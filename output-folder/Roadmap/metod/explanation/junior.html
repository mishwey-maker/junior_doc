        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"junior-razlichayu-i-obuyasnyayu-prostye-koncepcii\"&gt;&lt;a href=\"Roadmap/metod/explanation/junior.html#junior-razlichayu-i-obuyasnyayu-prostye-koncepcii\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Различаю и объясняю простые концепции»&lt;/span&gt;&lt;/a&gt;Junior: «Различаю и объясняю простые концепции»&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне вы учитесь &lt;strong&gt;распознавать&lt;/strong&gt; explanation и писать его по готовой структуре. Ключевой сдвиг: вы перестаёте «инструктировать» в объяснительной статье и начинаете &lt;strong&gt;помогать понять&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание сути explanation:&lt;/strong&gt; это контент, ориентированный на понимание (understanding-oriented), а не на действие. Заголовок часто можно предварить словом «About»: «About Virtual Environments».&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Структура explanation:&lt;/strong&gt; Overview → Background and Context → How It Works → Key Components → Design Decisions.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Связь с аудиторией:&lt;/strong&gt; explanation нужен пользователям, которые хотят понять глубже, а не просто использовать инструмент.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Отличие от tutorial и how-to:&lt;/strong&gt; explanation не даёт пошаговых инструкций. После чтения explanation читатель не должен чувствовать, что ему что-то велели сделать.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Аналогии и примеры:&lt;/strong&gt; вы используете аналогии, чтобы связать новое с тем, что читатель уже знает, и диаграммы для сложных связей.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;пишете explanation по структуре&lt;/strong&gt;, не превращая его в tutorial или reference.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-junior\"&gt;&lt;a href=\"Roadmap/metod/explanation/junior.html#kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://diataxis.fr/explanation/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diátaxis Framework — Explanation&lt;/a&gt; - Официальное описание explanation: understanding-oriented контент, «About»-заголовки, отличие от других типов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://mintlify.com/blog/documentation-content-types\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Documentation content types (Mintlify)&lt;/a&gt; - Практические рекомендации: как писать explanation, чем он отличается от how-to и tutorial;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ann-kilzer/doc-types-guide\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Explanation Documentation Skill (GitHub)&lt;/a&gt; - Готовый шаблон explanation с разделами: Overview, Background, How It Works, Design Decisions;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - База: структура, аудитория, ясность. Применимо к explanation;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.macmillanlearning.com/college/us/product/Technical-Communication/p/1319248727\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Communication (Mike Markel)&lt;/a&gt; - Главы о концептуальных объяснениях и описаниях процессов.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/metod/explanation/junior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Junior: «Различаю и объясняю простые концепции»","href":"Roadmap/metod/explanation/junior.html#junior-razlichayu-i-obuyasnyayu-prostye-koncepcii","level":2,"items":[{"title":"Курсы и книги (Junior)","href":"Roadmap/metod/explanation/junior.html#kursy-i-knigi-junior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/metod/explanation/junior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
