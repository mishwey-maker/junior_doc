        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"middle-nastraivayu-generaciyu-i-integriruyu-v-ci/cd\"&gt;&lt;a href=\"Roadmap/docascode/auto/middle.html#middle-nastraivayu-generaciyu-i-integriruyu-v-ci/cd\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Настраиваю генерацию и интегрирую в CI/CD»&lt;/span&gt;&lt;/a&gt;Middle: «Настраиваю генерацию и интегрирую в CI/CD»&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне автоматизация генерации перестаёт быть просто «запуском инструмента». Теперь это &lt;strong&gt;предмет настройки и интеграции&lt;/strong&gt;: вы создаёте пайплайн, который автоматически генерирует документацию при каждом изменении кода, проверяет её качество и публикует.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Настройка генерации из OpenAPI:&lt;/strong&gt; вы настраиваете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2w9t5utq\"&gt;redocly.yaml&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-awttfucv\"&gt;swagger-config.yaml&lt;/code&gt; для тонкой настройки генерации: какие эндпоинты включать, как группировать, какие примеры показывать. Вы используете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jmw1j98b\"&gt;x-codeSamples&lt;/code&gt; для добавления примеров на разных языках.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Генерация из комментариев в коде:&lt;/strong&gt; вы настраиваете Sphinx (Python), DocFX (.NET/Java), JSDoc (JavaScript) или Doxygen (C++). Вы понимаете, как писать docstrings, которые хорошо генерируются: параметры, возвращаемые значения, примеры.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;AST-анализ и AI-генерация:&lt;/strong&gt; вы работаете с инструментами, которые используют AST-анализ для понимания структуры кода: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b4rnfbyd\"&gt;know-cli&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wtn736zk\"&gt;code2docs&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fok7upoj\"&gt;codeledger&lt;/code&gt;. Вы понимаете, как AI генерирует документацию из кода и как это проверять.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Интеграция в CI/CD:&lt;/strong&gt; вы настраиваете GitHub Actions (или GitLab CI) так, чтобы генерация документации запускалась при каждом изменении кода: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b9viwaq6\"&gt;on: push&lt;/code&gt; → генерация → валидация → деплой. Вы используете CI-гейты: если сгенерированная документация не проходит валидацию, PR не может быть смержен.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Синхронизация с кодом:&lt;/strong&gt; вы настраиваете пайплайн так, чтобы документация всегда соответствовала актуальной версии кода. Вы используете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0oaccjiz\"&gt;codeledger generate&lt;/code&gt; для создания снимков документации и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c5ywblcx\"&gt;codeledger merge&lt;/code&gt; для объединения их в финальный документ.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация сгенерированной документации:&lt;/strong&gt; вы проверяете, что сгенерированная документация корректна: все ссылки работают, примеры запускаются, схемы валидны. Вы настраиваете автоматическую проверку в CI.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;настраиваете и интегрируете&lt;/strong&gt;. Вы отвечаете за то, чтобы генерация работала надёжно и документация всегда была актуальной.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-middle\"&gt;&lt;a href=\"Roadmap/docascode/auto/middle.html#kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://www.gfu.de/schulung/docs-as-code/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Schulung Docs-as-Code: Technische Dokumentation mit Git, Markdown und CI/CD (GFU)&lt;/a&gt; - 2-дневный интенсив: автоматизированные publishing-пайплайны, Static Site Generators, CI/CD, генерация документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.cloudthat.com/resources/blog/automated-documentation-sites-with-backstage-techdocs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Automated Documentation Sites with Backstage TechDocs (CloudThat)&lt;/a&gt; - Реальный кейс: настройка автоматической генерации сайта документации из Markdown в CI/CD. Prepare → Generate → Publish;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://pypi.org/project/code2docs/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;code2docs Documentation&lt;/a&gt; - Инструмент для автоматической генерации и синхронизации документации из исходного кода. Поддерживает MkDocs, watch mode, sync markers;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://pypi.org/project/codeledger/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;codeledger Documentation&lt;/a&gt; - AI-ассистированная генерация документации: scan → parse → classify → generate → merge. Поддерживает Ollama (бесплатно);&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/docs-like-code/9781492049364/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs Like Code (Anne Gentle)&lt;/a&gt; - Классика docs-as-code: collaboration, automation, test automation, continuous integration. Как выстроить систему генерации.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/docascode/auto/middle.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Middle: «Настраиваю генерацию и интегрирую в CI/CD»","href":"Roadmap/docascode/auto/middle.html#middle-nastraivayu-generaciyu-i-integriruyu-v-ci/cd","level":2,"items":[{"title":"Курсы и книги (Middle)","href":"Roadmap/docascode/auto/middle.html#kursy-i-knigi-middle","level":3}]}],"title":""},"router":{"pathname":"Roadmap/docascode/auto/middle","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
