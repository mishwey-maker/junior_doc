    <body class="g-root g-root_theme_light">

        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"senior-opredelyayu-byudzhetnuyu-strategiyu-i-stroyu-sistemu-upravleniya-vendorami\"&gt;&lt;a href=\"Roadmap/metric/cashe/senior.html#senior-opredelyayu-byudzhetnuyu-strategiyu-i-stroyu-sistemu-upravleniya-vendorami\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю бюджетную стратегию и строю систему управления вендорами»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю бюджетную стратегию и строю систему управления вендорами»&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне бюджет и вендоры становятся &lt;strong&gt;элементом организационной стратегии&lt;/strong&gt;. Вы не просто обосновываете отдельные инвестиции, вы &lt;strong&gt;определяете, как организация инвестирует в документацию&lt;/strong&gt;: какой бюджет выделяется, какие вендоры используются, как измеряется отдача и как управляются риски в масштабе. Ключевой сдвиг: вы переходите от управления отдельными сделками к &lt;strong&gt;созданию системы&lt;/strong&gt;, которая делает инвестиции в документацию предсказуемыми и стратегически обоснованными.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Бюджетная стратегия для домена:&lt;/strong&gt; вы определяете, как формируется бюджет документации: какие статьи, какие приоритеты, как он связан с продуктовым roadmap и бизнес-целями. Вы защищаете бюджет перед руководством, используя данные о ROI и рисках.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Управление портфелем вендоров:&lt;/strong&gt; вы управляете не отдельными подрядчиками, а &lt;strong&gt;портфелем&lt;/strong&gt;: переводческие агентства, инструменты, консалтинг. Вы балансируете затраты, риски и качество across多个 вендоров.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance закупок:&lt;/strong&gt; вы определяете политику: кто может инициировать покупку, какие критерии обязательны, как проверяется ROI, как обрабатываются исключения.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых продуктов, языков, команд без пересмотра всех контрактов.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Управление рисками:&lt;/strong&gt; вы идентифицируете и митигируете риски, связанные с вендорами: зависимость от одного поставщика, рост цен, уход ключевых людей, несовместимость инструментов.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение и развитие менеджеров:&lt;/strong&gt; вы обучаете middle-менеджеров и тимлидов навыкам обоснования бюджета и выбора вендоров.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Инвестиции в документацию становятся частью бизнес-стратегии, а не «затратами на тексты».&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-senior\"&gt;&lt;a href=\"Roadmap/metric/cashe/senior.html#kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://www.amazon.com/Managing-Your-Documentation-Projects-Hackos/dp/0471591239\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Managing Your Documentation Projects (JoAnn T. Hackos)&lt;/a&gt; - Классика управления документационными проектами. Главы о планировании, оценке затрат, производстве и оценке проектов. Включает шаблоны и чек-листы;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.amazon.com/Technical-Writing-Management-Practical-Guide/dp/1484226722\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing Management: A Practical Guide (Steven A. Schwarzman, главы 5–6)&lt;/a&gt; - Разделы об оценке и отслеживании проектов, управлении обучением и бюджетом, а также о работе с внешними заказчиками и подрядчиками;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://dl.acm.org/doi/book/10.5555/1190163\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Development: Managing Your Documentation, Projects, Portfolio, and People (JoAnn Hackos)&lt;/a&gt; - Управление портфелем документации и бюджетом в масштабе;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://lavacon.org/2017/presentations/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;LavaCon 2017 - Management Workshop Part 1: Leadership and Management in Technical Documentation (слайды)&lt;/a&gt; - Факторы принятия решений: needs assessment, budget, timing. Стратегии работы с вендорами: партнёрство, win-win, понимание бизнеса вендора.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/metric/cashe/senior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Senior: «Определяю бюджетную стратегию и строю систему управления вендорами»","href":"Roadmap/metric/cashe/senior.html#senior-opredelyayu-byudzhetnuyu-strategiyu-i-stroyu-sistemu-upravleniya-vendorami","level":2,"items":[{"title":"Курсы и книги (Senior)","href":"Roadmap/metric/cashe/senior.html#kursy-i-knigi-senior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/metric/cashe/senior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
