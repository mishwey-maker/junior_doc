        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"senior-opredelyayu-standart-i-upravlyayu-lifecycle\"&gt;&lt;a href=\"Roadmap/api/sdk/senior.html#senior-opredelyayu-standart-i-upravlyayu-lifecycle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и управляю lifecycle»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и управляю lifecycle»&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне SDK-документация становится &lt;strong&gt;элементом developer experience (DX) стратегии&lt;/strong&gt;. Вы не просто проектируете документацию для одного SDK, вы определяете, как компания подходит к SDK-документации в масштабе: стандарты, автоматизация, метрики, обучение.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия SDK-документации:&lt;/strong&gt; вы определяете, какие SDK нуждаются в документации, какие языки поддерживаются, как документация связана с API reference и migration guides.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за актуальность, как проверяется работоспособность примеров, как обрабатываются breaking changes в SDK.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Стандарты:&lt;/strong&gt; вы определяете, как организуется SDK-документация: структура навигации, обязательные разделы, шаблоны, стиль примеров кода.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Автоматизация:&lt;/strong&gt; вы настраиваете пайплайн: генерация reference из docstrings → валидация примеров → публикация. Вы выбираете инструменты: TypeDoc, DocFX, Javadoc, Sphinx, phpDocumentor.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность SDK-документации: time-to-first-call, adoption, support tickets, DX-метрики.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды написанию SDK-документации, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Влияние на дизайн SDK:&lt;/strong&gt; вы участвуете в design-ревью SDK, предлагаете улучшения API с точки зрения документируемости и пользовательского опыта.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. SDK-документация становится частью DX-стратегии, а не побочным продуктом разработки.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-senior\"&gt;&lt;a href=\"Roadmap/api/sdk/senior.html#kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ann-kilzer/developer-docs-framework\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;developer-docs-framework: SDK docs (GitHub)&lt;/a&gt; - Enterprise-фреймворк для документации: 14 content types, включая SDK docs. Content architecture, docs-as-code workflows, DX strategy;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://mintlify.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mintlify: Create developer documentation&lt;/a&gt; - Построение developer documentation: quickstarts, references, guides для SDK;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации, включая SDK и governance;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/style\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Developer Documentation Style Guide&lt;/a&gt; - Эталонные правила для developer documentation, включая code samples и reference.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/api/sdk/senior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Senior: «Определяю стандарт и управляю lifecycle»","href":"Roadmap/api/sdk/senior.html#senior-opredelyayu-standart-i-upravlyayu-lifecycle","level":2,"items":[{"title":"Курсы и книги (Senior)","href":"Roadmap/api/sdk/senior.html#kursy-i-knigi-senior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/api/sdk/senior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
