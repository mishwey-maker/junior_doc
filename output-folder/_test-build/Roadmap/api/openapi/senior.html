        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"senior-opredelyayu-standart-i-upravlyayu-lifecycle\"&gt;&lt;a href=\"Roadmap/api/openapi/senior.html#senior-opredelyayu-standart-i-upravlyayu-lifecycle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и управляю lifecycle»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и управляю lifecycle»&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне OpenAPI становится &lt;strong&gt;элементом архитектуры документации&lt;/strong&gt;. Вы не просто создаёте спецификации, вы &lt;strong&gt;управляете их lifecycle&lt;/strong&gt;: версионирование, breaking changes, автоматизация, стандартизация, обучение команд.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия spec-driven документации:&lt;/strong&gt; вы определяете, как OpenAPI вписывается в общую стратегию: единый источник истины для документации, тестов, SDK, кода.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за актуальность спецификации, как проверяется соответствие коду, как обрабатываются breaking changes.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Версионирование:&lt;/strong&gt; вы управляете версиями спецификации: как поддерживать несколько версий API, как архивировать старые версии, как коммуницировать изменения.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;CI/CD для OpenAPI:&lt;/strong&gt; вы настраиваете пайплайн: валидация → генерация → публикация. Вы используете CI-гейты для проверки свежести спецификации и примеров.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Автоматизация:&lt;/strong&gt; вы настраиваете генерацию документации из спецификации, генерацию SDK, генерацию тестов.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых API, версий, языков без ручной работы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды работе с OpenAPI, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Инженеры приходят к вам за советом по API-дизайну &lt;strong&gt;до&lt;/strong&gt; начала разработки.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-senior\"&gt;&lt;a href=\"Roadmap/api/openapi/senior.html#kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://www.manning.com/books/designing-apis-with-swagger-and-openapi\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Designing APIs with Swagger and OpenAPI (Josh Ponelat, Lukas Rosenstock, продвинутые главы)&lt;/a&gt; - Главы о versioning, breaking changes, codegen, работе с кросс-функциональными командами;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.manning.com/books/the-design-of-web-apis-second-edition\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The Design of Web APIs, Second Edition (Arnaud Lauret, продвинутые главы)&lt;/a&gt; - Продвинутые главы: стандартизация API-дизайна, automation, rationale;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.pce.uw.edu/specializations/api-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Specialization in API Documentation (UW Professional &amp;amp; Continuing Education)&lt;/a&gt; - Программа для технических писателей: API fundamentals, OpenAPI, docs-as-code, testing;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.gitbook.com/integrations/git-sync\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitBook: Integrating with CI/CD&lt;/a&gt; - Как автоматизировать обновление OpenAPI-спецификации через GitBook CLI.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/api/openapi/senior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Senior: «Определяю стандарт и управляю lifecycle»","href":"Roadmap/api/openapi/senior.html#senior-opredelyayu-standart-i-upravlyayu-lifecycle","level":2,"items":[{"title":"Курсы и книги (Senior)","href":"Roadmap/api/openapi/senior.html#kursy-i-knigi-senior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/api/openapi/senior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
