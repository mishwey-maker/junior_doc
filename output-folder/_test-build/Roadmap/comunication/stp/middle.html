            {"data":{"leading":false,"html":"&lt;h2 id=\"middle-dayu-obratnuyu-svyaz-i-upravlyayu-revyu\"&gt;&lt;a href=\"Roadmap/comunication/stp/middle.html#middle-dayu-obratnuyu-svyaz-i-upravlyayu-revyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Даю обратную связь и управляю ревью»&lt;/span&gt;&lt;/a&gt;Middle: «Даю обратную связь и управляю ревью»&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне обратная связь перестаёт быть просто «принятием правок». Теперь это &lt;strong&gt;предмет управления&lt;/strong&gt;: вы даёте конструктивные ревью junior-писателям, разрешаете конфликты между стейкхолдерами, выстраиваете процесс peer review.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Конструктивная обратная связь:&lt;/strong&gt; вы даёте конкретные, объективные, действенные комментарии. Вы начинаете с того, что работает, затем переходите к областям для улучшения.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Фокус на высокоэффективных областях:&lt;/strong&gt; вы приоритезируете структуру, ясность и логику, а не придираетесь к стилю.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Peer review процесс:&lt;/strong&gt; вы выстраиваете процесс ревью: кто ревьюит кого, сроки, что проверяется. В командах &amp;gt;10 писателей требуется формализованный ротационный процесс.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Разрешение конфликтов:&lt;/strong&gt; вы умеете работать с противоречивой обратной связью от разных стейкхолдеров. Вы фильтруете, что действительно важно, и не позволяете процессу превратиться в хаос.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Инструменты:&lt;/strong&gt; вы используете conventional comments, шаблоны ревью, чек-листы. Вы понимаете, какие инструменты подходят для разных типов ревью (formal, informal, anonymous).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обратная связь по содержанию:&lt;/strong&gt; вы проверяете не только грамматику, но и точность, полноту, консистентность.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;даёте и управляете&lt;/strong&gt;. Вы отвечаете за качество обратной связи в команде и за то, чтобы процесс ревью работал.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-middle\"&gt;&lt;a href=\"Roadmap/comunication/stp/middle.html#kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://document360.com/webinar/collaborative-writing-on-technical-teams/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Collaborative Writing on Technical Teams: Establishing an Effective Peer Review Process (Document360)&lt;/a&gt; - Полный разбор peer review: типы, процесс, сроки, что измерять. Примеры workflow для команд разного размера;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://redhat-documentation.github.io/peer-review/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Red Hat Peer Review Guide (redhat-documentation.github.io)&lt;/a&gt; - Реальный стандарт peer review: чек-листы для языка, структуры, точности. «Peer reviews must be kind… Support your comments with style guides»;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://users.dcc.uchile.cl/~nbaloian/ArquitecturaDeLaInformacion/materialDeLAWeb/TriDoc2005-DQTI.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Developing Quality Technical Information (IBM)&lt;/a&gt; - Глава «Reviewing, testing, and evaluating technical information»: checklists для ревью, качественные характеристики;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://conventionalcomments.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Conventional Comments&lt;/a&gt; - Единый язык для комментариев ревью: suggestion, issue, nitpick, question. Упрощает коммуникацию;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.piazza-copernico.it/en/courses/the-art-of-feedback/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The Art of Feedback (Piazza Copernico)&lt;/a&gt; - Как давать негативную обратную связь конструктивно, когда обратная связь неэффективна.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/comunication/stp/middle.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Middle: «Даю обратную связь и управляю ревью»","href":"Roadmap/comunication/stp/middle.html#middle-dayu-obratnuyu-svyaz-i-upravlyayu-revyu","level":2,"items":[{"title":"Курсы и книги (Middle)","href":"Roadmap/comunication/stp/middle.html#kursy-i-knigi-middle","level":3}]}],"title":""},"router":{"pathname":"Roadmap/comunication/stp/middle","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
