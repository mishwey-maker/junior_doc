        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"junior-chitayu-oshibki-linterov-i-ispravlyayu-ih\"&gt;&lt;a href=\"Roadmap/docascode/liter/junior.html#junior-chitayu-oshibki-linterov-i-ispravlyayu-ih\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Читаю ошибки линтеров и исправляю их»&lt;/span&gt;&lt;/a&gt;Junior: «Читаю ошибки линтеров и исправляю их»&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне линтеры — это &lt;strong&gt;инструменты, которые помогают вам не ошибаться&lt;/strong&gt;. Вы учитесь читать сообщения линтеров, понимать, что они означают, и исправлять нарушения. Ключевой сдвиг: вы перестаёте воспринимать красный статус CI как наказание и начинаете видеть в нём &lt;strong&gt;обратную связь&lt;/strong&gt;, которая делает вашу документацию лучше.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание, что такое линтер:&lt;/strong&gt; вы знаете, что линтер — это программа, которая проверяет текст на соответствие правилам. Линтеры бывают для разных целей: markdownlint проверяет синтаксис Markdown (заголовки, списки, отступы, длину строк), Vale проверяет стиль и терминологию, cspell проверяет орфографию.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Чтение сообщений markdownlint:&lt;/strong&gt; вы понимаете типичные ошибки: MD013 (длина строки превышает лимит), MD022 (заголовок должен быть окружён пустыми строками), MD032 (списки должны быть окружены пустыми строками). Вы знаете, что такое &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kuvhh833\"&gt;markdownlint-cli2&lt;/code&gt; и как его запустить локально.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Чтение сообщений Vale:&lt;/strong&gt; вы понимаете, что Vale проверяет прозу на соответствие стайлгайду. Типичные ошибки: использование «simply» или «just» (создаёт предположение, что задача лёгкая), пассивный залог, слишком длинные предложения. Вы знаете, как запустить Vale локально (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b727r47q\"&gt;vale docs/&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Исправление ошибок:&lt;/strong&gt; вы исправляете ошибки линтеров, не отключая правила без причины. Если правило кажется вам неправильным — вы уточняете у старшего коллеги, а не добавляете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oqncmd46\"&gt;&amp;lt;!-- markdownlint-disable --&amp;gt;&lt;/code&gt; без объяснения.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Pre-commit hooks:&lt;/strong&gt; вы понимаете, что такое pre-commit hook, и знаете, что линтеры могут запускаться автоматически перед каждым коммитом.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;исправляете&lt;/strong&gt; то, что нашли линтеры, и учитесь на их сообщениях. Если ошибка повторяется — вы запоминаете правило и больше её не допускаете.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-junior\"&gt;&lt;a href=\"Roadmap/docascode/liter/junior.html#kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/DavidAnson/markdownlint\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;markdownlint Documentation (GitHub)&lt;/a&gt; - Официальная документация markdownlint: полный список правил (MD001–MD059), примеры ошибок и исправлений;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://vale.sh/docs/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Vale Documentation&lt;/a&gt; - Официальная документация Vale: установка, настройка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b2mw33fp\"&gt;.vale.ini&lt;/code&gt;, запуск локально и в CI;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://techwriters.ru/docs-as-code/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs as Code (techwriters.ru)&lt;/a&gt; - Подробное описание процесса docs-as-code на русском: схема workflow, CI/CD Pipeline, линтеры;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.gitlab.com/development/documentation/testing/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitLab Documentation Testing&lt;/a&gt; - Реальный пример CI/CD для документации: Vale, markdownlint, link check, mermaid lint;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.freecodecamp.org/news/set-up-documentation-as-code-with-docusaurus-and-github-actions/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to Set Up Documentation as Code with Docusaurus and GitHub Actions (freeCodeCamp)&lt;/a&gt; - Пошаговый гайд: настройка GitHub Actions для проверки грамматики через Vale перед merge.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/docascode/liter/junior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Junior: «Читаю ошибки линтеров и исправляю их»","href":"Roadmap/docascode/liter/junior.html#junior-chitayu-oshibki-linterov-i-ispravlyayu-ih","level":2,"items":[{"title":"Курсы и книги (Junior)","href":"Roadmap/docascode/liter/junior.html#kursy-i-knigi-junior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/docascode/liter/junior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
