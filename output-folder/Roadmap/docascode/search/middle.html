        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"middle-nastraivayu-poisk-i-upravlyayu-metadannymi\"&gt;&lt;a href=\"Roadmap/docascode/search/middle.html#middle-nastraivayu-poisk-i-upravlyayu-metadannymi\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Настраиваю поиск и управляю метаданными»&lt;/span&gt;&lt;/a&gt;Middle: «Настраиваю поиск и управляю метаданными»&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне поиск и метаданные перестают быть просто «оформлением». Теперь это &lt;strong&gt;предмет настройки&lt;/strong&gt;: вы выбираете поисковый движок, настраиваете метаданные для команды, управляете таксономией и обеспечиваете, чтобы документация была находимой.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Настройка поиска:&lt;/strong&gt; вы настраиваете поисковый движок для документационного сайта. Варианты: встроенный search plugin в MkDocs (client-side, lunr), Algolia DocSearch (hosted, для open-source бесплатно), Redocly Realm. Вы понимаете компромиссы: client-side проще, hosted — мощнее.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Настройка Algolia DocSearch:&lt;/strong&gt; вы подаёте заявку на DocSearch (бесплатно для open-source), настраиваете crawler, добавляете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u1u4dnhz\"&gt;algolia&lt;/code&gt; field в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xlx8suv2\"&gt;docusaurus.config.js&lt;/code&gt;. Вы понимаете, как работает индексация.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Управление метаданными:&lt;/strong&gt; вы создаёте стандарт заполнения front matter для команды: какие поля обязательны (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bm8pien3\"&gt;title&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-81c8xcfb\"&gt;description&lt;/code&gt;), какие опциональны (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h6s05ncc\"&gt;tags&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aaz0fxno\"&gt;owner&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xybul6rt\"&gt;version&lt;/code&gt;). Вы используете metadata для маршрутизации контента, фильтрации и поиска.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Таксономия:&lt;/strong&gt; вы создаёте таксономию — систему категорий и тегов для классификации контента. Вы понимаете, что такое metadata, taxonomy и classification. Вы используете теги для группировки связанного контента.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Настройка индексации:&lt;/strong&gt; вы настраиваете, какие страницы индексируются, какие исключаются (например, draft, internal pages). Вы понимаете, как работает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4v49a5dv\"&gt;sitemap.xml&lt;/code&gt; и robots.txt.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Поисковая аналитика:&lt;/strong&gt; вы анализируете поисковые запросы пользователей: что ищут, что находят, что не находят. Вы используете эти данные для улучшения документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Внутренняя поисковая оптимизация:&lt;/strong&gt; вы настраиваете вес страниц в поиске (page ranking factor в Mintlify: значения &amp;gt;1 приоритезируют, 0–1 де-приоритезируют).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;настраиваете и управляете&lt;/strong&gt;. Вы отвечаете за то, чтобы пользователи находили нужное, а метаданные помогали в управлении контентом.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-middle\"&gt;&lt;a href=\"Roadmap/docascode/search/middle.html#kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://www.udemy.com/course/ux-and-information-architecture-basics-for-technical-writers/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;UX and Information Architecture Basics for Technical Writers (Udemy)&lt;/a&gt; - Learn 3 taxonomy development and 2 card sorting techniques. Understand what is metadata, taxonomy and classification;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.gitbook.com/blog/seo-techniques-for-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SEO techniques for documentation (GitBook, полная версия)&lt;/a&gt; - Keyword research, headings, metadata, internal links, indexing, accessibility;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://redocly.com/docs/realm/search/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Tune search and SEO (Redocly)&lt;/a&gt; - Choose a search engine, add facets, exclude content from index. Set metadata, sitemaps;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docsearch.algolia.com/docs/what-is-docsearch\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Algolia DocSearch Documentation&lt;/a&gt; - Официальная документация: getting started, configuration, crawler setup;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://squidfunk.github.io/mkdocs-material/setup/setting-up-site-search/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MkDocs Search Plugin (продвинутые разделы)&lt;/a&gt; - Настройка языков, конфигурация, интеграция с Material for MkDocs.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/docascode/search/middle.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Middle: «Настраиваю поиск и управляю метаданными»","href":"Roadmap/docascode/search/middle.html#middle-nastraivayu-poisk-i-upravlyayu-metadannymi","level":2,"items":[{"title":"Курсы и книги (Middle)","href":"Roadmap/docascode/search/middle.html#kursy-i-knigi-middle","level":3}]}],"title":""},"router":{"pathname":"Roadmap/docascode/search/middle","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
