        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"junior-chitayu-specifikaciyu-i-dopolnyayu-po-shablonu\"&gt;&lt;a href=\"Roadmap/api/openapi/junior.html#junior-chitayu-specifikaciyu-i-dopolnyayu-po-shablonu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Читаю спецификацию и дополняю по шаблону»&lt;/span&gt;&lt;/a&gt;Junior: «Читаю спецификацию и дополняю по шаблону»&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне OpenAPI — это &lt;strong&gt;формат, который вы учитесь читать и дополнять&lt;/strong&gt;. Вы не создаёте спецификацию с нуля, а работаете с существующей: добавляете описания, примеры, уточняете параметры. Ключевой сдвиг: вы перестаёте «пересказывать» API в Markdown и начинаете работать с &lt;strong&gt;машиночитаемым контрактом&lt;/strong&gt;, который генерирует документацию автоматически.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Структура OpenAPI-документа:&lt;/strong&gt; вы понимаете базовые секции: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f17qn1ls\"&gt;openapi&lt;/code&gt; (версия), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nu23y9l5\"&gt;info&lt;/code&gt; (название, версия, описание), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eewiy4hm\"&gt;servers&lt;/code&gt; (базовые URL), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vgti33vm\"&gt;paths&lt;/code&gt; (эндпоинты и методы), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ilozuox2\"&gt;components/schemas&lt;/code&gt; (модели данных).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Чтение спецификации:&lt;/strong&gt; вы можете открыть YAML или JSON файл OpenAPI и найти нужный эндпоинт, его параметры, схему запроса и ответа.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Дополнение описаний:&lt;/strong&gt; вы добавляете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-df2p9qaw\"&gt;description&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t78nu404\"&gt;summary&lt;/code&gt; для эндпоинтов, параметров, схем. Вы понимаете, что автогенерация из кода не даёт контекста — его нужно писать вручную.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Примеры:&lt;/strong&gt; вы добавляете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q05hink8\"&gt;example&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1x3m31dv\"&gt;examples&lt;/code&gt; для request body и responses. Вы проверяете, что примеры валидны и соответствуют реальному API.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Swagger UI:&lt;/strong&gt; вы умеете открыть Swagger UI, понять, как отображается спецификация, и использовать интерактивный режим «Try it out» для проверки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация:&lt;/strong&gt; вы проверяете, что спецификация синтаксически корректна (через Swagger Editor или валидатор).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;дополняете&lt;/strong&gt; существующую спецификацию, а не создаёте её с нуля. Если чего-то не хватает — вы уточняете у разработчика.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-junior\"&gt;&lt;a href=\"Roadmap/api/openapi/junior.html#kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://www.udemy.com/course/learn-swagger-and-the-open-api-specification/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Learn Swagger and the OpenAPI Specification (Udemy)&lt;/a&gt; - Курс &lt;strong&gt;специально для технических писателей и PM-ов&lt;/strong&gt;: не требует опыта программирования. Учит читать и писать OpenAPI-файлы, понимать альтернативы Swagger;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.udemy.com/course/mastering-openapi-swagger/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mastering OpenAPI &amp;amp; Swagger: From Basics to AI Design (Udemy)&lt;/a&gt; - Для начинающих: предполагает базовое знание REST и JSON, но не требует программирования. Подходит техническим писателям;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://apidog.com/blog/openapi-3-0-tutorial/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;OpenAPI 3.0 Tutorial (Apidog)&lt;/a&gt; - Пошаговое руководство по определению OpenAPI 3.0: структура, paths, operations, schemas;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://spec.openapis.org/oas/v3.0.3\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;OpenAPI Specification — официальная документация&lt;/a&gt; - Официальная спецификация: структура документа, paths, components, schemas;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://swagger.io/tools/swagger-ui/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Swagger UI — официальная документация&lt;/a&gt; - Как работает Swagger UI, как отображается спецификация, интерактивный режим.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/api/openapi/junior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Junior: «Читаю спецификацию и дополняю по шаблону»","href":"Roadmap/api/openapi/junior.html#junior-chitayu-specifikaciyu-i-dopolnyayu-po-shablonu","level":2,"items":[{"title":"Курсы и книги (Junior)","href":"Roadmap/api/openapi/junior.html#kursy-i-knigi-junior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/api/openapi/junior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":tr
