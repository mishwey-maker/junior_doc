        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"junior-ponimayu-princip-i-zapuskayu-gotovuyu-generaciyu\"&gt;&lt;a href=\"Roadmap/docascode/auto/junior.html#junior-ponimayu-princip-i-zapuskayu-gotovuyu-generaciyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Понимаю принцип и запускаю готовую генерацию»&lt;/span&gt;&lt;/a&gt;Junior: «Понимаю принцип и запускаю готовую генерацию»&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне автоматизация генерации — это &lt;strong&gt;осознание того, что документацию можно создавать не только вручную&lt;/strong&gt;. Вы учитесь запускать готовые генераторы, понимать, откуда берётся контент, и проверять, что сгенерированная документация соответствует реальности. Ключевой сдвиг: вы перестаёте воспринимать документацию как «текст, который я пишу» и начинаете видеть в ней &lt;strong&gt;результат работы инструмента&lt;/strong&gt;, который можно настроить.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание источников генерации:&lt;/strong&gt; документация может генерироваться из разных источников: OpenAPI-спецификации (Swagger Codegen, Redocly), комментариев в коде (Javadoc, DocFX, Sphinx), AST-анализа кода (know-cli, code2docs). Вы знаете, что каждый источник даёт разный результат.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Запуск готового генератора:&lt;/strong&gt; вы умеете запустить генератор документации из OpenAPI-файла: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ovi8bi6\"&gt;swagger-codegen generate&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0duhee5k\"&gt;redocly build-docs&lt;/code&gt;. Вы видите результат и понимаете, как спецификация превращается в HTML или Markdown.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Генерация reference из кода:&lt;/strong&gt; вы понимаете, как работает генерация API reference из комментариев в коде (docstrings, Javadoc). Вы можете запустить &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mwq479pd\"&gt;sphinx-apidoc&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ft5m50bz\"&gt;docfx&lt;/code&gt; и увидеть, как комментарии становятся документацией.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Проверка результата:&lt;/strong&gt; вы проверяете, что сгенерированная документация соответствует реальному API: правильные эндпоинты, параметры, примеры. Если что-то не совпадает — вы сообщаете об этом.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Понимание ограничений:&lt;/strong&gt; вы знаете, что автогенерация покрывает reference, но не даёт контекста, объяснений и примеров использования. Вы понимаете, что ручная работа всё ещё нужна — но в другом месте.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;запускаете и проверяете&lt;/strong&gt; готовую генерацию. Вы не настраиваете пайплайн, а учитесь работать с результатом.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-junior\"&gt;&lt;a href=\"Roadmap/docascode/auto/junior.html#kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://learn.microsoft.com/en-us/training/modules/automate-documentation/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Внедрение автоматизации документации истории Git (Microsoft Learn)&lt;/a&gt; - Официальный модуль: автоматизация документации API из кода через OpenAPI, Swagger Codegen, Redocly. Встраивание в CI/CD;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://dotnet.github.io/docfx/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;DocFX Documentation&lt;/a&gt; - Официальная документация DocFX: генерация reference из комментариев в коде для .NET, Java, JavaScript;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.sphinx-doc.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Sphinx Documentation&lt;/a&gt; - Официальная документация Sphinx: генерация reference из docstrings для Python;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://swagger.io/tools/swagger-codegen/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Swagger Codegen Documentation&lt;/a&gt; - Официальная документация Swagger Codegen: генерация документации из OpenAPI;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://redocly.com/docs/cli/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Redocly CLI Documentation&lt;/a&gt; - Официальная документация Redocly CLI: генерация документации из OpenAPI.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/docascode/auto/junior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Junior: «Понимаю принцип и запускаю готовую генерацию»","href":"Roadmap/docascode/auto/junior.html#junior-ponimayu-princip-i-zapuskayu-gotovuyu-generaciyu","level":2,"items":[{"title":"Курсы и книги (Junior)","href":"Roadmap/docascode/auto/junior.html#kursy-i-knigi-junior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/docascode/auto/junior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
