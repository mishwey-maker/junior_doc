        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"junior-ponimayu,-kakie-metriki-vazhny,-i-sobirayu-bazovye-dannye\"&gt;&lt;a href=\"Roadmap/metric/metricdocs/junior.html#junior-ponimayu,-kakie-metriki-vazhny,-i-sobirayu-bazovye-dannye\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Понимаю, какие метрики важны, и собираю базовые данные»&lt;/span&gt;&lt;/a&gt;Junior: «Понимаю, какие метрики важны, и собираю базовые данные»&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне метрики — это &lt;strong&gt;осознание того, что ваша работа измерима&lt;/strong&gt;. Вы учитесь определять, какие показатели важны для документации, и собирать базовые данные с помощью существующих инструментов. Ключевой сдвиг: вы перестаёте оценивать свою работу только по объёму написанного и начинаете задаваться вопросом «как это повлияло на пользователя?».&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание ключевых метрик:&lt;/strong&gt; Вы знаете, что метрики документации делятся на категории: вовлечённость (page views, time on page), поиск (search success rate, zero-result rate), поддержка (ticket deflection rate) и удовлетворённость (CSAT, NPS).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Работа с существующими инструментами:&lt;/strong&gt; Вы умеете открывать дашборды в Google Analytics или Pendo и снимать базовые показатели: количество просмотров страницы, среднее время на странице, показатели поиска.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Понимание разницы между vanity- и impact-метриками:&lt;/strong&gt; Вы знаете, что page views и количество слов — это «метрики тщеславия», которые мало говорят о реальной пользе. Настоящие метрики — это те, что показывают, решает ли документация проблемы пользователей. Такие показатели, как time-on-page, bounce rate и даже CSAT, могут быть «почти бесполезны» для демонстрации ценности вашей работы[reference:0].&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Сбор данных из поддержки:&lt;/strong&gt; Вы можете запросить у команды поддержки данные о том, какие вопросы чаще всего задают пользователи, и сопоставить их с существующей документацией.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Понимание ticket deflection:&lt;/strong&gt; Вы знаете, что такое «отклонение тикетов» (support ticket deflection) — процент запросов, решённых с помощью документации без обращения в поддержку.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: Вы &lt;strong&gt;наблюдаете и собираете&lt;/strong&gt; данные, используя готовые дашборды и отчёты. Вы не строите систему метрик, а учитесь читать те, что уже есть.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-junior\"&gt;&lt;a href=\"Roadmap/metric/metricdocs/junior.html#kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://www.linkedin.com/posts/aldendesoto_technical-writers-measure-business-outcomes-activity-7362867263705673729-djiT\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical writers: Measure business outcomes, not doc usage (Alden DeSoto, LinkedIn)&lt;/a&gt; - Пост о том, почему традиционные метрики (time-on-page, bounce rate) не работают, и какие бизнес-показатели (adoption, retention, снижение затрат на поддержку) действительно важны;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.linkedin.com/posts/joshua-fechter_12-tw-metrics-that-prove-your-work-is-working-activity-7454937490018205696-k8F8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;12 Technical Writer Metrics to Prove Documentation's Impact (Joshua Gene Fechter, LinkedIn)&lt;/a&gt; - Список из 12 метрик с пояснениями: time-to-first-success, task success rate, ticket deflection, staleness rate и другие;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://document360.com/blog/value-of-documentation/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The Value of Documentation for Business Growth and Support (Document360)&lt;/a&gt; - Обзор метрик, включая финансовые, и того, как их использовать для обоснования ценности документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://redocly.com/blog/key-metrics-for-docs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Key Metrics for Docs (Redocly)&lt;/a&gt; - Простое объяснение трёх ключевых метрик: acquisition, adoption, deflection. С конкретными примерами, что измерять;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Глава об измерении успеха контента через аналитику и обратную связь. Практические шаблоны и принципы.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/metric/metricdocs/junior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Junior: «Понимаю, какие метрики важны, и собираю базовые данные»","href":"Roadmap/metric/metricdocs/junior.html#junior-ponimayu,-kakie-metriki-vazhny,-i-sobirayu-bazovye-dannye","level":2,"items":[{"title":"Курсы и книги (Junior)","href":"Roadmap/metric/metricdocs/junior.html#kursy-i-knigi-junior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/metric/metricdocs/junior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
