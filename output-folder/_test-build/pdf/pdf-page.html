dden\" data-no-index=\"true\"&gt;Middle: «Проектирую структуру и связываю с системой»&lt;/span&gt;&lt;/a&gt;Middle: «Проектирую структуру и связываю с системой»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metod_reference_middle\" id=\"Roadmap_metod_reference_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне вы перестаёте писать reference «по шаблону» и начинаете &lt;strong&gt;проектировать&lt;/strong&gt; справочную систему. Архитектура reference должна отражать архитектуру описываемой системы.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Архитектура reference:&lt;/strong&gt; вы проектируете структуру справочника так, чтобы читатель мог найти нужный факт за минимальное время. Группировка по ресурсам (endpoints, параметры, коды ошибок) или по модулям.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Связывание с системой:&lt;/strong&gt; reference для API должен генерироваться из единого источника истины — OpenAPI-спецификации. Вы понимаете, как работает schema-based generation.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Гибридный подход:&lt;/strong&gt; автоматическая генерация покрывает endpoints и параметры, но не даёт контекста. Вы добавляете ручные описания поверх автогенерации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация:&lt;/strong&gt; вы проверяете reference на точность: соответствует ли описание реальному поведению API? Вы тестируете примеры.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность reference: как часто его ищут, находят ли нужное, сколько времени тратят.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;проектируете структуру reference&lt;/strong&gt; и связываете её с системой через OpenAPI.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metod_reference_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_metod_reference_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://mintlify.com/blog/generate-docs-from-schema\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Should you generate docs from your API schema? (Mintlify)&lt;/a&gt; - Детальный разбор гибридного подхода: автогенерация + ручные описания, ограничения schema-based generation;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.gitbook.com/blog/how-to-write-api-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to write incredible API documentation (GitBook)&lt;/a&gt; - Организация endpoints: группировка по ресурсам или workflow, избегание длинных плоских списков;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://learn.microsoft.com/en-us/training/modules/create-api-documentation/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Create API Documentation (Microsoft Learn)&lt;/a&gt; - Выбор формата (OpenAPI или Markdown), примеры, обновление при изменениях, обратная связь от пользователей;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://api7.ai/blog/openapi-api-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Using OpenAPI for API Documentation (API7.ai)&lt;/a&gt; - Валидация спецификации и реализации: syntax validation, style linting, contract tests;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://diataxis.fr/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diátaxis Framework — Applying Diátaxis&lt;/a&gt; - Продвинутое применение: как связывать reference с другими типами документации.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metod_reference_senior_senior-opredelyayu-standart-i-masshtabiruyu\" data-original-article=\"Roadmap/metod/reference/senior.html\"&gt;&lt;a href=\"#Roadmap_metod_reference_senior_senior-opredelyayu-standart-i-masshtabiruyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и масштабирую»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и масштабирую»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metod_reference_senior\" id=\"Roadmap_metod_reference_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне reference становится &lt;strong&gt;элементом стратегии документации&lt;/strong&gt;. Вы определяете, как справочная система вписывается в общую архитектуру документации.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия reference:&lt;/strong&gt; вы определяете, какие типы reference обязательны для каждого продукта (API reference, configuration reference, error code catalog, glossary), как они связаны с другими типами документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за актуальность reference, как проверяется точность, как обрабатываются изменения в API.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых endpoints, версий, языков без полной перестройки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Кросс-продуктовый reference:&lt;/strong&gt; вы обеспечиваете, чтобы reference для одного API связывался с reference для другого, не теряя контекст.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность reference на уровне организации: time-to-find, support tickets, adoption.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды проектированию reference, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете стандарт reference&lt;/strong&gt; для организации и отвечаете за его соблюдение.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metod_reference_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_metod_reference_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://users.dcc.uchile.cl/~nbaloian/ArquitecturaDeLaInformacion/materialDeLAWeb/TriDoc2005-DQTI.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Developing Quality Technical Information (IBM)&lt;/a&gt; - Главы о проектировании reference, точности, валидации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/information-architecture-4th/9781491913529/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Architecture: For the Web and Beyond (Rosenfeld, Morville, Arango)&lt;/a&gt; - Классика IA: организация, навигация, связывание типов контента;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации в целом, включая reference и governance;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.macmillanlearning.com/college/us/product/Technical-Communication/p/1319248727\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Communication (Mike Markel)&lt;/a&gt; - Главы о проектировании документов, аудиторном анализе, валидации.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metod_explanation_junior_junior-razlichayu-i-obuyasnyayu-prostye-koncepcii\" data-original-article=\"Roadmap/metod/explanation/junior.html\"&gt;&lt;a href=\"#Roadmap_metod_explanation_junior_junior-razlichayu-i-obuyasnyayu-prostye-koncepcii\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Различаю и объясняю простые концепции»&lt;/span&gt;&lt;/a&gt;Junior: «Различаю и объясняю простые концепции»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metod_explanation_junior\" id=\"Roadmap_metod_explanation_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне вы учитесь &lt;strong&gt;распознавать&lt;/strong&gt; explanation и писать его по готовой структуре. Ключевой сдвиг: вы перестаёте «инструктировать» в объяснительной статье и начинаете &lt;strong&gt;помогать понять&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание сути explanation:&lt;/strong&gt; это контент, ориентированный на понимание (understanding-oriented), а не на действие. Заголовок часто можно предварить словом «About»: «About Virtual Environments».&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Структура explanation:&lt;/strong&gt; Overview → Background and Context → How It Works → Key Components → Design Decisions.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Связь с аудиторией:&lt;/strong&gt; explanation нужен пользователям, которые хотят понять глубже, а не просто использовать инструмент.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Отличие от tutorial и how-to:&lt;/strong&gt; explanation не даёт пошаговых инструкций. После чтения explanation читатель не должен чувствовать, что ему что-то велели сделать.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Аналогии и примеры:&lt;/strong&gt; вы используете аналогии, чтобы связать новое с тем, что читатель уже знает, и диаграммы для сложных связей.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;пишете explanation по структуре&lt;/strong&gt;, не превращая его в tutorial или reference.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metod_explanation_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_metod_explanation_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://diataxis.fr/explanation/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diátaxis Framework — Explanation&lt;/a&gt; - Официальное описание explanation: understanding-oriented контент, «About»-заголовки, отличие от других типов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://mintlify.com/blog/documentation-content-types\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Documentation content types (Mintlify)&lt;/a&gt; - Практические рекомендации: как писать explanation, чем он отличается от how-to и tutorial;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ann-kilzer/doc-types-guide\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Explanation Documentation Skill (GitHub)&lt;/a&gt; - Готовый шаблон explanation с разделами: Overview, Background, How It Works, Design Decisions;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - База: структура, аудитория, ясность. Применимо к explanation;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.macmillanlearning.com/college/us/product/Technical-Communication/p/1319248727\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Communication (Mike Markel)&lt;/a&gt; - Главы о концептуальных объяснениях и описаниях процессов.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metod_explanation_middle_middle-proektiruyu-explanation-sistemu-i-svyazyvayu-s-drugimi-tipami\" data-original-article=\"Roadmap/metod/explanation/middle.html\"&gt;&lt;a href=\"#Roadmap_metod_explanation_middle_middle-proektiruyu-explanation-sistemu-i-svyazyvayu-s-drugimi-tipami\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Проектирую explanation-систему и связываю с другими типами»&lt;/span&gt;&lt;/a&gt;Middle: «Проектирую explanation-систему и связываю с другими типами»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metod_explanation_middle\" id=\"Roadmap_metod_explanation_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне вы перестаёте писать отдельные explanation-статьи и начинаете &lt;strong&gt;проектировать систему объяснительного контента&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Система explanation:&lt;/strong&gt; вы определяете, какие концепции нуждаются в объяснении, как они связаны между собой, в каком порядке их читать.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Связывание с другими типами:&lt;/strong&gt; explanation может ссылаться на tutorial, how-to, reference. Вы проектируете эти cross-references.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Глубина и аудитория:&lt;/strong&gt; вы адаптируете глубину explanation под аудиторию. Для новичков — больше аналогий и контекста. Для опытных — больше деталей о компромиссах и альтернативах.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Уровни explanation:&lt;/strong&gt; вы понимаете, что explanation бывает разного масштаба: от «About X» до архитектурных обзоров.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация:&lt;/strong&gt; вы проверяете explanation на читателях: формируется ли у них правильная ментальная модель?&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность explanation: как часто его читают, снижает ли он количество вопросов в поддержке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;проектируете систему explanation&lt;/strong&gt; и связываете её с другими типами контента.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metod_explanation_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_metod_explanation_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://diataxis.fr/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diátaxis Framework — Applying Diátaxis&lt;/a&gt; - Продвинутое применение: как связывать explanation с другими типами;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Главы о концептуальном контенте, работе с аудиторией, измерении эффективности;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://users.dcc.uchile.cl/~nbaloian/ArquitecturaDeLaInformacion/materialDeLAWeb/TriDoc2005-DQTI.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Developing Quality Technical Information (IBM)&lt;/a&gt; - Главы о проектировании объяснительного контента, progressive disclosure;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/information-architecture-4th/9781491913529/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Architecture: For the Web and Beyond (Rosenfeld, Morville, Arango)&lt;/a&gt; - Классика IA: организация, навигация, связывание типов контента;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.washington.edu/students/crscat/engl.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ENGL 396 A Winter 2026 (University of Washington)&lt;/a&gt; - Академический курс: document types включают conceptual overviews.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metod_explanation_senior_senior-opredelyayu-standart-i-masshtabiruyu\" data-original-article=\"Roadmap/metod/explanation/senior.html\"&gt;&lt;a href=\"#Roadmap_metod_explanation_senior_senior-opredelyayu-standart-i-masshtabiruyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и масштабирую»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и масштабирую»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metod_explanation_senior\" id=\"Roadmap_metod_explanation_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне explanation становится &lt;strong&gt;элементом стратегии документации&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия explanation:&lt;/strong&gt; вы определяете, какие концепции обязательны для каждого продукта (architecture overview, design rationale, data model explanation), как они связаны с tutorial, how-to и reference.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за explanation, как проверяется качество, как обрабатываются изменения в архитектуре.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых продуктов, концепций, языков без полной перестройки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Кросс-продуктовые explanation:&lt;/strong&gt; вы обеспечиваете, чтобы explanation для одного продукта связывался с explanation для другого.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность explanation на уровне организации: снижение support tickets, ускорение onboarding, adoption.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды написанию explanation, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете стандарт explanation&lt;/strong&gt; для организации.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metod_explanation_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_metod_explanation_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://users.dcc.uchile.cl/~nbaloian/ArquitecturaDeLaInformacion/materialDeLAWeb/TriDoc2005-DQTI.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Developing Quality Technical Information (IBM)&lt;/a&gt; - Продвинутые главы: проектирование explanation, валидация, метрики;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/information-architecture-4th/9781491913529/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Architecture: For the Web and Beyond (Rosenfeld, Morville, Arango)&lt;/a&gt; - Классика IA: организация, навигация, связывание типов контента;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации, включая explanation и governance;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.macmillanlearning.com/college/us/product/Technical-Communication/p/1319248727\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Communication (Mike Markel)&lt;/a&gt; - Главы о проектировании документов, аудиторном анализе, валидации.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metod_release_junior_junior-pishu-po-shablonu-i-sobirayu-izmeneniya\" data-original-article=\"Roadmap/metod/release/junior.html\"&gt;&lt;a href=\"#Roadmap_metod_release_junior_junior-pishu-po-shablonu-i-sobirayu-izmeneniya\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Пишу по шаблону и собираю изменения»&lt;/span&gt;&lt;/a&gt;Junior: «Пишу по шаблону и собираю изменения»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metod_release_junior\" id=\"Roadmap_metod_release_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне вы учитесь &lt;strong&gt;распознавать&lt;/strong&gt; разницу между release notes и changelog и писать оба типа по готовому шаблону.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание разницы:&lt;/strong&gt; release notes — для пользователей (benefit-led, action-oriented), changelog — для разработчиков (precise, structured, technical).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Структура release notes:&lt;/strong&gt; заголовок с версией и датой → Highlights → New Features → Improvements → Bug Fixes → Breaking Changes → Deprecation → ссылки на документацию.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Структура changelog:&lt;/strong&gt; дата + версия → категории: Added, Changed, Deprecated, Removed, Fixed, Security.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Сбор изменений:&lt;/strong&gt; вы умеете читать merged PRs, closed tickets, commit messages и вытаскивать из них то, что важно для пользователя.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Язык:&lt;/strong&gt; вы пишете простым языком («Export to CSV» вместо «Enhanced data portability»), избегаете жаргона и внутренних названий фич.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Что не включать:&lt;/strong&gt; internal refactors, branch names, ticket IDs, vague engineering notes, PR numbers, commit hashes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;пишете release notes и changelog по шаблону&lt;/strong&gt;, собирая изменения из PR и тикетов.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metod_release_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_metod_release_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.pluralsight.com/courses/technical-writing-software-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing for Software Development (Pluralsight)&lt;/a&gt; - Раздел о release notes: как коммуницировать завершённую работу через release notes и support content;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://mintlify.com/blog/how-to-write-release-notes\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to write release notes (Mintlify)&lt;/a&gt; - Детальный разбор разницы между release notes и changelog, шаблоны для product и API releases;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://announcekit.app/blog/how-to-write-a-changelog\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to Write a Changelog (AnnounceKit)&lt;/a&gt; - Best practices для changelog: структура, категории, примеры хороших и плохих записей;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://keepachangelog.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Keep a Changelog&lt;/a&gt; - Официальный стандарт changelog: категории Added, Changed, Deprecated, Removed, Fixed, Security;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://announcekit.app/blog/changelog-vs-release-notes\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Changelog vs. Release Notes (AnnounceKit)&lt;/a&gt; - Шесть различий между changelog и release notes: аудитория, цель, контент, формат, тон, тайминг.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metod_release_middle_middle-proektiruyu-process-i-svyazyvayu-s-reliznym-ciklom\" data-original-article=\"Roadmap/metod/release/middle.html\"&gt;&lt;a href=\"#Roadmap_metod_release_middle_middle-proektiruyu-process-i-svyazyvayu-s-reliznym-ciklom\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Проектирую процесс и связываю с релизным циклом»&lt;/span&gt;&lt;/a&gt;Middle: «Проектирую процесс и связываю с релизным циклом»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metod_release_middle\" id=\"Roadmap_metod_release_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне вы перестаёте писать отдельные release notes «по запросу» и начинаете &lt;strong&gt;проектировать процесс&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Процесс сбора:&lt;/strong&gt; вы выстраиваете workflow, при котором changelog-фрагменты создаются &lt;strong&gt;в момент PR&lt;/strong&gt;, а не восстанавливаются постфактум. Инструменты: Changesets, Changie, conventional commits.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Связывание с документацией:&lt;/strong&gt; release notes должны ссылаться на обновлённые how-to, reference и migration guides.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Адаптация под аудиторию:&lt;/strong&gt; вы пишете отдельные версии release notes для разных аудиторий: end users, admins, developers, integrators.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Semantic Versioning:&lt;/strong&gt; вы понимаете, как категории изменений соотносятся с SemVer (patch, minor, major).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация:&lt;/strong&gt; вы проверяете, что release notes точны: соответствует ли описание реальному поведению?&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность release notes: open rates, click-through, support tickets после релиза.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;проектируете процесс сбора и публикации&lt;/strong&gt; release notes.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metod_release_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_metod_release_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://mintlify.com/blog/how-to-write-release-notes\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to write release notes (Mintlify, разделы о workflow)&lt;/a&gt; - Разделы о повторяемом процессе написания и поддержании точности changelog в shipping workflow;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/universal-dev-standards/changelog-standards\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Changelog Standards (Universal Dev Standards)&lt;/a&gt; - Стандарт для &lt;a href=\"http://CHANGELOG.md\"&gt;CHANGELOG.md&lt;/a&gt;: user-centric, consistent, complete, timely;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://keepachangelog.com/en/1.0.0/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Keep a Changelog — Automation&lt;/a&gt; - Разделы о Semantic Versioning и автоматизации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Глава о release notes: research, draft, write different kinds of documentation;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://semver.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Semantic Versioning&lt;/a&gt; - Официальная спецификация SemVer: patch, minor, major.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metod_release_senior_senior-opredelyayu-standart-i-masshtabiruyu\" data-original-article=\"Roadmap/metod/release/senior.html\"&gt;&lt;a href=\"#Roadmap_metod_release_senior_senior-opredelyayu-standart-i-masshtabiruyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и масштабирую»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и масштабирую»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metod_release_senior\" id=\"Roadmap_metod_release_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне release notes и changelog становятся &lt;strong&gt;элементами стратегии коммуникации&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия коммуникации:&lt;/strong&gt; вы определяете, какие типы изменений доносятся через какие каналы: release notes (пользователи), changelog (разработчики), email digests (stakeholders), in-app notifications (end users).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за release notes, как проверяется точность, как обрабатываются breaking changes.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых продуктов, версий, языков без ручной работы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Кросс-продуктовый changelog:&lt;/strong&gt; вы обеспечиваете, чтобы changelog для одного API связывался с changelog для другого.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность коммуникации изменений на уровне организации: adoption новых фич, support tickets, retention.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды писать release notes, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете стандарт коммуникации изменений&lt;/strong&gt; для организации.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metod_release_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_metod_release_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://users.dcc.uchile.cl/~nbaloian/ArquitecturaDeLaInformacion/materialDeLAWeb/TriDoc2005-DQTI.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Developing Quality Technical Information (IBM)&lt;/a&gt; - Продвинутые главы о проектировании release notes, валидации, метриках;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/information-architecture-4th/9781491913529/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Architecture: For the Web and Beyond (Rosenfeld, Morville, Arango)&lt;/a&gt; - Классика IA: организация, навигация, связывание типов контента;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации, включая release notes и governance;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.pearson.com/store/p/spring-into-technical-writing-for-engineers-and-scientists/P100000855156\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Spring Into Technical Writing for Engineers and Scientists (Rosenberg)&lt;/a&gt; - Разделы о release notes и manuals: how to write effective release notes.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metod_troubleshooting_junior_junior-pishu-po-shablonu-i-sobirayu-tipovye-problemy\" data-original-article=\"Roadmap/metod/troubleshooting/junior.html\"&gt;&lt;a href=\"#Roadmap_metod_troubleshooting_junior_junior-pishu-po-shablonu-i-sobirayu-tipovye-problemy\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Пишу по шаблону и собираю типовые проблемы»&lt;/span&gt;&lt;/a&gt;Junior: «Пишу по шаблону и собираю типовые проблемы»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metod_troubleshooting_junior\" id=\"Roadmap_metod_troubleshooting_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне вы учитесь &lt;strong&gt;распознавать&lt;/strong&gt; troubleshooting-сценарии и писать статьи по готовому шаблону.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание структуры:&lt;/strong&gt; troubleshooting-статья строится по формату &lt;strong&gt;Problem → Cause → Solution&lt;/strong&gt;. Заголовок должен описывать симптом, который видит пользователь.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Типы troubleshooting-контента:&lt;/strong&gt; вводный (контекст о возможных проблемах), task-based (пошаговое решение), reference (справочная информация о проблемах).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Структура KB-статьи:&lt;/strong&gt; Title → Problem/Symptom → Environment → Cause (если известна) → Resolution Steps → Verification → Related Articles.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Язык:&lt;/strong&gt; простой, спокойный, нейтральный тон. Избегайте жаргона, объясняйте технические термины кратко.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Разделение ошибок и решений:&lt;/strong&gt; не смешивайте описание проблемы с её решением в одном абзаце.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Поисковая оптимизация:&lt;/strong&gt; заголовок — самый важный элемент для поиска. Используйте формулировки, которые вводит пользователь.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;пишете troubleshooting по шаблону&lt;/strong&gt;, начиная с симптома.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metod_troubleshooting_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_metod_troubleshooting_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://docs.gitlab.com/development/documentation/troubleshooting/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Troubleshooting documentation (GitLab Docs)&lt;/a&gt; - Официальное руководство GitLab по troubleshooting-топикам: три типа контента, структура, примеры;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.telerik.com/devtools/wpf/styling-and-appearance/style-guide/knowledge-base-articles\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Knowledge Base Articles (Progress Telerik Style Guide)&lt;/a&gt; - Разбор структуры KB-статьи: problem, cause, fixes, workarounds;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.digitalocean.com/community/tutorials\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Support Articles (DigitalOcean Docs)&lt;/a&gt; - Практические рекомендации: lead with the resolution, break problems into failure points, separate errors from solutions;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - База: аудитория, структура, ясность. Применимо к troubleshooting;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://ones.com/blog/how-to-structure-an-it-knowledge-base-article/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to Structure an IT Knowledge Base Article (Ones.com)&lt;/a&gt; - Шаблон KB-статьи: Title, Problem/Symptom, Environment, Resolution Steps, Verification.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metod_troubleshooting_middle_middle-proektiruyu-sistemu-kb-i-analiziruyu-dannye\" data-original-article=\"Roadmap/metod/troubleshooting/middle.html\"&gt;&lt;a href=\"#Roadmap_metod_troubleshooting_middle_middle-proektiruyu-sistemu-kb-i-analiziruyu-dannye\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Проектирую систему KB и анализирую данные»&lt;/span&gt;&lt;/a&gt;Middle: «Проектирую систему KB и анализирую данные»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metod_troubleshooting_middle\" id=\"Roadmap_metod_troubleshooting_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне вы перестаёте писать отдельные статьи «по запросу» и начинаете &lt;strong&gt;проектировать систему&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Процесс создания KB:&lt;/strong&gt; вы выстраиваете workflow, при котором статьи создаются из решённых тикетов, частых вопросов и workaround'ов.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Информационная архитектура KB:&lt;/strong&gt; вы определяете категории, теги, метаданные, перелинковку.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Анализ данных:&lt;/strong&gt; вы работаете с данными поддержки: какие тикеты повторяются, какие статьи не помогают, какие темы отсутствуют.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность KB: page views, average time on article, self-service rate, снижение тикетов.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Шаблоны и стандарты:&lt;/strong&gt; вы создаёте шаблоны KB-статей для команды и обучаете junior-писателей.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация:&lt;/strong&gt; вы проверяете, что статьи точны: соответствует ли описание реальному поведению продукта?&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;проектируете систему KB&lt;/strong&gt; и анализируете данные для улучшения.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metod_troubleshooting_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_metod_troubleshooting_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://docs.gitlab.com/development/documentation/styleguide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Knowledge Base Style Guide (GitLab)&lt;/a&gt; - Стандарт KB GitLab: voice, structure, solutions and workarounds, cause;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://martech.zone/optimize-knowledge-base-article/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How To Optimize A Knowledge-Base Article (Martech Zone)&lt;/a&gt; - Практические рекомендации: title, problem, TOC, interlinking, step-by-step, related articles;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.zendesk.com/blog/knowledge-base-article-templates/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;8 Knowledge Base Article Templates That Work (Zendesk)&lt;/a&gt; - Шаблоны KB-статей: troubleshooting, how-to, FAQ;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.givainc.com/blog/knowledge-base-articles/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Knowledge Base Articles: Types, How-To Steps &amp;amp; Examples (Giva)&lt;/a&gt; - Типы KB-статей, инструкции по написанию, метрики эффективности;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Глава о support content: troubleshooting, KB, работа с данными поддержки.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metod_troubleshooting_senior_senior-opredelyayu-strategiyu-i-masshtabiruyu-sistemu-znanij\" data-original-article=\"Roadmap/metod/troubleshooting/senior.html\"&gt;&lt;a href=\"#Roadmap_metod_troubleshooting_senior_senior-opredelyayu-strategiyu-i-masshtabiruyu-sistemu-znanij\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стратегию и масштабирую систему знаний»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стратегию и масштабирую систему знаний»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metod_troubleshooting_senior\" id=\"Roadmap_metod_troubleshooting_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне troubleshooting и KB становятся &lt;strong&gt;элементами стратегии самообслуживания&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия самообслуживания:&lt;/strong&gt; вы определяете, как KB снижает нагрузку на поддержку, как измеряется ROI, как связаны KB-метрики с бизнес-показателями.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за KB, как проверяется актуальность, как обрабатываются устаревшие статьи.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых продуктов, языков, версий без ручной работы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Кросс-продуктовая KB:&lt;/strong&gt; вы обеспечиваете, чтобы KB для одного продукта связывалась с KB для другого.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Интеграция с поддержкой:&lt;/strong&gt; вы настраиваете workflow, при котором поддержка и KB работают вместе: тикеты → статьи → самообслуживание.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды написанию troubleshooting-статей, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете стратегию самообслуживания&lt;/strong&gt; для организации.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metod_troubleshooting_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_metod_troubleshooting_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://dl.acm.org/doi/book/10.5555/1190163\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Development: Managing Your Documentation, Projects, Portfolio, and People (JoAnn Hackos)&lt;/a&gt; - Управление документацией и KB в масштабе: процессы, метрики, команда;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.amazon.com/AI-Knowledge-Base-Editors-Ellison/dp/B0D8QZ8Z8Z\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;AI for Knowledge Base Editors (Maya Ellison)&lt;/a&gt; - Использование AI для аудита KB, выявления пробелов и планирования контента;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации, включая support content и governance;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.thekcsacademy.net/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;KCS Academy Resources&lt;/a&gt; - Принципы Knowledge-Centered Service: как строить KB, интегрированную с поддержкой.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metod_audit_junior_junior-opredelyayu-auditoriyu-i-adaptiruyu-kontent\" data-original-article=\"Roadmap/metod/audit/junior.html\"&gt;&lt;a href=\"#Roadmap_metod_audit_junior_junior-opredelyayu-auditoriyu-i-adaptiruyu-kontent\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Определяю аудиторию и адаптирую контент»&lt;/span&gt;&lt;/a&gt;Junior: «Определяю аудиторию и адаптирую контент»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metod_audit_junior\" id=\"Roadmap_metod_audit_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне аудиторный анализ — это &lt;strong&gt;дисциплина мышления&lt;/strong&gt;. Вы учитесь останавливаться перед написанием текста и задавать вопрос: «Для кого я это пишу?».&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Определение ролей:&lt;/strong&gt; вы начинаете с идентификации ролей аудитории. Software engineers, технические менеджеры, учёные,非-технические специалисты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Уровни экспертизы:&lt;/strong&gt; highly technical (для специалистов), semi-technical (некоторый технический бэкграунд), nontechnical (широкая аудитория).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Типы аудитории:&lt;/strong&gt; primary audience (для кого написан документ), secondary audience (кто читает косвенно), hidden audience (кто влияет на решение, но не читает напрямую).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Ключевые вопросы:&lt;/strong&gt; Кто читатель? Что он уже знает? Что ему нужно узнать? Где и когда он будет читать? Зачем он читает?&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Адаптация языка:&lt;/strong&gt; вы адаптируете терминологию и уровень детализации под аудиторию. В медицинской документации для пациента «exanthema» превращается в «skin rash».&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;определяете аудиторию&lt;/strong&gt; и адаптируете контент под неё.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metod_audit_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_metod_audit_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one/audience\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One — Audience&lt;/a&gt; - Официальный модуль по аудиторному анализу: определение ролей, proximity to knowledge, sample audience analysis;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://learn.saylor.org/course/view.php?id=429\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ENGL210: Technical Writing (Saylor Academy)&lt;/a&gt; - Unit 1 полностью посвящён аудиторному анализу: шаги анализа, определение знаний аудитории, адаптация текста;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://writingcommons.org/section/genre/technical-writing/audience-analysis/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Audience Analysis (Writing Commons)&lt;/a&gt; - Ключевые вопросы для анализа аудитории: кто читатель, что знает, нужно ли адаптировать для международных читателей;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://oercommons.org/courseware/lesson/80764/overview\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Audience Analysis: Primary, Secondary, and Hidden Audiences (OER Commons)&lt;/a&gt; - Подробный разбор трёх типов аудитории и ключевых вопросов для анализа;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.macmillanlearning.com/college/us/product/Technical-Communication/p/1319248727\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Communication (Mike Markel)&lt;/a&gt; - Глава «Analyzing your audience and purpose»: определение характеристик аудитории, техники изучения аудитории, audience profile sheet.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metod_audit_middle_middle-segmentiruyu-auditoriyu-i-stroyu-persony\" data-original-article=\"Roadmap/metod/audit/middle.html\"&gt;&lt;a href=\"#Roadmap_metod_audit_middle_middle-segmentiruyu-auditoriyu-i-stroyu-persony\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Сегментирую аудиторию и строю персоны»&lt;/span&gt;&lt;/a&gt;Middle: «Сегментирую аудиторию и строю персоны»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metod_audit_middle\" id=\"Roadmap_metod_audit_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне аудиторный анализ перестаёт быть «разовым упражнением перед написанием». Теперь это &lt;strong&gt;система&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Сегментация аудитории:&lt;/strong&gt; вы разбиваете читателей на actionable-категории: developers, business stakeholders, support staff, QA engineers, new users, international partners, compliance teams.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Персоны:&lt;/strong&gt; вы трансформируете абстрактные группы в «реальные человеческие контексты». Персона описывает роль, цели, вызовы и предпочитаемый формат документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Применение персон к дизайну документации:&lt;/strong&gt; вы используете персоны для принятия решений: align tone with reader experience, provide examples in native workflows, reference terminology consistently.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Proximity to knowledge:&lt;/strong&gt; вы учитываете не только роль, но и близость к знанию. Даже в одной роли знания быстро расходятся: Amal — эксперт в Python, Sharon — в C++.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Кросс-культурная адаптация:&lt;/strong&gt; вы учитываете, нужно ли модифицировать сообщение для международных читателей.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность адаптации: находят ли пользователи информацию, снижается ли количество тикетов поддержки.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;сегментируете аудиторию&lt;/strong&gt; и строите персоны для принятия решений.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metod_audit_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_metod_audit_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/TECH-OPSS/Technical-Writing-Masterclass-C\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing Masterclass — Module 2: Audience Analysis (TECH-OPSS)&lt;/a&gt; - Детальный разбор сегментации, персон, применения к дизайну документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.sfu.ca/students/calendar/2024/spring/courses/plnl/320.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;PLNL320: Strategies in Audience Analysis (SFU)&lt;/a&gt; - Курс по стратегиям аудиторного анализа: как планировать, писать и оценивать контент для целевой аудитории;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.pce.uw.edu/courses/foundations-of-professional-technical-writing\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Foundations of Professional Technical Writing (UW)&lt;/a&gt; - Аудиторный анализ в контексте технического писательства: практическое введение в анализ аудитории;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.pearson.com/store/p/a-concise-guide-to-technical-communication/P100000855156\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;A Concise Guide to Technical Communication (Gurak, Lannon)&lt;/a&gt; - Глава «A World of People and Purposes»: анализ аудитории, целей и контекста, audience-purpose interview;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.pearson.com/store/p/strategies-for-technical-communication-in-the-workplace/P100000855156\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Strategies for Technical Communication in the Workplace&lt;/a&gt; - Расширенное покрытие аудиторного анализа: как писать убедительно и анализировать аудиторию/цель.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metod_audit_senior_senior-opredelyayu-strategiyu-i-masshtabiruyu\" data-original-article=\"Roadmap/metod/audit/senior.html\"&gt;&lt;a href=\"#Roadmap_metod_audit_senior_senior-opredelyayu-strategiyu-i-masshtabiruyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стратегию и масштабирую»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стратегию и масштабирую»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metod_audit_senior\" id=\"Roadmap_metod_audit_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне аудиторный анализ становится &lt;strong&gt;элементом организационной стратегии&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия аудитории:&lt;/strong&gt; вы определяете, какие сегменты аудитории существуют для каждого продукта, как они связаны между собой, как их потребности влияют на roadmap документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за аудиторный анализ, как часто он обновляется, как результаты анализа влияют на решения.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых продуктов, сегментов, языков без полной перестройки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Кросс-продуктовый анализ:&lt;/strong&gt; вы обеспечиваете, чтобы аудиторный анализ для одного продукта связывался с анализом для другого.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность аудиторного анализа на уровне организации: adoption, retention, support tickets, CSAT.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды проведению аудиторного анализа, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Влияние на продукт:&lt;/strong&gt; вы используете понимание аудитории для влияния на продуктовые решения.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете стратегию аудитории&lt;/strong&gt; для организации.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metod_audit_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_metod_audit_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://dl.acm.org/doi/book/10.5555/1190163\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Development: Managing Your Documentation, Projects, Portfolio, and People (JoAnn Hackos)&lt;/a&gt; - Управление документацией и аудиторией в масштабе: процессы, метрики, команда;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, работа с аудиторией, масштабирование, обучение команды;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.macmillanlearning.com/college/us/product/Technical-Communication/p/1319248727\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Communication (Mike Markel, продвинутые главы)&lt;/a&gt; - Продвинутые главы: writing for multiple audiences, revising information for a new audience and purpose;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.cptsc.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Audience Personas: Audience Analysis Documentation for Rhetorical Technical Communications (CPTSC)&lt;/a&gt; - Шаблон аудиторной персоны для технических коммуникаторов: как использовать персоны для sharing target audience среди writers, editors, media publishers;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации, включая аудиторный анализ и governance.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_api_rest_junior_junior-chitayu-api-i-dokumentiruyu-po-shablonu\" data-original-article=\"Roadmap/api/rest/junior.html\"&gt;&lt;a href=\"#Roadmap_api_rest_junior_junior-chitayu-api-i-dokumentiruyu-po-shablonu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Читаю API и документирую по шаблону»&lt;/span&gt;&lt;/a&gt;Junior: «Читаю API и документирую по шаблону»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_api_rest_junior\" id=\"Roadmap_api_rest_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне REST/HTTP — это &lt;strong&gt;язык, на котором говорит API&lt;/strong&gt;. Вы учитесь читать спецификации, понимать запросы и ответы, различать методы и коды. Ключевой сдвиг: вы перестаёте «пересказывать» API и начинаете &lt;strong&gt;документировать его контракт&lt;/strong&gt; — что можно сделать, какие данные передать, что вернётся в ответ.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;HTTP-методы:&lt;/strong&gt; вы понимаете разницу между GET (чтение, безопасный, идемпотентный), POST (создание, не идемпотентный), PUT (полная замена, идемпотентный), PATCH (частичное обновление), DELETE (удаление, идемпотентный).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Статус-коды:&lt;/strong&gt; вы различаете пять семейств: 1xx (информационные), 2xx (успех), 3xx (редиректы), 4xx (ошибки клиента), 5xx (ошибки сервера). Вы документируете как минимум один успешный код (200, 201, 204) и типичные ошибки (400, 401, 404, 500).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;URL-структура:&lt;/strong&gt; вы понимаете компоненты: scheme (https), host (&lt;a href=\"http://api.example.com\"&gt;api.example.com&lt;/a&gt;), path (/users/123), query parameters (?page=1&amp;amp;limit=20), fragment (#section).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Заголовки:&lt;/strong&gt; вы понимаете Content-Type (application/json), Accept, Authorization (Bearer token), Location (в ответе 201).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Структура документации эндпоинта:&lt;/strong&gt; вы документируете по шаблону: Resource description → Endpoint and method → Parameters (path, query, body) → Sample request → Sample response → Status codes → Error codes → Code samples.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;JSON:&lt;/strong&gt; вы читаете JSON, понимаете вложенность объектов и массивов, различаете типы данных (string, number, boolean, array, object, null).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;читаете и документируете&lt;/strong&gt; API, а не проектируете его. Если метод неверный — вы документируете то, что есть, и уточняете у разработчика.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_api_rest_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_api_rest_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://idratherbewriting.com/learnapidoc/docapis_introtoapis.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Documenting APIs: Introduction to REST APIs (Tom Johnson)&lt;/a&gt; - Бесплатный курс для технических писателей: контекстуализирует REST через реальный weather API, учит endpoints, parameters, curl, JSON, статус-коды. Более 900 страниц, 17 глав;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.udemy.com/course/learn-api-technical-writing-2-rest-for-writers/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Learn API Technical Writing 2: REST for Writers (Udemy)&lt;/a&gt; - Курс &lt;strong&gt;специально для технических писателей&lt;/strong&gt;: без опыта программирования. Учит документировать REST-запросы и ответы;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://httpwg.org/http-extensions/draft-ietf-httpbis-semantics.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;HTTP Editorial Style Guide (httpwg.org)&lt;/a&gt; - Официальное руководство по написанию HTTP: как правильно упоминать методы, статус-коды, заголовки. Методы — без кавычек, статус-коды — число + фраза в скобках;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Status\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;HTTP Status Codes Reference (MDN Web Docs)&lt;/a&gt; - Полный справочник статус-кодов с описанием и примерами использования;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.classcentral.com/course/udemy-learn-api-technical-writing-json-and-19418\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Learn API Documentation with JSON and XML (Peter Gruenbaum, Class Central)&lt;/a&gt; - Курс для технических писателей: чтение и документирование структурированных данных в JSON и XML.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_api_rest_middle_middle-proektiruyu-dokumentaciyu-i-chitayu-specifikacii\" data-original-article=\"Roadmap/api/rest/middle.html\"&gt;&lt;a href=\"#Roadmap_api_rest_middle_middle-proektiruyu-dokumentaciyu-i-chitayu-specifikacii\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Проектирую документацию и читаю спецификации»&lt;/span&gt;&lt;/a&gt;Middle: «Проектирую документацию и читаю спецификации»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_api_rest_middle\" id=\"Roadmap_api_rest_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне REST/HTTP перестаёт быть просто «языком, который я читаю». Теперь это &lt;strong&gt;предмет анализа&lt;/strong&gt;: вы работаете с OpenAPI-спецификациями, проверяете контракты, влияете на качество документации через понимание архитектуры API.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;OpenAPI-спецификация:&lt;/strong&gt; вы читаете и анализируете OpenAPI 3.0: paths, operations, parameters, requestBody, responses, components, schemas.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация контрактов:&lt;/strong&gt; вы проверяете, что документация соответствует реальному поведению API. Вы используете schema validation, contract tests, style linting.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Аутентификация:&lt;/strong&gt; вы документируете OAuth 2.0, API keys, Bearer tokens, basic auth. Вы понимаете, как описать процесс получения токена и его использования в запросах.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Пагинация и фильтрация:&lt;/strong&gt; вы документируете limit/offset, cursor-based pagination, sorting, filtering.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обработка ошибок:&lt;/strong&gt; вы документируете не только коды, но и структуру ошибок (Problem Details, error objects с code, message, details).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Rate limiting:&lt;/strong&gt; вы документируете ограничения на количество запросов, заголовки (X-RateLimit-Limit, X-RateLimit-Remaining), поведение при превышении.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Гибридный подход:&lt;/strong&gt; вы понимаете, что автогенерация из OpenAPI покрывает endpoints и параметры, но не даёт контекста. Вы добавляете ручные описания поверх автогенерации.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;анализируете и проверяете&lt;/strong&gt; API, а не просто документируете его. Вы отвечаете за точность контракта и полноту документации.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_api_rest_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_api_rest_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.coursera.org/learn/designing-documenting-apis-openapi-specification\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Designing and Documenting APIs with OpenAPI Specification (Coursera)&lt;/a&gt; - Проектирование RESTful API с OpenAPI: endpoints, schemas, versioning strategies, OAuth 2.0, API keys, JWT. Для разработчиков, архитекторов и технических писателей;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://idratherbewriting.com/learnapidoc/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Documenting APIs: OpenAPI Specification (Tom Johnson)&lt;/a&gt; - Разделы по OpenAPI 3.0, Swagger UI, testing API docs, publishing API docs. Бесплатный курс для технических писателей;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://swagger.io/specification/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;OpenAPI Specification 3.0 (swagger.io)&lt;/a&gt; - Официальная спецификация: структура, схемы, примеры;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://document360.com/blog/api-documentation/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;API Documentation: Components &amp;amp; Best Practices (Document360)&lt;/a&gt; - Разбор компонентов API-документации и лучших практик: base URL, paging, result codes, accuracy, completeness;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Главы об API documentation: research, draft, write, measure.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_api_rest_senior_senior-vliyayu-na-dizajn-api-i-opredelyayu-standart\" data-original-article=\"Roadmap/api/rest/senior.html\"&gt;&lt;a href=\"#Roadmap_api_rest_senior_senior-vliyayu-na-dizajn-api-i-opredelyayu-standart\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Влияю на дизайн API и определяю стандарт»&lt;/span&gt;&lt;/a&gt;Senior: «Влияю на дизайн API и определяю стандарт»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_api_rest_senior\" id=\"Roadmap_api_rest_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне REST/HTTP становится &lt;strong&gt;элементом архитектуры продукта&lt;/strong&gt;. Вы не просто документируете API, вы &lt;strong&gt;влияете на его дизайн&lt;/strong&gt; с точки зрения документируемости. Вы определяете стандарты, обучаете команды, обеспечиваете консистентность между продуктами.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Дизайн API с точки зрения документируемости:&lt;/strong&gt; вы участвуете в API-ревью, предлагаете улучшения: консистентные имена ресурсов, понятные коды ошибок, предсказуемое поведение.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Стандарты документации API:&lt;/strong&gt; вы определяете, какие разделы обязательны для каждого эндпоинта, какие примеры нужны, как описывать ошибки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за актуальность документации API, как проверяется соответствие спецификации, как обрабатываются изменения.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему документации, которая выдерживает рост: добавление новых endpoints, версий, языков без ручной работы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Автоматизация:&lt;/strong&gt; вы настраиваете CI/CD для документации API: генерация из OpenAPI, валидация, линтинг, публикация.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды документированию API, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность документации API: time-to-first-call, support tickets, adoption.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. PM-ы и инженеры приходят к вам за советом по API-дизайну &lt;strong&gt;до&lt;/strong&gt; начала разработки.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_api_rest_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_api_rest_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.pce.uw.edu/specializations/api-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Specialization in API Documentation (UW Professional &amp;amp; Continuing Education)&lt;/a&gt; - 11-недельная программа для технических писателей: API fundamentals, OpenAPI, docs-as-code, testing. Практика с industry-standard tools: OpenAPI Specification, Swagger UI, Markdown, Postman;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/restful-web-services/9780596529260/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;RESTful Web Services (Leonard Richardson, Sam Ruby)&lt;/a&gt; - Классика: дизайн ресурсов, правильное использование HTTP и hypermedia links;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/rest-api-design/9781449317904/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;REST API Design Rulebook (Mark Masse)&lt;/a&gt; - Правила дизайна REST API: URI, методы, статус-коды, представления;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-2764-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Pro RESTful APIs (Sanjay Patni)&lt;/a&gt; - Дизайн, построение и интеграция с REST, JSON, XML;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации, включая API и governance.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_api_json_junior_junior-chitayu-struktury-i-dokumentiruyu-po-shablonu\" data-original-article=\"Roadmap/api/json/junior.html\"&gt;&lt;a href=\"#Roadmap_api_json_junior_junior-chitayu-struktury-i-dokumentiruyu-po-shablonu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Читаю структуры и документирую по шаблону»&lt;/span&gt;&lt;/a&gt;Junior: «Читаю структуры и документирую по шаблону»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_api_json_junior\" id=\"Roadmap_api_json_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне JSON/XML — это &lt;strong&gt;язык, на котором передаются данные&lt;/strong&gt;. Вы учитесь читать JSON-ответы, разбирать XML-документы, различать типы данных и документировать структуры по готовому шаблону. Ключевой сдвиг: вы перестаёте «пересказывать» данные и начинаете &lt;strong&gt;документировать их контракт&lt;/strong&gt; — какие поля есть, какие типы, обязательные или опциональные.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;JSON-синтаксис:&lt;/strong&gt; вы понимаете структуру JSON: объекты &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_api_json_junior_inline-code-id-2uep38fo\"&gt;{}&lt;/code&gt;, массивы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_api_json_junior_inline-code-id-f43axe6f\"&gt;[]&lt;/code&gt;, пары «ключ-значение», строки, числа, булевы значения, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_api_json_junior_inline-code-id-n8gvnbwu\"&gt;null&lt;/code&gt;. Вы различаете вложенные объекты и массивы объектов.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;XML-синтаксис:&lt;/strong&gt; вы понимаете структуру XML: корневой элемент, вложенные элементы, атрибуты, текстовое содержимое.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Типы данных:&lt;/strong&gt; вы различаете в JSON: string, number, boolean, array, object, null. В XML: элементы, атрибуты, текст, CDATA. Вы документируете типы для каждого поля.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обязательные и опциональные поля:&lt;/strong&gt; вы понимаете, какие поля обязательны, а какие — нет. Вы документируете это явно.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Документирование структур:&lt;/strong&gt; вы описываете JSON/XML по шаблону: поле → тип → описание → пример.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация примеров:&lt;/strong&gt; вы проверяете, что ваши примеры JSON/XML валидны — синтаксически корректны и соответствуют реальному API.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;читаете и документируете&lt;/strong&gt; структуры данных, а не проектируете их. Если поле неверное — вы документируете то, что есть, и уточняете у разработчика.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_api_json_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_api_json_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.udemy.com/course/learn-api-technical-writing-json-and-xml-for-writers/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Learn API Technical Writing: JSON and XML for Writers (Udemy, Peter Gruenbaum)&lt;/a&gt; - Курс &lt;strong&gt;специально для технических писателей&lt;/strong&gt;: 8 видео, 4 практических упражнения, 5 квизов. Учит читать и документировать структурированные данные в JSON и XML. Не требует опыта программирования;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.koenig-solutions.com/api-technical-writing-json-xml-training\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;API Technical Writing: JSON and XML for Writers (Koenig Solutions)&lt;/a&gt; - 8-часовой интенсив: API types (REST, SOAP, GraphQL), JSON syntax, XML tags and attributes, hands-on practice, documenting errors;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.amazon.com/API-Technical-Writing-Made-Easy-ebook/dp/B0BQZ8Z8Z8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;API Technical Writing Made Easy: A Guide to JSON &amp;amp; XML for Non-Programmers (R. Parvin)&lt;/a&gt; - Практическое руководство &lt;strong&gt;без опыта программирования&lt;/strong&gt;: что такое API, как читать JSON/XML, как документировать структуры;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.classcentral.com/course/udemy-learn-api-technical-writing-json-and-19418\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JSON and XML for Technical Writers (Class Central)&lt;/a&gt; - Обзорный курс: read and understand structured data, write documentation for JSON/XML files, edit JSON/XML for tools that generate documentation;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://stackoverflow.com/questions/13217291/json-schema-vs-xml-schema\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JSON Schema vs XML Schema (Stack Overflow)&lt;/a&gt; - Понимание разницы между схемами: JSON Schema draft 04 vs XSD, когда что использовать.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_api_json_middle_middle-proektiruyu-shemy-i-proveryayu-validnost\" data-original-article=\"Roadmap/api/json/middle.html\"&gt;&lt;a href=\"#Roadmap_api_json_middle_middle-proektiruyu-shemy-i-proveryayu-validnost\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Проектирую схемы и проверяю валидность»&lt;/span&gt;&lt;/a&gt;Middle: «Проектирую схемы и проверяю валидность»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_api_json_middle\" id=\"Roadmap_api_json_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне JSON/XML перестаёт быть просто «форматом, который я читаю». Теперь это &lt;strong&gt;предмет анализа&lt;/strong&gt;: вы работаете со схемами (JSON Schema, XSD), проверяете валидность данных, обеспечиваете консистентность документации с реальным API.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;JSON Schema:&lt;/strong&gt; вы читаете и анализируете JSON Schema: type, properties, required, enum, format, items, additionalProperties. Вы понимаете, как схема описывает контракт данных и как использовать её для валидации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;XSD (XML Schema Definition):&lt;/strong&gt; вы читаете XSD: elements, attributes, types, restrictions, complexType. Вы понимаете, как XSD описывает структуру XML-документа и как валидировать XML по схеме.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация данных:&lt;/strong&gt; вы используете JSON Schema и XSD для проверки: соответствует ли реальный ответ API описанной схеме?&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Связь с OpenAPI:&lt;/strong&gt; вы понимаете, как JSON Schema используется внутри OpenAPI 3.0 для описания requestBody и responses.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Документирование ошибок:&lt;/strong&gt; вы описываете структуру ошибок в JSON/XML: код, сообщение, детали.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Гибридный подход:&lt;/strong&gt; вы понимаете, что автогенерация из схем покрывает структуры, но не даёт контекста. Вы добавляете ручные описания поверх.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Инструменты:&lt;/strong&gt; вы работаете с инструментами валидации: JSON Schema Validator, oXygen для XML, Swagger для OpenAPI.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;анализируете и проверяете&lt;/strong&gt; структуры данных, а не просто документируете их. Вы отвечаете за точность контракта и полноту документации.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_api_json_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_api_json_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://json-schema.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JSON Schema Documentation (json-schema.org)&lt;/a&gt; - Официальная документация JSON Schema: type, properties, required, enum, format, validation keywords;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.w3schools.com/xml/schema_intro.asp\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;XSD Tutorial (W3Schools)&lt;/a&gt; - Основы XSD: elements, attributes, types, restrictions, complexType;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-2764-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Pro RESTful APIs (Sanjay Patni)&lt;/a&gt; - Глава 3 «Introduction — XML, JSON»: дизайн, построение и интеграция с REST, JSON, XML;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://json-schema.org/understanding-json-schema/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Understanding JSON Schema (json-schema.org)&lt;/a&gt; - Продвинутое руководство: schema composition, conditional validation, references;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.consult-timmins.com/api-technical-writing-json-xml/\" target=\"_blank\" rel=\"noreferrer noopener\"&
