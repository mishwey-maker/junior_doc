        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"middle-proektiruyu-explanation-sistemu-i-svyazyvayu-s-drugimi-tipami\"&gt;&lt;a href=\"Roadmap/metod/explanation/middle.html#middle-proektiruyu-explanation-sistemu-i-svyazyvayu-s-drugimi-tipami\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Проектирую explanation-систему и связываю с другими типами»&lt;/span&gt;&lt;/a&gt;Middle: «Проектирую explanation-систему и связываю с другими типами»&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне вы перестаёте писать отдельные explanation-статьи и начинаете &lt;strong&gt;проектировать систему объяснительного контента&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Система explanation:&lt;/strong&gt; вы определяете, какие концепции нуждаются в объяснении, как они связаны между собой, в каком порядке их читать.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Связывание с другими типами:&lt;/strong&gt; explanation может ссылаться на tutorial, how-to, reference. Вы проектируете эти cross-references.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Глубина и аудитория:&lt;/strong&gt; вы адаптируете глубину explanation под аудиторию. Для новичков — больше аналогий и контекста. Для опытных — больше деталей о компромиссах и альтернативах.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Уровни explanation:&lt;/strong&gt; вы понимаете, что explanation бывает разного масштаба: от «About X» до архитектурных обзоров.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация:&lt;/strong&gt; вы проверяете explanation на читателях: формируется ли у них правильная ментальная модель?&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность explanation: как часто его читают, снижает ли он количество вопросов в поддержке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;проектируете систему explanation&lt;/strong&gt; и связываете её с другими типами контента.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-middle\"&gt;&lt;a href=\"Roadmap/metod/explanation/middle.html#kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://diataxis.fr/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diátaxis Framework — Applying Diátaxis&lt;/a&gt; - Продвинутое применение: как связывать explanation с другими типами;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Главы о концептуальном контенте, работе с аудиторией, измерении эффективности;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://users.dcc.uchile.cl/~nbaloian/ArquitecturaDeLaInformacion/materialDeLAWeb/TriDoc2005-DQTI.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Developing Quality Technical Information (IBM)&lt;/a&gt; - Главы о проектировании объяснительного контента, progressive disclosure;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/information-architecture-4th/9781491913529/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Architecture: For the Web and Beyond (Rosenfeld, Morville, Arango)&lt;/a&gt; - Классика IA: организация, навигация, связывание типов контента;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.washington.edu/students/crscat/engl.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ENGL 396 A Winter 2026 (University of Washington)&lt;/a&gt; - Академический курс: document types включают conceptual overviews.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/metod/explanation/middle.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"t
