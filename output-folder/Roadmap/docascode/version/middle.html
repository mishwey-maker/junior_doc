        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"middle-nastraivayu-versionirovanie-i-upravlyayu-neskolkimi-versiyami\"&gt;&lt;a href=\"Roadmap/docascode/version/middle.html#middle-nastraivayu-versionirovanie-i-upravlyayu-neskolkimi-versiyami\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Настраиваю версионирование и управляю несколькими версиями»&lt;/span&gt;&lt;/a&gt;Middle: «Настраиваю версионирование и управляю несколькими версиями»&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне версионирование перестаёт быть просто «пониманием, что версии нужны». Теперь это &lt;strong&gt;предмет настройки&lt;/strong&gt;: вы выбираете стратегию, настраиваете инструменты, управляете несколькими версиями и обеспечиваете, чтобы пользователи всегда могли найти документацию для своей версии продукта.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Настройка версионирования в SSG:&lt;/strong&gt; вы умеете настроить версионирование для MkDocs (через плагин mike), Docusaurus (встроенное) или Antora. Вы понимаете, какие инструменты требуют ручного создания версий, а какие — автоматического.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия версионирования:&lt;/strong&gt; вы определяете, какую схему использовать: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nqy0t9v6\"&gt;major.minor&lt;/code&gt; (как в RMC Software Documentation) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jexazc9a\"&gt;major.minor.patch&lt;/code&gt;. Вы понимаете, что для документации часто достаточно &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v93meajy\"&gt;major.minor&lt;/code&gt;, а patch-изменения не требуют новой версии документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Управление алиасами:&lt;/strong&gt; вы настраиваете алиасы для версий: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-erge8imj\"&gt;latest&lt;/code&gt; (последняя стабильная версия), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n0mzv4a2\"&gt;dev&lt;/code&gt; (версия в разработке), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q6awowtf\"&gt;stable&lt;/code&gt; (LTS-версия). Вы понимаете, как алиасы влияют на URL и навигацию.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Версионный селектор:&lt;/strong&gt; вы настраиваете выпадающий список версий в шапке сайта. Вы понимаете, как работает маршрутизация: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n9o2r9i6\"&gt;example.com/1.7/&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e86vec2n\"&gt;example.com/latest/&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Уведомления об устаревших версиях:&lt;/strong&gt; вы настраиваете баннеры для старых версий с ссылкой на актуальную версию.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Автоматизация деплоя версий:&lt;/strong&gt; вы настраиваете CI/CD так, чтобы при создании нового тега или релиза продукта автоматически создавалась и деплоилась новая версия документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Политика поддержки версий:&lt;/strong&gt; вы определяете, сколько версий поддерживать (например, N-2: текущая и две предыдущие). Вы понимаете, когда архивировать старые версии.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;настраиваете и управляете&lt;/strong&gt;. Вы отвечаете за то, чтобы версионирование работало надёжно и не создавало путаницы для пользователей.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-middle\"&gt;&lt;a href=\"Roadmap/docascode/version/middle.html#kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://squidfunk.github.io/mkdocs-material/setup/setting-up-versioning/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Setting up versioning with mike (Material for MkDocs)&lt;/a&gt; - Официальное руководство: установка mike, настройка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ohsv61bn\"&gt;mkdocs.yml&lt;/code&gt;, деплой версий, работа с алиасами;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docusaurus.io/docs/versioning#tagging-a-new-version\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docusaurus: Tagging a new version&lt;/a&gt; - Пошаговое руководство: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h8974paz\"&gt;npm run docusaurus docs:version 1.0.0&lt;/code&gt;, работа с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ybul8u90\"&gt;versions.json&lt;/code&gt;;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/antora/antora/blob/main/docs/modules/ROOT/pages/versioning-content.adoc\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Antora: How to Version Documentation (GitHub)&lt;/a&gt; - Создание версионных веток, настройка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2moi45cq\"&gt;antora.yml&lt;/code&gt;, добавление в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-buqgy8xp\"&gt;antora-playbook.yml&lt;/code&gt;;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://rmc.software/documentation/versioning-system/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;RMC Software Documentation: Versioning System&lt;/a&gt; - Детальное руководство по стратегии версионирования: когда создавать major, когда minor, decision tree, примеры;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://theneo.io/blog/docs-as-code-with-markdown\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs-as-Code with Markdown (theneo.io)&lt;/a&gt; - Best practices: версионирование Markdown, синхронизация с Git.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/docascode/version/middle.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Middle: «Настраиваю версионирование и управляю несколькими версиями»","href":"Roadmap/docascode/version/middle.html#middle-nastraivayu-versionirovanie-i-upravlyayu-neskolkimi-versiyami","level":2,"items":[{"title":"Курсы и книги (Middle)","href":"Roadmap/docascode/version/middle.html#kursy-i-knigi-middle","level":3}]}],"title":""},"router":{"pathname":"Roadmap/docascode/version/middle","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
