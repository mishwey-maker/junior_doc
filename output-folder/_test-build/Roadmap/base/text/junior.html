        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"junior-delyu-na-razdely-i-delayu-skaniruemym\"&gt;&lt;a href=\"Roadmap/base/text/junior.html#junior-delyu-na-razdely-i-delayu-skaniruemym\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Делю на разделы и делаю сканируемым»&lt;/span&gt;&lt;/a&gt;Junior: «Делю на разделы и делаю сканируемым»&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне структура текста — это &lt;strong&gt;дисциплина оформления&lt;/strong&gt;. Вы следуете шаблонам и не изобретаете велосипед. Ключевой сдвиг: вы перестаёте думать «как мне удобно писать» и начинаете думать «как читателю удобно искать». Пользователи не читают документацию линейно — они сканируют её в поисках ответа. Поэтому структура должна поддерживать &lt;strong&gt;сканирование&lt;/strong&gt; (scannability).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Логичная иерархия:&lt;/strong&gt; заголовки H1–H3, вложенные подразделы, группировка связанных тем. Каждый заголовок должен отвечать на вопрос читателя. Структура без заголовков — это «стена текста», которую пользователь покинет за 20–30 секунд. Иерархия должна быть интуитивной: пользователю не нужно учиться читать документацию, чтобы найти нужное.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Chunking:&lt;/strong&gt; разбиение контента на небольшие блоки с одной целью. Человеческая рабочая память удерживает 5±2 элемента — если раздел пытается объяснить пять разных вещей, читатель теряет нить. DQTI (Developing Quality Technical Information) подчёркивает: «Break up text into manageable chunks» и «Outline or chunk tasks and topics».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Инвертированная пирамида:&lt;/strong&gt; ключевая информация — в начале. Первый абзац должен содержать главный ответ, детали — ниже. В заголовках и первом предложении каждого абзаца — самое важное. Это принцип из журналистики, который работает и в технической документации: читатель должен понять суть, даже если прочитает только первый абзац.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Cross-references:&lt;/strong&gt; ссылки на связанные разделы («см. также», «для получения дополнительной информации»). На Junior вы используете их по шаблону, но понимаете, зачем они нужны: они помогают читателю перейти к нужной теме, не читая весь документ. Хорошая cross-reference — это не «см. раздел 5», а «см. раздел „Настройка аутентификации“».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Списки и таблицы:&lt;/strong&gt; когда использовать нумерованный список (последовательность шагов), когда маркированный (перечисление), когда таблицу (сравнение параметров). Нумерованный список говорит: «делай по порядку». Маркированный — «это равнозначные элементы». Таблица — «сравни эти параметры». Выбор неправильного формата сбивает читателя с толку.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Сканируемость:&lt;/strong&gt; вы используете пробелы, заголовки, списки и короткие абзацы, чтобы текст можно было быстро просмотреть. «Стена текста» — главный враг junior-писателя. Разбивайте длинные абзацы на короткие, используйте подзаголовки каждые 200–300 слов.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;следуете&lt;/strong&gt; структуре, заданной шаблоном. Если в проекте принята структура «Цель → Предпосылки → Шаги → Результат» — вы делаете именно так. Вы не изобретаете новую структуру, а применяете существующую.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-junior\"&gt;&lt;a href=\"Roadmap/base/text/junior.html#kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - Фундаментальный курс: как организовывать информацию, как использовать заголовки, как строить абзацы. Раздел «Organizing information» даёт базовые принципы структурирования текста;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://learncoachassist.com/technical-writing-textbook/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing Textbook (LearnCoachAssist)&lt;/a&gt; - Учебник из 7 глав, включая «Document Structure and Information Design»: структура документа, информационный дизайн, организация контента. Даёт системное понимание того, как строится документация;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.litres.ru/book/maksim-ilyahov/pishi-sokraschay-kak-sozdavat-silnyy-tekst-20276938/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«Пиши, сокращай» (Максим Ильяхов, Людмила Сарычева)&lt;/a&gt; - Русскоязычная библия информационного стиля: как структурировать текст, чтобы он был читаемым. Главы о заголовках, списках и абзацах применимы к технической документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4302-6634-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;User Guides, Manuals, and Technical Writing (Adrian Wallwork)&lt;/a&gt; - Раздел «Structure and Content»: как писать различные секции мануала, какой контент включать, как организовать информацию для разных аудиторий. Написана специально для не-носителей английского;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.pearson.com/store/p/technical-communication-today/P100000855156\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Communication Today (Richard Johnson-Sheehan)&lt;/a&gt; - Учебник построен на принципе chunking: текст разбит на читаемые блоки с графикой. Показывает, как структура помогает читателю сканировать и находить информацию. Главы о заголовках, списках и визуальной организации;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/base/text/junior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Junior: «Делю на разделы и делаю сканируемым»","href":"Roadmap/base/text/junior.html#junior-delyu-na-razdely-i-delayu-skaniruemym","level":2,"items":[{"title":"Курсы и книги (Junior)","href":"Roadmap/base/text/junior.html#kursy-i-knigi-junior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/base/text/junior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
