        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"middle-nastraivayu-sbor-metrik-i-analiziruyu-dannye-dlya-uluchsheniya-dokumentacii\"&gt;&lt;a href=\"Roadmap/metric/metricdocs/middle.html#middle-nastraivayu-sbor-metrik-i-analiziruyu-dannye-dlya-uluchsheniya-dokumentacii\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Настраиваю сбор метрик и анализирую данные для улучшения документации»&lt;/span&gt;&lt;/a&gt;Middle: «Настраиваю сбор метрик и анализирую данные для улучшения документации»&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне метрики перестают быть просто «наблюдением». Теперь это &lt;strong&gt;инструмент управления качеством&lt;/strong&gt;: вы настраиваете сбор данных, анализируете их и используете для принятия решений. Ключевой сдвиг: вы перестаёте быть пассивным получателем отчётов и становитесь тем, кто &lt;strong&gt;определяет, что и как измерять&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Настройка аналитики:&lt;/strong&gt; Вы настраиваете Google Analytics 4 (или Plausible) для документационного сайта: custom dimensions (doc_version, doc_section, search_query), custom events (code_copy, feedback_submitted).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Настройка поисковой аналитики:&lt;/strong&gt; Вы работаете с Algolia Analytics или встроенной поисковой аналитикой, чтобы отслеживать search success rate, zero-result rate и популярные запросы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Анализ данных для принятия решений:&lt;/strong&gt; Вы не просто смотрите на цифры, а задаёте вопросы: почему у этой страницы высокий bounce rate? Почему пользователи ищут «X», но не находят? Какие темы генерируют больше всего тикетов в поддержку?&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Построение дашбордов:&lt;/strong&gt; Вы создаёте дашборд (в Google Looker Studio, Power BI или аналоге), который показывает ключевые метрики в динамике: search success rate, ticket deflection, time-to-first-success.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Связывание метрик с бизнес-целями:&lt;/strong&gt; Вы понимаете, как метрики документации связаны с бизнес-показателями: adoption продукта, retention, cost-to-serve. Вы можете оценить экономию, например, зная среднюю стоимость одного обращения в поддержку (около $15–$25) и достигнутый уровень ticket deflection[reference:1].&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A/B-тестирование:&lt;/strong&gt; Вы можете провести простой эксперимент: изменить структуру статьи или заголовок и сравнить метрики до и после.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Работа с поддержкой:&lt;/strong&gt; Вы налаживаете процесс обмена данными с поддержкой: какие тикеты можно было предотвратить с помощью документации?&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: Вы &lt;strong&gt;настраиваете и анализируете&lt;/strong&gt;. Вы отвечаете за то, чтобы данные были точными, а выводы — действенными.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-middle\"&gt;&lt;a href=\"Roadmap/metric/metricdocs/middle.html#kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://podscan.fm/podcasts/technical-writing-success/episodes/how-to-reduce-support-tickets-with-better-documentation-with-real-numbers\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to Reduce Support Tickets With Better Documentation (Technical Writing Success Podcast)&lt;/a&gt; - Эпизод о том, как рассчитать ROI документации через снижение затрат на поддержку, и о достижении ticket deflection rate в 25–60%;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.zoominsoftware.com/blog/kpis-benchmarks-measuring-content-roi/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Explore KPIs and benchmarks for measuring content ROI (Zoomin Software)&lt;/a&gt; - Статья о ключевых показателях эффективности и бенчмарках для измерения ROI технического контента;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://redish.net/wp-content/uploads/Redish_Applied_Theory_2010.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Applied Theory: Adding Value as a Professional Technical Communicator (Janice Redish)&lt;/a&gt; - Классическая работа, объясняющая концепцию добавленной стоимости и то, как рассчитать возврат инвестиций (ROI) в техническую коммуникацию;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Практическое руководство по измерению эффективности документации и построению процессов вокруг данных;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://support.google.com/analytics/answer/10089681\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Analytics 4 Documentation&lt;/a&gt; - Официальная документация GA4 для настройки кастомных событий и параметров.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"style":["_bundle/latex-extension.css"],"script":["_bundle/latex-extension.js"],"vcsPath":"Roadmap/metric/metricdocs/middle.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Middle: «Настраиваю сбор метрик и анализирую данные для улучшения документации»","href":"Roadmap/metric/metricdocs/middle.html#middle-nastraivayu-sbor-metrik-i-analiziruyu-dannye-dlya-uluchsheniya-dokumentacii","level":2,"items":[{"title":"Курсы и книги (Middle)","href":"Roadmap/metric/metricdocs/middle.html#kursy-i-knigi-middle","level":3}]}],"title":""},"router":{"pathname":"Roadmap/metric/metricdocs/middle","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"l
