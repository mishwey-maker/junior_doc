            {"data":{"leading":false,"html":"&lt;h2 id=\"middle-prevrashayu-audit-v-instrument-prinyatiya-reshenij\"&gt;&lt;a href=\"Roadmap/metric/auditdoc/middle.html#middle-prevrashayu-audit-v-instrument-prinyatiya-reshenij\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Превращаю аудит в инструмент принятия решений»&lt;/span&gt;&lt;/a&gt;Middle: «Превращаю аудит в инструмент принятия решений»&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне контент-аудит перестаёт быть просто «списком проблем». Теперь это &lt;strong&gt;инструмент управления контентом&lt;/strong&gt;: вы не просто находите проблемы, вы принимаете решения о судьбе каждого документа и приоритизируете работу на основе данных.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Аудит как decision tool:&lt;/strong&gt; вы превращаете аудит в решение, а не в список URL. Для каждой страницы вы определяете действие: &lt;strong&gt;Keep, Update, Merge, Archive, Delete&lt;/strong&gt; — с доказательствами и указанием ответственного за каждое деструктивное действие.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Оценка по двум осям:&lt;/strong&gt; вы оцениваете точность (accuracy) и ценность задачи (task value) отдельно. Страница с низким трафиком может быть обязательной с точки зрения комплаенса.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Приоритизация:&lt;/strong&gt; вы создаёте 30-дневный backlog, сгруппированный по продуктовым областям. Вы не просите стейкхолдеров читать 320 строк — вы даёте им краткое резюме и приоритетный план.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Управление жизненным циклом:&lt;/strong&gt; вы определяете состояния контента: draft, active, review due, stale, deprecated, archived. Вы знаете, когда страница должна перейти из active в review due: истёк срок верификации, исчез владелец, изменился исходный контракт.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Работа с метаданными:&lt;/strong&gt; вы используете метаданные для управления: content ID, lifecycle state, risk tier, product owner, documentation owner, last verified date, review interval.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Анализ данных:&lt;/strong&gt; вы используете аналитику (GA4, поисковые запросы, тикеты поддержки) для выявления страниц с высоким трафиком, но низкой удовлетворённостью, и страниц с нулевым трафиком, которые можно архивировать.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация:&lt;/strong&gt; вы проверяете, что аудит действительно решает проблемы: после обновления страниц снижается ли количество тикетов? Улучшается ли search success rate?&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;принимаете решения на основе данных&lt;/strong&gt;. Вы отвечаете за то, чтобы аудит приводил к действенному плану, а не к отчёту, который никто не читает.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-middle\"&gt;&lt;a href=\"Roadmap/metric/auditdoc/middle.html#kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/nagisanzenin/production-grade/blob/main/skills/technical-writer/phases/01-content-audit.md\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Phase 1: Content Audit (production-grade, GitHub, продвинутые разделы)&lt;/a&gt; - Продвинутые разделы: gap analysis, приоритизация, создание плана документации на основе аудита;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.mediawiki.org/wiki/Documentation/Toolkit/Content_audit\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Documentation/Toolkit/Content audit (MediaWiki, углублённый обзор)&lt;/a&gt; - Углублённый чек-лист для оценки полноты, точности и релевантности контента, включая проверку код-примеров;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.routledge.com/Content-Strategy-A-How-to-Guide/Getto-Labriola-Ruszkiewicz/p/book/9781138485495\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Content Strategy: A How-to Guide (Guiseppe Getto et al., продвинутые главы)&lt;/a&gt; - Главы о принятии решений на основе аудита и разработке контент-стратегии;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Главы о поддержании документации и работе с устаревшим контентом;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для управления жизненным циклом контента.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/metric/auditdoc/middle.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Middle: «Превращаю аудит в инструмент принятия решений»","href":"Roadmap/metric/auditdoc/middle.html#middle-prevrashayu-audit-v-instrument-prinyatiya-reshenij","level":2,"items":[{"title":"Курсы и книги (Middle)","href":"Roadmap/metric/auditdoc/middle.html#kursy-i-knigi-middle","level":3}]}],"title":""},"router":{"pathname":"Roadmap/metric/auditdoc/middle","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
