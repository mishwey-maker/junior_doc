        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"junior-ponimayu-pajplajn-i-zapuskayu-gotovyj-workflow\"&gt;&lt;a href=\"Roadmap/docascode/cicd/junior.html#junior-ponimayu-pajplajn-i-zapuskayu-gotovyj-workflow\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Понимаю пайплайн и запускаю готовый workflow»&lt;/span&gt;&lt;/a&gt;Junior: «Понимаю пайплайн и запускаю готовый workflow»&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне CI/CD — это &lt;strong&gt;процесс, за которым вы наблюдаете и в котором участвуете&lt;/strong&gt;. Вы учитесь работать с pull requests, понимать статусы проверок и исправлять ошибки, которые находит автоматика. Ключевой сдвиг: вы перестаёте воспринимать документацию как отдельный артефакт и начинаете видеть в ней &lt;strong&gt;часть инженерного workflow&lt;/strong&gt; — от коммита до публикации.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание принципа docs-as-code:&lt;/strong&gt; документация живёт в том же репозитории, что и код, использует те же инструменты (Git, Markdown, pull requests) и проходит те же этапы проверки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Работа с pull requests:&lt;/strong&gt; вы создаёте PR, видите, какие проверки запустились, и понимаете, что означает красный или зелёный статус. В современных workflow CI-система запускает тесты документации при каждом PR.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Базовые проверки:&lt;/strong&gt; вы знаете, что CI проверяет: сборка сайта (build), проверка ссылок (broken links), линтинг (стиль, форматирование), орфография. Вы умеете читать логи ошибок и исправлять их.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Простые workflow GitHub Actions:&lt;/strong&gt; вы понимаете структуру YAML-файла: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mcazro4l\"&gt;name&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-roy7fy9d\"&gt;on&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cri8bs3s\"&gt;jobs&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-loo6xm1n\"&gt;steps&lt;/code&gt;. Вы можете прочитать существующий workflow и понять, что он делает.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Деплой:&lt;/strong&gt; вы знаете, что после merge в main документация публикуется автоматически. Вы понимаете, что такое GitHub Pages или Read the Docs как платформа для публикации.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;участвуете&lt;/strong&gt; в CI/CD-процессе, а не проектируете его. Если проверка упала — вы исправляете ошибку и делаете новый коммит.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-junior\"&gt;&lt;a href=\"Roadmap/docascode/cicd/junior.html#kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://www.freecodecamp.org/news/set-up-documentation-as-code-with-docusaurus-and-github-actions/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to Set Up Documentation as Code with Docusaurus and GitHub Actions (freeCodeCamp)&lt;/a&gt; - Пошаговый гайд &lt;strong&gt;специально для технических писателей&lt;/strong&gt;: создание docs-сайта, настройка GitHub Actions для проверки грамматики через Vale перед merge. Beginner-friendly;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://techwriterstribe.com/courses/publish-your-website-with-docusaurus/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Publish your website with Docusaurus (Tech Writer's Tribe)&lt;/a&gt; - 4 сессии: Markdown, Git, Docusaurus, GitHub Actions, автоматическая публикация. &lt;strong&gt;Не требует опыта программирования&lt;/strong&gt;;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.gfu.de/schulung/docs-as-code/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Schulung Docs-as-Code: Technische Dokumentation mit Git, Markdown und CI/CD (GFU)&lt;/a&gt; - 2-дневный интенсив: CI/CD-Pipelines, Build-Prozesse, Testing (broken links, linting), Deployment;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://techwriters.ru/docs-as-code/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs as Code (techwriters.ru)&lt;/a&gt; - Подробное описание процесса docs-as-code на русском: схема workflow, CI/CD Pipeline, инструменты;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.github.com/en/actions\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitHub Actions Documentation&lt;/a&gt; - Официальная документация GitHub Actions: от первых шагов до продвинутых сценариев.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/docascode/cicd/junior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Junior: «Понимаю пайплайн и запускаю готовый workflow»","href":"Roadmap/docascode/cicd/junior.html#junior-ponimayu-pajplajn-i-zapuskayu-gotovyj-workflow","level":2,"items":[{"title":"Курсы и книги (Junior)","href":"Roadmap/docascode/cicd/junior.html#kursy-i-knigi-junior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/docascode/cicd/junior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
