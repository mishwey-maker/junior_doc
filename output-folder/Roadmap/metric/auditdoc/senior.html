        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"senior-stroyu-sistemu-upravleniya-zhiznennym-ciklom-kontenta\"&gt;&lt;a href=\"Roadmap/metric/auditdoc/senior.html#senior-stroyu-sistemu-upravleniya-zhiznennym-ciklom-kontenta\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Строю систему управления жизненным циклом контента»&lt;/span&gt;&lt;/a&gt;Senior: «Строю систему управления жизненным циклом контента»&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне контент-аудит становится &lt;strong&gt;элементом архитектуры управления контентом&lt;/strong&gt;. Вы не просто проводите аудиты, вы &lt;strong&gt;строите систему&lt;/strong&gt;, которая делает аудит регулярным, автоматизированным и масштабируемым. Вы определяете политику, стандарты и метрики, которые обеспечивают актуальность документации без ручного героизма.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия управления жизненным циклом:&lt;/strong&gt; вы определяете enforceable state machine для контента, привязанную к продуктовым доменам. Вы задаёте разрешённые переходы (draft → active → review due → stale → deprecated → archived) с критериями входа, утверждающими и доказательствами для каждого изменения.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за актуальность, как проверяется качество, как обрабатываются исключения. Вы создаёте контент-модели и таксономию, которые делают аудит воспроизводимым.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Автоматизация:&lt;/strong&gt; вы настраиваете автоматические проверки: staleness detection, broken link checking, terminology drift, missing metadata. Вы используете инструменты для регулярного сканирования.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых продуктов, языков, версий без перестройки процессов аудита.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность аудита: staleness rate (процент устаревших страниц), coverage gap rate (процент непокрытых тем), time-to-detect (время от устаревания до обнаружения), content debt backlog size.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды проведению аудита, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Влияние на продукт:&lt;/strong&gt; вы используете данные аудита как аргумент для изменения продукта: если документация для функции постоянно устаревает из-за частых изменений, это сигнал для продуктовой команды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Контент-аудит становится частью инженерной культуры, а не разовым проектом.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-senior\"&gt;&lt;a href=\"Roadmap/metric/auditdoc/senior.html#kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://www.routledge.com/Content-Strategy-A-How-to-Guide/Getto-Labriola-Ruszkiewicz/p/book/9781138485495\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Content Strategy: A How-to Guide (Guiseppe Getto et al., продвинутые главы)&lt;/a&gt; - Стратегическое управление контентом: от аудита до governance и масштабирования;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.mediawiki.org/wiki/Documentation/Toolkit/Content_audit\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Documentation/Toolkit/Content audit (MediaWiki, продвинутые разделы)&lt;/a&gt; - Разделы о работе с SME для углублённого аудита и о проверке технического контента;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://dl.acm.org/doi/book/10.5555/1190163\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Development: Managing Your Documentation, Projects, Portfolio, and People (JoAnn Hackos)&lt;/a&gt; - Управление портфелем документации и процессами обеспечения качества в масштабе;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации, включая governance и управление жизненным циклом.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/metric/auditdoc/senior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Senior: «Строю систему управления жизненным циклом контента»","href":"Roadmap/metric/auditdoc/senior.html#senior-stroyu-sistemu-upravleniya-zhiznennym-ciklom-kontenta","level":2,"items":[{"title":"Курсы и книги (Senior)","href":"Roadmap/metric/auditdoc/senior.html#kursy-i-knigi-senior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/metric/auditdoc/senior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
