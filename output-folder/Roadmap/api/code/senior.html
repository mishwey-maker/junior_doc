            {"data":{"leading":false,"html":"&lt;h2 id=\"senior-opredelyayu-standart-i-upravlyayu-lifecycle-primerov\"&gt;&lt;a href=\"Roadmap/api/code/senior.html#senior-opredelyayu-standart-i-upravlyayu-lifecycle-primerov\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и управляю lifecycle примеров»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и управляю lifecycle примеров»&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне примеры кода становятся &lt;strong&gt;элементом архитектуры документации&lt;/strong&gt;. Вы не просто создаёте примеры, вы &lt;strong&gt;управляете их lifecycle&lt;/strong&gt;: стандартизация, автоматизация, масштабирование, обучение команд.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия примеров:&lt;/strong&gt; вы определяете, какие типы примеров обязательны для каждого продукта, как они связаны с другими типами документации (tutorial, how-to, reference), как обеспечивается консистентность между командами.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за актуальность примеров, как проверяется их работоспособность, как обрабатываются breaking changes.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых API, языков, версий без ручной работы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;CI/CD для примеров:&lt;/strong&gt; вы настраиваете пайплайн: синтаксическая проверка → тестирование против контролируемой среды → публикация. Вы используете CI-гейты для проверки свежести примеров.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Стандарты примеров:&lt;/strong&gt; вы определяете, как оформлять примеры: форматирование, комментарии, обработка ошибок, безопасность.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды написанию примеров, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность примеров: time-to-first-call, support tickets, adoption.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Примеры кода становятся частью процесса разработки, а не разовым действием.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-senior\"&gt;&lt;a href=\"Roadmap/api/code/senior.html#kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды, включая code samples;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://api7.ai/blog/code-samples-in-api-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;API7.ai: Incorporating Code Samples (продвинутые разделы)&lt;/a&gt; - Управление портфелем примеров, метрики, масштабирование;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/style/api-reference-comments\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Developer Documentation Style Guide — API reference code comments&lt;/a&gt; - Стандарты для API reference: code samples на каждой странице (5–20 строк), ссылки на reference;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.gitbook.com/content-editor/blocks/code-block\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitBook: Adding custom code samples&lt;/a&gt; - Как добавлять кастомные примеры через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jf4qbt8r\"&gt;x-codeSamples&lt;/code&gt;, интеграция с Fern-generated SDK;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://mintlify.com/docs/api-playground/sdk-examples\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mintlify: Add SDK examples&lt;/a&gt; - Автоматическая генерация примеров через Speakeasy, добавление в OpenAPI.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/api/code/senior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Senior: «Определяю стандарт и управляю lifecycle примеров»","href":"Roadmap/api/code/senior.html#senior-opredelyayu-standart-i-upravlyayu-lifecycle-primerov","level":2,"items":[{"title":"Курсы и книги (Senior)","href":"Roadmap/api/code/senior.html#kursy-i-knigi-senior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/api/code/senior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
