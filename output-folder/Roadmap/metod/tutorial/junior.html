        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"junior-razlichayu-i-pishu-po-shablonu\"&gt;&lt;a href=\"Roadmap/metod/tutorial/junior.html#junior-razlichayu-i-pishu-po-shablonu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Различаю и пишу по шаблону»&lt;/span&gt;&lt;/a&gt;Junior: «Различаю и пишу по шаблону»&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне вы учитесь &lt;strong&gt;различать&lt;/strong&gt; how-to и tutorial и писать оба типа по готовым шаблонам. Ключевой сдвиг: вы перестаёте писать «инструкцию вообще» и начинаете осознанно выбирать формат под задачу читателя.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание разницы:&lt;/strong&gt; tutorial учит (читатель не знает ничего), how-to решает (читатель знает контекст). Tutorial — это обучающий опыт для новичка, how-to — практическое руководство для опытного пользователя.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Структура tutorial:&lt;/strong&gt; заголовок начинается с глагола («Создайте первый REST API»), структура — Goal → Prerequisites → Numbered steps → Immediate verifiable result at each step → Final outcome.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Структура how-to:&lt;/strong&gt; заголовок формулируется как задача («Как настроить X»), структура — Goal statement → Assumptions/prerequisites → Numbered steps → Expected result.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Шаблоны:&lt;/strong&gt; вы используете готовые шаблоны для обоих типов: Overview → Prerequisites → Steps → Examples → Troubleshooting.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Проверка на работоспособность:&lt;/strong&gt; вы тестируете свой tutorial или how-to, проходя по шагам самостоятельно.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;следуете&lt;/strong&gt; шаблону и осознанно выбираете формат под задачу читателя.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-junior\"&gt;&lt;a href=\"Roadmap/metod/tutorial/junior.html#kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - База: аудитория, активный залог, списки, структура. В Technical Writing Two есть раздел о создании примеров для туториалов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://diataxis.fr/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diátaxis Framework&lt;/a&gt; - Официальный фреймворк: различие между tutorials и how-to guides, принципы каждого типа;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://about.gitlab.com/handbook/product/ux/technical-writing/fundamentals/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitLab Technical Writing Fundamentals Course&lt;/a&gt; - Четыре вводных видео о типах топиков, грамматике и стилевых требованиях;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://ubuntu.com/blog/the-idea-of-a-tutorial\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The idea of a tutorial (Ubuntu Blog)&lt;/a&gt; - Глубокое объяснение разницы между tutorial и how-to: tutorial — обучение, how-to — применение навыка;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/wongyah/awesome-technical-writing-learning\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Awesome Technical Writing Learning (GitHub)&lt;/a&gt; - Кураторский список бесплатных ресурсов по техническому писательству.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/metod/tutorial/junior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Junior: «Различаю и пишу по шаблону»","href":"Roadmap/metod/tutorial/junior.html#junior-razlichayu-i-pishu-po-shablonu","leve
