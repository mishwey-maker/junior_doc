        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"senior-opredelyayu-standart-i-upravlyayu-sistemoj-generacii\"&gt;&lt;a href=\"Roadmap/docascode/auto/senior.html#senior-opredelyayu-standart-i-upravlyayu-sistemoj-generacii\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и управляю системой генерации»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и управляю системой генерации»&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне автоматизация генерации становится &lt;strong&gt;элементом архитектуры документации&lt;/strong&gt;. Вы не просто настраиваете генерацию для одного проекта, вы &lt;strong&gt;определяете стандарт для организации&lt;/strong&gt;: какие источники истины используются, как обрабатываются исключения, как измеряется качество сгенерированной документации.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия источников истины:&lt;/strong&gt; вы определяете, что является единым источником истины для каждого типа документации: OpenAPI для API reference, docstrings для SDK reference, код для архитектурных диаграмм. Вы понимаете, как связать разные источники.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за актуальность спецификаций, как обрабатываются breaking changes, как проверяется, что сгенерированная документация соответствует реальности.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых API, языков, версий без переписывания конфигураций для каждого.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Кросс-продуктовая генерация:&lt;/strong&gt; вы обеспечиваете, чтобы генерация работала across products: единый пайплайн для всех API, единый стиль сгенерированной документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики качества:&lt;/strong&gt; вы измеряете эффективность генерации: покрытие API документацией (какой процент эндпоинтов задокументирован), свежесть документации (насколько она отстаёт от кода), количество ошибок в сгенерированной документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды работе с генераторами, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Влияние на дизайн:&lt;/strong&gt; вы участвуете в design-ревью API и кода, предлагаете улучшения, которые делают генерацию более полной и точной.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Генерация документации становится частью инженерной культуры.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-senior\"&gt;&lt;a href=\"Roadmap/docascode/auto/senior.html#kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://dl.acm.org/doi/10.1145/3641237.3691677\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Implementing Structured Authoring Practices in a Docs-as-Code Framework (ACM)&lt;/a&gt; - Реальный кейс: структурированное авторство, генерация документации, автоматизация, масштабирование;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.docsastests.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs as Tests (Manny Silva)&lt;/a&gt; - Как применять концепцию тестирования к документации: автоматическая проверка актуальности, генерация из единого источника истины;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/technical-writing-for/9781098141349/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing for Software Developers (Chris Chinchilla)&lt;/a&gt; - Главы о docs-as-code, toolchains, автоматизации, генерации документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs-as-ecosystem.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs-as-Ecosystem (Alejandra Quetzalli)&lt;/a&gt; - Community approach to engineering documentation: как выстроить экосистему документации с автоматизацией;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/docascode/auto/senior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Senior: «Определяю стандарт и управляю системой генерации»","href":"Roadmap/docascode/auto/senior.html#senior-opredelyayu-standart-i-upravlyayu-sistemoj-generacii","level":2,"items":[{"title":"Курсы и книги (Senior)","href":"Roadmap/docascode/auto/senior.html#kursy-i-knigi-senior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/docascode/auto/senior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
