        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"junior-znayu-strukturu-i-pishu-po-shablonu\"&gt;&lt;a href=\"Roadmap/metod/reference/junior.html#junior-znayu-strukturu-i-pishu-po-shablonu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Знаю структуру и пишу по шаблону»&lt;/span&gt;&lt;/a&gt;Junior: «Знаю структуру и пишу по шаблону»&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне вы учитесь &lt;strong&gt;распознавать&lt;/strong&gt; reference и писать его по готовому шаблону. Ключевой сдвиг: вы перестаёте «объяснять» в справочнике и начинаете &lt;strong&gt;каталогизировать факты&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание сути reference:&lt;/strong&gt; это полный каталог фактов о чём-либо: API endpoints, параметры, настройки, коды ошибок, глоссарий.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Структура reference:&lt;/strong&gt; каждый элемент (функция, параметр, команда) следует одному и тому же паттерну: Name → Type → Description → Parameters (таблица: Name, Type, Default, Description) → Returns → Examples → Notes.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Таблицы и списки:&lt;/strong&gt; reference должен быть сканируемым. Параметры описываются в таблицах, а не в прозе.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Точность:&lt;/strong&gt; информация должна быть проверена по реальной системе. Reference не может быть «примерно верным».&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Отсутствие редактуры:&lt;/strong&gt; никаких оценочных суждений («эта опция лучше»), никаких tutorial-объяснений. Только факты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Примеры:&lt;/strong&gt; минимально полезный пример для каждого элемента — как вызвать функцию, как выглядит ответ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;пишете reference по шаблону&lt;/strong&gt;, не добавляя редактуры и оценочных суждений.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-junior\"&gt;&lt;a href=\"Roadmap/metod/reference/junior.html#kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://diataxis.fr/reference/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diátaxis Framework — Reference&lt;/a&gt; - Официальное описание reference: техническое описание фактов, нейтральность, структура, отражающая архитектуру системы;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ann-kilzer/doc-types-guide\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Doc Types Guide (GitHub)&lt;/a&gt; - Шаблон reference с примером: Name → Type → Description → Parameters → Returns → Examples → Notes;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - База: аудитория, структура, точность. Разделы о таблицах и списках применимы к reference;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://engineering.homeoffice.gov.uk/patterns/documentation/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write effective documentation (Home Office)&lt;/a&gt; - Разделение контента на conceptual, task-based и reference; рекомендации по структуре;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://about.gitlab.com/handbook/product/ux/technical-writing/fundamentals/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitLab Technical Writing Fundamentals&lt;/a&gt; - Типы топиков, включая reference; грамматика и стилевые требования.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/metod/reference/junior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Junior: «Знаю структуру и пишу по шаблону»","href":"Roadmap/metod/reference/junior.html#junior-znayu-strukturu-i-pishu-po-shablonu","level":2,"items":[{"title":"Курсы и книги (Junior)","href":"Roadmap/metod/reference/junior.html#kursy-i-knigi-junior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/metod/reference/junior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
