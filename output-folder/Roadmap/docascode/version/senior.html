        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"senior-opredelyayu-standart-i-upravlyayu-lifecycle-versij\"&gt;&lt;a href=\"Roadmap/docascode/version/senior.html#senior-opredelyayu-standart-i-upravlyayu-lifecycle-versij\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и управляю lifecycle версий»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и управляю lifecycle версий»&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне версионирование становится &lt;strong&gt;элементом архитектуры документации&lt;/strong&gt;. Вы не просто настраиваете версии для одного проекта, вы &lt;strong&gt;определяете стандарт для организации&lt;/strong&gt;, управляете lifecycle версий и обеспечиваете, чтобы документация для всех продуктов версионировалась консистентно.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия версионирования для организации:&lt;/strong&gt; вы определяете, какие продукты версионируются, по какой схеме, как долго поддерживаются старые версии. Вы понимаете, что версионирование — это не только техническая, но и &lt;strong&gt;продуктовая&lt;/strong&gt; задача: сколько версий поддерживать, как коммуницировать end-of-life.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за создание новой версии документации, как проверяется соответствие документации и продукта, как обрабатываются breaking changes в документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых продуктов, языков, версий без переписывания конфигураций для каждого.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Кросс-продуктовое версионирование:&lt;/strong&gt; вы обеспечиваете, чтобы версии документации для разных продуктов были согласованы. Например, если продукт A и продукт B используются вместе, их документация должна версионироваться синхронно.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Интеграция с релизным циклом:&lt;/strong&gt; вы интегрируете версионирование документации с процессом релизов продукта: при создании релиза автоматически создаётся версия документации, при обновлении продукта — обновляется документация.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность версионирования: сколько пользователей остаются на старых версиях, как часто они переключаются, снижается ли количество обращений в поддержку.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды работе с версиями, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Версионирование документации становится частью продуктовой стратегии.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-senior\"&gt;&lt;a href=\"Roadmap/docascode/version/senior.html#kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://dl.acm.org/doi/10.1145/3641237.3691677\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Implementing Structured Authoring Practices in a Docs-as-Code Framework (ACM)&lt;/a&gt; - Реальный кейс: version control, structured authoring, SSG, deployment options, content maintenance strategies;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docusaurus.io/community/release-process\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docusaurus Release Process&lt;/a&gt; - Пример управления версиями в крупном open-source проекте: SemVer, major/minor/patch, политика поддержки старых версий;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.antora.org/antora/latest/playbook/configure-content-sources/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Antora: Version Facets (docs.antora.org)&lt;/a&gt; - Продвинутое версионирование: actual version, prerelease, display, symbolic. Управление версиями в масштабе;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации, включая версионирование и governance.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/docascode/version/senior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Senior: «Определяю стандарт и управляю lifecycle версий»","href":"Roadmap/docascode/version/senior.html#senior-opredelyayu-standart-i-upravlyayu-lifecycle-versij","level":2,"items":[{"title":"Курсы и книги (Senior)","href":"Roadmap/docascode/version/senior.html#kursy-i-knigi-senior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/docascode/version/senior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
