ументации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs-as-ecosystem.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs-as-Ecosystem (Alejandra Quetzalli)&lt;/a&gt; - Community approach to engineering documentation: как выстроить экосистему документации с автоматизацией;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_comunication_sme_junior_junior-gotovlyus-i-zadayu-konkretnye-voprosy\" data-original-article=\"Roadmap/comunication/sme/junior.html\"&gt;&lt;a href=\"#Roadmap_comunication_sme_junior_junior-gotovlyus-i-zadayu-konkretnye-voprosy\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Готовлюсь и задаю конкретные вопросы»&lt;/span&gt;&lt;/a&gt;Junior: «Готовлюсь и задаю конкретные вопросы»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_comunication_sme_junior\" id=\"Roadmap_comunication_sme_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне интервью с SME — это &lt;strong&gt;дисциплина подготовки&lt;/strong&gt;. Вы учитесь не «просить рассказать о фиче», а задавать узкие, сценарные вопросы, на которые эксперт может ответить конкретно. Ключевой сдвиг: вы перестаёте надеяться на «walkthrough» и начинаете приходить на встречу подготовленным.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Подготовка перед встречей:&lt;/strong&gt; это не обсуждается. Вы читаете существующие материалы, пробуете продукт самостоятельно, готовите конкретные вопросы. Ваши вопросы должны быть информированными и точными, а не широкими и подавляющими.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Определение цели интервью:&lt;/strong&gt; перед встречей вы формулируете чёткую цель и делитесь ею с SME. Это даёт эксперту понимание, о чём будет разговор, и позволяет ему подготовиться.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Узкие, сценарные вопросы:&lt;/strong&gt; вместо «Расскажите мне об этой настройке?» вы спрашиваете: «Пожалуйста, проведите меня через то, что происходит, когда пользователь впервые настраивает этот параметр».&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Исследование темы:&lt;/strong&gt; вы изучаете исходную документацию, предыдущие версии, Jira-тикеты. Вы определяете противоречия и допущения, которые нужно прояснить.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Активное слушание:&lt;/strong&gt; во время интервью вы слушаете, анализируете и удерживаете контроль над диапазоном и глубиной интервью с тактом.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация:&lt;/strong&gt; вы резюмируете и проверяете сразу: «Итак, система повторяет попытку дважды, затем выбрасывает эту ошибку — верно?».&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Follow-up в письменной форме:&lt;/strong&gt; после встречи вы отправляете резюме. Инженеры доверяют документированным резюме больше, чем договорённостям по памяти.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;готовитесь и задаёте конкретные вопросы&lt;/strong&gt;. Инженеры не будут давать вам всё, что нужно, по собственной инициативе.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_comunication_sme_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_comunication_sme_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/TECH-OPSS/Technical-Writing-Masterclass-C/blob/main/Module%2010.md\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical-Writing-Masterclass-C: Module 10 — Collaborating with SMEs (GitHub, TECH-OPSS)&lt;/a&gt; - Полный модуль по работе с SME: типы экспертов, жизненный цикл коллаборации, подготовка, проведение интервью, валидация;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://psutechcommtopics.miraheze.org/wiki/Interviewing_Subject_Matter_Experts\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Conducting Successful SME Interviews (Jennifer Lambe, Intercom)&lt;/a&gt; - Классическая статья: что делать до, во время и после интервью. Работа с hostile SMEs;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.archbee.com/blog/sme-interview-tips\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Subject Matter Expert (SME) Interview Tips for Technical Writers (Archbee)&lt;/a&gt; - Шесть практических советов: определение цели, исследование темы, подготовка вопросов, тон;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://writingtendencies.com/2017/04/24/getting-the-most-out-of-sme-interviews/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Getting the Most Out of SME Interviews (Writing Tendencies)&lt;/a&gt; - Фреймворк для интервью: пяти W и H, идентификация предпосылок и use cases;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - База: аудитория, структура, ясность. Применимо к формулировке вопросов.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_comunication_sme_middle_middle-upravlyayu-processom-i-vystraivayu-dolgosrochnye-otnosheniya\" data-original-article=\"Roadmap/comunication/sme/middle.html\"&gt;&lt;a href=\"#Roadmap_comunication_sme_middle_middle-upravlyayu-processom-i-vystraivayu-dolgosrochnye-otnosheniya\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Управляю процессом и выстраиваю долгосрочные отношения»&lt;/span&gt;&lt;/a&gt;Middle: «Управляю процессом и выстраиваю долгосрочные отношения»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_comunication_sme_middle\" id=\"Roadmap_comunication_sme_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне интервью с SME перестаёт быть разовым мероприятием. Теперь это &lt;strong&gt;часть выстроенного процесса&lt;/strong&gt;: вы управляете циклом коллаборации, знаете типы SME и адаптируете подход под каждого, а также выстраиваете доверие, чтобы инженеры сами приходили к вам с информацией.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Управление жизненным циклом коллаборации:&lt;/strong&gt; вы понимаете и управляете полным циклом: Pre-interview Research → Initial Meeting → Interview Sessions → Drafting → SME Review → Revision → Sign-off.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Адаптация под типы SME:&lt;/strong&gt; вы понимаете, что Product SME (PM, UX), Technical SME (разработчики, архитекторы), Operational SME (поддержка, SRE) и Regulatory SME (комплаенс, юристы) требуют разных подходов.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Работа с персонами:&lt;/strong&gt; вы адаптируете коммуникацию под конкретного эксперта. Backend-разработчик предпочитает техническую краткость и ожидает понимания JSON. PM фокусируется на user journey и предпочитает flowchart.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Эффективное использование времени SME:&lt;/strong&gt; вы проводите тщательное исследование до интервью и исключаете вопросы, на которые можно ответить самостоятельным изучением. Вы используете стратегический «позвоночник вопросов» на основе пяти W и H.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Проверка через процедуры:&lt;/strong&gt; вы проходите процедуры вживую, действуя как прокси для конечного пользователя, и задаёте уточняющие вопросы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Работа с трудными SME:&lt;/strong&gt; вы умеете перенаправлять разговор обратно к теме, повторять то, что сказал эксперт, чтобы получить более развёрнутый ответ.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Итеративная валидация:&lt;/strong&gt; вы развиваете контент через итеративную валидацию и циклы ревью, которые сохраняют целостность контента.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;управляете процессом и строите отношения&lt;/strong&gt;. Со временем ваша позиция меняется: инженеры начинают предвидеть ваши вопросы, вовлекают вас раньше, и вы учитесь извлекать нужную информацию.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_comunication_sme_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_comunication_sme_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/TECH-OPSS/Technical-Writing-Masterclass-C/blob/main/Module%2010.md\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TECH-OPSS Technical-Writing-Masterclass-C: Module 10 (GitHub, продвинутые разделы)&lt;/a&gt; - Продвинутые разделы: персоны SME, цикл коллаборации, работа с challenging scenarios;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://podscan.fm/podcasts/technical-writing-success/episodes/how-to-interview-an-sme-without-wasting-their-time-or-yours\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to Interview an SME Without Wasting Their Time (or Yours) (Technical Writing Success Podcast)&lt;/a&gt; - Фреймворк: rigorous pre-interview research, strategic question spine (5 Ws + H), walking through procedures live;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www2.gov.bc.ca/gov/content/governments/services-for-government/service-experience-digital-delivery/digital-delivery/digital-content/writing-content/interview-subject-matter-experts\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Interview subject matter experts (Government of British Columbia)&lt;/a&gt; - Практические рекомендации: не принимать мнения за факты, подтверждать данные, понимать аудиторию;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, работа с разработчиками, измерение эффективности;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://payhip.com/b/5QZ2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Extracting Technical Knowledge from BUSY SMEs (Payhip)&lt;/a&gt; - Специализированная книга: Asking Better Questions, Pre-SME Preparation, Interview Shortcuts, Validating Asynchronously.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_comunication_sme_senior_senior-opredelyayu-standart-i-masshtabiruyu-kollaboraciyu\" data-original-article=\"Roadmap/comunication/sme/senior.html\"&gt;&lt;a href=\"#Roadmap_comunication_sme_senior_senior-opredelyayu-standart-i-masshtabiruyu-kollaboraciyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и масштабирую коллаборацию»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и масштабирую коллаборацию»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_comunication_sme_senior\" id=\"Roadmap_comunication_sme_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне интервью с SME становится &lt;strong&gt;элементом организационной культуры&lt;/strong&gt;. Вы не просто управляете процессом для себя, вы &lt;strong&gt;определяете стандарт для организации&lt;/strong&gt;: как выстраивается коллаборация между писателями и экспертами, как масштабируется на несколько команд и продуктов, как измеряется эффективность.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия коллаборации:&lt;/strong&gt; вы определяете, как писатели и SME работают вместе в масштабе: какие процессы, какие артефакты, какие ожидания. Вы понимаете, что организационная структура влияет на динамику взаимодействия.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за актуальность информации, как обрабатываются конфликты между писателем и SME, как проверяется точность.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых продуктов, команд, языков без перестройки процессов.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Кросс-функциональная работа:&lt;/strong&gt; вы обеспечиваете, чтобы писатели и SME работали в единой экосистеме: общие цели, общие инструменты, общие метрики.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды работе с SME, проводите воркшопы, создаёте внутренние стандарты. Вы понимаете, что навык задавать правильные вопросы редко преподаётся формально.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность коллаборации: скорость получения информации, точность документации, количество итераций ревью, удовлетворённость SME.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Влияние на организацию:&lt;/strong&gt; вы рекомендуете изменения в структуре, которые улучшают коллаборацию.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Коллаборация с SME становится частью инженерной культуры компании.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_comunication_sme_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_comunication_sme_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://dl.acm.org/doi/book/10.5555/1190163\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Development: Managing Your Documentation, Projects, Portfolio, and People (JoAnn Hackos)&lt;/a&gt; - Управление документацией и командой в масштабе: процессы, метрики, организационные структуры, коллаборация с SME;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://users.dcc.uchile.cl/~nbaloian/ArquitecturaDeLaInformacion/materialDeLAWeb/TriDoc2005-DQTI.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Developing Quality Technical Information (IBM)&lt;/a&gt; - Продвинутые главы: валидация, метрики, работа с экспертами;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации, включая коллаборацию и governance;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.tekom.de/veranstaltungen/content-management-seminar\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Content-Management Seminar (tekom.de)&lt;/a&gt; - Content-Management-Methoden, Modularisierung, Metadaten und (PI-)Klassifikation, XML und Informationsmodelle.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_comunication_stp_junior_junior-prinimayu-obratnuyu-svyaz-i-uchus-na-nej\" data-original-article=\"Roadmap/comunication/stp/junior.html\"&gt;&lt;a href=\"#Roadmap_comunication_stp_junior_junior-prinimayu-obratnuyu-svyaz-i-uchus-na-nej\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Принимаю обратную связь и учусь на ней»&lt;/span&gt;&lt;/a&gt;Junior: «Принимаю обратную связь и учусь на ней»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_comunication_stp_junior\" id=\"Roadmap_comunication_stp_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне обратная связь — это &lt;strong&gt;дисциплина восприятия&lt;/strong&gt;. Вы учитесь не защищаться, а слушать, задавать уточняющие вопросы и применять замечания. Ключевой сдвиг: вы перестаёте воспринимать правки как критику в свой адрес и начинаете видеть в них &lt;strong&gt;инструмент улучшения текста&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Открытость:&lt;/strong&gt; вы не реагируете защитно. Обратная связь касается контента, а не вас лично.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Уточняющие вопросы:&lt;/strong&gt; если комментарий непонятен, вы спрашиваете: «Что именно здесь неясно?», «Можете привести пример?».&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Поиск паттернов:&lt;/strong&gt; вы анализируете повторяющиеся замечания и делаете выводы: «Мне часто говорят, что я использую пассивный залог — нужно поработать над этим».&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Применение правок:&lt;/strong&gt; вы внедряете обратную связь итеративно, а не откладываете на потом.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Благодарность:&lt;/strong&gt; вы благодарите ревьюеров за insights — это укрепляет отношения и поощряет дальнейшую обратную связь.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;принимаете и применяете&lt;/strong&gt;. Вы не спорите с каждым замечанием, а ищете, что можно улучшить.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_comunication_stp_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_comunication_stp_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://document360.com/webinar/the-art-of-feedback-technical-writing-edition/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The art of feedback: Technical writing edition (Document360, Sneha Pandey)&lt;/a&gt; - Разбор принципов эффективной обратной связи: be specific, be objective, be actionable, be timely. Примеры плохих и хороших комментариев;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://document360.com/webinar/collaborative-writing-on-technical-teams/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to Conduct Peer Reviews (Document360, Danielle Vansia)&lt;/a&gt; - Типы peer review, процесс, как давать и получать обратную связь. Шаблон workflow: Write → Draft → Reviewer (2–4 дня) → Incorporate Feedback (1–2 дня);&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - База: структура, ясность. Разделы о рецензировании применимы к обратной связи;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://conventionalcomments.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Conventional Comments&lt;/a&gt; - Стандарт для комментариев в ревью: префиксы (suggestion, issue, nitpick), которые делают обратную связь понятной и уважительной;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://uscranton.com/starting-place-giving-feedback/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Starting Place: Giving Feedback (University of Virginia)&lt;/a&gt; - Практические советы: как запрашивать обратную связь, какие вопросы задавать, как предоставлять контекст.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_comunication_stp_middle_middle-dayu-obratnuyu-svyaz-i-upravlyayu-revyu\" data-original-article=\"Roadmap/comunication/stp/middle.html\"&gt;&lt;a href=\"#Roadmap_comunication_stp_middle_middle-dayu-obratnuyu-svyaz-i-upravlyayu-revyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Даю обратную связь и управляю ревью»&lt;/span&gt;&lt;/a&gt;Middle: «Даю обратную связь и управляю ревью»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_comunication_stp_middle\" id=\"Roadmap_comunication_stp_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне обратная связь перестаёт быть просто «принятием правок». Теперь это &lt;strong&gt;предмет управления&lt;/strong&gt;: вы даёте конструктивные ревью junior-писателям, разрешаете конфликты между стейкхолдерами, выстраиваете процесс peer review.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Конструктивная обратная связь:&lt;/strong&gt; вы даёте конкретные, объективные, действенные комментарии. Вы начинаете с того, что работает, затем переходите к областям для улучшения.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Фокус на высокоэффективных областях:&lt;/strong&gt; вы приоритезируете структуру, ясность и логику, а не придираетесь к стилю.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Peer review процесс:&lt;/strong&gt; вы выстраиваете процесс ревью: кто ревьюит кого, сроки, что проверяется. В командах &amp;gt;10 писателей требуется формализованный ротационный процесс.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Разрешение конфликтов:&lt;/strong&gt; вы умеете работать с противоречивой обратной связью от разных стейкхолдеров. Вы фильтруете, что действительно важно, и не позволяете процессу превратиться в хаос.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Инструменты:&lt;/strong&gt; вы используете conventional comments, шаблоны ревью, чек-листы. Вы понимаете, какие инструменты подходят для разных типов ревью (formal, informal, anonymous).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обратная связь по содержанию:&lt;/strong&gt; вы проверяете не только грамматику, но и точность, полноту, консистентность.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;даёте и управляете&lt;/strong&gt;. Вы отвечаете за качество обратной связи в команде и за то, чтобы процесс ревью работал.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_comunication_stp_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_comunication_stp_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://document360.com/webinar/collaborative-writing-on-technical-teams/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Collaborative Writing on Technical Teams: Establishing an Effective Peer Review Process (Document360)&lt;/a&gt; - Полный разбор peer review: типы, процесс, сроки, что измерять. Примеры workflow для команд разного размера;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://redhat-documentation.github.io/peer-review/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Red Hat Peer Review Guide (redhat-documentation.github.io)&lt;/a&gt; - Реальный стандарт peer review: чек-листы для языка, структуры, точности. «Peer reviews must be kind… Support your comments with style guides»;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://users.dcc.uchile.cl/~nbaloian/ArquitecturaDeLaInformacion/materialDeLAWeb/TriDoc2005-DQTI.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Developing Quality Technical Information (IBM)&lt;/a&gt; - Глава «Reviewing, testing, and evaluating technical information»: checklists для ревью, качественные характеристики;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://conventionalcomments.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Conventional Comments&lt;/a&gt; - Единый язык для комментариев ревью: suggestion, issue, nitpick, question. Упрощает коммуникацию;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.piazza-copernico.it/en/courses/the-art-of-feedback/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The Art of Feedback (Piazza Copernico)&lt;/a&gt; - Как давать негативную обратную связь конструктивно, когда обратная связь неэффективна.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_comunication_stp_senior_senior-opredelyayu-standart-i-stroyu-kulturu-obratnoj-svyazi\" data-original-article=\"Roadmap/comunication/stp/senior.html\"&gt;&lt;a href=\"#Roadmap_comunication_stp_senior_senior-opredelyayu-standart-i-stroyu-kulturu-obratnoj-svyazi\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и строю культуру обратной связи»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и строю культуру обратной связи»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_comunication_stp_senior\" id=\"Roadmap_comunication_stp_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне обратная связь становится &lt;strong&gt;элементом организационной культуры&lt;/strong&gt;. Вы не просто управляете процессом для команды, вы &lt;strong&gt;определяете стандарт для организации&lt;/strong&gt;: как давать обратную связь, как её принимать, как измерять эффективность, как масштабировать культуру ревью.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия обратной связи:&lt;/strong&gt; вы определяете, как обратная связь вписывается в общий процесс разработки документации: кто ревьюит, когда, с какими критериями.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: как обрабатываются конфликты между стейкхолдерами, как проверяется качество ревью, как обучаются новые ревьюеры.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых команд, продуктов, языков без потери качества обратной связи.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Кросс-функциональная обратная связь:&lt;/strong&gt; вы обеспечиваете, чтобы обратная связь работала между писателями, разработчиками, продактами, поддержкой.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды давать и принимать обратную связь, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность обратной связи: скорость внедрения правок, качество документации после ревью, удовлетворённость ревьюеров.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Влияние на культуру:&lt;/strong&gt; вы формируете культуру, в которой обратная связь — это норма, а не событие. Вы поощряете итеративную обратную связь.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Культура обратной связи становится частью инженерной культуры компании.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_comunication_stp_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_comunication_stp_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://dl.acm.org/doi/book/10.5555/1190163\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Development: Managing Your Documentation, Projects, Portfolio, and People (JoAnn Hackos)&lt;/a&gt; - Управление документацией и командой в масштабе: процессы, метрики, организационные структуры, культура ревью;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://users.dcc.uchile.cl/~nbaloian/ArquitecturaDeLaInformacion/materialDeLAWeb/TriDoc2005-DQTI.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Developing Quality Technical Information (IBM, продвинутые главы)&lt;/a&gt; - Главы о валидации, метриках, обучении ревьюеров, культуре качества;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, работа с командой, измерение эффективности, обучение;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/continuous-delivery-reliable/9780321670250/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Continuous Delivery (Jez Humble, David Farley)&lt;/a&gt; - Принципы CI/CD, применимые к культуре обратной связи: быстрые итерации, автоматизация, измерение;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации, включая ревью, коллаборацию и governance.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_comunication_press_junior_junior-pokazyvayu,-chto-sdelal\" data-original-article=\"Roadmap/comunication/press/junior.html\"&gt;&lt;a href=\"#Roadmap_comunication_press_junior_junior-pokazyvayu,-chto-sdelal\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Показываю, что сделал»&lt;/span&gt;&lt;/a&gt;Junior: «Показываю, что сделал»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_comunication_press_junior\" id=\"Roadmap_comunication_press_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне презентация работы — это &lt;strong&gt;дисциплина факта&lt;/strong&gt;. Вы учитесь рассказывать о выполненной задаче: что было сделано, зачем, какой результат. Ключевой сдвиг: вы перестаёте прятаться за текстом и начинаете &lt;strong&gt;показывать свою работу&lt;/strong&gt; — на демо, на стендапе, на ретроспективе.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Рассказ о задаче:&lt;/strong&gt; вы можете за 2–3 минуты объяснить, что сделали: какую документацию написали, для какой аудитории, какую проблему решили.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Демонстрация результата:&lt;/strong&gt; вы показываете готовый артефакт: страницу документации, API reference, KB-статью. Вы объясняете, как это работает и почему это полезно.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Ответы на вопросы:&lt;/strong&gt; вы не боитесь вопросов от разработчиков, продактов, поддержки. Если не знаете ответ — вы честно говорите и обещаете уточнить.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Структура презентации:&lt;/strong&gt; вы следуете простой структуре: контекст → задача → решение → результат → следующие шаги.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Визуализация:&lt;/strong&gt; вы используете скриншоты, диаграммы, примеры кода. Вы понимаете, что «показать» лучше, чем «рассказать».&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;показываете результат&lt;/strong&gt; и объясняете, какую проблему он решает. Вы не прячетесь за «я просто написал текст».&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_comunication_press_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_comunication_press_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.routledge.com/Technical-Writing-and-Speaking-An-Introduction/van-Emden-Easteal/p/book/9780415391788\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing and Speaking: An Introduction (Joan van Emden, Jennifer Easteal)&lt;/a&gt; - Классическое введение в техническую презентацию: как структурировать, как готовить визуальные материалы, как выступать;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.cambridge.org/core/books/how-to-write-and-present-technical-information/6B3F4F5F5F5F5F5F5F5F5F5F5F5F5F5F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to Write and Present Technical Information (Cambridge)&lt;/a&gt; - Практическое руководство: как представлять техническую информацию устно и письменно;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.tonex.com/training-courses/communications-skills-for-engineers-and-developers/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Communications Skills for Engineers and Developers (Tonex)&lt;/a&gt; - Module 3: Presenting Technical Information — preparing, using visuals, engaging audiences, handling questions;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - База: аудитория, структура, ясность. Применимо к структуре презентации.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_comunication_press_middle_middle-predstavlyayu-rezultaty-proekta\" data-original-article=\"Roadmap/comunication/press/middle.html\"&gt;&lt;a href=\"#Roadmap_comunication_press_middle_middle-predstavlyayu-rezultaty-proekta\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Представляю результаты проекта»&lt;/span&gt;&lt;/a&gt;Middle: «Представляю результаты проекта»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_comunication_press_middle\" id=\"Roadmap_comunication_press_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне презентация перестаёт быть просто «рассказом о задаче». Теперь это &lt;strong&gt;представление результатов проекта&lt;/strong&gt;: вы показываете метрики, обосновываете решения, демонстрируете impact. Ключевой сдвиг: вы перестаёте говорить «я написал документацию» и начинаете говорить «документация снизила количество обращений в поддержку на X%».&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Метрики и impact:&lt;/strong&gt; вы представляете результаты с цифрами: page views, self-service rate, снижение support tickets, time-to-find. Вы понимаете, что «результат без метрики — это мнение».&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обоснование решений:&lt;/strong&gt; вы объясняете, почему выбрали именно такой подход: почему task-based структура, почему именно эти примеры кода, почему такая стратегия версионирования.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Адаптация под аудиторию:&lt;/strong&gt; вы адаптируете презентацию под аудиторию: для разработчиков — технические детали, для продактов — impact на пользователей, для менеджмента — ROI.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Визуализация данных:&lt;/strong&gt; вы используете графики, диаграммы, дашборды для представления метрик.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Ответы на сложные вопросы:&lt;/strong&gt; вы готовы к вопросам о trade-offs, альтернативах, ограничениях. Вы не защищаетесь — вы объясняете.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Презентация на ретроспективе:&lt;/strong&gt; вы представляете результаты проекта на ретроспективе: что сработало, что нет, что измените в следующий раз.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;представляете результаты с метриками и обоснованием&lt;/strong&gt;. Вы отвечаете за то, чтобы ваш вклад был виден и измерим.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_comunication_press_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_comunication_press_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://ep.jhu.edu/courses/645705-communication-and-presentations-for-engineers/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Communication and Presentations for Engineers (Johns Hopkins University)&lt;/a&gt; - 3 модуля: Audience Analysis, Storytelling and Narrative, Visual Storytelling. Translate technical work into communication that drives action;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.coursera.org/learn/effective-presentations-persuasive-writing\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Effective Presentations and Persuasive Writing (Coursera)&lt;/a&gt; - Design effective presentation slides, create compelling arguments, tailor communication strategies based on audience needs;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/TECH-OPSS/Technical-Writing-Masterclass-A\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical-Writing-Masterclass-A: Module 9 — Career Paths &amp;amp; Portfolio Building (TECH-OPSS)&lt;/a&gt; - Turning skills into a fulfilling career: self-presentation, portfolio building, career paths;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://document360.com/webinar/creating-tech-writing-portfolios-with-docs-as-code-tooling/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Document360: Creating Tech Writing Portfolios with Docs as Code Tooling&lt;/a&gt; - Organize portfolio items, tagging samples for relevance, custom domain, blog to showcase expertise.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_comunication_press_senior_senior-predstavlyayu-dokumentaciyu-na-urovne-kompanii\" data-original-article=\"Roadmap/comunication/press/senior.html\"&gt;&lt;a href=\"#Roadmap_comunication_press_senior_senior-predstavlyayu-dokumentaciyu-na-urovne-kompanii\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Представляю документацию на уровне компании»&lt;/span&gt;&lt;/a&gt;Senior: «Представляю документацию на уровне компании»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_comunication_press_senior\" id=\"Roadmap_comunication_press_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне презентация становится &lt;strong&gt;элементом организационной стратегии&lt;/strong&gt;. Вы не просто представляете результаты проекта, вы &lt;strong&gt;представляете документацию на уровне компании&lt;/strong&gt;: защищаете бюджет, обосновываете стратегию, влияете на продуктовые решения. Ключевой сдвиг: вы перестаёте быть «тем, кто пишет документацию» и становитесь «тем, кто определяет, как компания доносит информацию до пользователей».&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегическая презентация:&lt;/strong&gt; вы представляете стратегию документации: какие продукты, какие аудитории, какие каналы, какие метрики. Вы связываете документацию с бизнес-целями.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Защита бюджета:&lt;/strong&gt; вы обосновываете ресурсы: сколько писателей нужно, какие инструменты, какое обучение. Вы говорите на языке бизнеса: ROI, cost-to-serve, adoption.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Влияние на продукт:&lt;/strong&gt; вы представляете рекомендации по улучшению продукта с точки зрения документируемости. Разработчики приходят к вам за советом &lt;strong&gt;до&lt;/strong&gt; начала разработки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Презентация для executive-аудитории:&lt;/strong&gt; вы умеете говорить с C-level: коротко, по делу, с фокусом на impact. Вы используете layered summaries: executive summary → детали → приложения.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Storytelling:&lt;/strong&gt; вы используете нарратив: проблема → решение → результат → следующий шаг. Вы понимаете, что «данные убеждают, но истории вдохновляют».&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение и менторство:&lt;/strong&gt; вы обучаете команду презентации, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Документация становится частью продуктовой стратегии.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_comunication_press_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_comunication_press_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/presentation-patterns/9780132963374/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Presentation Patterns: Techniques for Crafting Better Presentations (Neal Ford et al.)&lt;/a&gt; - Паттерны презентаций: структура, визуализация, delivery. Для технических специалистов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/slideology/9780596527486/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;slide:ology: The Art and Science of Creating Great Presentations (Nancy Duarte)&lt;/a&gt; - Классика визуальных презентаций: как превратить данные в историю, как дизайнить slides для impact;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.tonex.com/training-courses/executive-briefing-and-communication-for-engineers/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Executive Briefing and Communication for Engineers (Tonex)&lt;/a&gt; - Delivering executive presentations, strengthening leadership communication skills;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.devx.com/technical-communication/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to Bridge the Gap When Communicating Technical Progress to Stakeholders (DevX)&lt;/a&gt; - Two-layer, metrics-led cadence, layered summaries, dual narratives, outcome-first briefs;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, работа с командой, измерение эффективности, обучение.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_comunication_press_junior_junior-pokazyvayu,-chto-sdelal\" data-original-article=\"Roadmap/comunication/press/junior.html\"&gt;&lt;a href=\"#Roadmap_comunication_press_junior_junior-pokazyvayu,-chto-sdelal\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Показываю, что сделал»&lt;/span&gt;&lt;/a&gt;Junior: «Показываю, что сделал»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_comunication_press_junior\" id=\"Roadmap_comunication_press_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне презентация работы — это &lt;strong&gt;дисциплина факта&lt;/strong&gt;. Вы учитесь рассказывать о выполненной задаче: что было сделано, зачем, какой результат. Ключевой сдвиг: вы перестаёте прятаться за текстом и начинаете &lt;strong&gt;показывать свою работу&lt;/strong&gt; — на демо, на стендапе, на ретроспективе.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Рассказ о задаче:&lt;/strong&gt; вы можете за 2–3 минуты объяснить, что сделали: какую документацию написали, для какой аудитории, какую проблему решили.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Демонстрация результата:&lt;/strong&gt; вы показываете готовый артефакт: страницу документации, API reference, KB-статью. Вы объясняете, как это работает и почему это полезно.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Ответы на вопросы:&lt;/strong&gt; вы не боитесь вопросов от разработчиков, продактов, поддержки. Если не знаете ответ — вы честно говорите и обещаете уточнить.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Структура презентации:&lt;/strong&gt; вы следуете простой структуре: контекст → задача → решение → результат → следующие шаги.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Визуализация:&lt;/strong&gt; вы используете скриншоты, диаграммы, примеры кода. Вы понимаете, что «показать» лучше, чем «рассказать».&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;показываете результат&lt;/strong&gt; и объясняете, какую проблему он решает. Вы не прячетесь за «я просто написал текст».&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_comunication_press_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_comunication_press_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.routledge.com/Technical-Writing-and-Speaking-An-Introduction/van-Emden-Easteal/p/book/9780415391788\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing and Speaking: An Introduction (Joan van Emden, Jennifer Easteal)&lt;/a&gt; - Классическое введение в техническую презентацию: как структурировать, как готовить визуальные материалы, как выступать;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.cambridge.org/core/books/how-to-write-and-present-technical-information/6B3F4F5F5F5F5F5F5F5F5F5F5F5F5F5F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to Write and Present Technical Information (Cambridge)&lt;/a&gt; - Практическое руководство: как представлять техническую информацию устно и письменно;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.tonex.com/training-courses/communications-skills-for-engineers-and-developers/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Communications Skills for Engineers and Developers (Tonex)&lt;/a&gt; - Module 3: Presenting Technical Information — preparing, using visuals, engaging audiences, handling questions;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - База: аудитория, структура, ясность. Применимо к структуре презентации.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_comunication_press_middle_middle-predstavlyayu-rezultaty-proekta\" data-original-article=\"Roadmap/comunication/press/middle.html\"&gt;&lt;a href=\"#Roadmap_comunication_press_middle_middle-predstavlyayu-rezultaty-proekta\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Представляю результаты проекта»&lt;/span&gt;&lt;/a&gt;Middle: «Представляю результаты проекта»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_comunication_press_middle\" id=\"Roadmap_comunication_press_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне презентация перестаёт быть просто «рассказом о задаче». Теперь это &lt;strong&gt;представление результатов проекта&lt;/strong&gt;: вы показываете метрики, обосновываете решения, демонстрируете impact. Ключевой сдвиг: вы перестаёте говорить «я написал документацию» и начинаете говорить «документация снизила количество обращений в поддержку на X%».&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Метрики и impact:&lt;/strong&gt; вы представляете результаты с цифрами: page views, self-service rate, снижение support tickets, time-to-find. Вы понимаете, что «результат без метрики — это мнение».&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обоснование решений:&lt;/strong&gt; вы объясняете, почему выбрали именно такой подход: почему task-based структура, почему именно эти примеры кода, почему такая стратегия версионирования.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Адаптация под аудиторию:&lt;/strong&gt; вы адаптируете презентацию под аудиторию: для разработчиков — технические детали, для продактов — impact на пользователей, для менеджмента — ROI.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Визуализация данных:&lt;/strong&gt; вы используете графики, диаграммы, дашборды для представления метрик.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Ответы на сложные вопросы:&lt;/strong&gt; вы готовы к вопросам о trade-offs, альтернативах, ограничениях. Вы не защищаетесь — вы объясняете.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Презентация на ретроспективе:&lt;/strong&gt; вы представляете результаты проекта на ретроспективе: что сработало, что нет, что измените в следующий раз.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;представляете результаты с метриками и обоснованием&lt;/strong&gt;. Вы отвечаете за то, чтобы ваш вклад был виден и измерим.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_comunication_press_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_comunication_press_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://ep.jhu.edu/courses/645705-communication-and-presentations-for-engineers/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Communication and Presentations for Engineers (Johns Hopkins University)&lt;/a&gt; - 3 модуля: Audience Analysis, Storytelling and Narrative, Visual Storytelling. Translate technical work into communication that drives action;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.coursera.org/learn/effective-presentations-persuasive-writing\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Effective Presentations and Persuasive Writing (Coursera)&lt;/a&gt; - Design effective presentation slides, create compelling arguments, tailor communication strategies based on audience needs;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/TECH-OPSS/Technical-Writing-Masterclass-A\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical-Writing-Masterclass-A: Module 9 — Career Paths &amp;amp; Portfolio Building (TECH-OPSS)&lt;/a&gt; - Turning skills into a fulfilling career: self-presentation, portfolio building, career paths;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://document360.com/webinar/creating-tech-writing-portfolios-with-docs-as-code-tooling/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Document360: Creating Tech Writing Portfolios with Docs as Code Tooling&lt;/a&gt; - Organize portfolio items, tagging samples for relevance, custom domain, blog to showcase expertise.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_comunication_press_senior_senior-predstavlyayu-dokumentaciyu-na-urovne-kompanii\" data-original-article=\"Roadmap/comunication/press/senior.html\"&gt;&lt;a href=\"#Roadmap_comunication_press_senior_senior-predstavlyayu-dokumentaciyu-na-urovne-kompanii\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Представляю документацию на уровне компании»&lt;/span&gt;&lt;/a&gt;Senior: «Представляю документацию на уровне компании»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_comunication_press_senior\" id=\"Roadmap_comunication_press_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне презентация становится &lt;strong&gt;элементом организационной стратегии&lt;/strong&gt;. Вы не просто представляете результаты проекта, вы &lt;strong&gt;представляете документацию на уровне компании&lt;/strong&gt;: защищаете бюджет, обосновываете стратегию, влияете на продуктовые решения. Ключевой сдвиг: вы перестаёте быть «тем, кто пишет документацию» и становитесь «тем, кто определяет, как компания доносит информацию до пользователей».&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегическая презентация:&lt;/strong&gt; вы представляете стратегию документации: какие продукты, какие аудитории, какие каналы, какие метрики. Вы связываете документацию с бизнес-целями.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Защита бюджета:&lt;/strong&gt; вы обосновываете ресурсы: сколько писателей нужно, какие инструменты, какое обучение. Вы говорите на языке бизнеса: ROI, cost-to-serve, adoption.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Влияние на продукт:&lt;/strong&gt; вы представляете рекомендации по улучшению продукта с точки зрения документируемости. Разработчики приходят к вам за советом &lt;strong&gt;до&lt;/strong&gt; начала разработки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Презентация для executive-аудитории:&lt;/strong&gt; вы умеете говорить с C-level: коротко, по делу, с фокусом на impact. Вы используете layered summaries: executive summary → детали → приложения.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Storytelling:&lt;/strong&gt; вы используете нарратив: проблема → решение → результат → следующий шаг. Вы понимаете, что «данные убеждают, но истории вдохновляют».&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение и менторство:&lt;/strong&gt; вы обучаете команду презентации, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Документация становится частью продуктовой стратегии.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_comunication_press_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_comunication_press_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/presentation-patterns/9780132963374/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Presentation Patterns: Techniques for Crafting Better Presentations (Neal Ford et al.)&lt;/a&gt; - Паттерны презентаций: структура, визуализация, delivery. Для технических специалистов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/slideology/9780596527486/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;slide:ology: The Art and Science of Creating Great Presentations (Nancy Duarte)&lt;/a&gt; - Классика визуальных презентаций: как превратить данные в историю, как дизайнить slides для impact;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.tonex.com/training-courses/executive-briefing-and-communication-for-engineers/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Executive Briefing and Communication for Engineers (Tonex)&lt;/a&gt; - Delivering executive presentations, strengthening leadership communication skills;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.devx.com/technical-communication/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to Bridge the Gap When Communicating Technical Progress to Stakeholders (DevX)&lt;/a&gt; - Two-layer, metrics-led cadence, layered summaries, dual narratives, outcome-first briefs;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, работа с командой, измерение эффективности, обучение.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_metricdocs_junior_junior-ponimayu,-kakie-metriki-vazhny,-i-sobirayu-bazovye-dannye\" data-original-article=\"Roadmap/metric/metricdocs/junior.html\"&gt;&lt;a href=\"#Roadmap_metric_metricdocs_junior_junior-ponimayu,-kakie-metriki-vazhny,-i-sobirayu-bazovye-dannye\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Понимаю, какие метрики важны, и собираю базовые данные»&lt;/span&gt;&lt;/a&gt;Junior: «Понимаю, какие метрики важны, и собираю базовые данные»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_metricdocs_junior\" id=\"Roadmap_metric_metricdocs_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне метрики — это &lt;strong&gt;осознание того, что ваша работа измерима&lt;/strong&gt;. Вы учитесь определять, какие показатели важны для документации, и собирать базовые данные с помощью существующих инструментов. Ключевой сдвиг: вы перестаёте оценивать свою работу только по объёму написанного и начинаете задаваться вопросом «как это повлияло на пользователя?».&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание ключевых метрик:&lt;/strong&gt; Вы знаете, что метрики документации делятся на категории: вовлечённость (page views, time on page), поиск (search success rate, zero-result rate), поддержка (ticket deflection rate) и удовлетворённость (CSAT, NPS).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Работа с существующими инструментами:&lt;/strong&gt; Вы умеете открывать дашборды в Google Analytics или Pendo и снимать базовые показатели: количество просмотров страницы, среднее время на странице, показатели поиска.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Понимание разницы между vanity- и impact-метриками:&lt;/strong&gt; Вы знаете, что page views и количество слов — это «метрики тщеславия», которые мало говорят о реальной пользе. Настоящие метрики — это те, что показывают, решает ли документация проблемы пользователей. Такие показатели, как time-on-page, bounce rate и даже CSAT, могут быть «почти бесполезны» для демонстрации ценности вашей работы[reference:0].&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Сбор данных из поддержки:&lt;/strong&gt; Вы можете запросить у команды поддержки данные о том, какие вопросы чаще всего задают пользователи, и сопоставить их с существующей документацией.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Понимание ticket deflection:&lt;/strong&gt; Вы знаете, что такое «отклонение тикетов» (support ticket deflection) — процент запросов, решённых с помощью документации без обращения в поддержку.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: Вы &lt;strong&gt;наблюдаете и собираете&lt;/strong&gt; данные, используя готовые дашборды и отчёты. Вы не строите систему метрик, а учитесь читать те, что уже есть.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_metricdocs_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_metric_metricdocs_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.linkedin.com/posts/aldendesoto_technical-writers-measure-business-outcomes-activity-7362867263705673729-djiT\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical writers: Measure business outcomes, not doc usage (Alden DeSoto, LinkedIn)&lt;/a&gt; - Пост о том, почему традиционные метрики (time-on-page, bounce rate) не работают, и какие бизнес-показатели (adoption, retention, снижение затрат на поддержку) действительно важны;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.linkedin.com/posts/joshua-fechter_12-tw-metrics-that-prove-your-work-is-working-activity-7454937490018205696-k8F8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;12 Technical Writer Metrics to Prove Documentation's Impact (Joshua Gene Fechter, LinkedIn)&lt;/a&gt; - Список из 12 метрик с пояснениями: time-to-first-success, task success rate, ticket deflection, staleness rate и другие;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://document360.com/blog/value-of-documentation/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The Value of Documentation for Business Growth and Support (Document360)&lt;/a&gt; - Обзор метрик, включая финансовые, и того, как их использовать для обоснования ценности документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://redocly.com/blog/key-metrics-for-docs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Key Metrics for Docs (Redocly)&lt;/a&gt; - Простое объяснение трёх ключевых метрик: acquisition, adoption, deflection. С конкретными примерами, что измерять;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Глава об измерении успеха контента через аналитику и обратную связь. Практические шаблоны и принципы.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_metricdocs_middle_middle-nastraivayu-sbor-metrik-i-analiziruyu-dannye-dlya-uluchsheniya-dokumentacii\" data-original-article=\"Roadmap/metric/metricdocs/middle.html\"&gt;&lt;a href=\"#Roadmap_metric_metricdocs_middle_middle-nastraivayu-sbor-metrik-i-analiziruyu-dannye-dlya-uluchsheniya-dokumentacii\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Настраиваю сбор метрик и анализирую данные для улучшения документации»&lt;/span&gt;&lt;/a&gt;Middle: «Настраиваю сбор метрик и анализирую данные для улучшения документации»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_metricdocs_middle\" id=\"Roadmap_metric_metricdocs_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне метрики перестают быть просто «наблюдением». Теперь это &lt;strong&gt;инструмент управления качеством&lt;/strong&gt;: вы настраиваете сбор данных, анализируете их и используете для принятия решений. Ключевой сдвиг: вы перестаёте быть пассивным получателем отчётов и становитесь тем, кто &lt;strong&gt;определяет, что и как измерять&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Настройка аналитики:&lt;/strong&gt; Вы настраиваете Google Analytics 4 (или Plausible) для документационного сайта: custom dimensions (doc_version, doc_section, search_query), custom events (code_copy, feedback_submitted).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Настройка поисковой аналитики:&lt;/strong&gt; Вы работаете с Algolia Analytics или встроенной поисковой аналитикой, чтобы отслеживать search success rate, zero-result rate и популярные запросы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Анализ данных для принятия решений:&lt;/strong&gt; Вы не просто смотрите на цифры, а задаёте вопросы: почему у этой страницы высокий bounce rate? Почему пользователи ищут «X», но не находят? Какие темы генерируют больше всего тикетов в поддержку?&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Построение дашбордов:&lt;/strong&gt; Вы создаёте дашборд (в Google Looker Studio, Power BI или аналоге), который показывает ключевые метрики в динамике: search success rate, ticket deflection, time-to-first-success.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Связывание метрик с бизнес-целями:&lt;/strong&gt; Вы понимаете, как метрики документации связаны с бизнес-показателями: adoption продукта, retention, cost-to-serve. Вы можете оценить экономию, например, зная среднюю стоимость одного обращения в поддержку (около $15–$25) и достигнутый уровень ticket deflection[reference:1].&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A/B-тестирование:&lt;/strong&gt; Вы можете провести простой эксперимент: изменить структуру статьи или заголовок и сравнить метрики до и после.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Работа с поддержкой:&lt;/strong&gt; Вы налаживаете процесс обмена данными с поддержкой: какие тикеты можно было предотвратить с помощью документации?&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: Вы &lt;strong&gt;настраиваете и анализируете&lt;/strong&gt;. Вы отвечаете за то, чтобы данные были точными, а выводы — действенными.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_metricdocs_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_metric_metricdocs_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://podscan.fm/podcasts/technical-writing-success/episodes/how-to-reduce-support-tickets-with-better-documentation-with-real-numbers\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to Reduce Support Tickets With Better Documentation (Technical Writing Success Podcast)&lt;/a&gt; - Эпизод о том, как рассчитать ROI документации через снижение затрат на поддержку, и о достижении ticket deflection rate в 25–60%;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.zoominsoftware.com/blog/kpis-benchmarks-measuring-content-roi/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Explore KPIs and benchmarks for measuring content ROI (Zoomin Software)&lt;/a&gt; - Статья о ключевых показателях эффективности и бенчмарках для измерения ROI технического контента;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://redish.net/wp-content/uploads/Redish_Applied_Theory_2010.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Applied Theory: Adding Value as a Professional Technical Communicator (Janice Redish)&lt;/a&gt; - Классическая работа, объясняющая концепцию добавленной стоимости и то, как рассчитать возврат инвестиций (ROI) в техническую коммуникацию;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Практическое руководство по измерению эффективности документации и построению процессов вокруг данных;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://support.google.com/analytics/answer/10089681\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Analytics 4 Documentation&lt;/a&gt; - Официальная документация GA4 для настройки кастомных событий и параметров.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_metricdocs_senior_senior-stroyu-sistemu-metrik-i-dokazyvayu-roi-dokumentacii\" data-original-article=\"Roadmap/metric/metricdocs/senior.html\"&gt;&lt;a href=\"#Roadmap_metric_metricdocs_senior_senior-stroyu-sistemu-metrik-i-dokazyvayu-roi-dokumentacii\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Строю систему метрик и доказываю ROI документации»&lt;/span&gt;&lt;/a&gt;Senior: «Строю систему метрик и доказываю ROI документации»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_metricdocs_senior\" id=\"Roadmap_metric_metricdocs_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне метрики становятся &lt;strong&gt;элементом бизнес-стратегии&lt;/strong&gt;. Вы не просто анализируете данные для улучшения документации, вы &lt;strong&gt;строите систему измерений&lt;/strong&gt;, которая доказывает ценность документации для бизнеса и влияет на продуктовые решения. Ключевой сдвиг: вы перестаёте говорить «документация стала лучше» и начинаете говорить «документация снизила cost-to-serve на X% и увеличила adoption на Y%».&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия метрик для организации:&lt;/strong&gt; Вы определяете, какие метрики обязательны для всех документационных проектов, как они связаны с бизнес-целями, как часто измеряются.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Построение системы измерений:&lt;/strong&gt; Вы проектируете end-to-end систему: от сбора данных (GA4, Algolia, Pendo) до дашбордов (Looker Studio, Power BI) и регулярных отчётов для стейкхолдеров.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Связывание метрик с ROI:&lt;/strong&gt; Вы умеете рассчитать возврат на инвестиции в документацию: сколько стоит поддержка, сколько тикетов отклонено, сколько времени сэкономлено. Вы работаете с другими отделами (маркетинг, поддержка), чтобы получить необходимые данные[reference:2].&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Влияние на продуктовые решения:&lt;/strong&gt; Вы используете данные о пробелах в документации (coverage gap rate, staleness rate) как аргумент для изменения продукта или приоритизации фич.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; Вы определяете политику: кто отвечает за сбор метрик, как проверяется их достоверность, как обрабатываются выбросы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; Вы проектируете систему, которая выдерживает рост: добавление новых продуктов, языков, версий без перестройки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; Вы обучаете команды работе с метриками, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Презентация для executive-аудитории:&lt;/strong&gt; Вы умеете представлять метрики на уровне C-level: коротко, с фокусом на impact и ROI.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: Вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Метрики документации становятся частью бизнес-отчётности.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_metricdocs_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_metric_metricdocs_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.tekom.de/shop/betriebliche-kennzahlen-fuer-die-technische-kommunikation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Betriebliche Kennzahlen für die Technische Kommunikation (tekom)&lt;/a&gt; - Система показателей tekom: более 100 метрик для управления технической документацией, практические основы, модель внедрения, scorecard;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.infomanagementcenter.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The Center for Information-Development Management (CIDM) Resources&lt;/a&gt; - Ресурсы по измерению ROI и управлению эффективностью документационных команд, включая материалы по DITA metrics;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Главы об измерении успеха контента, публикации и поддержании документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации, включая измерение эффективности и governance;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://itrevolution.com/product/accelerate/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Accelerate (Nicole Forsgren et al.)&lt;/a&gt; - Научный подход к измерению эффективности, DORA-метрики, которые можно адаптировать для документации.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_auditdoc_junior_junior-provozhu-inventarizaciyu-i-fiksiruyu-problemy\" data-original-article=\"Roadmap/metric/auditdoc/junior.html\"&gt;&lt;a href=\"#Roadmap_metric_auditdoc_junior_junior-provozhu-inventarizaciyu-i-fiksiruyu-problemy\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Провожу инвентаризацию и фиксирую проблемы»&lt;/span&gt;&lt;/a&gt;Junior: «Провожу инвентаризацию и фиксирую проблемы»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_auditdoc_junior\" id=\"Roadmap_metric_auditdoc_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне контент-аудит — это &lt;strong&gt;дисциплина наблюдения и документирования&lt;/strong&gt;. Вы учитесь замечать несоответствия, устаревшую информацию и пробелы, но пока не принимаете стратегических решений. Ключевой сдвиг: вы перестаёте просто «писать текст» и начинаете видеть документацию как &lt;strong&gt;систему&lt;/strong&gt;, которую нужно регулярно проверять.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Инвентаризация:&lt;/strong&gt; вы умеете составить список всех существующих документов: страницы, API reference, туториалы, release notes. Вы фиксируете базовые метаданные: путь к файлу, тип контента, целевую аудиторию, дату последнего обновления. В идеале инвентаризация включает аудит README, комментариев в коде и анализ пробелов (gap analysis) относительно требуемой документации[reference:3].&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Проверка на соответствие чек-листу:&lt;/strong&gt; вы используете готовый чек-лист для оценки качества: ясность (активный залог, короткие предложения), полнота (раскрыта ли тема), точность (соответствует ли реальному поведению продукта). Чек-лист может включать проверку заголовка (описательный и конкретный), введения, ссылок и статуса страницы (отсутствие баннеров «draft» или «outdated»).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Выявление очевидных проблем:&lt;/strong&gt; вы находите битые ссылки, устаревшие скриншоты, опечатки, страницы с пометкой «draft», которые так и не были опубликованы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Сбор данных обратной связи:&lt;/strong&gt; вы запрашиваете у поддержки список частых вопросов и сопоставляете его с существующей документацией: есть ли статьи, отвечающие на эти вопросы?&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Документирование находок:&lt;/strong&gt; вы создаёте простой отчёт: «Страница X устарела», «Для функции Y нет документации», «Ссылка Z ведёт на 404». Вы не предлагаете решение, а &lt;strong&gt;фиксируете факт&lt;/strong&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;находите и записываете&lt;/strong&gt; проблемы, используя готовые шаблоны и чек-листы. Вы не принимаете решений о том, что делать с находками.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_auditdoc_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_metric_auditdoc_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/nagisanzenin/production-grade/blob/main/skills/technical-writer/phases/01-content-audit.md\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Phase 1: Content Audit (production-grade, GitHub)&lt;/a&gt; - Пример формального процесса аудита: инвентаризация, анализ пробелов, приоритизация. Включает шаблоны таблиц и критерии оценки;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.mediawiki.org/wiki/Documentation/Toolkit/Content_audit\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Documentation/Toolkit/Content audit (MediaWiki)&lt;/a&gt; - Два чек-листа для ревью документации: быстрый (заголовок, введение, ссылки) и углублённый (полнота, точность, код-примеры);&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://owasp.org/www-project-wstg/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Qualitative and Quantitative Content Audit (OWASP)&lt;/a&gt; - Методология аудита контента с критериями оценки: достоверность, оригинальность, точность, доступность, форматирование, релевантность аудитории;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.linkedin.com/posts/sneha-pandey-a8b5a6a_tech-writers-audit-checklist-for-quality-activity-7170937490018205696-k8F8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Tech Writer's Audit Checklist for Quality Control (Sneha Pandey, LinkedIn)&lt;/a&gt; - Практический чек-лист для контроля качества документации перед публикацией;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.routledge.com/Content-Strategy-A-How-to-Guide/Getto-Labriola-Ruszkiewicz/p/book/9781138485495\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Content Strategy: A How-to Guide (Guiseppe Getto et al.)&lt;/a&gt; - Глава о контент-аудите: от инвентаризации до разработки контент-моделей.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_auditdoc_middle_middle-prevrashayu-audit-v-instrument-prinyatiya-reshenij\" data-original-article=\"Roadmap/metric/auditdoc/middle.html\"&gt;&lt;a href=\"#Roadmap_metric_auditdoc_middle_middle-prevrashayu-audit-v-instrument-prinyatiya-reshenij\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Превращаю аудит в инструмент принятия решений»&lt;/span&gt;&lt;/a&gt;Middle: «Превращаю аудит в инструмент принятия решений»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_auditdoc_middle\" id=\"Roadmap_metric_auditdoc_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне контент-аудит перестаёт быть просто «списком проблем». Теперь это &lt;strong&gt;инструмент управления контентом&lt;/strong&gt;: вы не просто находите проблемы, вы принимаете решения о судьбе каждого документа и приоритизируете работу на основе данных.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Аудит как decision tool:&lt;/strong&gt; вы превращаете аудит в решение, а не в список URL. Для каждой страницы вы определяете действие: &lt;strong&gt;Keep, Update, Merge, Archive, Delete&lt;/strong&gt; — с доказательствами и указанием ответственного за каждое деструктивное действие.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Оценка по двум осям:&lt;/strong&gt; вы оцениваете точность (accuracy) и ценность задачи (task value) отдельно. Страница с низким трафиком может быть обязательной с точки зрения комплаенса.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Приоритизация:&lt;/strong&gt; вы создаёте 30-дневный backlog, сгруппированный по продуктовым областям. Вы не просите стейкхолдеров читать 320 строк — вы даёте им краткое резюме и приоритетный план.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Управление жизненным циклом:&lt;/strong&gt; вы определяете состояния контента: draft, active, review due, stale, deprecated, archived. Вы знаете, когда страница должна перейти из active в review due: истёк срок верификации, исчез владелец, изменился исходный контракт.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Работа с метаданными:&lt;/strong&gt; вы используете метаданные для управления: content ID, lifecycle state, risk tier, product owner, documentation owner, last verified date, review interval.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Анализ данных:&lt;/strong&gt; вы используете аналитику (GA4, поисковые запросы, тикеты поддержки) для выявления страниц с высоким трафиком, но низкой удовлетворённостью, и страниц с нулевым трафиком, которые можно архивировать.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация:&lt;/strong&gt; вы проверяете, что аудит действительно решает проблемы: после обновления страниц снижается ли количество тикетов? Улучшается ли search success rate?&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;принимаете решения на основе данных&lt;/strong&gt;. Вы отвечаете за то, чтобы аудит приводил к действенному плану, а не к отчёту, который никто не читает.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_auditdoc_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_metric_auditdoc_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/nagisanzenin/production-grade/blob/main/skills/technical-writer/phases/01-content-audit.md\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Phase 1: Content Audit (production-grade, GitHub, продвинуты
