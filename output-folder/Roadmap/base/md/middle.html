        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;[TOC]&lt;/p&gt;\n&lt;h2 id=\"middle-vybirayu-i-nastraivayu\"&gt;&lt;a href=\"Roadmap/base/md/middle.html#middle-vybirayu-i-nastraivayu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Выбираю и настраиваю»&lt;/span&gt;&lt;/a&gt;Middle: «Выбираю и настраиваю»&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне Markdown перестаёт быть просто «языком, на котором я пишу». Теперь это предмет решений: какой диалект использовать, какие расширения подключать, какие правила линтинга настроить, как обеспечить единообразие в команде.&lt;/p&gt;\n&lt;p&gt;Что входит в Middle-уровень:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Выбор диалекта:&lt;/strong&gt; вы понимаете разницу между CommonMark, GFM, MyST, и можете обосновать, почему для проекта выбран именно этот вариант. Markdown (CommonMark/GFM) — тривиален для изучения, все его знают, он даёт чистые диффы, но имеет ограничения: нет встроенных includes, сносок, сложных таблиц, admonitions.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Расширения:&lt;/strong&gt; вы знаете, как подключить и использовать admonitions (callouts), footnotes, definition lists, task lists, tabbed code blocks, collapsible sections. Вы понимаете, какие расширения даёт Python-Markdown, какие — MyST, а какие — SSG (MkDocs, Docusaurus).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Линтинг и валидация:&lt;/strong&gt; вы настраиваете markdownlint для проверки синтаксиса и Vale для проверки стиля. Vale позволяет превратить стайлгайд в исполняемые правила: он ловит жаргон, пассивный залог, несоответствия терминов — прямо в редакторе или в CI.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Интеграция с SSG:&lt;/strong&gt; вы понимаете, как Markdown-файлы превращаются в сайт через MkDocs, Docusaurus, Sphinx или Hugo. Вы знаете, как работают front matter (YAML-метаданные), навигация, sidebar, версионирование.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Стандарты и стайлгайд:&lt;/strong&gt; вы можете написать стайлгайд для Markdown: какие заголовки использовать (ATX, не Setext), какую длину строки считать максимальной, когда использовать таблицу, а когда список, как оформлять код и ссылки.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы делаете выбор и объясняете его. Вы не просто «пишете в Markdown», вы отвечаете за то, чтобы команда писала единообразно.&lt;/em&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"kursy-i-knigi-middle\"&gt;&lt;a href=\"Roadmap/base/md/middle.html#kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"Roadmap/base/md/senior-stack.uz\"&gt;Docs as Code &amp;amp; Tooling — Middle Level&lt;/a&gt; - подробный разбор выбора языка разметки, SSG, CI-гейтов. Описывает, как принимать решения, а не просто следовать туториалу.&lt;/p&gt;\n&lt;p&gt;Write Better with Vale (Brian P. Hogan) - единственная книга, целиком посвящённая Vale: как превратить стайлгайд в исполняемые правила, как линтить Markdown, как настроить CI.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"Roadmap/base/md/learn.microsoft.com\"&gt;Microsoft Markdown Best Practices&lt;/a&gt; - реальный корпоративный стайлгайд: ATX-заголовки, лимит строки 100 символов, работа с пробелами и табами.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://google.github.io/styleguide/docguide/style.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Markdown Style Guide&lt;/a&gt; - пример строгого, продуманного стайлгайда от Google: простота, консистентность, читаемость исходного текста.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.gitlab.com/development/documentation/styleguide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitLab Documentation Style Guide&lt;/a&gt; - отличный пример стайлгайда для open-source проекта, написанного на Markdown&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://python-markdown.github.io/extensions/index.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Python-Markdown Extensions&lt;/a&gt; - справочник по расширениям: admonitions, footnotes, definition lists, attribute lists&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/base/md/middle.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Middle: «Выбираю и настраиваю»","href":"Roadmap/base/md/middle.html#middle-vybirayu-i-nastraivayu","level":2},{"title":"Курсы и книги (Middle)","href":"Roadmap/base/md/middle.html#kursy-i-knigi-middle","level":2}],"title":""},"router":{"pathname":"Roadmap/base/md/middle","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
