        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"middle-formuliruyu-pravila-i-adaptiruyu-ton\"&gt;&lt;a href=\"Roadmap/base/style/middle.html#middle-formuliruyu-pravila-i-adaptiruyu-ton\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Формулирую правила и адаптирую тон»&lt;/span&gt;&lt;/a&gt;Middle: «Формулирую правила и адаптирую тон»&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне стиль и тон перестают быть просто «набором правил, которым я следую». Теперь это предмет решений: вы выбираете стайлгайд под проект, формулируете правила для команды, адаптируете тон под разные типы контента и разрешаете спорные случаи. Ключевой сдвиг: вы перестаёте быть «тем, кто следует чужим правилам», и становитесь тем, кто создаёт правила для своей команды и обеспечивает их соблюдение.&lt;/p&gt;\n&lt;p&gt;Что входит в Middle-уровень:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Выбор и адаптация стайлгайда:&lt;/strong&gt; вы понимаете разницу между Google Developer Documentation Style Guide (фокус на developer-аудитории, «knowledgeable friend», консистентность) и Microsoft Writing Style Guide (более 300 тем по терминологии, бренд-голос, accessibility, локализация). Вы можете обосновать выбор для конкретного проекта и адаптировать его под продукт, а не просто «взять Google, потому что он хороший».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Формулирование правил для команды:&lt;/strong&gt; вы создаёте внутренний стайлгайд: какие термины использовать, какой тон, какие конструкции запрещены. Вы адаптируете Google/Microsoft под продукт, а не копируете их целиком. Ваши правила должны быть исполнимыми, а не декларативными.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Адаптация тона под тип контента:&lt;/strong&gt; вы понимаете, что тон должен соответствовать задаче читателя. API reference для опытных разработчиков выигрывает от плотности и точности. Туториал для новичков — от более разговорного и поддерживающего тона. Release notes — от нейтрального и фактологического.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Разрешение спорных случаев:&lt;/strong&gt; когда два автора пишут по-разному, вы решаете, какой вариант правильный, и объясняете почему. Вы не просто говорите «так принято», а аргументируете через аудиторию, задачу и стайлгайд.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Обучение и ревью:&lt;/strong&gt; вы проверяете тексты других авторов на соответствие стилю и даёте конструктивный фидбек. Вы не просто исправляете, а объясняете, почему это важно.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Автоматизация проверки стиля:&lt;/strong&gt; вы превращаете стайлгайд в исполняемые правила с помощью Vale. Вы подключаете готовые стили (Google, Microsoft), комбинируете их, разрешаете конфликты и создаёте кастомный словарь для терминов вашей команды.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы формулируете правила и объясняете их. Вы отвечаете за то, чтобы команда писала единообразно, даже если авторов несколько.&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"kursy-i-knigi-middle\"&gt;&lt;a href=\"Roadmap/base/style/middle.html#kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"https://www.pce.uw.edu/courses/intermediate-professional-technical-writing\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Intermediate Professional Technical Writing (UW Professional &amp;amp; Continuing Education)&lt;/a&gt; - Курс для развития редакторского голоса и тона: как адаптировать контент под разные аудитории и цели, как интегрировать AI как редакторский инструмент, как выстраивать phased editing;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://books.google.com.sg/books?id=nMabEQAAQBAJ\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write Better with Vale (Brian P. Hogan)&lt;/a&gt; - Книга, которая превращает стайлгайд в исполняемые правила: как подключить стили Google и Microsoft, комбинировать их, разрешать конфликты и создавать кастомный словарь для терминов команды. Интеграция в VS Code, Git hooks и CI;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.tonex.com/writing-workshop-technical-professionals/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Writing Workshop for Technical Professionals (Tonex)&lt;/a&gt; - Модуль 3: Writing Style and Tone — профессиональный тон, избегание жаргона, баланс между технической детализацией и простотой, написание для разных аудиторий, активный и пассивный залог;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://learn.microsoft.com/en-us/style-guide/welcome/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Microsoft Writing Style Guide&lt;/a&gt; - Продвинутые разделы: более 300 тем по терминологии, руководство по локализации (избегание идиом и культурных отсылок), accessibility, написание для глобальной аудитории. Раздел «Top 10 tips» — быстрый старт для команды;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/style\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Developer Documentation Style Guide&lt;/a&gt; - Продвинутые разделы: Voice and tone (цель — «knowledgeable friend»), Word list (сотни терминов с рекомендациями), Write for a global audience, Write inclusive documentation. Эталон для developer-документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://users.dcc.uchile.cl/~nbaloian/ArquitecturaDeLaInformacion/materialDeLAWeb/TriDoc2005-DQTI.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Developing Quality Technical Information (IBM)&lt;/a&gt; - Руководство по качеству технической информации: 9 характеристик качества (accuracy, clarity, completeness, concreteness, organization, retrievability, style, task orientation, visual effectiveness), сгруппированных в 3 категории — Easy to use, Easy to understand, Easy to find. Помогает формулировать правила не «на глаз», а на основе модели качества;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://archive.org/details/isbn_9780132101301\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The IBM Style Guide: Conventions for Writers and Editors&lt;/a&gt; - Практическое руководство по языку и грамматике, пунктуации, форматированию и структуре, написанию для разных аудиторий. Полезно для формулирования внутренних правил команды: как писать чётко и консистентно, как структурировать информацию, чтобы её было легко найти.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/base/style/middle.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Middle: «Формулирую правила и адаптирую тон»","href":"Roadmap/base/style/middle.html#middle-formuliruyu-pravila-i-adaptiruyu-ton","level":2},{"title":"Курсы и книги (Middle)","href":"Roadmap/base/style/middle.html#kursy-i-knigi-middle","level":2}],"title":""},"router":{"pathname":"Roadmap/base/style/middle","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
