        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"senior-opredelyayu-standart-i-upravlyayu-sistemoj-validacii\"&gt;&lt;a href=\"Roadmap/docascode/liter/senior.html#senior-opredelyayu-standart-i-upravlyayu-sistemoj-validacii\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и управляю системой валидации»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и управляю системой валидации»&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне линтеры и валидация становятся &lt;strong&gt;элементом архитектуры качества документации&lt;/strong&gt;. Вы не просто настраиваете инструменты для одного проекта, вы &lt;strong&gt;определяете стандарт для организации&lt;/strong&gt;: какие проверки обязательны, какие инструменты используются, как обрабатываются исключения, как измеряется эффективность.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия валидации:&lt;/strong&gt; вы определяете, какие проверки обязательны для всех docs-репозиториев: markdownlint, Vale, cspell, link check, build, проверка примеров кода. Вы понимаете, что валидация — это не только линтеры, но и тестирование примеров кода, проверка инструкций в контейнерах, проверка ссылок в сгенерированном HTML.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за обновление правил, как обрабатываются исключения (когда можно отключить правило), как проверяется, что правила не устарели.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Стандартизация конфигураций:&lt;/strong&gt; вы создаёте reusable workflows (GitHub Actions) или templates (GitLab CI), которые используются всеми командами. Вы определяете, какие правила обязательны (error), какие — рекомендательны (warning).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых продуктов, языков, версий без переписывания конфигураций для каждого.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Интеграция с другими системами:&lt;/strong&gt; вы интегрируете валидацию с системами аналитики (проверка качества после деплоя), системами мониторинга (уведомления о падениях), системами управления релизами (синхронизация с версиями продукта).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность валидации: время сборки, частота падений, время до исправления, покрытие проверками.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды работе с линтерами, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Валидация становится частью инженерной культуры компании.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-senior\"&gt;&lt;a href=\"Roadmap/docascode/liter/senior.html#kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://books.google.com/books/about/Write_Better_with_Vale.html?id=nMabEQAAQBAJ\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write Better with Vale (Brian P. Hogan, продвинутые главы)&lt;/a&gt; - Главы о масштабировании Vale в организации, создании кастомных стилей, интеграции с CI/CD;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/uw-ssec/rse-plugins\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Documentation Validation SKILL (GitHub)&lt;/a&gt; - Комплексный гайд по валидации документации: Vale, link checking, markdownlint, тестирование примеров кода, CI-интеграция. Decision tree для выбора инструментов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/continuous-delivery-reliable/9780321670250/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Continuous Delivery (Jez Humble, David Farley)&lt;/a&gt; - Классика CI/CD: принципы, паттерны, антипаттерны. Применимо к валидации документации как части software delivery;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://itrevolution.com/product/accelerate/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Accelerate (Nicole Forsgren et al.)&lt;/a&gt; - Научный подход к измерению эффективности CI/CD: DORA-метрики, которые можно адаптировать для валидации документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.gitlab.com/development/documentation/testing/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitLab Documentation Testing&lt;/a&gt; - Реальный пример валидации в масштабе: Vale, markdownlint, link check, mermaid lint, rubocop-docs, eslint-docs.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/docascode/liter/senior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Senior: «Определяю стандарт и управляю системой валидации»","href":"Roadmap/docascode/liter/senior.html#senior-opredelyayu-standart-i-upravlyayu-sistemoj-validacii","level":2,"items":[{"title":"Курсы и книги (Senior)","href":"Roadmap/docascode/liter/senior.html#kursy-i-knigi-senior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/docascode/liter/senior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
