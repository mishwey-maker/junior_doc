 момент уже почти два месяца, как получается не бросить всё и не вернуться в прежнее состояние.&lt;/p&gt;\n&lt;p&gt;В конце книги предлагается завести дневник или блог для публичного отчета, чтобы было ощущение, что его ждут, и это придавало дополнительную ответственность. Могу сказать, что это действительно подталкивает к продолжению.&lt;/p&gt;\n&lt;p&gt;Если ты давно хотел что-то начать, но никак не получалось, то советую к прочтению.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 data-original-article=\"WhatRead/dream.html\"&gt;Кэл Ньюпорт \"Хватит мечтать. Займись делом. Почему важнее хорошо работать, чем найти хорошую работу.\"&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#WhatRead_dream\" id=\"WhatRead_dream\"&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;img src=\"../WhatRead/image-1.png\" alt=\"alt text\"&gt;&lt;/p&gt;\n&lt;p&gt;🤓&lt;em&gt;&lt;strong&gt;Ещё одна книга из недавних, которую советую почитать, особенно если есть выгорание на работе.&lt;/strong&gt;&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Автор рассказывает истории людей, которые достигли успеха. Однако есть причина, которая подкупила меня, и я стал читать книгу взахлёб.&lt;/p&gt;\n&lt;p&gt;В книге рассматривается популярный призыв: «Найдите работу своей мечты! Бросьте всё. Неважно, как и где вы будете. Схватите мечту» и показывает иной подход.&lt;/p&gt;\n&lt;p&gt;🥷Первой же историей он заставляет задуматься над этим лозунгом, рассказывая о Томасе, который очень хотел стать буддийским монахом. Тот бросил работу и ушёл в монастырь. Томас пробыл там несколько лет, и автор рассказывает, что встретил его плачущим у дерева и жалеющим о своей мечте. Что в итоге случилось с Томасом, вы узнаете в финале книги. Это лишь одна из многих историй, но именно она не даёт отложить чтение.&lt;/p&gt;\n&lt;p&gt;❓На протяжении всей книги автор старается ответить на главный вопрос: «Как найти работу мечты?».&lt;/p&gt;\n&lt;p&gt;✍️После прочтения я понял, чего хочу от работы. Если задаёшься тем же вопросом, то эта книга для тебя.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 data-original-article=\"WhatRead/bio.html\"&gt;Бионический шрифт&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#WhatRead_bio\" id=\"WhatRead_bio\"&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;img src=\"../WhatRead/image-3.png\" alt=\"alt text\"&gt;&lt;/p&gt;\n&lt;p&gt;Хотел поделиться одной интересной штукой. Мне о ней ещё давно говорили, но я успешно забыл и случайно вспомнил, когда ковырялся в настройках шрифтов в «Букмейте».&lt;/p&gt;\n&lt;p&gt;🔤Бионический шрифт. Это способ форматирования текста, при котором программа выделяет более ярким цветом первую часть каждого слова.&lt;/p&gt;\n&lt;p&gt;Как говорят, одним из плюсов является более высокая скорость чтения. Не могу сказать, что ты сразу превратишься в скорочитателя, но в целом текст проглатывать будешь чуть быстрее.&lt;/p&gt;\n&lt;p&gt;Больше я заметил, что после привыкания читать удобнее. Глаза не так устают.&lt;/p&gt;\n&lt;p&gt;Плюсом я добавил режим «Сепия». В совокупности читать становится действительно комфортнее.&lt;/p&gt;\n&lt;p&gt;Спустя полчаса ты даже не замечаешь, как долго уже читаешь с телефона. Раньше для меня это было проблемой. Уже через 10–15 минут чтения хотелось посмотреть вдаль и немного передохнуть. С таким набором настроек это происходит гораздо реже, а усталость наступает позже.&lt;/p&gt;\n&lt;p&gt;Поэтому, если любишь почитать подольше, то крайне советую протестировать.&lt;/p&gt;\n&lt;/div&gt;","headings":[],"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"style":["_bundle/latex-extension.css"],"script":["_bundle/latex-extension.js"]},"title":"junior"},"router":{"pathname":"pdf-page","depth":1,"base":"./"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
