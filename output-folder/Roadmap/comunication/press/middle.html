        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"middle-predstavlyayu-rezultaty-proekta\"&gt;&lt;a href=\"Roadmap/comunication/press/middle.html#middle-predstavlyayu-rezultaty-proekta\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Представляю результаты проекта»&lt;/span&gt;&lt;/a&gt;Middle: «Представляю результаты проекта»&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне презентация перестаёт быть просто «рассказом о задаче». Теперь это &lt;strong&gt;представление результатов проекта&lt;/strong&gt;: вы показываете метрики, обосновываете решения, демонстрируете impact. Ключевой сдвиг: вы перестаёте говорить «я написал документацию» и начинаете говорить «документация снизила количество обращений в поддержку на X%».&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Метрики и impact:&lt;/strong&gt; вы представляете результаты с цифрами: page views, self-service rate, снижение support tickets, time-to-find. Вы понимаете, что «результат без метрики — это мнение».&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обоснование решений:&lt;/strong&gt; вы объясняете, почему выбрали именно такой подход: почему task-based структура, почему именно эти примеры кода, почему такая стратегия версионирования.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Адаптация под аудиторию:&lt;/strong&gt; вы адаптируете презентацию под аудиторию: для разработчиков — технические детали, для продактов — impact на пользователей, для менеджмента — ROI.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Визуализация данных:&lt;/strong&gt; вы используете графики, диаграммы, дашборды для представления метрик.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Ответы на сложные вопросы:&lt;/strong&gt; вы готовы к вопросам о trade-offs, альтернативах, ограничениях. Вы не защищаетесь — вы объясняете.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Презентация на ретроспективе:&lt;/strong&gt; вы представляете результаты проекта на ретроспективе: что сработало, что нет, что измените в следующий раз.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;представляете результаты с метриками и обоснованием&lt;/strong&gt;. Вы отвечаете за то, чтобы ваш вклад был виден и измерим.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-middle\"&gt;&lt;a href=\"Roadmap/comunication/press/middle.html#kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://ep.jhu.edu/courses/645705-communication-and-presentations-for-engineers/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Communication and Presentations for Engineers (Johns Hopkins University)&lt;/a&gt; - 3 модуля: Audience Analysis, Storytelling and Narrative, Visual Storytelling. Translate technical work into communication that drives action;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.coursera.org/learn/effective-presentations-persuasive-writing\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Effective Presentations and Persuasive Writing (Coursera)&lt;/a&gt; - Design effective presentation slides, create compelling arguments, tailor communication strategies based on audience needs;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/TECH-OPSS/Technical-Writing-Masterclass-A\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical-Writing-Masterclass-A: Module 9 — Career Paths &amp;amp; Portfolio Building (TECH-OPSS)&lt;/a&gt; - Turning skills into a fulfilling career: self-presentation, portfolio building, career paths;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://document360.com/webinar/creating-tech-writing-portfolios-with-docs-as-code-tooling/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Document360: Creating Tech Writing Portfolios with Docs as Code Tooling&lt;/a&gt; - Organize portfolio items, tagging samples for relevance, custom domain, blog to showcase expertise.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/comunication/press/middle.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Middle: «Представляю результаты проекта»","href":"Roadmap/comunication/press/middle.html#middle-predstavlyayu-rezultaty-proekta","level":2,"items":[{"title":"Курсы и книги (Middle)","href":"Roadmap/comunication/press/middle.html#kursy-i-knigi-middle","level":3}]}],"title":""},"router":{"pathname":"Roadmap/comunication/press/middle","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
