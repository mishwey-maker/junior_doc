е разделы)&lt;/a&gt; - Продвинутые разделы: gap analysis, приоритизация, создание плана документации на основе аудита;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.mediawiki.org/wiki/Documentation/Toolkit/Content_audit\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Documentation/Toolkit/Content audit (MediaWiki, углублённый обзор)&lt;/a&gt; - Углублённый чек-лист для оценки полноты, точности и релевантности контента, включая проверку код-примеров;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.routledge.com/Content-Strategy-A-How-to-Guide/Getto-Labriola-Ruszkiewicz/p/book/9781138485495\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Content Strategy: A How-to Guide (Guiseppe Getto et al., продвинутые главы)&lt;/a&gt; - Главы о принятии решений на основе аудита и разработке контент-стратегии;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Главы о поддержании документации и работе с устаревшим контентом;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для управления жизненным циклом контента.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_auditdoc_senior_senior-stroyu-sistemu-upravleniya-zhiznennym-ciklom-kontenta\" data-original-article=\"Roadmap/metric/auditdoc/senior.html\"&gt;&lt;a href=\"#Roadmap_metric_auditdoc_senior_senior-stroyu-sistemu-upravleniya-zhiznennym-ciklom-kontenta\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Строю систему управления жизненным циклом контента»&lt;/span&gt;&lt;/a&gt;Senior: «Строю систему управления жизненным циклом контента»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_auditdoc_senior\" id=\"Roadmap_metric_auditdoc_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне контент-аудит становится &lt;strong&gt;элементом архитектуры управления контентом&lt;/strong&gt;. Вы не просто проводите аудиты, вы &lt;strong&gt;строите систему&lt;/strong&gt;, которая делает аудит регулярным, автоматизированным и масштабируемым. Вы определяете политику, стандарты и метрики, которые обеспечивают актуальность документации без ручного героизма.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия управления жизненным циклом:&lt;/strong&gt; вы определяете enforceable state machine для контента, привязанную к продуктовым доменам. Вы задаёте разрешённые переходы (draft → active → review due → stale → deprecated → archived) с критериями входа, утверждающими и доказательствами для каждого изменения.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за актуальность, как проверяется качество, как обрабатываются исключения. Вы создаёте контент-модели и таксономию, которые делают аудит воспроизводимым.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Автоматизация:&lt;/strong&gt; вы настраиваете автоматические проверки: staleness detection, broken link checking, terminology drift, missing metadata. Вы используете инструменты для регулярного сканирования.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых продуктов, языков, версий без перестройки процессов аудита.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность аудита: staleness rate (процент устаревших страниц), coverage gap rate (процент непокрытых тем), time-to-detect (время от устаревания до обнаружения), content debt backlog size.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды проведению аудита, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Влияние на продукт:&lt;/strong&gt; вы используете данные аудита как аргумент для изменения продукта: если документация для функции постоянно устаревает из-за частых изменений, это сигнал для продуктовой команды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Контент-аудит становится частью инженерной культуры, а не разовым проектом.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_auditdoc_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_metric_auditdoc_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.routledge.com/Content-Strategy-A-How-to-Guide/Getto-Labriola-Ruszkiewicz/p/book/9781138485495\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Content Strategy: A How-to Guide (Guiseppe Getto et al., продвинутые главы)&lt;/a&gt; - Стратегическое управление контентом: от аудита до governance и масштабирования;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.mediawiki.org/wiki/Documentation/Toolkit/Content_audit\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Documentation/Toolkit/Content audit (MediaWiki, продвинутые разделы)&lt;/a&gt; - Разделы о работе с SME для углублённого аудита и о проверке технического контента;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://dl.acm.org/doi/book/10.5555/1190163\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Development: Managing Your Documentation, Projects, Portfolio, and People (JoAnn Hackos)&lt;/a&gt; - Управление портфелем документации и процессами обеспечения качества в масштабе;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации, включая governance и управление жизненным циклом.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_strateg_junior_junior-sleduyu-strategii-i-ponimayu-kontekst\" data-original-article=\"Roadmap/metric/strateg/junior.html\"&gt;&lt;a href=\"#Roadmap_metric_strateg_junior_junior-sleduyu-strategii-i-ponimayu-kontekst\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Следую стратегии и понимаю контекст»&lt;/span&gt;&lt;/a&gt;Junior: «Следую стратегии и понимаю контекст»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_strateg_junior\" id=\"Roadmap_metric_strateg_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне контент-стратегия — это &lt;strong&gt;осознание того, что вы пишете не в вакууме&lt;/strong&gt;. Вы учитесь понимать, зачем создаётся каждый документ, для какой аудитории и как он вписывается в общую картину. Планирование на этом уровне обычно уже выполнено за вас. Ключевой сдвиг: вы перестаёте просто «выполнять задачи по написанию текста» и начинаете задаваться вопросом «какую проблему пользователя решает этот документ?».&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание бизнес-контекста:&lt;/strong&gt; вы учитесь видеть связь между документацией и целями продукта. Вы знаете, какие метрики важны для компании (adoption, support tickets) и как ваша работа влияет на них.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Следование established strategy:&lt;/strong&gt; вы работаете в рамках существующих стандартов, шаблонов и style guide. Вы не создаёте стратегию, а исполняете её, обеспечивая консистентность.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Сбор информации для стратегии:&lt;/strong&gt; вы учитесь собирать данные, которые позже лягут в основу стратегических решений: feedback от пользователей, вопросы в поддержку, пробелы в документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Понимание аудитории:&lt;/strong&gt; вы учитесь сегментировать аудиторию и понимать, что разным пользователям (разработчикам, админам, конечным пользователям) нужен разный контент и разный формат.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Системное мышление:&lt;/strong&gt; вы начинаете видеть каждую страницу как часть большой системы: контент, продукт, пользователи, процессы, владение и поддержка.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;понимаете и исполняете&lt;/strong&gt; существующую стратегию, фокусируясь на качестве и консистентности контента в рамках заданных параметров.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_strateg_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_metric_strateg_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.routledge.com/Content-Strategy-A-How-to-Guide/Getto-Labriola-Ruszkiewicz/p/book/9781138485495\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Content Strategy: A How-to Guide (Guiseppe Getto, Jack T. Labriola, Sheryl Ruszkiewicz)&lt;/a&gt; - Комплексное введение в контент-стратегию для технических коммуникаторов. Даёт понимание основ и помогает увидеть общую картину;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://books.google.com.sg/books/about/Content_Strategy_in_Technical_Communication.html?id=5QZ2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Content Strategy in Technical Communication (Books Google)&lt;/a&gt; - Сбалансированный обзор текущего состояния контент-стратегии в области технической коммуникации, showcases groundbreaking work in the field;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.waterstones.com/book/technical-communication-and-the-discipline-of-content/rebekka-andersen/carlos-evia/9780815376057\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Communication and the Discipline of Content (Rebekka Andersen, Carlos Evia)&lt;/a&gt; - Исследует, как workflow и технологии, рассматривающие контент как вычисляемые данные, меняют роли и результаты работы технических коммуникаторов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://clickhelp.com/clickhelp-technical-writing-blog/the-role-of-content-strategy-in-technical-writing/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The Role of Content Strategy in Technical Writing (ClickHelp)&lt;/a&gt; - Объясняет, что такое контент-стратегия, зачем она нужна и из чего состоит (цели, аудитория, архитектура);&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://codeharborhub.github.io/docs/technical-writing/career-path\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writer Career Path (CodeHarborHub)&lt;/a&gt; - Описывает карьерный путь и то, какие навыки (включая стратегические) ожидаются на разных уровнях.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_strateg_middle_middle-formiruyu-strategiyu-dlya-produkta-i-upravlyayu-kontentom\" data-original-article=\"Roadmap/metric/strateg/middle.html\"&gt;&lt;a href=\"#Roadmap_metric_strateg_middle_middle-formiruyu-strategiyu-dlya-produkta-i-upravlyayu-kontentom\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Формирую стратегию для продукта и управляю контентом»&lt;/span&gt;&lt;/a&gt;Middle: «Формирую стратегию для продукта и управляю контентом»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_strateg_middle\" id=\"Roadmap_metric_strateg_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне контент-стратегия перестаёт быть чем-то, что вы просто «понимаете». Теперь это &lt;strong&gt;инструмент, которым вы управляете&lt;/strong&gt;. Вы отвечаете за документацию целого продукта или его части, определяете, какие типы контента нужны, как они связаны и как измеряется их эффективность. Ключевой сдвиг: вы переходите от исполнения к &lt;strong&gt;планированию и принятию решений&lt;/strong&gt; в рамках своей зоны ответственности.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Определение scope и vision:&lt;/strong&gt; вы определяете, что входит в документацию, а что — нет. Вы понимаете, что «документация, которая пытается охватить всё, не охватывает ничего хорошо».&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Планирование жизненного цикла контента:&lt;/strong&gt; вы управляете полным циклом: от планирования и создания до публикации, измерения и поддержки (или архивации).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Стратегическое мышление:&lt;/strong&gt; перед созданием контента вы понимаете, какую проблему решаете, кто пользователь и какое действие должен поддержать контент.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Анализ и устранение пробелов:&lt;/strong&gt; вы используете данные (поисковую аналитику, вопросы поддержки) для выявления пробелов в контенте и приоритизации работы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Определение стандартов и шаблонов:&lt;/strong&gt; вы создаёте шаблоны и стандарты для разных типов контента, чтобы снизить когнитивную нагрузку на авторов и ускорить ревью.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Управление моделями владения:&lt;/strong&gt; вы определяете, кто отвечает за какой контент, и что происходит, когда владелец уходит или продукт меняется.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;планируете и управляете&lt;/strong&gt; контент-стратегией для своего продукта, принимая решения на основе данных и обеспечивая связь между потребностями пользователей и бизнес-целями.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_strateg_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_metric_strateg_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://catalog.unt.edu/preview_course_nopop.php?catoid=36&amp;amp;coid=227644\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TECM 5200 - Digital Content Strategies for Communication Professionals (UNT)&lt;/a&gt; - Продвинутое изучение навыков контент-стратегии для технических коммуникаторов, включая работу с CMS;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://apps.senecapolytechnic.ca/ssos/findOutline.do?subjectCode=TCN805\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Content Strategy for Technical Communicators (Seneca)&lt;/a&gt; - Изучение связи UX, IA и контент-стратегии для планирования и организации информации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.routledge.com/Content-Strategy-A-How-to-Guide/Getto-Labriola-Ruszkiewicz/p/book/9781138485495\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Content Strategy: A How-to Guide (Guiseppe Getto et al., продвинутые главы)&lt;/a&gt; - Углублённое изучение процессов контент-стратегии, включая аудит, моделирование и управление;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://medium.com/@docsanddoodles/stages-of-building-a-technical-documentation-content-strategy-5f5f5f5f5f5f\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Stages of Building a Technical Documentation Content Strategy (Medium)&lt;/a&gt; - Практический пример эволюции команды от ad-hoc письма к структурированной стратегии.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_strateg_senior_senior-opredelyayu-strategiyu-i-stroyu-sistemu-upravleniya-kontentom\" data-original-article=\"Roadmap/metric/strateg/senior.html\"&gt;&lt;a href=\"#Roadmap_metric_strateg_senior_senior-opredelyayu-strategiyu-i-stroyu-sistemu-upravleniya-kontentom\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стратегию и строю систему управления контентом»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стратегию и строю систему управления контентом»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_strateg_senior\" id=\"Roadmap_metric_strateg_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне контент-стратегия становится &lt;strong&gt;элементом организационной системы&lt;/strong&gt;. Вы не просто управляете контентом для продукта, вы &lt;strong&gt;определяете, как компания управляет знаниями в масштабе&lt;/strong&gt;. Вы создаёте стратегию, которая переживёт вас и будет работать без вашего постоянного участия. Ключевой сдвиг: вы переходите от управления контентом к &lt;strong&gt;проектированию системы (governance)&lt;/strong&gt;, которая обеспечивает качество и актуальность документации в масштабе всей организации.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Разработка стратегии для программы документации:&lt;/strong&gt; вы определяете и документируете стратегию для целой программы документации, а не просто вносите вклад в неё.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance и стандарты:&lt;/strong&gt; вы создаёте систему управления: определяете scope, владение, стандарты, политику версионирования и архивации для всей организации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Определение долгосрочного видения:&lt;/strong&gt; вы формируете долгосрочное направление развития документации, включая выбор платформ (build-vs-buy) и определение стандартов для пользовательского и developer-контента.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Влияние на бизнес-результаты:&lt;/strong&gt; вы напрямую связываете цели контента с бизнес-результатами, такими как снижение затрат на поддержку, и представляете документацию как первостепенный актив на уровне руководства.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Управление изменениями:&lt;/strong&gt; вы управляете переходом от ad-hoc письма к структурированной стратегии, включая планирование, принятие решений по governance и масштабирование систем документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Стратегическое мышление и суждение:&lt;/strong&gt; вы принимаете решения о том, что и как документировать, основываясь на потребностях пользователей и бизнес-контексте, а не только на запросах.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;строите систему&lt;/strong&gt;, которая обеспечивает создание, поддержку и развитие качественной документации в масштабе всей организации, напрямую влияя на бизнес-показатели.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_strateg_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_metric_strateg_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.waterstones.com/book/technical-communication-and-the-discipline-of-content/rebekka-andersen/carlos-evia/9780815376057\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Communication and the Discipline of Content (Rebekka Andersen, Carlos Evia)&lt;/a&gt; - Исследует, как workflow и технологии, рассматривающие контент как вычисляемые данные, меняют роли и результаты работы технических коммуникаторов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.routledge.com/Content-Strategy-A-How-to-Guide/Getto-Labriola-Ruszkiewicz/p/book/9781138485495\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Content Strategy: A How-to Guide (Guiseppe Getto et al., продвинутые главы)&lt;/a&gt; - Стратегическое управление контентом: от аудита до governance и масштабирования;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://books.google.com.sg/books/about/Content_Strategy_in_Technical_Communication.html?id=5QZ2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Content Strategy in Technical Communication (Books Google, продвинутые главы)&lt;/a&gt; - Продвинутые главы о стратегическом управлении контентом в организациях;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://writetechhub.com/resources\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Advanced Resources (WriteTech Hub)&lt;/a&gt; - Ресурсы для писателей, работающих на уровне программ: стратегия, governance, стандарты, метрики.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_mentor_junior_junior-uchus-i-perenimayu-opyt\" data-original-article=\"Roadmap/metric/mentor/junior.html\"&gt;&lt;a href=\"#Roadmap_metric_mentor_junior_junior-uchus-i-perenimayu-opyt\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Учусь и перенимаю опыт»&lt;/span&gt;&lt;/a&gt;Junior: «Учусь и перенимаю опыт»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_mentor_junior\" id=\"Roadmap_metric_mentor_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне менторство — это &lt;strong&gt;роль менти, а не ментора&lt;/strong&gt;. Вы учитесь быть хорошим учеником: задавать вопросы, применять обратную связь и перенимать негласные правила профессии. Ключевой сдвиг: вы перестаёте пассивно ждать, пока вас научат, и начинаете &lt;strong&gt;активно управлять своим обучением&lt;/strong&gt; с помощью наставника.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Активное ученичество:&lt;/strong&gt; вы не просто слушаете — вы задаёте уточняющие вопросы, пересказываете услышанное и проверяете понимание. Вы приходите на встречи с ментором подготовленным, а не с пустыми руками.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Применение обратной связи:&lt;/strong&gt; вы не просто принимаете правки, а анализируете их. Вы ищете паттерны («мне часто говорят про пассивный залог») и работаете над их устранением.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Понимание своих пробелов:&lt;/strong&gt; вы учитесь честно оценивать, чего вам не хватает. Вы не боитесь признаться ментору: «Я не понимаю, как работает X» — это отправная точка для роста.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Использование ресурсов ментора:&lt;/strong&gt; вы берёте рекомендованные книги, статьи, курсы и &lt;strong&gt;действительно их изучаете&lt;/strong&gt;. Вы не ждёте, пока ментор вложит знания в вашу голову.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Осознание ценности менторства:&lt;/strong&gt; вы видите, что менторство — это не «повинность» старших, а инвестиция в команду. Вы учитесь быть благодарным и конструктивным менти.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;активно учитесь&lt;/strong&gt; и делаете процесс обучения эффективным для себя и своего ментора.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_mentor_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_metric_mentor_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"http://www.izmalk.com/post/mentorship/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mentorship (Vladimir Izmalkov, izmalk.com)&lt;/a&gt; - Пример структурированной программы менторства для начинающих технических писателей: цели, формат,Curriculum, требования к менти;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://technicalwritingmp.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing Mentorship Program&lt;/a&gt; - Программа менторства, включающая модули по сбору информации, определению аудитории и работе с SME;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://techwriterstribe.com/mentorship/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Tech Writer's Tribe | TWT Mentorship&lt;/a&gt; - Программа менторства с воркшопами по задачам и написанию тем с использованием AI-инструментов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.amazon.com/Teaching-Mentoring-Writers-Sciences-Evidence-Based/dp/0226831555\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Teaching and Mentoring Writers in the Sciences (Bethann Garramon Merkle, Stephen B. Heard)&lt;/a&gt; - Книга о научно-обоснованном подходе к обучению и менторству писателей;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - База: аудитория, структура, ясность. Даёт прочный фундамент, на котором ментор может строить ваше дальнейшее обучение.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_mentor_middle_middle-pomogayu-novym-kollegam-i-delyus-znaniyami\" data-original-article=\"Roadmap/metric/mentor/middle.html\"&gt;&lt;a href=\"#Roadmap_metric_mentor_middle_middle-pomogayu-novym-kollegam-i-delyus-znaniyami\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Помогаю новым коллегам и делюсь знаниями»&lt;/span&gt;&lt;/a&gt;Middle: «Помогаю новым коллегам и делюсь знаниями»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_mentor_middle\" id=\"Roadmap_metric_mentor_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне менторство перестаёт быть только «получением помощи». Теперь это &lt;strong&gt;предмет отдачи&lt;/strong&gt;: вы начинаете помогать новым коллегам адаптироваться, делиться знаниями и брать на себя роль неформального наставника для junior-ов. Ключевой сдвиг: вы перестаёте быть «тем, кого менторят» и становитесь &lt;strong&gt;тем, кто менторит&lt;/strong&gt;, даже без формального титула.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Помощь в онбординге:&lt;/strong&gt; вы помогаете новым коллегам освоиться: объясняете процессы, инструменты, конвенции команды. Вы можете провести экскурсию по документации или показать, как работает CI/CD.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Делегирование с поддержкой:&lt;/strong&gt; вы даёте junior-писателю задачу, но не бросаете его одного. Вы проверяете промежуточные результаты, даёте конструктивную обратную связь и помогаете исправить ошибки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Структурированная обратная связь:&lt;/strong&gt; вы не просто говорите «здесь плохо», а объясняете &lt;strong&gt;почему&lt;/strong&gt; и &lt;strong&gt;как улучшить&lt;/strong&gt;. Вы используете фреймворки вроде Conventional Comments, чтобы ваши замечания были понятными и действенными.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Создание ресурсов для обучения:&lt;/strong&gt; вы пишете статьи в внутреннюю базу знаний, создаёте чек-листы, шаблоны и гайды, которые помогают новичкам быстрее разобраться.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Понимание ответственности:&lt;/strong&gt; вы осознаёте, что ваша обратная связь влияет на уверенность и рост junior-а. Вы учитесь быть поддерживающим, но требовательным.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;делитесь знаниями и поддерживаете рост других&lt;/strong&gt;, создавая среду, в которой обучение происходит естественно.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_mentor_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_metric_mentor_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.igi-global.com/viewtitle.aspx?TitleId=315814\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GROW Model for Technical Mentoring (IGI Mentoring Guidelines)&lt;/a&gt; - Детальное описание коучинговой модели GROW (Goals, Realities, Options, Way forward) для технического менторства. Структура сессии, вопросы, тайминг;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://dev.to/techwriting/navigating-the-complexities-challenges-and-solutions-in-mentoring-tech-writers-5f5f\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Navigating the Complexities: Challenges and Solutions in Mentoring Tech Writers (DEV Community)&lt;/a&gt; - Разбор типичных проблем менторства и способов их преодоления. Качества эффективного ментора: эмпатия, терпение, активное слушание;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://about.gitlab.com/handbook/engineering/ux/technical-writing/onboarding/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writer Onboarding (GitLab)&lt;/a&gt; - Пример структурированного онбординга технических писателей в GitLab, включая фазы shadow и trainee;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.penguinrandomhouse.com/books/551712/the-coaching-habit-by-michael-bungay-stanier/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The Coaching Habit (Michael Bungay Stanier)&lt;/a&gt; - Практическое руководство по коучингу: 7 вопросов, которые меняют подход к менторству. Помогает перейти от «давать ответы» к «задавать вопросы»;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://conventionalcomments.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Conventional Comments&lt;/a&gt; - Стандарт для комментариев в ревью, который помогает давать структурированную и уважительную обратную связь.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_mentor_senior_senior-stroyu-sistemu-mentorstva-i-razvivayu-drugih-mentorov\" data-original-article=\"Roadmap/metric/mentor/senior.html\"&gt;&lt;a href=\"#Roadmap_metric_mentor_senior_senior-stroyu-sistemu-mentorstva-i-razvivayu-drugih-mentorov\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Строю систему менторства и развиваю других менторов»&lt;/span&gt;&lt;/a&gt;Senior: «Строю систему менторства и развиваю других менторов»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_mentor_senior\" id=\"Roadmap_metric_mentor_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне менторство становится &lt;strong&gt;элементом организационной системы&lt;/strong&gt;. Вы не просто менторите отдельных людей, вы &lt;strong&gt;проектируете программу менторства&lt;/strong&gt;, которая работает в масштабе и не зависит от героизма отдельных личностей. Ключевой сдвиг: вы переходите от «менторства как личной инициативы» к «менторству как инженерному процессу» с чёткими входами, выходами и метриками.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Формализация программы:&lt;/strong&gt; вы создаёте структурированную программу менторства: цели, роли, ожидания, таймлайн. Вы документируете процесс, как любой другой инженерный процесс.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Создание «Менторского стартового кита»:&lt;/strong&gt; вы разрабатываете шаблоны планов, чек-листы, ресурсы, которые помогают новым менторам быстро включиться в процесс.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение менторов:&lt;/strong&gt; вы не только менторите сами, но и обучаете других быть менторами. Вы проводите воркшопы, делитесь фреймворками (GROW, активное слушание), даёте обратную связь.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост команды: добавление новых менторов, менти, продуктов без потери качества.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность программы: время онбординга, удовлетворённость менти, прогресс в компетенциях, удержание.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Защита времени менторов:&lt;/strong&gt; вы создаёте условия, в которых менторство признаётся работой, а не «благотворительностью». Вы устанавливаете квоты, защищаете время, признаёте вклад.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;строите систему&lt;/strong&gt;, которая делает менторство предсказуемым, масштабируемым и устойчивым, а не зависимым от отдельных героев.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_mentor_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_metric_mentor_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://habr.com/ru/articles/814301/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«Архитектура менторства: от хаоса к масштабируемой системе» (Константин Потапов)&lt;/a&gt; - Практическое руководство по построению масштабируемой программы менторства: формализация, ментор-план, база знаний, метрики;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.wiley.com/en-us/The+Mentor%27s+Guide%3A+Facilitating+Effective+Learning+Relationships%2C+3rd+Edition-p-9781119143092\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«The Mentor's Guide: Facilitating Effective Learning Relationships» (Lois J. Zachary)&lt;/a&gt; - Классическое руководство по менторству: как строить отношения, фасилитировать обучение, работать с разными типами менти;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.radicalcandor.com/the-book/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«Radical Candor» (Kim Scott)&lt;/a&gt; - О том, как давать обратную связь, которая одновременно заботлива и честна. Критически важно для обучения менторов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://dl.acm.org/doi/book/10.5555/1190163\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Development: Managing Your Documentation, Projects, Portfolio, and People (JoAnn Hackos)&lt;/a&gt; - Управление командой и развитие сотрудников в масштабе, включая менторство и планирование карьеры.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_ball_junior_junior-uchus-ocenivat-po-kriteriyam-i-uchastvuyu-v-intervyu\" data-original-article=\"Roadmap/metric/ball/junior.html\"&gt;&lt;a href=\"#Roadmap_metric_ball_junior_junior-uchus-ocenivat-po-kriteriyam-i-uchastvuyu-v-intervyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Учусь оценивать по критериям и участвую в интервью»&lt;/span&gt;&lt;/a&gt;Junior: «Учусь оценивать по критериям и участвую в интервью»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_ball_junior\" id=\"Roadmap_metric_ball_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне найм и оценка — это &lt;strong&gt;роль наблюдателя и ученика&lt;/strong&gt;. Вы ещё не принимаете финальных решений, но учитесь понимать, как выглядит сильный кандидат, как работают критерии оценки и почему найм — это не «нравится / не нравится», а сопоставление свидетельств с требованиями роли. Ключевой сдвиг: вы перестаёте воспринимать найм как «поиск самого опытного» и начинаете видеть в нём &lt;strong&gt;поиск наиболее ясного мыслителя&lt;/strong&gt; для конкретной роли.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание уровневой модели:&lt;/strong&gt; вы знаете, чем отличается Junior от Middle и Senior не по годам, а по &lt;strong&gt;объёму владения&lt;/strong&gt; (scope). Junior документирует отдельные фичи под плотным ревью, Middle владеет продуктовой поверхностью end-to-end, Senior отвечает за информационную архитектуру всего набора документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Понимание критериев оценки:&lt;/strong&gt; вы знаете, что на собеседовании оценивают не «качество портфолио» как таковое, а &lt;strong&gt;решения, стоящие за работой&lt;/strong&gt;: почему выбрана эта аудитория, эта структура, этот scope и что кандидат сделал бы иначе. Сильный кандидат идентифицирует читателя и его цель до начала письма[reference:5].&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Участие в интервью как наблюдатель:&lt;/strong&gt; вы присутствуете на интервью (shadowing), фиксируете ответы по заданным критериям и учитесь отличать сильный ответ от слабого.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Оценка тестовых заданий по рубрике:&lt;/strong&gt; вы проверяете writing exercise по готовой рубрике: структура, точность, определение задачи читателя, проверенность шагов. Рубрика может оценивать точность и ясность с весом 30%[reference:6].&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Понимание процесса найма:&lt;/strong&gt; вы знаете этапы: portfolio screen → screening call → writing exercise → интервью с писателями и инженерами → финальное интервью.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;учитесь оценивать по критериям&lt;/strong&gt;, а не по впечатлению. Ваша задача — собрать свидетельства и сопоставить их с требованиями, а не «почувствовать» кандидата.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_ball_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_metric_ball_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.cohesyve.com/how-to-assess/technical-writing\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to Assess Technical Writing Skills When Hiring (Cohesyve)&lt;/a&gt; - Практическое руководство по оценке навыков технического письма: форматы тестовых заданий (write from an expert dump, edit exercise, instruction test) и что считать сильным ответом;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://avahr.com/technical-writer-interview-questions/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writer Interview Questions with Candidate Scorecard (Avahr)&lt;/a&gt; - Пример структурированного scorecard для оценки кандидатов по единым критериям;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://interviewersignal.com/technical-writer-job-description/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writer Job Description Template (Interview Signal)&lt;/a&gt; - Шаблон описания вакансии и screening-вопросов, включая вопрос о читателе и его цели;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://clarity-hire.com/technical-writer-assessment-test/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writer Assessment Test (Clarity Hire)&lt;/a&gt; - Пример тестового задания с рубрикой, оценивающей понимание информации, структуру и работу с инженерами;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.amazon.com/Technical-Writing-Management-Practical-Guide/dp/1484226722\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing Management: A Practical Guide (Steven A. Schwarzman)&lt;/a&gt; - Глава 3 полностью посвящена найму: establish requirements → evaluate resumes → interview → review samples → give a test.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_ball_middle_middle-provozhu-intervyu-i-dayu-strukturirovannuyu-ocenku\" data-original-article=\"Roadmap/metric/ball/middle.html\"&gt;&lt;a href=\"#Roadmap_metric_ball_middle_middle-provozhu-intervyu-i-dayu-strukturirovannuyu-ocenku\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Провожу интервью и даю структурированную оценку»&lt;/span&gt;&lt;/a&gt;Middle: «Провожу интервью и даю структурированную оценку»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_ball_middle\" id=\"Roadmap_metric_ball_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне найм и оценка перестают быть «наблюдением». Теперь вы &lt;strong&gt;полноценный участник процесса&lt;/strong&gt;: проводите интервью, оцениваете тестовые задания, даёте структурированную обратную связь и участвуете в калибровке решений. Ключевой сдвиг: вы перестаёте оценивать «нравится / не нравится» и начинаете оценивать &lt;strong&gt;по поведенческим якорям&lt;/strong&gt; (behavioral anchors), привязанным к требованиям роли.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Проведение структурированных интервью:&lt;/strong&gt; вы задаёте одинаковый набор вопросов разным кандидатам и оцениваете ответы по заранее определённым критериям. Сильный ответ должен содержать: личный вклад кандидата, ограничения, процесс принятия решений, метод проверки, результат и что кандидат сделал бы иначе.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Оценка тестовых заданий:&lt;/strong&gt; вы проверяете writing exercise по рубрике: определил ли кандидат аудиторию и scope в начале, структура, точность, проверенность процедур, ясность.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Участие в калибровке:&lt;/strong&gt; вы обсуждаете оценки с другими интервьюерами, аргументируете свою позицию свидетельствами, а не общими впечатлениями.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Выявление «красных флагов» и сильных сигналов:&lt;/strong&gt; вы знаете, что «сильные сэмплы, хорошее понимание структуры и знакомство с инструментами» — это ещё не всё; важно, задаёт ли кандидат уточняющие вопросы, будет ли он хорошо сотрудничать с инженерами и продактами, сможет ли адаптироваться к системе.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Оценка потенциала, а не только текущего уровня:&lt;/strong&gt; вы учитесь отличать кандидата, который «уже умеет», от кандидата, который «быстро научится» — и понимаете, когда второе важнее.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обратная связь кандидату:&lt;/strong&gt; вы даёте конструктивную обратную связь по итогам тестового задания, даже если кандидат не прошёл.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;проводите интервью и даёте структурированную оценку&lt;/strong&gt; по заранее определённым критериям, снижая предвзятость и обеспечивая сопоставимость кандидатов.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_ball_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_metric_ball_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://avahr.com/technical-writer-interview-questions/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writer Interview Questions with Candidate Scorecard (Avahr, продвинутые разделы)&lt;/a&gt; - Продвинутые разделы: использование единой рубрики для всех кандидатов, оценка по шести критериям для сопоставимости выводов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.cohesyve.com/how-to-assess/technical-writing\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to Assess Technical Writing Skills When Hiring (Cohesyve, продвинутые разделы)&lt;/a&gt; - Продвинутые разделы: оценка reasoning, а не только результата, и использование асинхронных заданий для скрининга;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.amazon.com/Technical-Writing-Management-Practical-Guide/dp/1484226722\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing Management: A Practical Guide (Steven A. Schwarzman, глава 4)&lt;/a&gt; - Раздел «Evaluate the writers»: как оценивать работу писателей в команде, а не только на входе;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://connectdevs.com/hire-technical-copywriting-copywriters/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Hire Technical Copywriting Copywriters: Interview Guide (ConnectDevs)&lt;/a&gt; - Гайд по созданию структурированного scorecard и определению критериев оценки до начала поиска кандидатов.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_ball_senior_senior-stroyu-sistemu-najma-i-ocenki-dlya-organizacii\" data-original-article=\"Roadmap/metric/ball/senior.html\"&gt;&lt;a href=\"#Roadmap_metric_ball_senior_senior-stroyu-sistemu-najma-i-ocenki-dlya-organizacii\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Строю систему найма и оценки для организации»&lt;/span&gt;&lt;/a&gt;Senior: «Строю систему найма и оценки для организации»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_ball_senior\" id=\"Roadmap_metric_ball_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне найм и оценка становятся &lt;strong&gt;элементом организационной системы&lt;/strong&gt;. Вы не просто проводите интервью, вы &lt;strong&gt;проектируете процесс&lt;/strong&gt;: определяете уровневую модель, критерии, рубрики, калибровку и карьерные треки. Ключевой сдвиг: вы переходите от оценки отдельных кандидатов к &lt;strong&gt;созданию системы&lt;/strong&gt;, которая делает найм предсказуемым, справедливым и масштабируемым.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Определение уровневой модели:&lt;/strong&gt; вы создаёте карьерную лестницу с чёткими критериями перехода: scope, key differentiator, typical YoE для каждого уровня. Вы понимаете, что переход в Senior обычно происходит, когда писатель переходит от документирования отдельных фич к владению информационной архитектурой всего продукта.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Создание рубрик и scorecard:&lt;/strong&gt; вы разрабатываете структурированные scorecard для каждой роли, с behavioral anchors и evidence, которые можно аудировать.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Калибровка и снижение предвзятости:&lt;/strong&gt; вы выстраиваете процесс калибровки, чтобы оценки разных интервьюеров были сопоставимы, и отслеживаете pass-through rates и overrides для консистентности.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Оценка performance, а не только найма:&lt;/strong&gt; вы создаёте систему регулярной оценки (performance review) на основе уровневой модели: что ожидается на каждом уровне, как измеряется прогресс, как принимаются решения о повышении.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Использование фреймворков компетенций:&lt;/strong&gt; вы работаете с внешними фреймворками (например, tekom Competence Framework) для описания требований ролей, найма и развития сотрудников.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете процесс, который выдерживает рост: добавление новых ролей, уровней, продуктов без перестройки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение интервьюеров:&lt;/strong&gt; вы обучаете других проводить структурированные интервью и давать объективную оценку.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;строите систему найма и оценки&lt;/strong&gt;, которая обеспечивает справедливость, предсказуемость и масштабируемость, а не полагаетесь на интуицию отдельных интервьюеров.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_ball_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_metric_ball_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.amazon.com/Technical-Writing-Management-Practical-Guide/dp/1484226722\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing Management: A Practical Guide (Steven A. Schwarzman, главы 2–4)&lt;/a&gt; - Полный цикл управления: требования к роли, оценка резюме, интервью, тесты, оценка писателей в команде;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.technical-communication.org/competence-framework\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;tekom Competence Framework (technical-communication.org)&lt;/a&gt; - Комплексное определение компетенций для технической коммуникации. Используется для описания ролей, найма, развития и сертификации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://harmny.com/technical-writer-career-ladder/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writer Career Ladder (Harmny)&lt;/a&gt; - Готовая уровневая модель: IC1–IC5 + management track, с scope и key differentiators;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://dl.acm.org/doi/book/10.5555/1190163\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Development: Managing Your Documentation, Projects, Portfolio, and People (JoAnn Hackos)&lt;/a&gt; - Управление командой и развитие сотрудников, включая найм, оценку и планирование карьеры.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_status_junior_junior-fiksiruyu-problemy-polzovatelej\" data-original-article=\"Roadmap/metric/status/junior.html\"&gt;&lt;a href=\"#Roadmap_metric_status_junior_junior-fiksiruyu-problemy-polzovatelej\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Фиксирую проблемы пользователей»&lt;/span&gt;&lt;/a&gt;Junior: «Фиксирую проблемы пользователей»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_status_junior\" id=\"Roadmap_metric_status_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне влияние на продукт — это &lt;strong&gt;дисциплина наблюдения&lt;/strong&gt;. Вы ещё не предлагаете решения, но учитесь замечать, где продукт «скрипит», и документировать это так, чтобы команда могла действовать. Ключевой сдвиг: вы перестаёте воспринимать документацию как «описание того, что уже сделано», и начинаете видеть в ней &lt;strong&gt;инструмент проверки дизайна&lt;/strong&gt;. Если что-то сложно объяснить, возможно, это сложно и использовать[reference:7].&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Фиксация «сигналов сложности»:&lt;/strong&gt; вы документируете назначенные фичи, но уже начинаете видеть &lt;strong&gt;разрыв между задумкой продукта и реальностью пользователя&lt;/strong&gt;. Работая над документацией, вы обнаруживаете места, где интерфейс или workflow вызывают вопросы, и учитесь сообщать о них инженерам и продактам.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Сбор свидетельств:&lt;/strong&gt; ваш вклад пока заключается в &lt;strong&gt;сборе свидетельств&lt;/strong&gt;: «Пользователи спрашивают в поддержке X», «В документации не получается объяснить Y без дополнительных уточнений», «Этот шаг требует трёх разных экранов».&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Понимание разницы между «задокументировать как есть» и «сообщить, что это можно улучшить»:&lt;/strong&gt; вы учитесь не просто фиксировать текущее состояние, но и подсвечивать проблемы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Использование документации как способа проверить user journey:&lt;/strong&gt; вы проходите по шагам, которые описываете, и замечаете, где пользователь может споткнуться.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Сбор конкретных примеров:&lt;/strong&gt; вы собираете скриншоты, шаги, цитаты пользователей, а не общие впечатления.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;фиксируете проблемы&lt;/strong&gt; и передаёте их команде. Вы не предлагаете решения, но создаёте основу для будущих улучшений.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_status_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_metric_status_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://ubuntu.com/blog/documentation-development-and-design-for-technical-authors\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Documentation, development and design for technical authors (Ubuntu)&lt;/a&gt; - Статья о том, как технический автор, являясь частью команды разработки, может использовать документацию, чтобы влиять на сам продукт;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.linkedin.com/posts/natalie-case-121b81a_technical-writers-are-ux-designers-we-just-activity-7426416422811045889-Mstg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writers as UX Designers: Reducing Friction with Words (Natalie Case, LinkedIn)&lt;/a&gt; - Пост о том, как технические писатели могут выявлять несоответствия между ментальными моделями пользователей и реализацией;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.linkedin.com/posts/melissa-eakin-121b81a_technical-writers-as-valuable-gut-checks-for-activity-7426416422811045889-Mstg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writers as Valuable Gut Checks for Product Success (Melissa Eakin, LinkedIn)&lt;/a&gt; - Пост о том, как писатели могут выступать в роли «проверки на здравый смысл» для продукта, выявляя проблемы, которые не видят инженеры;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - База: аудитория, структура, ясность. Помогает лучше понимать, где документация «не работает»;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации, включая понимание пользователей и их задач.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_status_middle_middle-predlagayu-resheniya-i-uchastvuyu-v-obsuzhdenii\" data-original-article=\"Roadmap/metric/status/middle.html\"&gt;&lt;a href=\"#Roadmap_metric_status_middle_middle-predlagayu-resheniya-i-uchastvuyu-v-obsuzhdenii\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Предлагаю решения и участвую в обсуждении»&lt;/span&gt;&lt;/a&gt;Middle: «Предлагаю решения и участвую в обсуждении»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_status_middle\" id=\"Roadmap_metric_status_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне влияние перестаёт быть пассивным наблюдением. Вы &lt;strong&gt;активно участвуете&lt;/strong&gt; в обсуждении продукта и предлагаете конкретные улучшения. Ключевой сдвиг: вы перестаёте быть «тем, кто приходит после релиза», и становитесь частью процесса принятия решений.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Раннее вовлечение:&lt;/strong&gt; вы участвуете в обсуждении фич до начала разработки. Это предотвращает переработку и позволяет заложить документацию в план с самого начала. Лучшая техническая документация создаётся &lt;strong&gt;до и во время&lt;/strong&gt; разработки продукта[reference:8].&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Участие в design-ревью и refinement:&lt;/strong&gt; вы используете системное видение документации, чтобы выявлять проблемы, которые не видны изнутри компонента.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Предложение решений на основе данных:&lt;/strong&gt; вы приносите данные из поддержки и поисковой аналитики, чтобы обосновать свои предложения.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Роль «голоса пользователя»:&lt;/strong&gt; вы задаёте «глупые» вопросы, которые выявляют реальные проблемы юзабилити, превращаете сложные фичи в понятные user stories, идентифицируете пробелы и edge cases на ранних стадиях[reference:9].&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обоснование через impact:&lt;/strong&gt; вы говорите на языке пользовательских проблем и бизнес-влияния, а не только на языке документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Отслеживание результата:&lt;/strong&gt; вы отслеживаете, были ли ваши предложения приняты, и анализируете результат.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;предлагаете решения и участвуете&lt;/strong&gt; в продуктовых обсуждениях, используя данные и системное видение. Разработчики начинают видеть в вас партнёра.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_status_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_metric_status_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.linkedin.com/posts/amy-lauren-scott-121b81a_the-earlier-you-involve-technical-writers-activity-7426416422811045889-Mstg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Involve Technical Writers Early for Better UX (Amy Lauren Scott, LinkedIn)&lt;/a&gt; - Пост о том, как раннее вовлечение технических писателей помогает выявлять проблемы UX, edge cases и улучшать onboarding;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.linkedin.com/posts/melissa-eakin-121b81a_technical-writers-as-valuable-gut-checks-for-activity-7426416422811045889-Mstg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writers as Valuable Gut Checks for Product Success (Melissa Eakin, LinkedIn)&lt;/a&gt; - Пост о трёх вещах, которые писатель ловит, а инженеры — нет: понятность фичи, соответствие дизайна мышлению пользователей, готовность к adoption;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://ieeexplore.ieee.org/document/1024567\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Using a prototype package to obtain customer feedback (IEEE Xplore)&lt;/a&gt; - Пример из практики: как технический писатель взял на себя разработку прототипа для получения обратной связи от клиентов и стал более интегральной частью команды разработки;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://ubuntu.com/blog/documentation-development-and-design-for-technical-authors\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Documentation, development and design for technical authors (Ubuntu, продвинутые разделы)&lt;/a&gt; - Разделы о том, как технический автор, работая в команде разработки, может влиять на дизайн продукта;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, работа с командой, измерение эффективности.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_status_senior_senior-opredelyayu,-kakim-dolzhen-byt-produkt\" data-original-article=\"Roadmap/metric/status/senior.html\"&gt;&lt;a href=\"#Roadmap_metric_status_senior_senior-opredelyayu,-kakim-dolzhen-byt-produkt\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю, каким должен быть продукт»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю, каким должен быть продукт»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_status_senior\" id=\"Roadmap_metric_status_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне влияние становится &lt;strong&gt;стратегическим&lt;/strong&gt;. Вы не просто предлагаете улучшения — вы участвуете в определении того, что и как должно быть построено. Ключевой сдвиг: вы перестаёте быть «голосом документации» и становитесь &lt;strong&gt;голосом пользователя&lt;/strong&gt; в продуктовых решениях.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегическое влияние:&lt;/strong&gt; вы определяете документационную стратегию для домена и &lt;strong&gt;влияете на продуктовые решения&lt;/strong&gt; на уровне архитектуры и пользовательского опыта.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Раннее участие в дизайне:&lt;/strong&gt; технические писатели вовлечены в дизайн продукта достаточно рано, чтобы влиять на то, где живёт guidance и как он доставляется. Экспертиза формирует опыт продукта, а не просто документирует его[reference:10].&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Роль user advocate:&lt;/strong&gt; ваша основная роль в цикле разработки продукта — не только создание документации, но и &lt;strong&gt;защита интересов пользователя&lt;/strong&gt;. Вы проводите анализ аудитории и делаете рекомендации относительно пользовательского интерфейса[reference:11].&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Работа с дизайнерами как равный партнёр:&lt;/strong&gt; в организациях вроде Canonical технические авторы получают design-тренинг и работают в тесной связке с дизайнерами, потому что документация — это часть продукта[reference:12].&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обоснование через бизнес-ценность:&lt;/strong&gt; вы можете обосновать продуктовые решения через пользовательскую ценность и бизнес-влияние, а не только через качество документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрика успеха:&lt;/strong&gt; продакт-менеджеры приходят к вам за советом &lt;strong&gt;до&lt;/strong&gt; начала разработки, а не после.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете, каким должен быть продукт&lt;/strong&gt; с точки зрения пользовательского опыта и документируемости. Вы становитесь стратегическим партнёром продуктовой команды.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_status_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_metric_status_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://ubuntu.com/blog/documentation-development-and-design-for-technical-authors\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Documentation, development and design for technical authors (Ubuntu)&lt;/a&gt; - Статья, описывающая модель, где технический автор — часть команды разработки с design-тренингом и влиянием на продукт;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://handbook.gitlab.com/handbook/engineering/ux/technical-writing/vision-and-strategy/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Vision and Strategy (GitLab Handbook)&lt;/a&gt; - Раздел о стратегической роли технических писателей в GitLab: как они вовлечены в дизайн продукта и влияют на решения;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/the-product-is/9781492050377/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The Product is Docs (Christopher Gales)&lt;/a&gt; - Книга о написании технической документации в группе разработки продукта: кросс-функциональные зависимости, перспектива менеджера информационного развития;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, работа с командой, измерение эффективности, обучение;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://dl.acm.org/doi/book/10.5555/1190163\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Development: Managing Your Documentation, Projects, Portfolio, and People (JoAnn Hackos)&lt;/a&gt; - Управление документацией в масштабе и стратегическое влияние на продукт.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_cashe_junior_junior-ponimayu,-iz-chego-sostoit-stoimost-i-ne-vyhozhu-za-ramki\" data-original-article=\"Roadmap/metric/cashe/junior.html\"&gt;&lt;a href=\"#Roadmap_metric_cashe_junior_junior-ponimayu,-iz-chego-sostoit-stoimost-i-ne-vyhozhu-za-ramki\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Понимаю, из чего состоит стоимость и не выхожу за рамки»&lt;/span&gt;&lt;/a&gt;Junior: «Понимаю, из чего состоит стоимость и не выхожу за рамки»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_cashe_junior\" id=\"Roadmap_metric_cashe_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне бюджет и вендоры — это &lt;strong&gt;осознание экономического контекста&lt;/strong&gt; вашей работы. Вы ещё не управляете бюджетом, но начинаете понимать, что стоит за каждым решением: сколько стоит час вашей работы, какие инструменты уже оплачены, почему нельзя просто «купить ещё один сервис». Ключевой сдвиг: вы перестаёте воспринимать инструменты и ресурсы как данность и начинаете видеть в них &lt;strong&gt;инвестиции с ценой и отдачей&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание структуры затрат:&lt;/strong&gt; вы знаете, что стоимость документации складывается не только из зарплаты писателя, но и из инструментов (лицензии, подписки), обучения, переводов и поддержки. Скрытые расходы — обучение каждого нового автора работе с системой, поддержка и обновления — часто остаются за рамками первого бюджета.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Работа с существующими инструментами:&lt;/strong&gt; вы используете те инструменты, которые уже оплачены командой, и не инициируете покупку новых без обоснования. Вы понимаете, какие лицензии есть у команды и какие ограничения они накладывают.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Понимание стоимости своего времени:&lt;/strong&gt; вы знаете, сколько примерно стоит час работы технического писателя (внутреннего или фрилансера), и учитываете это, когда планируете задачу.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Сбор данных для обоснований:&lt;/strong&gt; вы фиксируете, где текущие инструменты не справляются: «В этом редакторе нельзя проверить ссылки», «В этой системе нет версионирования». Это сырьё для будущих бизнес-кейсов.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Понимание разницы между внутренним и внешним исполнителем:&lt;/strong&gt; вы знаете, что фрилансер или агентство — это не «дешевле» или «дороже» в абстракте, а другой набор компетенций и рисков. Полный цикл услуг (full service) включает стратегию, написание, архитектуру, дизайн, QA и поддержку, и стоит соответственно[reference:13].&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;понимаете и экономите&lt;/strong&gt; в рамках заданных ограничений, а не пытаетесь оптимизировать бюджет всей команды.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_cashe_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_metric_cashe_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://writechoice.io/blog/technical-writing-services-what-they-include-how-to-choose\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing Services: What is included &amp;amp; how to choose (WriteChoice)&lt;/a&gt; - Детальный разбор того, что входит в услуги технического писательства на разных уровнях (writing only, writing plus structure, full service), и как выбирать провайдера;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://adoc-studio.app/blog/project-management-in-technical-writing/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Project Management in Technical Writing (adoc-studio.app)&lt;/a&gt; - Гайд, показывающий, что технические писатели управляют сложными проектами, включая расчёт и запрос бюджетов на документацию;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://technicalwritingmp.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Managing Technical Writing Projects (Technical Writing Mentorship Program)&lt;/a&gt; - Модуль, который учит управлять ресурсами и стейкхолдерами так, чтобы проект оставался в рамках бюджета;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.linkedin.com/posts/technicalwriterhq_6-documentation-system-costs-nobody-budgets-activity-7170937490018205696-k8F8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;6 Documentation System Costs Nobody Budgets For (Technical Writer HQ, LinkedIn)&lt;/a&gt; - Пост о скрытых расходах: training debt, поддержка, обновления. Помогает увидеть полную картину затрат.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_cashe_middle_middle-obosnovyvayu-byudzhet-i-vybirayu-vendorov-po-kriteriyam\" data-original-article=\"Roadmap/metric/cashe/middle.html\"&gt;&lt;a href=\"#Roadmap_metric_cashe_middle_middle-obosnovyvayu-byudzhet-i-vybirayu-vendorov-po-kriteriyam\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Обосновываю бюджет и выбираю вендоров по критериям»&lt;/span&gt;&lt;/a&gt;Middle: «Обосновываю бюджет и выбираю вендоров по критериям»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_cashe_middle\" id=\"Roadmap_metric_cashe_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне бюджет и вендоры перестают быть «данностью». Теперь это &lt;strong&gt;предмет управления&lt;/strong&gt;: вы обосновываете инвестиции, выбираете инструменты и подрядчиков по структурированным критериям, оцениваете ROI и управляете рисками. Ключевой сдвиг: вы перестаёте говорить «нам нужен инструмент X» и начинаете говорить «инвестиция в X окупится за счёт Y, и вот доказательства».&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Построение бизнес-кейса:&lt;/strong&gt; вы умеете обосновать инвестиции в документацию или инструменты, переводя технические улучшения на язык бизнеса: сокращение времени на документацию на 30%, снижение затрат на переводы на 25%. Вы показываете не «что мы купим», а «какую проблему это решит и сколько это сэкономит».&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Иерархия потребностей для выбора инструментов:&lt;/strong&gt; вы не сравниваете инструменты по списку фич. Вы строите иерархию: что критично для workflow авторов, что требуется организации, что запрашивают пользователи. Требования часто &lt;strong&gt;эволюционируют в процессе демо и триалов&lt;/strong&gt;, когда вы обнаруживаете возможности, о которых не знали.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Структурированная оценка вендоров:&lt;/strong&gt; вы используете взвешенные критерии: техническое соответствие, стоимость владения (TCO), надёжность, поддержка, репутация. Вы запрашиваете кейсы с измеримыми результатами, а не общие обещания.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Управление вендорскими отношениями:&lt;/strong&gt; вы работаете с подрядчиками (переводческими агентствами, фрилансерами) не как с «исполнителями», а как с партнёрами. Вы обсуждаете win-win условия и понимаете их бизнес.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Оценка ROI:&lt;/strong&gt; вы рассчитываете возврат инвестиций: сколько стоит инструмент, сколько времени он сэкономит, через сколько окупится. Вы используете ROI-калькуляторы для CCMS и других систем.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;обосновываете и выбираете&lt;/strong&gt; на основе данных, а не интуиции. Вы отвечаете за то, чтобы каждая инвестиция была оправдана и измерима.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_cashe_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_metric_cashe_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://writechoice.io/blog/technical-writing-services-what-they-include-how-to-choose\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing Services: What is included &amp;amp; how to choose (WriteChoice, продвинутые разделы)&lt;/a&gt; - Продвинутые разделы: сравнение моделей обслуживания (writing-only, writing+structure, full service), вопросы для отделения серьёзных провайдеров от контент-мельниц, реалистичные цены;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.amazon.com/Technical-Writing-Management-Practical-Guide/dp/1484226722\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing Management: A Practical Guide (Steven A. Schwarzman, главы 4–5)&lt;/a&gt; - Разделы об оценке и отслеживании проектов, управлении обучением и бюджетом;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://podcasts.apple.com/us/podcast/the-not-boring-tech-writer/id1523042903\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The Not-Boring Tech Writer: Advocating for docs and choosing tools (Kelton Noyes, подкаст)&lt;/a&gt; - Эпизод о выборе инструментов: иерархия потребностей, демо и триалы, red flags. Также — как обосновать ценность документации через метрики;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://recited.io/blog/vendor-selection\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Vendor Selection and Third-Party Tool Evaluation (recited.io)&lt;/a&gt; - Структурированный подход к оценке вендоров: критерии, взвешивание, запрос ROI-кейсов. Применимо к инструментам документации.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metric_cashe_senior_senior-opredelyayu-byudzhetnuyu-strategiyu-i-stroyu-sistemu-upravleniya-vendorami\" data-original-article=\"Roadmap/metric/cashe/senior.html\"&gt;&lt;a href=\"#Roadmap_metric_cashe_senior_senior-opredelyayu-byudzhetnuyu-strategiyu-i-stroyu-sistemu-upravleniya-vendorami\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю бюджетную стратегию и строю систему управления вендорами»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю бюджетную стратегию и строю систему управления вендорами»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metric_cashe_senior\" id=\"Roadmap_metric_cashe_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне бюджет и вендоры становятся &lt;strong&gt;элементом организационной стратегии&lt;/strong&gt;. Вы не просто обосновываете отдельные инвестиции, вы &lt;strong&gt;определяете, как организация инвестирует в документацию&lt;/strong&gt;: какой бюджет выделяется, какие вендоры используются, как измеряется отдача и как управляются риски в масштабе. Ключевой сдвиг: вы переходите от управления отдельными сделками к &lt;strong&gt;созданию системы&lt;/strong&gt;, которая делает инвестиции в документацию предсказуемыми и стратегически обоснованными.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Бюджетная стратегия для домена:&lt;/strong&gt; вы определяете, как формируется бюджет документации: какие статьи, какие приоритеты, как он связан с продуктовым roadmap и бизнес-целями. Вы защищаете бюджет перед руководством, используя данные о ROI и рисках.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Управление портфелем вендоров:&lt;/strong&gt; вы управляете не отдельными подрядчиками, а &lt;strong&gt;портфелем&lt;/strong&gt;: переводческие агентства, инструменты, консалтинг. Вы балансируете затраты, риски и качество across多个 вендоров.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance закупок:&lt;/strong&gt; вы определяете политику: кто может инициировать покупку, какие критерии обязательны, как проверяется ROI, как обрабатываются исключения.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых продуктов, языков, команд без пересмотра всех контрактов.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Управление рисками:&lt;/strong&gt; вы идентифицируете и митигируете риски, связанные с вендорами: зависимость от одного поставщика, рост цен, уход ключевых людей, несовместимость инструментов.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение и развитие менеджеров:&lt;/strong&gt; вы обучаете middle-менеджеров и тимлидов навыкам обоснования бюджета и выбора вендоров.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Инвестиции в документацию становятся частью бизнес-стратегии, а не «затратами на тексты».&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metric_cashe_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_metric_cashe_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.amazon.com/Managing-Your-Documentation-Projects-Hackos/dp/0471591239\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Managing Your Documentation Projects (JoAnn T. Hackos)&lt;/a&gt; - Классика управления документационными проектами. Главы о планировании, оценке затрат, производстве и оценке проектов. Включает шаблоны и чек-листы;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.amazon.com/Technical-Writing-Management-Practical-Guide/dp/1484226722\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing Management: A Practical Guide (Steven A. Schwarzman, главы 5–6)&lt;/a&gt; - Разделы об оценке и отслеживании проектов, управлении обучением и бюджетом, а также о работе с внешними заказчиками и подрядчиками;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://dl.acm.org/doi/book/10.5555/1190163\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Development: Managing Your Documentation, Projects, Portfolio, and People (JoAnn Hackos)&lt;/a&gt; - Управление портфелем документации и бюджетом в масштабе;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://lavacon.org/2017/presentations/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;LavaCon 2017 - Management Workshop Part 1: Leadership and Management in Technical Documentation (слайды)&lt;/a&gt; - Факторы принятия решений: needs assessment, budget, timing. Стратегии работы с вендорами: партнёрство, win-win, понимание бизнеса вендора.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 data-original-article=\"WhatRead/amir.html\"&gt;Амир Вафин \"Абсолютная дисциплина\"&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#WhatRead_amir\" id=\"WhatRead_amir\"&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;img src=\"../WhatRead/image-4.png\" alt=\"alt text\"&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;&lt;strong&gt;Еще одна причина, по которой решил записывать, что было сделано, и вставать в пять утра.&lt;/strong&gt;&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Когда начинаешь читать, первая мысль: &lt;em&gt;\"Да ну, это база, это всем понятно\"&lt;/em&gt;. Однако это тот случай, когда тебе нужен кто-то со стороны, чтобы сказал очевидное. С каждой новой главой всё раскладывается по полочкам планов и привычек.&lt;/p&gt;\n&lt;p&gt;Благодаря этой книге получилось начать и, надеюсь, не бросить тренировки, чтение и обучение. Иногда по чуть-чуть, не спеша, но каждый день. На текущий
