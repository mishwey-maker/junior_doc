        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"senior-sozdayu-standart-i-obuchayu-drugih\"&gt;&lt;a href=\"Roadmap/base/style/senior.html#senior-sozdayu-standart-i-obuchayu-drugih\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Создаю стандарт и обучаю других»&lt;/span&gt;&lt;/a&gt;Senior: «Создаю стандарт и обучаю других»&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне стиль и тон — это &lt;strong&gt;элемент организационной культуры&lt;/strong&gt;. Вы не просто выбираете стайлгайд для команды, вы &lt;strong&gt;определяете, как язык документации вписывается в общую стратегию&lt;/strong&gt;: как связаны стиль документации, стиль интерфейса (UX writing) и стиль маркетинга, как обеспечивается консистентность между командами и продуктами, как обучать инженеров писать понятно. Ключевой сдвиг: вы перестаёте быть «тем, кто пишет по правилам», и становитесь &lt;strong&gt;тем, кто создаёт правила для организации&lt;/strong&gt; и отвечает за их соблюдение в масштабе.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Создание org-wide стайлгайда:&lt;/strong&gt; вы создаёте стандарт стиля для всей организации, который используется несколькими командами. Вы определяете, как обрабатывать исключения, как проводить ревью, как обучать новых авторов. Хороший стайлгайд не пишется в одиночку: в CrowdStrike, например, создают небольшие рабочие группы внутри писательской команды — одна решает, какие слова использовать, другая — каким должен быть стайлгайд, третья — что важно для accessibility. Это даёт чувство ownership и снижает «усталость от решений» у остальных авторов.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Governance и стандарты:&lt;/strong&gt; вы определяете политику языка: какие термины обязательны, какие запрещены, как адаптировать стиль для локализации, как обеспечивать accessibility. Ваш стайлгайд должен быть &lt;strong&gt;исполнимым&lt;/strong&gt;, а не декларативным: он либо встроен в Vale и CI, либо не работает. Senior-писатель «устанавливает и обеспечивает соблюдение стайлгайдов, шаблонов и стандартов документации, чтобы обеспечить консистентность и качество across documentation sets».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Кросс-функциональная работа:&lt;/strong&gt; вы согласовываете стиль документации со стилем интерфейса и маркетинга. IBM, например, строит контентные гайдлайны на основе &lt;strong&gt;IBM Style&lt;/strong&gt; — корпоративного справочника для всех писателей и редакторов, который применяется ко всему публикуемому контенту, и &lt;strong&gt;IBM Design Language&lt;/strong&gt;, который задаёт голос бренда. Голос (voice) остаётся узнаваемым, а тон (tone) адаптируется под ситуацию: тон сообщений об ошибках — экономный и прямой, тон onboarding-флоу — более дружелюбный и развёрнутый. Вы выстраиваете такую же связку для своей организации.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Обучение и менторство:&lt;/strong&gt; вы обучаете инженеров и писателей правилам стиля, проводите воркшопы, создаёте внутренние курсы. Senior-писатель «менторит и направляет других писателей, развивая навыки и обеспечивая adherence to best practices».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Стратегия локализации:&lt;/strong&gt; вы определяете, как стиль адаптируется для разных языков и культур. W3C Manual of Style, например, требует избегать идиом, специфичных для США или английского языка, выбирать примеры, отражающие глобальную аудиторию, и использовать locale-neutral представления данных — даты, числа, валюты. ISO House Style добавляет требование &lt;strong&gt;Plain English&lt;/strong&gt;: короткие предложения (не более 20 слов), одна идея на предложение, частые подзаголовки и списки, потому что документы читают не-носители языка и часто переводят.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Метрики стиля:&lt;/strong&gt; вы измеряете, как качество стиля влияет на метрики документации. Это не «нравится / не нравится», а &lt;strong&gt;data-driven обновления стайлгайда&lt;/strong&gt;: какие правила снижают время поиска, какие темы генерируют меньше тикетов, где readability scores улучшаются после правок. «Enhanced Style Guide» — это не статичный документ, а результат анализа performance-данных.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. PM-ы и инженеры приходят к вам за советом по стилю &lt;strong&gt;до&lt;/strong&gt; начала работы над фичей, потому что вы — тот, кто знает, как организация говорит с пользователем.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-senior\"&gt;&lt;a href=\"Roadmap/base/style/senior.html#kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://www.w3.org/guide/manual-of-style/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;W3C Manual of Style&lt;/a&gt; - Пример редакционного стандарта для организации: grammar, spelling, punctuation, case, linking, accessibility, internationalization. Показывает, как выглядит живой стайлгайд, который обновляется и используется распределённой командой авторов и редакторов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.iso.org/ISO-house-style.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ISO House Style&lt;/a&gt; - Стандарт стиля для международной организации: Plain English, структура документов, терминология. Демонстрирует, как требования к ясности и переводимости встраиваются в формальный стандарт, обязательный для всех документов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.pearson.de/media/muster/ext/9780132118934.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The IBM Style Guide: Conventions for Writers and Editors&lt;/a&gt; - Пример корпоративного стайлгайда, который «помогает любой организации улучшить и стандартизировать контент across authors, delivery mechanisms, and geographic locations». Показывает, как связать язык, грамматику, форматирование и написание для глобальной аудитории в один исполнимый стандарт;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://carbondesignsystem.com/guidelines/content/overview/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;IBM Carbon Design System — Content guidelines&lt;/a&gt; - Пример связи voice и tone с продуктовым дизайном: IBM Style как корпоративный справочник, IBM Design Language как источник голоса бренда. Показывает, как документация и интерфейс используют один и тот же стандарт, но адаптируют тон под ситуацию;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://document360.com/blog/how-to-build-style-guides-that-enhances-the-customer-journey/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to build style guides with Marty Yu from CrowdStrike (Document360)&lt;/a&gt; - Подкаст о том, как Senior Technical Writer строит стайлгайд в реальной организации: рабочие группы, ownership, снижение decision fatigue, связь стайлгайда с customer journey и метриками;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Практическое руководство по созданию, измерению и поддержанию документации: шаблоны, процессы, принципы. Полезно для построения системы, в которой стайлгайд — часть жизненного цикла контента, а не отдельный документ;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://dl.acm.org/doi/book/10.5555/1190163\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Development: Managing Your Documentation Projects, Portfolio, and People (JoAnn T. Hackos)&lt;/a&gt; - Управление документацией в масштабе: портфель, зрелость процессов, качество, эффективность затрат. Помогает увидеть стайлгайд как элемент более широкой системы управления информацией, а не как «правила про запятые».&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/base/style/senior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Senior: «Создаю стандарт и обучаю других»","href":"Roadmap/base/style/senior.html#senior-sozdayu-standart-i-obuchayu-drugih","level":2,"items":[{"title":"Курсы и книги (Senior)","href":"Roadmap/base/style/senior.html#kursy-i-knigi-senior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/base/style/senior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
