        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"middle-pishu-specifikaciyu-i-nastraivayu-generaciyu\"&gt;&lt;a href=\"Roadmap/api/openapi/middle.html#middle-pishu-specifikaciyu-i-nastraivayu-generaciyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Пишу спецификацию и настраиваю генерацию»&lt;/span&gt;&lt;/a&gt;Middle: «Пишу спецификацию и настраиваю генерацию»&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне OpenAPI перестаёт быть просто «форматом, который я читаю». Теперь это &lt;strong&gt;инструмент проектирования и автоматизации&lt;/strong&gt;. Вы создаёте спецификации с нуля, настраиваете генерацию документации, интегрируете OpenAPI в docs-as-code.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Написание спецификации с нуля:&lt;/strong&gt; вы создаёте OpenAPI 3.0/3.1 документ для нового API: paths, operations, parameters, requestBody, responses, components/schemas.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Переиспользование компонентов:&lt;/strong&gt; вы понимаете, как работает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3j97yl11\"&gt;components&lt;/code&gt;: reusable schemas, parameters, responses, securitySchemes. Вы избегаете дублирования через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-78x50xyr\"&gt;$ref&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Безопасность:&lt;/strong&gt; вы документируете securitySchemes: OAuth 2.0, API keys, Bearer tokens, basic auth.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Генерация документации:&lt;/strong&gt; вы настраиваете Swagger UI или Redoc для отображения спецификации. Вы понимаете разницу: Swagger UI — интерактивный, с «Try it out»; Redoc — read-focused, более чистый и современный.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Интеграция в docs-as-code:&lt;/strong&gt; вы понимаете, как OpenAPI-файл живёт в Git-репозитории рядом с Markdown-документацией. Вы настраиваете CI для валидации спецификации и генерации документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация и линтинг:&lt;/strong&gt; вы настраиваете проверку спецификации в CI: syntax validation, style linting, проверка на breaking changes.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Гибридный подход:&lt;/strong&gt; вы понимаете, что автогенерация из OpenAPI покрывает reference, но не даёт контекста. Вы добавляете ручные описания поверх.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;создаёте и автоматизируете&lt;/strong&gt;. Вы отвечаете за то, чтобы спецификация была точной, полной и генерировала качественную документацию.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-middle\"&gt;&lt;a href=\"Roadmap/api/openapi/middle.html#kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://www.manning.com/books/designing-apis-with-swagger-and-openapi\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Designing APIs with Swagger and OpenAPI (Josh Ponelat, Lukas Rosenstock)&lt;/a&gt; - Комплексное руководство: от концепции до продакшена. Реальные проекты, OpenAPI syntax, codegen, versioning, breaking changes;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.manning.com/books/the-design-of-web-apis-second-edition\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The Design of Web APIs, Second Edition (Arnaud Lauret)&lt;/a&gt; - Обновлённое издание: покрывает последние изменения OpenAPI, документирование REST API с OpenAPI и JSON Schema;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://codered.eccouncil.org/course/openapi-3-1-api-design\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;OpenAPI 3.1 API Design Course (CodeRed)&lt;/a&gt; - Для разработчиков, архитекторов и &lt;strong&gt;технических писателей&lt;/strong&gt;: design-first подход, создание OpenAPI-документа, paths, operations, reusable components;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.pce.uw.edu/specializations/api-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Specialization in API Documentation (UW Professional &amp;amp; Continuing Education)&lt;/a&gt; - 11-недельная программа для технических писателей: API fundamentals, OpenAPI, docs-as-code, testing;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/OAI/OpenAPI-Specification/blob/main/versions/3.1.0.md\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitHub: Best Practices (Spec Authoring)&lt;/a&gt; - Правила написания спецификаций: operationId, reuse components, clear responses.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/api/openapi/middle.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Middle: «Пишу спецификацию и настраиваю генерацию»","href":"Roadmap/api/openapi/middle.html#middle-pishu-specifikaciyu-i-nastraivayu-generaciyu","level":2,"items":[{"title":"Курсы и книги (Middle)","href":"Roadmap/api/openapi/middle.html#kursy-i-knigi-middle","level":3}]}],"title":""},"router":{"pathname":"Roadmap/api/openapi/middle","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
