            {"data":{"leading":false,"html":"&lt;h2 id=\"middle-proektiruyu-portfel-primerov-i-avtomatiziruyu-proverki\"&gt;&lt;a href=\"Roadmap/api/code/middle.html#middle-proektiruyu-portfel-primerov-i-avtomatiziruyu-proverki\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Проектирую портфель примеров и автоматизирую проверки»&lt;/span&gt;&lt;/a&gt;Middle: «Проектирую портфель примеров и автоматизирую проверки»&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне примеры кода перестают быть просто «дополнением к документации». Теперь это &lt;strong&gt;предмет проектирования&lt;/strong&gt;: вы определяете, какие примеры нужны для разных аудиторий, как они связаны с задачами разработчиков, как автоматизировать их проверку.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Портфель примеров (Code Sample Portfolio):&lt;/strong&gt; вы проектируете три уровня примеров: &lt;strong&gt;request snippets&lt;/strong&gt; (один вызов), &lt;strong&gt;task-focused examples&lt;/strong&gt; (несколько вызовов для решения задачи), &lt;strong&gt;sample applications&lt;/strong&gt; (end-to-end приложение).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Мультиязычность:&lt;/strong&gt; вы добавляете примеры на нескольких языках (curl, Python, JavaScript, Java) в зависимости от аудитории.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Безопасность и обработка ошибок:&lt;/strong&gt; вы включаете в примеры безопасную обработку credentials (никогда не хардкодить токены), таймауты, проверку статус-кодов, обработку ошибок.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Автоматизация проверок:&lt;/strong&gt; вы настраиваете CI для тестирования примеров: синтаксическая проверка — минимум, высокоценные примеры запускаются против контролируемой среды.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Интеграция с OpenAPI:&lt;/strong&gt; вы используете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bdo3xf5s\"&gt;x-codeSamples&lt;/code&gt; для добавления примеров в спецификацию OpenAPI. Swagger UI и Redoc автоматически отображают примеры для каждого эндпоинта.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Проверка актуальности:&lt;/strong&gt; вы убеждаетесь, что примеры не используют устаревшие SDK, не игнорируют ошибки и не нормализуют небезопасные практики.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;проектируете и автоматизируете&lt;/strong&gt;. Вы отвечаете за то, чтобы примеры были актуальными, безопасными и проверяемыми.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-middle\"&gt;&lt;a href=\"Roadmap/api/code/middle.html#kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/two\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing Two — Code Samples&lt;/a&gt; - Продвинутые темы: создание примеров для туториалов, антипримеры, диапазон сложности;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://mintlify.com/docs/api-playground/sdk-examples\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mintlify: Add SDK examples&lt;/a&gt; - Как добавлять SDK-примеры через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z3fofadn\"&gt;x-codeSamples&lt;/code&gt;, автоматическая генерация через Speakeasy;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://redocly.com/docs/openapi-visual-reference/x-code-samples/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Redocly: x-codeSamples&lt;/a&gt; - Использование &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-svdnobo7\"&gt;x-codeSamples&lt;/code&gt; для добавления кастомных примеров на нескольких языках;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://api7.ai/blog/code-samples-in-api-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;API7.ai: Incorporating Code Samples&lt;/a&gt; - Продвинутые разделы: портфель примеров, мультиязычность, автоматизация проверок;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://learning.postman.com/docs/sending-requests/examples/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Postman: Create examples of request responses&lt;/a&gt; - Как использовать Postman для создания и сохранения примеров запросов и ответов.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/api/code/middle.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Middle: «Проектирую портфель примеров и автоматизирую проверки»","href":"Roadmap/api/code/middle.html#middle-proektiruyu-portfel-primerov-i-avtomatiziruyu-proverki","level":2,"items":[{"title":"Курсы и книги (Middle)","href":"Roadmap/api/code/middle.html#kursy-i-knigi-middle","level":3}]}],"title":""},"router":{"pathname":"Roadmap/api/code/middle","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
