        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"middle-formuliruyu-pravila-i-adaptiruyu-yazyk\"&gt;&lt;a href=\"Roadmap/base/english/middle.html#middle-formuliruyu-pravila-i-adaptiruyu-yazyk\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Формулирую правила и адаптирую язык»&lt;/span&gt;&lt;/a&gt;Middle: «Формулирую правила и адаптирую язык»&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне английский перестаёт быть просто «языком, на котором я пишу». Теперь это &lt;strong&gt;предмет решений&lt;/strong&gt;: какой стайлгайд использовать, как адаптировать язык под аудиторию, как формулировать правила для команды, как разрешать спорные случаи. Ключевой сдвиг: вы перестаёте быть «тем, кто следует чужим правилам», и становитесь &lt;strong&gt;тем, кто создаёт правила для своей команды&lt;/strong&gt; и обеспечивает их соблюдение.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Уровень C1–C2:&lt;/strong&gt; требования к middle и senior technical writer — C1 или C2 (fluent/proficient) в письменном и устном английском.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Выбор и адаптация стайлгайда:&lt;/strong&gt; вы понимаете разницу между Google Developer Documentation Style Guide (фокус на developer-аудитории, «knowledgeable friend», консистентность) и Microsoft Writing Style Guide (более 300 тем по терминологии, бренд-голос, accessibility, локализация). Вы можете обосновать выбор для конкретного проекта и адаптировать его под продукт.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Global English:&lt;/strong&gt; вы адаптируете язык для глобальной аудитории: избегаете идиом, культурных отсылок, военных и спортивных метафор. Используете короткие предложения, простые конструкции, явные синтаксические связи. The Global English Style Guide (John R. Kohl) — ключевой ресурс: он объясняет, как писать документацию, оптимизированную для не-носителей, переводчиков и машинного перевода.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Управление терминологией:&lt;/strong&gt; вы ведёте глоссарий, определяете, какие термины переводить, какие оставлять на английском, как адаптировать терминологию для локализации. Microsoft Writing Style Guide содержит более 300 тем по терминологии, которые можно использовать как основу.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Формулирование правил:&lt;/strong&gt; вы создаёте внутренний стайлгайд для команды: какие термины использовать, какой тон, какие конструкции запрещены. Вы адаптируете Google/Microsoft под продукт, а не копируете их целиком.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Ревью и обучение:&lt;/strong&gt; вы проверяете тексты других авторов на соответствие стилю и даёте конструктивный фидбек. Вы не просто исправляете, а объясняете, почему это важно.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Интеграция стиля в процесс:&lt;/strong&gt; вы понимаете, как встроить проверку стиля в CI (Vale), чтобы правила соблюдались автоматически. Write Better with Vale (Brian P. Hogan) — практическое руководство по превращению стайлгайда в исполняемые правила.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;формулируете&lt;/strong&gt; правила и &lt;strong&gt;объясняете&lt;/strong&gt; их. Вы отвечаете за то, чтобы команда писала единообразно, даже если авторов несколько.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-middle\"&gt;&lt;a href=\"Roadmap/base/english/middle.html#kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://www.amazon.com/Global-English-Style-Guide-Documentation/dp/0131477498\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The Global English Style Guide (John R. Kohl)&lt;/a&gt; - Классика жанра: как писать документацию, оптимизированную для не-носителей, переводчиков и машинного перевода. Главы об упрощении стиля, ясности модификаторов, пунктуации. Помогает адаптировать язык для глобальной аудитории;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.asd-ste100.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ASD-STE100 Simplified Technical English — Basic Course for Technical Writers (UNINETTUNO)&lt;/a&gt; - Официальный сертифицированный курс: 9 видеоуроков, от терминологии и грамматики до процедурного и описательного письма. Даёт структурированное понимание контролируемого языка и его применения в технической документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://be-english.com.ua/english-for-technical-writing/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;English for Technical Writing (be-english.com.ua)&lt;/a&gt; - Корпоративный курс для технических писателей с B1–B2: письмо для software products, user manuals, communication с инженерами. Практический курс, ориентированный на реальные задачи технического писателя;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4302-6634-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«User Guides, Manuals, and Technical Writing» (Adrian Wallwork, главы 2–4)&lt;/a&gt; - Разделы о ясном английском, типичных грамматических ошибках, layout и порядке информации. Написана специально для не-носителей английского, помогает избежать типичных ошибок в мануалах;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/two\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing Two&lt;/a&gt; - Продолжение Technical Writing One: продвинутые темы по стилю, редактированию и ревью. Помогает перейти от «пишу понятно» к «пишу так, чтобы команда писала единообразно»;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.pearson.com/store/p/technical-english/P100000855156\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«Technical English» (Pearson, 8-е издание)&lt;/a&gt; - Пошаговое руководство по технической коммуникации: research, employment, grammatical usage. Учебник для тех, кто хочет системно проработать грамматику и лексику технического английского.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/base/english/middle.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Middle: «Формулирую правила и адаптирую язык»","href":"Roadmap/base/english/middle.html#middle-formuliruyu-pravila-i-adaptiruyu-yazyk","level":2,"items":[{"title":"Курсы и книги (Middle)","href":"Roadmap/base/english/middle.html#kursy-i-knigi-middle","level":3}]}],"title":""},"router":{"pathname":"Roadmap/base/english/middle","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
