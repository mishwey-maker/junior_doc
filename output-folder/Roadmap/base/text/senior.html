        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"senior-proektiruyu-arhitekturu-kontenta-i-upravlyayu-strukturoj-v-masshtabe\"&gt;&lt;a href=\"Roadmap/base/text/senior.html#senior-proektiruyu-arhitekturu-kontenta-i-upravlyayu-strukturoj-v-masshtabe\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Проектирую архитектуру контента и управляю структурой в масштабе»&lt;/span&gt;&lt;/a&gt;Senior: «Проектирую архитектуру контента и управляю структурой в масштабе»&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне структура текста — это &lt;strong&gt;элемент информационной архитектуры (IA) всей организации&lt;/strong&gt;. Вы не просто проектируете структуру для одного продукта, вы &lt;strong&gt;владеете структурой всего набора документации (docset)&lt;/strong&gt;: иерархией, навигацией, шаблонами, перелинковкой и discoverability. Ключевой сдвиг: вы перестаёте быть «тем, кто проектирует страницы», и становитесь &lt;strong&gt;тем, кто проектирует систему&lt;/strong&gt;, в которой тысячи страниц остаются находимыми и консистентными при масштабировании.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Владение structural IA и docset hierarchy:&lt;/strong&gt; вы отвечаете за иерархию всего набора документации (10 000+ объектов знаний), а не отдельных страниц. Вы проектируете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bff196in\"&gt;docset hierarchies&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w98i0cx9\"&gt;linking strategies&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j156agbk\"&gt;navigation flows&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pu995io0\"&gt;content discoverability patterns&lt;/code&gt; — то, как пользователь перемещается по документации и находит нужное. DQTI относит это к характеристике &lt;strong&gt;Organization&lt;/strong&gt;: «Put information where users expect it».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Шаблонные системы и контент-модели:&lt;/strong&gt; вы создаёте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h5ojb98y\"&gt;template systems&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-atlqrznl\"&gt;content frameworks&lt;/code&gt;, которые используются всеми авторами. Вы определяете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-32pa9oo0\"&gt;structural patterns&lt;/code&gt; для больших документационных экосистем, чтобы новая страница автоматически получала правильную структуру, а не изобреталась заново. Это то, что DQTI называет «present similar information in a similar way».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Structured authoring и таксономия:&lt;/strong&gt; вы работаете с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9nw1monl\"&gt;structured authoring methodologies&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bh32hu8o\"&gt;reusable component patterns&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-epe6drws\"&gt;metadata tagging&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-node66zb\"&gt;taxonomy alignment&lt;/code&gt;. Структура перестаёт быть «текстом с заголовками» и становится управляемой моделью: компоненты переиспользуются, метаданные связывают контент, таксономия обеспечивает консистентную категоризацию.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Retrievability и discoverability:&lt;/strong&gt; вы проектируете структуру не только для чтения, но и для &lt;strong&gt;нахождения&lt;/strong&gt;. DQTI выделяет &lt;strong&gt;Retrievability&lt;/strong&gt; как отдельную характеристику качества: «Guide users through the information» и «simplify search and retrievability». Вы отвечаете за то, чтобы структура выдерживала поисковые сценарии, а не только линейное чтение.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Кросс-продуктовая и кросс-языковая структура:&lt;/strong&gt; вы проектируете IA, которая выдерживает рост: новые продукты, языки, версии и команды. W3C Manual of Style требует, чтобы структура документов работала для глобальной аудитории и выдерживала интернационализацию. ISO House Style добавляет требование &lt;strong&gt;Plain English&lt;/strong&gt;: короткие предложения и абзацы, частые подзаголовки и списки, чтобы структура была читаемой для не-носителей языка и переводимой.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Governance структуры:&lt;/strong&gt; вы определяете, кто владеет структурой, как она ревьюится, как обрабатываются исключения и как изменения в структуре коммуницируются командам. Вы обучаете авторов работать в рамках структуры, а не перестраивать её под каждую задачу.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Метрики структуры:&lt;/strong&gt; вы измеряете эффективность IA: time-to-find, search success rate, navigation paths, глубина кликов до целевой страницы. Вы используете данные для &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xtnlg001\"&gt;data-driven&lt;/code&gt; изменений структуры, а не «мне кажется, так логичнее».&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила структуры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Если новый автор открывает репозиторий и автоматически получает правильную иерархию, шаблон и навигацию — это ваша работа. Если структура ломается при добавлении нового продукта — это тоже ваша ответственность.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-senior\"&gt;&lt;a href=\"Roadmap/base/text/senior.html#kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/information-architecture-4th/9781491913529/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Architecture: For the Web and Beyond (Rosenfeld, Morville, Arango)&lt;/a&gt; - Классика IA: организация, маркировка, навигация, поиск, метаданные. Главы об &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zhy3p1yn\"&gt;Organization Systems&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e4uxk1bs\"&gt;Navigation Systems&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uzvd0klc\"&gt;Design for Finding&lt;/code&gt; дают фундаментальные модели, которые вы применяете к документации в масштабе, а не к отдельному сайту;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://users.dcc.uchile.cl/~nbaloian/ArquitecturaDeLaInformacion/materialDeLAWeb/TriDoc2005-DQTI.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Developing Quality Technical Information (IBM)&lt;/a&gt; - DQTI определяет &lt;strong&gt;Organization&lt;/strong&gt; и &lt;strong&gt;Retrievability&lt;/strong&gt; как отдельные характеристики качества. Главы об &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w3imqj77\"&gt;Organization&lt;/code&gt; («Put information where users expect it») и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zd2jwdn5\"&gt;Retrievability&lt;/code&gt; («Guide users through the information») дают язык и критерии для проектирования структуры в масштабе, а не «на глаз»;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/979-8-8688-2509-5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Глава «Organizing Documentation»: как организовывать большие наборы документации, чтобы пользователи находили нужное в нужный момент. Книга написана практиками из Google, Linux Foundation, Stripe и Monzo и даёт шаблоны и принципы, которые можно адаптировать под организацию[reference:14][reference:15];&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.w3.org/guide/manual-of-style/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;W3C Manual of Style&lt;/a&gt; - Пример редакционного стандарта для глобальной организации: интернационализация, доступность, структура документов. Показывает, как требования к структуре (заголовки, ссылки, представление данных) встраиваются в формальный стандарт, обязательный для распределённой команды авторов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.iso.org/ISO-house-style.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ISO House Style&lt;/a&gt; - Стандарт стиля для международной организации: &lt;strong&gt;Plain English&lt;/strong&gt;, короткие предложения и абзацы, частые подзаголовки и списки. Демонстрирует, как структура документа подчиняется требованиям читаемости и переводимости, а не только эстетике[reference:17][reference:18];&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://carbondesignsystem.com/guidelines/content/overview/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;IBM Carbon Design System — Content guidelines&lt;/a&gt; - Пример связи структуры контента с продуктовым дизайном: как голос бренда и тон адаптируются под ситуацию, а структура интерфейса и документации остаются согласованными. Полезно для кросс-функциональной работы с дизайнерами и продактами.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/base/text/senior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Senior: «Проектирую архитектуру контента и управляю структурой в масштабе»","href":"Roadmap/base/text/senior.html#senior-proektiruyu-arhitekturu-kontenta-i-upravlyayu-strukturoj-v-masshtabe","level":2,"items":[{"title":"Курсы и книги (Senior)","href":"Roadmap/base/text/senior.html#kursy-i-knigi-senior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/base/text/senior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
