        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"middle-proektiruyu-strukturu-i-adaptiruyu-pod-auditoriyu\"&gt;&lt;a href=\"Roadmap/base/text/middle.html#middle-proektiruyu-strukturu-i-adaptiruyu-pod-auditoriyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Проектирую структуру и адаптирую под аудиторию»&lt;/span&gt;&lt;/a&gt;Middle: «Проектирую структуру и адаптирую под аудиторию»&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне структура текста перестаёт быть просто «оформлением». Теперь это &lt;strong&gt;предмет проектирования&lt;/strong&gt;: вы выбираете тип иерархии, проектируете information architecture (IA) для продукта, применяете progressive disclosure и обеспечиваете findability. Ключевой сдвиг: вы перестаёте быть «тем, кто следует шаблону», и становитесь &lt;strong&gt;тем, кто создаёт структуру под конкретную аудиторию и задачу&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Information Architecture (IA):&lt;/strong&gt; вы понимаете, что IA — это организация, маркировка и связывание контента. Питер Морвиль сформулировал: «Findability precedes usability; you can’t use what you can’t find». IA упрощает сложную информацию, организуя её логически, последовательно и лаконично, что улучшает юзабилити и доступность цифровых продуктов.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Типы иерархий:&lt;/strong&gt; вы выбираете между &lt;strong&gt;task-based&lt;/strong&gt; (по задачам пользователя), &lt;strong&gt;role-based&lt;/strong&gt; (по ролям), &lt;strong&gt;system-based&lt;/strong&gt; (по архитектуре продукта) и &lt;strong&gt;tier-based&lt;/strong&gt; (по уровням доступа) в зависимости от продукта и аудитории. Вы понимаете, что иерархия должна быть интуитивной (пользователю не нужно учиться читать документацию), контекстуальной (каждый заголовок отвечает на вопрос пользователя) и гибкой (выдерживает добавление новой информации без полной перестройки).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Progressive disclosure:&lt;/strong&gt; вы слоями раскрываете информацию: сначала — базовую, потом — детали. Это особенно важно для мобильных интерфейсов и для документации, которую читают выборочно. В DQTI (Developing Quality Technical Information) это описывается как «apply a pattern for disclosing information».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Chunking и управление когнитивной нагрузкой:&lt;/strong&gt; вы разбиваете контент на управляемые блоки, чтобы снизить когнитивную нагрузку и улучшить удержание пользователей. DQTI подчёркивает: «Break up text into manageable chunks» и «Outline or chunk tasks and topics».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Аудиторный анализ и структура:&lt;/strong&gt; вы понимаете, что структура для новичка и для эксперта отличается. Новичку нужен пошаговый туториал, эксперту — плотный reference. Вы проектируете структуру под конкретную аудиторию, используя принципы IA: user (потребности, цели, ментальные модели), content (структура, организация, маркировка) и context (среда, в которой пользователь обращается к информации).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Масштабируемость:&lt;/strong&gt; вы проектируете структуру так, чтобы она выдерживала добавление новых разделов без полной реорганизации. «Docs for Developers» подчёркивает: «Organize larger sets of documentation to help users find the right information at the right time». Вы смотрите на документацию как на «traversal» — путь пользователя от «getting started» через архитектурные концепции к решению конкретных задач.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;проектируете&lt;/strong&gt; структуру и &lt;strong&gt;объясняете&lt;/strong&gt; её. Вы отвечаете за то, чтобы документация была находима, сканируема и читаема для разных аудиторий.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-middle\"&gt;&lt;a href=\"Roadmap/base/text/middle.html#kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://document360.com/blog/information-architecture-for-technical-writing/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Architecture for Technical Writing (Document360)&lt;/a&gt; - Практический гайд по IA: определение важных тем для установления иерархии, установление границ на основе тем, аудиторий и продуктовых линеек, определение уровней контента (Primary, Secondary, Tertiary). Показывает, как организовать контент по типу, а не по аудитории;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/TECH-OPSS/Technical-Writing-Masterclass-C/blob/main/Module%205.md\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing Masterclass — Module 5: Document Organization Techniques (TECH-OPSS)&lt;/a&gt; - Продвинутый модуль по IA: task-based, role-based, system-based и tier-based иерархии, progressive disclosure, chunking, выравнивание контента под технические workflow. Включает практические задания и brain teasers для применения;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/Technical-writing-mentorship-program/Technicalwritingcourse/blob/main/docs/technical-writing-course/Information-Architecture.mdx\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Architecture for Technical Writing Guide (Technical Writing Mentorship Program)&lt;/a&gt; - Полный модуль по IA: что такое IA, почему она важна, таксономия, ключевые принципы. Объясняет три элемента IA: user, content, context, и как они влияют на структуру документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://users.dcc.uchile.cl/~nbaloian/ArquitecturaDeLaInformacion/materialDeLAWeb/TriDoc2005-DQTI.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Developing Quality Technical Information (IBM)&lt;/a&gt; - Руководство по качеству технической информации: 9 характеристик, включая &lt;strong&gt;Organization&lt;/strong&gt; и &lt;strong&gt;Retrievability&lt;/strong&gt;. Разделы о chunking, progressive disclosure и о том, как «put information where users expect it». Помогает проектировать структуру на основе модели качества, а не интуиции;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7217-6\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Глава «Structuring sets of documentation»: как организовать большие наборы документации, чтобы пользователи находили нужное в нужный момент. Показывает, как проектировать IA и создавать «clear, well-lit paths through content»;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/information-architecture-4th/9781491913529/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Architecture: For the Web and Beyond (Rosenfeld, Morville, Arango)&lt;/a&gt; - Классика IA: организация, маркировка, навигация, поиск, метаданные. Даёт фундаментальное понимание компонентов IA, которые применимы к документации в масштабе.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/base/text/middle.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Middle: «Проектирую структуру и адаптирую под аудиторию»","href":"Roadmap/base/text/middle.html#middle-proektiruyu-strukturu-i-adaptiruyu-pod-auditoriyu","level":2,"items":[{"title":"Курсы и книги (Middle)","href":"Roadmap/base/text/middle.html#kursy-i-knigi-middle","level":3}]}],"title":""},"router":{"pathname":"Roadmap/base/text/middle","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
