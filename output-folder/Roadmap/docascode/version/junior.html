        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"junior-ponimayu,-chto-dokumentaciya-dolzhna-sootvetstvovat-versii-produkta\"&gt;&lt;a href=\"Roadmap/docascode/version/junior.html#junior-ponimayu,-chto-dokumentaciya-dolzhna-sootvetstvovat-versii-produkta\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Понимаю, что документация должна соответствовать версии продукта»&lt;/span&gt;&lt;/a&gt;Junior: «Понимаю, что документация должна соответствовать версии продукта»&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне версионирование — это &lt;strong&gt;осознание того, что документация не может быть «одной на все времена»&lt;/strong&gt;. Вы учитесь работать с версиями в Git, понимать, какая версия документации соответствует текущей версии продукта, и не путать пользователей устаревшими инструкциями. Ключевой сдвиг: вы перестаёте думать о документации как о статичном тексте и начинаете видеть в ней &lt;strong&gt;артефакт, который живёт вместе с продуктом&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание семантического версионирования (SemVer):&lt;/strong&gt; вы знаете схему &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oerjikla\"&gt;major.minor.patch&lt;/code&gt;. Major — breaking changes, minor — новые фичи без breaking changes, patch — исправления. Версии документации обычно следуют за версиями продукта: если продукт обновился до v2.0, документация тоже должна быть обновлена до v2.0.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Работа с версиями в Git:&lt;/strong&gt; вы понимаете, что документация хранится в Git-репозитории, и каждая версия продукта может соответствовать ветке, тегу или папке. Вы умеете переключаться между ветками и видеть, как выглядела документация в предыдущей версии.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Понимание, когда нужна новая версия документации:&lt;/strong&gt; вы знаете, что не каждое изменение требует новой версии. Исправление опечаток или битых ссылок — не требует. Добавление новой главы или существенная переработка нескольких разделов — требует.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Работа с версиями в готовом SSG:&lt;/strong&gt; вы умеете открыть версионный селектор в готовом документационном сайте (например, на сайте Docusaurus) и переключиться на другую версию документации. Вы понимаете, что старые версии остаются доступными по своим URL.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Уведомление об устаревших версиях:&lt;/strong&gt; вы знаете, что для старых версий документации нужно добавлять предупреждение («Эта версия устарела. Перейдите к актуальной версии»).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;следуете&lt;/strong&gt; установленной стратегии версионирования. Если в проекте принято создавать новую версию документации при каждом major-релизе — вы делаете именно так.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-junior\"&gt;&lt;a href=\"Roadmap/docascode/version/junior.html#kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://docusaurus.io/docs/versioning\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docusaurus Versioning Documentation&lt;/a&gt; - Официальная документация: как создать версию, как управлять версиями, как работает versioning CLI. Простые примеры для старта;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://rmc.software/documentation/versioning-system/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Versioning System (RMC Software Documentation)&lt;/a&gt; - Пошаговое руководство по версионированию: когда создавать major, когда minor, когда не создавать версию. Decision tree для определения номера версии;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://semver.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Semantic Versioning 2.0.0&lt;/a&gt; - Официальная спецификация SemVer: правила инкрементации major, minor, patch;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://skills.github.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitHub: Version Control Basics (skills.github.com)&lt;/a&gt; - Бесплатный курс по Git: ветки, теги, переключение между версиями;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ann-kilzer/docs-as-code-setup-guide\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs-as-Code Setup Guide (GitHub)&lt;/a&gt; - Разделы о версионировании: как документация версионируется вместе с кодом.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/docascode/version/junior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Junior: «Понимаю, что документация должна соответствовать версии продукта»","href":"Roadmap/docascode/version/junior.html#junior-ponimayu,-chto-dokumentaciya-dolzhna-sootvetstvovat-versii-produkta","level":2,"items":[{"title":"Курсы и книги (Junior)","href":"Roadmap/docascode/version/junior.html#kursy-i-knigi-junior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/docascode/version/junior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
