            {"data":{"leading":false,"html":"&lt;h2 id=\"junior-pishu-rabotayushie-primery-po-shablonu\"&gt;&lt;a href=\"Roadmap/api/code/junior.html#junior-pishu-rabotayushie-primery-po-shablonu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Пишу работающие примеры по шаблону»&lt;/span&gt;&lt;/a&gt;Junior: «Пишу работающие примеры по шаблону»&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне примеры кода — это &lt;strong&gt;практический инструмент&lt;/strong&gt;, который вы добавляете в документацию по готовому шаблону. Вы учитесь писать примеры, которые &lt;strong&gt;работают&lt;/strong&gt;: их можно скопировать, запустить и получить ожидаемый результат. Ключевой сдвиг: вы перестаёте «пересказывать» API словами и начинаете &lt;strong&gt;показывать&lt;/strong&gt; его в действии.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Базовые примеры для эндпоинта:&lt;/strong&gt; вы пишете пример запроса (curl) и пример ответа (JSON) для каждого документируемого эндпоинта.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Самодостаточность:&lt;/strong&gt; каждый пример должен быть &lt;strong&gt;self-contained&lt;/strong&gt; — его можно скопировать и запустить без дополнительных пояснений. Это означает: явные заголовки авторизации, полные URL, корректный JSON.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Форматирование:&lt;/strong&gt; вы следуете правилам оформления кода: отступы, переносы строк (80 символов), указание языка для подсветки синтаксиса, использование комментариев для пропущенного кода.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Интро-предложение:&lt;/strong&gt; вы предваряете каждый пример кода вводным предложением, которое объясняет, что этот пример делает.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Проверка работоспособности:&lt;/strong&gt; вы тестируете каждый пример через Postman или curl, чтобы убедиться, что он действительно работает и возвращает ожидаемый результат.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;пишете и проверяете&lt;/strong&gt; примеры, а не копируете их из кода. Если пример не работает — вы это находите и исправляете.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-junior\"&gt;&lt;a href=\"Roadmap/api/code/junior.html#kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One — Code Samples&lt;/a&gt; - Официальный модуль по оформлению примеров кода: интро-предложения, отступы, переносы строк, комментарии к пропущенному коду;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/style/code-samples\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Developer Documentation Style Guide — Code Samples&lt;/a&gt; - Эталонные правила оформления: отступы, переносы строк, использование комментариев, запрет на ellipsis;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://api7.ai/blog/code-samples-in-api-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;API7.ai: Incorporating Code Samples in API Documentation&lt;/a&gt; - Практические рекомендации: самодостаточность примеров, явные предпосылки, тестирование примеров;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://mintlify.com/blog/api-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mintlify: API Documentation Recommendations&lt;/a&gt; - Раздел о code samples: как примеры ускоряют time-to-first-call, примеры из Stripe и Twilio;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://document360.com/blog/technical-writing-guides/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Document360: Writing Technical Guides for Developers&lt;/a&gt; - Раздел о code examples: используйте реальный работающий код, показывайте вывод, добавляйте copy buttons.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/api/code/junior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Junior: «Пишу работающие примеры по шаблону»","href":"Roadmap/api/code/junior.html#junior-pishu-rabotayushie-primery-po-shablonu","level":2,"items":[{"title":"Курсы и книги (Junior)","href":"Roadmap/api/code/junior.html#kursy-i-knigi-junior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/api/code/junior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
