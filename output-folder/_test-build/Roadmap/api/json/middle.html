        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"middle-proektiruyu-shemy-i-proveryayu-validnost\"&gt;&lt;a href=\"Roadmap/api/json/middle.html#middle-proektiruyu-shemy-i-proveryayu-validnost\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Проектирую схемы и проверяю валидность»&lt;/span&gt;&lt;/a&gt;Middle: «Проектирую схемы и проверяю валидность»&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне JSON/XML перестаёт быть просто «форматом, который я читаю». Теперь это &lt;strong&gt;предмет анализа&lt;/strong&gt;: вы работаете со схемами (JSON Schema, XSD), проверяете валидность данных, обеспечиваете консистентность документации с реальным API.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;JSON Schema:&lt;/strong&gt; вы читаете и анализируете JSON Schema: type, properties, required, enum, format, items, additionalProperties. Вы понимаете, как схема описывает контракт данных и как использовать её для валидации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;XSD (XML Schema Definition):&lt;/strong&gt; вы читаете XSD: elements, attributes, types, restrictions, complexType. Вы понимаете, как XSD описывает структуру XML-документа и как валидировать XML по схеме.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация данных:&lt;/strong&gt; вы используете JSON Schema и XSD для проверки: соответствует ли реальный ответ API описанной схеме?&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Связь с OpenAPI:&lt;/strong&gt; вы понимаете, как JSON Schema используется внутри OpenAPI 3.0 для описания requestBody и responses.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Документирование ошибок:&lt;/strong&gt; вы описываете структуру ошибок в JSON/XML: код, сообщение, детали.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Гибридный подход:&lt;/strong&gt; вы понимаете, что автогенерация из схем покрывает структуры, но не даёт контекста. Вы добавляете ручные описания поверх.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Инструменты:&lt;/strong&gt; вы работаете с инструментами валидации: JSON Schema Validator, oXygen для XML, Swagger для OpenAPI.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;анализируете и проверяете&lt;/strong&gt; структуры данных, а не просто документируете их. Вы отвечаете за точность контракта и полноту документации.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-middle\"&gt;&lt;a href=\"Roadmap/api/json/middle.html#kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://json-schema.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JSON Schema Documentation (json-schema.org)&lt;/a&gt; - Официальная документация JSON Schema: type, properties, required, enum, format, validation keywords;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.w3schools.com/xml/schema_intro.asp\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;XSD Tutorial (W3Schools)&lt;/a&gt; - Основы XSD: elements, attributes, types, restrictions, complexType;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-2764-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Pro RESTful APIs (Sanjay Patni)&lt;/a&gt; - Глава 3 «Introduction — XML, JSON»: дизайн, построение и интеграция с REST, JSON, XML;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://json-schema.org/understanding-json-schema/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Understanding JSON Schema (json-schema.org)&lt;/a&gt; - Продвинутое руководство: schema composition, conditional validation, references;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.consult-timmins.com/api-technical-writing-json-xml/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;API Technical Writing: JSON and XML (Consult-Timmins)&lt;/a&gt; - Module 2: JSON syntax, structure, nested objects; Module 4: Hands-on writing API requests/responses in JSON; Module 7: Documenting API errors.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/api/json/middle.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Middle: «Проектирую схемы и проверяю валидность»","href":"Roadmap/api/json/middle.html#middle-proektiruyu-shemy-i-proveryayu-validnost","level":2,"items":[{"title":"Курсы и книги (Middle)","href":"Roadmap/api/json/middle.html#kursy-i-knigi-middle","level":3}]}],"title":""},"router":{"pathname":"Roadmap/api/json/middle","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
