        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"senior-stroyu-sistemu-mentorstva-i-razvivayu-drugih-mentorov\"&gt;&lt;a href=\"Roadmap/metric/mentor/senior.html#senior-stroyu-sistemu-mentorstva-i-razvivayu-drugih-mentorov\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Строю систему менторства и развиваю других менторов»&lt;/span&gt;&lt;/a&gt;Senior: «Строю систему менторства и развиваю других менторов»&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне менторство становится &lt;strong&gt;элементом организационной системы&lt;/strong&gt;. Вы не просто менторите отдельных людей, вы &lt;strong&gt;проектируете программу менторства&lt;/strong&gt;, которая работает в масштабе и не зависит от героизма отдельных личностей. Ключевой сдвиг: вы переходите от «менторства как личной инициативы» к «менторству как инженерному процессу» с чёткими входами, выходами и метриками.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Формализация программы:&lt;/strong&gt; вы создаёте структурированную программу менторства: цели, роли, ожидания, таймлайн. Вы документируете процесс, как любой другой инженерный процесс.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Создание «Менторского стартового кита»:&lt;/strong&gt; вы разрабатываете шаблоны планов, чек-листы, ресурсы, которые помогают новым менторам быстро включиться в процесс.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение менторов:&lt;/strong&gt; вы не только менторите сами, но и обучаете других быть менторами. Вы проводите воркшопы, делитесь фреймворками (GROW, активное слушание), даёте обратную связь.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост команды: добавление новых менторов, менти, продуктов без потери качества.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность программы: время онбординга, удовлетворённость менти, прогресс в компетенциях, удержание.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Защита времени менторов:&lt;/strong&gt; вы создаёте условия, в которых менторство признаётся работой, а не «благотворительностью». Вы устанавливаете квоты, защищаете время, признаёте вклад.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;строите систему&lt;/strong&gt;, которая делает менторство предсказуемым, масштабируемым и устойчивым, а не зависимым от отдельных героев.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-senior\"&gt;&lt;a href=\"Roadmap/metric/mentor/senior.html#kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://habr.com/ru/articles/814301/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«Архитектура менторства: от хаоса к масштабируемой системе» (Константин Потапов)&lt;/a&gt; - Практическое руководство по построению масштабируемой программы менторства: формализация, ментор-план, база знаний, метрики;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.wiley.com/en-us/The+Mentor%27s+Guide%3A+Facilitating+Effective+Learning+Relationships%2C+3rd+Edition-p-9781119143092\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«The Mentor's Guide: Facilitating Effective Learning Relationships» (Lois J. Zachary)&lt;/a&gt; - Классическое руководство по менторству: как строить отношения, фасилитировать обучение, работать с разными типами менти;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.radicalcandor.com/the-book/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«Radical Candor» (Kim Scott)&lt;/a&gt; - О том, как давать обратную связь, которая одновременно заботлива и честна. Критически важно для обучения менторов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://dl.acm.org/doi/book/10.5555/1190163\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Development: Managing Your Documentation, Projects, Portfolio, and People (JoAnn Hackos)&lt;/a&gt; - Управление командой и развитие сотрудников в масштабе, включая менторство и планирование карьеры.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/metric/mentor/senior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Senior: «Строю систему менторства и развиваю других менторов»","href":"Roadmap/metric/mentor/senior.html#senior-stroyu-sistemu-mentorstva-i-razvivayu-drugih-mentorov","level":2,"items":[{"title":"Курсы и книги (Senior)","href":"Roadmap/metric/mentor/senior.html#kursy-i-knigi-senior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/metric/mentor/senior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
