docascode_cicd_junior_inline-code-id-6oxar9dw\"&gt;name&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_cicd_junior_inline-code-id-b6iv6mf3\"&gt;on&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_cicd_junior_inline-code-id-rj08gcsj\"&gt;jobs&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_cicd_junior_inline-code-id-zs2hvy6r\"&gt;steps&lt;/code&gt;. Вы можете прочитать существующий workflow и понять, что он делает.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Деплой:&lt;/strong&gt; вы знаете, что после merge в main документация публикуется автоматически. Вы понимаете, что такое GitHub Pages или Read the Docs как платформа для публикации.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;участвуете&lt;/strong&gt; в CI/CD-процессе, а не проектируете его. Если проверка упала — вы исправляете ошибку и делаете новый коммит.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_docascode_cicd_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_docascode_cicd_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.freecodecamp.org/news/set-up-documentation-as-code-with-docusaurus-and-github-actions/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to Set Up Documentation as Code with Docusaurus and GitHub Actions (freeCodeCamp)&lt;/a&gt; - Пошаговый гайд &lt;strong&gt;специально для технических писателей&lt;/strong&gt;: создание docs-сайта, настройка GitHub Actions для проверки грамматики через Vale перед merge. Beginner-friendly;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://techwriterstribe.com/courses/publish-your-website-with-docusaurus/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Publish your website with Docusaurus (Tech Writer's Tribe)&lt;/a&gt; - 4 сессии: Markdown, Git, Docusaurus, GitHub Actions, автоматическая публикация. &lt;strong&gt;Не требует опыта программирования&lt;/strong&gt;;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.gfu.de/schulung/docs-as-code/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Schulung Docs-as-Code: Technische Dokumentation mit Git, Markdown und CI/CD (GFU)&lt;/a&gt; - 2-дневный интенсив: CI/CD-Pipelines, Build-Prozesse, Testing (broken links, linting), Deployment;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://techwriters.ru/docs-as-code/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs as Code (techwriters.ru)&lt;/a&gt; - Подробное описание процесса docs-as-code на русском: схема workflow, CI/CD Pipeline, инструменты;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.github.com/en/actions\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitHub Actions Documentation&lt;/a&gt; - Официальная документация GitHub Actions: от первых шагов до продвинутых сценариев.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 data-original-article=\"Roadmap/docascode/cicd/middle.html\"&gt;CI/CD для документации — Middle&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_docascode_cicd_middle\" id=\"Roadmap_docascode_cicd_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;&lt;h3 id=\"Roadmap_docascode_cicd_middle_middle-nastraivayu-pajplajn-i-avtomatiziruyu-proverki\"&gt;&lt;a href=\"#Roadmap_docascode_cicd_middle_middle-nastraivayu-pajplajn-i-avtomatiziruyu-proverki\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Настраиваю пайплайн и автоматизирую проверки»&lt;/span&gt;&lt;/a&gt;Middle: «Настраиваю пайплайн и автоматизирую проверки»&lt;/h3&gt;\n&lt;p&gt;На Middle-уровне CI/CD перестаёт быть просто «процессом, в котором я участвую». Теперь это &lt;strong&gt;предмет проектирования&lt;/strong&gt;: вы настраиваете workflow с нуля, выбираете инструменты, автоматизируете проверки и обеспечиваете, чтобы документация была качественной до попадания к пользователю.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Настройка workflow с нуля:&lt;/strong&gt; вы пишете YAML-файлы GitHub Actions (или GitLab CI) для документации: build → lint → test → deploy. Вы понимаете триггеры (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_cicd_middle_inline-code-id-r5qnjdf7\"&gt;on: push&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_cicd_middle_inline-code-id-uxwrclrn\"&gt;on: pull_request&lt;/code&gt;), jobs и steps.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Выбор инструментов проверки:&lt;/strong&gt; вы настраиваете линтеры (Vale для стиля, markdownlint для форматирования), проверку ссылок (lychee, linkchecker), проверку орфографии (cspell, yaspeller). Вы понимаете, какие проверки обязательны, а какие — рекомендательны.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Проверка сборки:&lt;/strong&gt; вы настраиваете CI так, чтобы сборка сайта запускалась при каждом PR. Если сборка падает — PR не может быть смержен. Это гарантирует, что в main всегда попадает рабочая документация.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Автоматический деплой:&lt;/strong&gt; вы настраиваете пайплайн, который после merge в main собирает и публикует документацию автоматически. Вы понимаете разницу между staging и production деплоем.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Оптимизация пайплайна:&lt;/strong&gt; вы используете кэширование зависимостей, matrix builds (для нескольких версий), условные проверки (только для изменённых файлов). Это ускоряет CI и экономит ресурсы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Мониторинг:&lt;/strong&gt; вы настраиваете уведомления о падениях CI (Slack, email), отслеживаете статус сборок, анализируете причины частых падений.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;настраиваете и автоматизируете&lt;/strong&gt;. Вы отвечаете за то, чтобы CI/CD-пайплайн был надёжным, быстрым и покрывал все критические проверки.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_docascode_cicd_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_docascode_cicd_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.udemy.com/course/github-actions-the-complete-guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitHub Actions: The Complete Guide from Beginner to Expert (Udemy)&lt;/a&gt; - Комплексный курс по GitHub Actions: от базовых workflow до продвинутых сценариев. Подходит для настройки CI/CD для документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.udemy.com/course/gitlab-ci-cd-the-complete-guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitLab CI/CD: The Complete Guide (Udemy)&lt;/a&gt; - Альтернатива GitHub Actions: настройка пайплайнов в GitLab CI. Полезно, если компания использует GitLab;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ann-kilzer/docs-as-code-setup-guide\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs-as-Code Setup Guide (GitHub)&lt;/a&gt; - Comprehensive guide: CI/CD pipelines для документации, автоматизация проверок, best practices;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://vale.sh/docs/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Vale Documentation&lt;/a&gt; - Официальная документация Vale: настройка правил, интеграция с CI;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://ubuntu.com/blog/continuous-deployment-for-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Continuous deployment for documentation (Ubuntu)&lt;/a&gt; - Реальный кейс: как организован CI/CD для документации в Ubuntu: review, test suite, deploy.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_docascode_cicd_senior_senior-opredelyayu-standart-i-proektiruyu-arhitekturu\" data-original-article=\"Roadmap/docascode/cicd/senior.html\"&gt;&lt;a href=\"#Roadmap_docascode_cicd_senior_senior-opredelyayu-standart-i-proektiruyu-arhitekturu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и проектирую архитектуру»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и проектирую архитектуру»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_docascode_cicd_senior\" id=\"Roadmap_docascode_cicd_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне CI/CD становится &lt;strong&gt;элементом архитектуры документации&lt;/strong&gt;. Вы не просто настраиваете пайплайн для одного проекта, вы &lt;strong&gt;определяете стандарт для организации&lt;/strong&gt;, проектируете масштабируемую систему и управляете lifecycle CI/CD.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия CI/CD для документации:&lt;/strong&gt; вы определяете, какие проверки обязательны для всех docs-репозиториев, какие инструменты используются, как обрабатываются исключения.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за обновление CI/CD, как обрабатываются breaking changes в пайплайне, как проверяется качество сборки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых продуктов, языков, версий без переписывания workflow для каждого.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Стандартизация workflow:&lt;/strong&gt; вы создаёте reusable workflows (GitHub Actions) или templates (GitLab CI), которые используются всеми командами. Вы определяете, какие проверки обязательны, какие — опциональны.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Интеграция с другими системами:&lt;/strong&gt; вы интегрируете CI/CD документации с системами аналитики (проверка качества после деплоя), системами мониторинга (уведомления), системами управления релизами (синхронизация с версиями продукта).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность CI/CD: время сборки, частота падений, время до исправления, покрытие проверками.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды работе с CI/CD, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. CI/CD для документации становится частью инженерной культуры компании.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_docascode_cicd_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_docascode_cicd_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.pluralsight.com/courses/github-actions-advanced\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitHub Actions: Advanced Techniques (Pluralsight)&lt;/a&gt; - Продвинутые темы: reusable workflows, composite actions, matrix builds, кэширование, безопасность;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/continuous-delivery-reliable/9780321670250/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Continuous Delivery: Reliable Software Releases through Build, Test, and Deployment Automation (Jez Humble, David Farley)&lt;/a&gt; - Классика CI/CD: принципы, паттерны, антипаттерны. Применимо к документации как к части software delivery;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://itrevolution.com/product/accelerate/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Accelerate: The Science of Lean Software and DevOps (Nicole Forsgren et al.)&lt;/a&gt; - Научный подход к измерению эффективности CI/CD: DORA-метрики, которые можно адаптировать для документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации, включая CI/CD и governance.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_docascode_liter_junior_junior-chitayu-oshibki-linterov-i-ispravlyayu-ih\" data-original-article=\"Roadmap/docascode/liter/junior.html\"&gt;&lt;a href=\"#Roadmap_docascode_liter_junior_junior-chitayu-oshibki-linterov-i-ispravlyayu-ih\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Читаю ошибки линтеров и исправляю их»&lt;/span&gt;&lt;/a&gt;Junior: «Читаю ошибки линтеров и исправляю их»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_docascode_liter_junior\" id=\"Roadmap_docascode_liter_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне линтеры — это &lt;strong&gt;инструменты, которые помогают вам не ошибаться&lt;/strong&gt;. Вы учитесь читать сообщения линтеров, понимать, что они означают, и исправлять нарушения. Ключевой сдвиг: вы перестаёте воспринимать красный статус CI как наказание и начинаете видеть в нём &lt;strong&gt;обратную связь&lt;/strong&gt;, которая делает вашу документацию лучше.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание, что такое линтер:&lt;/strong&gt; вы знаете, что линтер — это программа, которая проверяет текст на соответствие правилам. Линтеры бывают для разных целей: markdownlint проверяет синтаксис Markdown (заголовки, списки, отступы, длину строк), Vale проверяет стиль и терминологию, cspell проверяет орфографию.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Чтение сообщений markdownlint:&lt;/strong&gt; вы понимаете типичные ошибки: MD013 (длина строки превышает лимит), MD022 (заголовок должен быть окружён пустыми строками), MD032 (списки должны быть окружены пустыми строками). Вы знаете, что такое &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_liter_junior_inline-code-id-7nx9itxi\"&gt;markdownlint-cli2&lt;/code&gt; и как его запустить локально.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Чтение сообщений Vale:&lt;/strong&gt; вы понимаете, что Vale проверяет прозу на соответствие стайлгайду. Типичные ошибки: использование «simply» или «just» (создаёт предположение, что задача лёгкая), пассивный залог, слишком длинные предложения. Вы знаете, как запустить Vale локально (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_liter_junior_inline-code-id-8a15uet8\"&gt;vale docs/&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Исправление ошибок:&lt;/strong&gt; вы исправляете ошибки линтеров, не отключая правила без причины. Если правило кажется вам неправильным — вы уточняете у старшего коллеги, а не добавляете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_liter_junior_inline-code-id-c8ifjrsg\"&gt;&amp;lt;!-- markdownlint-disable --&amp;gt;&lt;/code&gt; без объяснения.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Pre-commit hooks:&lt;/strong&gt; вы понимаете, что такое pre-commit hook, и знаете, что линтеры могут запускаться автоматически перед каждым коммитом.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;исправляете&lt;/strong&gt; то, что нашли линтеры, и учитесь на их сообщениях. Если ошибка повторяется — вы запоминаете правило и больше её не допускаете.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_docascode_liter_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_docascode_liter_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/DavidAnson/markdownlint\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;markdownlint Documentation (GitHub)&lt;/a&gt; - Официальная документация markdownlint: полный список правил (MD001–MD059), примеры ошибок и исправлений;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://vale.sh/docs/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Vale Documentation&lt;/a&gt; - Официальная документация Vale: установка, настройка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_liter_junior_inline-code-id-f5twgvll\"&gt;.vale.ini&lt;/code&gt;, запуск локально и в CI;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://techwriters.ru/docs-as-code/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs as Code (techwriters.ru)&lt;/a&gt; - Подробное описание процесса docs-as-code на русском: схема workflow, CI/CD Pipeline, линтеры;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.gitlab.com/development/documentation/testing/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitLab Documentation Testing&lt;/a&gt; - Реальный пример CI/CD для документации: Vale, markdownlint, link check, mermaid lint;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.freecodecamp.org/news/set-up-documentation-as-code-with-docusaurus-and-github-actions/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to Set Up Documentation as Code with Docusaurus and GitHub Actions (freeCodeCamp)&lt;/a&gt; - Пошаговый гайд: настройка GitHub Actions для проверки грамматики через Vale перед merge.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_docascode_liter_middle_middle-nastraivayu-lintery-i-avtomatiziruyu-proverki\" data-original-article=\"Roadmap/docascode/liter/middle.html\"&gt;&lt;a href=\"#Roadmap_docascode_liter_middle_middle-nastraivayu-lintery-i-avtomatiziruyu-proverki\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Настраиваю линтеры и автоматизирую проверки»&lt;/span&gt;&lt;/a&gt;Middle: «Настраиваю линтеры и автоматизирую проверки»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_docascode_liter_middle\" id=\"Roadmap_docascode_liter_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне линтеры перестают быть просто «инструментами, которые находят ошибки». Теперь это &lt;strong&gt;предмет настройки&lt;/strong&gt;: вы выбираете правила, создаёте кастомные конфигурации, интегрируете линтеры в CI/CD и обеспечиваете, чтобы команда работала по единым стандартам.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Настройка markdownlint:&lt;/strong&gt; вы создаёте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_liter_middle_inline-code-id-end0al59\"&gt;.markdownlint.yaml&lt;/code&gt; с правилами, адаптированными под проект. Вы понимаете, какие правила можно отключить: MD013 (длина строки) часто отключается для таблиц и длинных URL, MD024 (дублирующиеся заголовки) — для changelog. Вы настраиваете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_liter_middle_inline-code-id-kgo1hpnz\"&gt;markdownlint-cli2&lt;/code&gt; для проверки конкретных папок.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Настройка Vale:&lt;/strong&gt; вы создаёте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_liter_middle_inline-code-id-xsbkrvzq\"&gt;.vale.ini&lt;/code&gt; с указанием стилей. Вы подключаете готовые стили (Google, Microsoft, write-good, proselint) и создаёте кастомные правила. Пример кастомного правила: запрет на «simply», «just», «obviously», «easy» — слова, которые создают предположение о лёгкости задачи.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Настройка cspell:&lt;/strong&gt; вы создаёте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_liter_middle_inline-code-id-24er86ml\"&gt;cspell.json&lt;/code&gt; с кастомным словарём для технических терминов, названий продуктов, аббревиатур. Вы понимаете, как игнорировать определённые пути и типы файлов.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Настройка проверки ссылок:&lt;/strong&gt; вы выбираете инструмент: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_liter_middle_inline-code-id-qtamvjs5\"&gt;lychee&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_liter_middle_inline-code-id-os83e427\"&gt;linkinator&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_liter_middle_inline-code-id-845gpqvt\"&gt;markdown-link-check&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_liter_middle_inline-code-id-1m3e0x9n\"&gt;mlc&lt;/code&gt;. Вы настраиваете конфигурацию: таймауты, повторные попытки, игнорирование определённых доменов.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Интеграция в CI/CD:&lt;/strong&gt; вы настраиваете GitHub Actions (или GitLab CI) так, чтобы все проверки запускались при каждом PR: markdownlint → Vale → cspell → link check → build. Если любая проверка падает — PR не может быть смержен.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Pre-commit hooks:&lt;/strong&gt; вы настраиваете pre-commit для всей команды, чтобы линтеры запускались локально перед коммитом. Это снижает количество «красных» CI-сборок.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Управление правилами:&lt;/strong&gt; вы определяете, какие правила обязательны (error), какие — рекомендательны (warning), какие — отключены. Вы документируете это в стайлгайде.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;настраиваете и автоматизируете&lt;/strong&gt;. Вы отвечаете за то, чтобы линтеры были настроены под проект и помогали команде, а не мешали.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_docascode_liter_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_docascode_liter_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://books.google.com/books/about/Write_Better_with_Vale.html?id=nMabEQAAQBAJ\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write Better with Vale (Brian P. Hogan)&lt;/a&gt; - Единственная книга, целиком посвящённая Vale: как превратить стайлгайд в исполняемые правила, как настраивать &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_liter_middle_inline-code-id-8meuu2m5\"&gt;.vale.ini&lt;/code&gt;, как интегрировать в CI. Использует Vale 3.12.0+;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.spectrocloud.com/blog/scaling-writing-practices-with-vale-sh\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Scaling Writing Practices with Vale.sh (Spectro Cloud)&lt;/a&gt; - Реальный кейс: как команда внедрила Vale, какие правила создала, как масштабировала. Пример кастомного правила против «simply»;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/elastic/vale-rules\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Elastic vale-rules (GitHub)&lt;/a&gt; - Готовый набор правил Vale от Elastic: примеры кастомных правил, настройка per-repo overrides, интеграция с GitHub Actions;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/DavidAnson/markdownlint/blob/main/doc/Configuration.md\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;markdownlint Configuration (GitHub)&lt;/a&gt; - Примеры &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_liter_middle_inline-code-id-1jxil3n6\"&gt;.markdownlint.yaml&lt;/code&gt; для документационных проектов: адаптация правил под реальные задачи;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ann-kilzer/documentation-lifecycle-guide\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Documentation Lifecycle Management Guide (GitHub)&lt;/a&gt; - Полный workflow: Write → Lint → Review → Publish → Audit. Включает pre-commit hooks и CI-интеграцию.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_docascode_liter_senior_senior-opredelyayu-standart-i-upravlyayu-sistemoj-validacii\" data-original-article=\"Roadmap/docascode/liter/senior.html\"&gt;&lt;a href=\"#Roadmap_docascode_liter_senior_senior-opredelyayu-standart-i-upravlyayu-sistemoj-validacii\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и управляю системой валидации»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и управляю системой валидации»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_docascode_liter_senior\" id=\"Roadmap_docascode_liter_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне линтеры и валидация становятся &lt;strong&gt;элементом архитектуры качества документации&lt;/strong&gt;. Вы не просто настраиваете инструменты для одного проекта, вы &lt;strong&gt;определяете стандарт для организации&lt;/strong&gt;: какие проверки обязательны, какие инструменты используются, как обрабатываются исключения, как измеряется эффективность.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия валидации:&lt;/strong&gt; вы определяете, какие проверки обязательны для всех docs-репозиториев: markdownlint, Vale, cspell, link check, build, проверка примеров кода. Вы понимаете, что валидация — это не только линтеры, но и тестирование примеров кода, проверка инструкций в контейнерах, проверка ссылок в сгенерированном HTML.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за обновление правил, как обрабатываются исключения (когда можно отключить правило), как проверяется, что правила не устарели.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Стандартизация конфигураций:&lt;/strong&gt; вы создаёте reusable workflows (GitHub Actions) или templates (GitLab CI), которые используются всеми командами. Вы определяете, какие правила обязательны (error), какие — рекомендательны (warning).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых продуктов, языков, версий без переписывания конфигураций для каждого.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Интеграция с другими системами:&lt;/strong&gt; вы интегрируете валидацию с системами аналитики (проверка качества после деплоя), системами мониторинга (уведомления о падениях), системами управления релизами (синхронизация с версиями продукта).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность валидации: время сборки, частота падений, время до исправления, покрытие проверками.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды работе с линтерами, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Валидация становится частью инженерной культуры компании.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_docascode_liter_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_docascode_liter_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://books.google.com/books/about/Write_Better_with_Vale.html?id=nMabEQAAQBAJ\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write Better with Vale (Brian P. Hogan, продвинутые главы)&lt;/a&gt; - Главы о масштабировании Vale в организации, создании кастомных стилей, интеграции с CI/CD;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/uw-ssec/rse-plugins\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Documentation Validation SKILL (GitHub)&lt;/a&gt; - Комплексный гайд по валидации документации: Vale, link checking, markdownlint, тестирование примеров кода, CI-интеграция. Decision tree для выбора инструментов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/continuous-delivery-reliable/9780321670250/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Continuous Delivery (Jez Humble, David Farley)&lt;/a&gt; - Классика CI/CD: принципы, паттерны, антипаттерны. Применимо к валидации документации как части software delivery;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://itrevolution.com/product/accelerate/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Accelerate (Nicole Forsgren et al.)&lt;/a&gt; - Научный подход к измерению эффективности CI/CD: DORA-метрики, которые можно адаптировать для валидации документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.gitlab.com/development/documentation/testing/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitLab Documentation Testing&lt;/a&gt; - Реальный пример валидации в масштабе: Vale, markdownlint, link check, mermaid lint, rubocop-docs, eslint-docs.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_docascode_version_junior_junior-ponimayu,-chto-dokumentaciya-dolzhna-sootvetstvovat-versii-produkta\" data-original-article=\"Roadmap/docascode/version/junior.html\"&gt;&lt;a href=\"#Roadmap_docascode_version_junior_junior-ponimayu,-chto-dokumentaciya-dolzhna-sootvetstvovat-versii-produkta\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Понимаю, что документация должна соответствовать версии продукта»&lt;/span&gt;&lt;/a&gt;Junior: «Понимаю, что документация должна соответствовать версии продукта»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_docascode_version_junior\" id=\"Roadmap_docascode_version_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне версионирование — это &lt;strong&gt;осознание того, что документация не может быть «одной на все времена»&lt;/strong&gt;. Вы учитесь работать с версиями в Git, понимать, какая версия документации соответствует текущей версии продукта, и не путать пользователей устаревшими инструкциями. Ключевой сдвиг: вы перестаёте думать о документации как о статичном тексте и начинаете видеть в ней &lt;strong&gt;артефакт, который живёт вместе с продуктом&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание семантического версионирования (SemVer):&lt;/strong&gt; вы знаете схему &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_version_junior_inline-code-id-wlw86iw6\"&gt;major.minor.patch&lt;/code&gt;. Major — breaking changes, minor — новые фичи без breaking changes, patch — исправления. Версии документации обычно следуют за версиями продукта: если продукт обновился до v2.0, документация тоже должна быть обновлена до v2.0.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Работа с версиями в Git:&lt;/strong&gt; вы понимаете, что документация хранится в Git-репозитории, и каждая версия продукта может соответствовать ветке, тегу или папке. Вы умеете переключаться между ветками и видеть, как выглядела документация в предыдущей версии.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Понимание, когда нужна новая версия документации:&lt;/strong&gt; вы знаете, что не каждое изменение требует новой версии. Исправление опечаток или битых ссылок — не требует. Добавление новой главы или существенная переработка нескольких разделов — требует.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Работа с версиями в готовом SSG:&lt;/strong&gt; вы умеете открыть версионный селектор в готовом документационном сайте (например, на сайте Docusaurus) и переключиться на другую версию документации. Вы понимаете, что старые версии остаются доступными по своим URL.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Уведомление об устаревших версиях:&lt;/strong&gt; вы знаете, что для старых версий документации нужно добавлять предупреждение («Эта версия устарела. Перейдите к актуальной версии»).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;следуете&lt;/strong&gt; установленной стратегии версионирования. Если в проекте принято создавать новую версию документации при каждом major-релизе — вы делаете именно так.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_docascode_version_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_docascode_version_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://docusaurus.io/docs/versioning\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docusaurus Versioning Documentation&lt;/a&gt; - Официальная документация: как создать версию, как управлять версиями, как работает versioning CLI. Простые примеры для старта;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://rmc.software/documentation/versioning-system/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Versioning System (RMC Software Documentation)&lt;/a&gt; - Пошаговое руководство по версионированию: когда создавать major, когда minor, когда не создавать версию. Decision tree для определения номера версии;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://semver.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Semantic Versioning 2.0.0&lt;/a&gt; - Официальная спецификация SemVer: правила инкрементации major, minor, patch;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://skills.github.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitHub: Version Control Basics (skills.github.com)&lt;/a&gt; - Бесплатный курс по Git: ветки, теги, переключение между версиями;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ann-kilzer/docs-as-code-setup-guide\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs-as-Code Setup Guide (GitHub)&lt;/a&gt; - Разделы о версионировании: как документация версионируется вместе с кодом.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_docascode_version_middle_middle-nastraivayu-versionirovanie-i-upravlyayu-neskolkimi-versiyami\" data-original-article=\"Roadmap/docascode/version/middle.html\"&gt;&lt;a href=\"#Roadmap_docascode_version_middle_middle-nastraivayu-versionirovanie-i-upravlyayu-neskolkimi-versiyami\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Настраиваю версионирование и управляю несколькими версиями»&lt;/span&gt;&lt;/a&gt;Middle: «Настраиваю версионирование и управляю несколькими версиями»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_docascode_version_middle\" id=\"Roadmap_docascode_version_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне версионирование перестаёт быть просто «пониманием, что версии нужны». Теперь это &lt;strong&gt;предмет настройки&lt;/strong&gt;: вы выбираете стратегию, настраиваете инструменты, управляете несколькими версиями и обеспечиваете, чтобы пользователи всегда могли найти документацию для своей версии продукта.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Настройка версионирования в SSG:&lt;/strong&gt; вы умеете настроить версионирование для MkDocs (через плагин mike), Docusaurus (встроенное) или Antora. Вы понимаете, какие инструменты требуют ручного создания версий, а какие — автоматического.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия версионирования:&lt;/strong&gt; вы определяете, какую схему использовать: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_version_middle_inline-code-id-s7la449b\"&gt;major.minor&lt;/code&gt; (как в RMC Software Documentation) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_version_middle_inline-code-id-8elbt5f2\"&gt;major.minor.patch&lt;/code&gt;. Вы понимаете, что для документации часто достаточно &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_version_middle_inline-code-id-tglv8w5s\"&gt;major.minor&lt;/code&gt;, а patch-изменения не требуют новой версии документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Управление алиасами:&lt;/strong&gt; вы настраиваете алиасы для версий: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_version_middle_inline-code-id-62gnas9c\"&gt;latest&lt;/code&gt; (последняя стабильная версия), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_version_middle_inline-code-id-9psup5j4\"&gt;dev&lt;/code&gt; (версия в разработке), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_version_middle_inline-code-id-jxm4p54z\"&gt;stable&lt;/code&gt; (LTS-версия). Вы понимаете, как алиасы влияют на URL и навигацию.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Версионный селектор:&lt;/strong&gt; вы настраиваете выпадающий список версий в шапке сайта. Вы понимаете, как работает маршрутизация: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_version_middle_inline-code-id-jdqc1nop\"&gt;example.com/1.7/&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_version_middle_inline-code-id-pmznemgi\"&gt;example.com/latest/&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Уведомления об устаревших версиях:&lt;/strong&gt; вы настраиваете баннеры для старых версий с ссылкой на актуальную версию.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Автоматизация деплоя версий:&lt;/strong&gt; вы настраиваете CI/CD так, чтобы при создании нового тега или релиза продукта автоматически создавалась и деплоилась новая версия документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Политика поддержки версий:&lt;/strong&gt; вы определяете, сколько версий поддерживать (например, N-2: текущая и две предыдущие). Вы понимаете, когда архивировать старые версии.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;настраиваете и управляете&lt;/strong&gt;. Вы отвечаете за то, чтобы версионирование работало надёжно и не создавало путаницы для пользователей.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_docascode_version_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_docascode_version_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://squidfunk.github.io/mkdocs-material/setup/setting-up-versioning/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Setting up versioning with mike (Material for MkDocs)&lt;/a&gt; - Официальное руководство: установка mike, настройка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_version_middle_inline-code-id-u8ti4lqu\"&gt;mkdocs.yml&lt;/code&gt;, деплой версий, работа с алиасами;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docusaurus.io/docs/versioning#tagging-a-new-version\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docusaurus: Tagging a new version&lt;/a&gt; - Пошаговое руководство: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_version_middle_inline-code-id-j0ivd8md\"&gt;npm run docusaurus docs:version 1.0.0&lt;/code&gt;, работа с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_version_middle_inline-code-id-rbi47bu3\"&gt;versions.json&lt;/code&gt;;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/antora/antora/blob/main/docs/modules/ROOT/pages/versioning-content.adoc\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Antora: How to Version Documentation (GitHub)&lt;/a&gt; - Создание версионных веток, настройка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_version_middle_inline-code-id-11ins566\"&gt;antora.yml&lt;/code&gt;, добавление в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_version_middle_inline-code-id-v25iinyv\"&gt;antora-playbook.yml&lt;/code&gt;;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://rmc.software/documentation/versioning-system/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;RMC Software Documentation: Versioning System&lt;/a&gt; - Детальное руководство по стратегии версионирования: когда создавать major, когда minor, decision tree, примеры;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://theneo.io/blog/docs-as-code-with-markdown\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs-as-Code with Markdown (theneo.io)&lt;/a&gt; - Best practices: версионирование Markdown, синхронизация с Git.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_docascode_version_senior_senior-opredelyayu-standart-i-upravlyayu-lifecycle-versij\" data-original-article=\"Roadmap/docascode/version/senior.html\"&gt;&lt;a href=\"#Roadmap_docascode_version_senior_senior-opredelyayu-standart-i-upravlyayu-lifecycle-versij\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и управляю lifecycle версий»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и управляю lifecycle версий»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_docascode_version_senior\" id=\"Roadmap_docascode_version_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне версионирование становится &lt;strong&gt;элементом архитектуры документации&lt;/strong&gt;. Вы не просто настраиваете версии для одного проекта, вы &lt;strong&gt;определяете стандарт для организации&lt;/strong&gt;, управляете lifecycle версий и обеспечиваете, чтобы документация для всех продуктов версионировалась консистентно.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия версионирования для организации:&lt;/strong&gt; вы определяете, какие продукты версионируются, по какой схеме, как долго поддерживаются старые версии. Вы понимаете, что версионирование — это не только техническая, но и &lt;strong&gt;продуктовая&lt;/strong&gt; задача: сколько версий поддерживать, как коммуницировать end-of-life.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за создание новой версии документации, как проверяется соответствие документации и продукта, как обрабатываются breaking changes в документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых продуктов, языков, версий без переписывания конфигураций для каждого.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Кросс-продуктовое версионирование:&lt;/strong&gt; вы обеспечиваете, чтобы версии документации для разных продуктов были согласованы. Например, если продукт A и продукт B используются вместе, их документация должна версионироваться синхронно.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Интеграция с релизным циклом:&lt;/strong&gt; вы интегрируете версионирование документации с процессом релизов продукта: при создании релиза автоматически создаётся версия документации, при обновлении продукта — обновляется документация.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность версионирования: сколько пользователей остаются на старых версиях, как часто они переключаются, снижается ли количество обращений в поддержку.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды работе с версиями, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Версионирование документации становится частью продуктовой стратегии.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_docascode_version_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_docascode_version_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://dl.acm.org/doi/10.1145/3641237.3691677\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Implementing Structured Authoring Practices in a Docs-as-Code Framework (ACM)&lt;/a&gt; - Реальный кейс: version control, structured authoring, SSG, deployment options, content maintenance strategies;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docusaurus.io/community/release-process\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docusaurus Release Process&lt;/a&gt; - Пример управления версиями в крупном open-source проекте: SemVer, major/minor/patch, политика поддержки старых версий;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.antora.org/antora/latest/playbook/configure-content-sources/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Antora: Version Facets (docs.antora.org)&lt;/a&gt; - Продвинутое версионирование: actual version, prerelease, display, symbolic. Управление версиями в масштабе;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации, включая версионирование и governance.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_docascode_search_junior_junior-ponimayu,-chto-dokumentaciya-dolzhna-byt-nahodimoj\" data-original-article=\"Roadmap/docascode/search/junior.html\"&gt;&lt;a href=\"#Roadmap_docascode_search_junior_junior-ponimayu,-chto-dokumentaciya-dolzhna-byt-nahodimoj\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Понимаю, что документация должна быть находимой»&lt;/span&gt;&lt;/a&gt;Junior: «Понимаю, что документация должна быть находимой»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_docascode_search_junior\" id=\"Roadmap_docascode_search_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне поиск и метаданные — это &lt;strong&gt;осознание того, что документация существует не в вакууме&lt;/strong&gt;. Вы учитесь писать заголовки, которые отражают суть страницы, заполнять front matter (title, description) и понимать, как пользователи ищут информацию. Ключевой сдвиг: вы перестаёте думать «я написал текст» и начинаете думать «пользователь найдёт этот текст».&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание важности findability:&lt;/strong&gt; «Findability precedes usability; you can’t use what you can’t find». Документация, которую не находят, бесполезна.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Заголовки и структура:&lt;/strong&gt; вы пишете заголовки, которые чётко отражают содержимое страницы. Используйте формулировки, которые вводит пользователь, а не внутренние названия фич. Заголовок H1 должен быть конкретным и описательным.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Front matter:&lt;/strong&gt; вы понимаете, что такое front matter (YAML-блок в начале Markdown-файла) и умеете заполнять базовые поля: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_search_junior_inline-code-id-glft2m3f\"&gt;title&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_search_junior_inline-code-id-u72dr1ln\"&gt;description&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_search_junior_inline-code-id-mbeot9c2\"&gt;tags&lt;/code&gt;. Mintlify автоматически генерирует мета-теги из frontmatter title и description.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Мета-теги для SEO:&lt;/strong&gt; вы понимаете, что meta title (50–60 символов) и meta description (150–160 символов) влияют на то, как страница отображается в поисковой выдаче. Они должны быть конкретными, а не шаблонными.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Внутренние ссылки:&lt;/strong&gt; вы добавляете internal links между связанными страницами. Это помогает и пользователям, и поисковым краулерам.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Понимание, как работает поиск в SSG:&lt;/strong&gt; вы знаете, что в MkDocs есть встроенный search plugin (работает на lunr), а в Docusaurus — интеграция с Algolia DocSearch.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;следуете&lt;/strong&gt; правилам оформления заголовков и метаданных. Если в проекте принято заполнять &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_search_junior_inline-code-id-8g30iu7f\"&gt;description&lt;/code&gt; для каждой страницы — вы делаете именно так.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_docascode_search_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_docascode_search_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.gitbook.com/blog/seo-techniques-for-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to use SEO techniques to improve your documentation (GitBook)&lt;/a&gt; - Практическое руководство: keywords, headings, metadata, internal links. Quick takeaways для старта;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.telerik.com/devtools/wpf/styling-and-appearance/style-guide/seo-metadata\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SEO metadata (Progress Telerik Style Guide)&lt;/a&gt; - Пример реализации meta block: title, description, tags. Правила заполнения;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.ansible.com/ansible/latest/community/documentation_contribs.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Writing documentation so search can find it (Ansible)&lt;/a&gt; - Практические советы: clear headings, numbered lists, первые предложения описывают тему страницы;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.mkdocs.org/user-guide/configuration/#search\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MkDocs Search Plugin&lt;/a&gt; - Официальная документация: как работает встроенный поиск, как настроить язык;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docusaurus.io/docs/search\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docusaurus Search&lt;/a&gt; - Официальная документация: как подключить Algolia DocSearch, какие поля заполнять.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_docascode_search_middle_middle-nastraivayu-poisk-i-upravlyayu-metadannymi\" data-original-article=\"Roadmap/docascode/search/middle.html\"&gt;&lt;a href=\"#Roadmap_docascode_search_middle_middle-nastraivayu-poisk-i-upravlyayu-metadannymi\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Настраиваю поиск и управляю метаданными»&lt;/span&gt;&lt;/a&gt;Middle: «Настраиваю поиск и управляю метаданными»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_docascode_search_middle\" id=\"Roadmap_docascode_search_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне поиск и метаданные перестают быть просто «оформлением». Теперь это &lt;strong&gt;предмет настройки&lt;/strong&gt;: вы выбираете поисковый движок, настраиваете метаданные для команды, управляете таксономией и обеспечиваете, чтобы документация была находимой.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Настройка поиска:&lt;/strong&gt; вы настраиваете поисковый движок для документационного сайта. Варианты: встроенный search plugin в MkDocs (client-side, lunr), Algolia DocSearch (hosted, для open-source бесплатно), Redocly Realm. Вы понимаете компромиссы: client-side проще, hosted — мощнее.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Настройка Algolia DocSearch:&lt;/strong&gt; вы подаёте заявку на DocSearch (бесплатно для open-source), настраиваете crawler, добавляете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_search_middle_inline-code-id-otfatnny\"&gt;algolia&lt;/code&gt; field в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_search_middle_inline-code-id-gr1h3xrz\"&gt;docusaurus.config.js&lt;/code&gt;. Вы понимаете, как работает индексация.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Управление метаданными:&lt;/strong&gt; вы создаёте стандарт заполнения front matter для команды: какие поля обязательны (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_search_middle_inline-code-id-wt8i2lsp\"&gt;title&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_search_middle_inline-code-id-3gj45uzj\"&gt;description&lt;/code&gt;), какие опциональны (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_search_middle_inline-code-id-1129n7n7\"&gt;tags&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_search_middle_inline-code-id-il7z3syz\"&gt;owner&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_search_middle_inline-code-id-5gtgrg14\"&gt;version&lt;/code&gt;). Вы используете metadata для маршрутизации контента, фильтрации и поиска.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Таксономия:&lt;/strong&gt; вы создаёте таксономию — систему категорий и тегов для классификации контента. Вы понимаете, что такое metadata, taxonomy и classification. Вы используете теги для группировки связанного контента.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Настройка индексации:&lt;/strong&gt; вы настраиваете, какие страницы индексируются, какие исключаются (например, draft, internal pages). Вы понимаете, как работает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_search_middle_inline-code-id-1ssbrr8q\"&gt;sitemap.xml&lt;/code&gt; и robots.txt.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Поисковая аналитика:&lt;/strong&gt; вы анализируете поисковые запросы пользователей: что ищут, что находят, что не находят. Вы используете эти данные для улучшения документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Внутренняя поисковая оптимизация:&lt;/strong&gt; вы настраиваете вес страниц в поиске (page ranking factor в Mintlify: значения &amp;gt;1 приоритезируют, 0–1 де-приоритезируют).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;настраиваете и управляете&lt;/strong&gt;. Вы отвечаете за то, чтобы пользователи находили нужное, а метаданные помогали в управлении контентом.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_docascode_search_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_docascode_search_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.udemy.com/course/ux-and-information-architecture-basics-for-technical-writers/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;UX and Information Architecture Basics for Technical Writers (Udemy)&lt;/a&gt; - Learn 3 taxonomy development and 2 card sorting techniques. Understand what is metadata, taxonomy and classification;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.gitbook.com/blog/seo-techniques-for-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SEO techniques for documentation (GitBook, полная версия)&lt;/a&gt; - Keyword research, headings, metadata, internal links, indexing, accessibility;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://redocly.com/docs/realm/search/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Tune search and SEO (Redocly)&lt;/a&gt; - Choose a search engine, add facets, exclude content from index. Set metadata, sitemaps;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docsearch.algolia.com/docs/what-is-docsearch\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Algolia DocSearch Documentation&lt;/a&gt; - Официальная документация: getting started, configuration, crawler setup;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://squidfunk.github.io/mkdocs-material/setup/setting-up-site-search/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MkDocs Search Plugin (продвинутые разделы)&lt;/a&gt; - Настройка языков, конфигурация, интеграция с Material for MkDocs.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_docascode_search_senior_senior-opredelyayu-standart-i-proektiruyu-arhitekturu-poiska\" data-original-article=\"Roadmap/docascode/search/senior.html\"&gt;&lt;a href=\"#Roadmap_docascode_search_senior_senior-opredelyayu-standart-i-proektiruyu-arhitekturu-poiska\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и проектирую архитектуру поиска»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и проектирую архитектуру поиска»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_docascode_search_senior\" id=\"Roadmap_docascode_search_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне поиск и метаданные становятся &lt;strong&gt;элементом архитектуры документации&lt;/strong&gt;. Вы не просто настраиваете поиск для одного проекта, вы &lt;strong&gt;определяете стандарт для организации&lt;/strong&gt;: как классифицируется контент, как работает кросс-продуктовый поиск, как измеряется эффективность findability.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия findability:&lt;/strong&gt; вы определяете, как пользователи находят информацию в вашей документации: через поиск, навигацию, внешние поисковики, AI-ассистенты. Вы проектируете систему, которая покрывает все каналы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за метаданные, как проверяется их качество, как обрабатываются изменения в таксономии.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых продуктов, языков, версий без перестройки таксономии.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Кросс-продуктовый поиск:&lt;/strong&gt; вы обеспечиваете, чтобы поиск работал across products: пользователь ищет «аутентификация» и находит результаты из всех релевантных продуктов.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Таксономия и онтология:&lt;/strong&gt; вы создаёте не просто список тегов, а &lt;strong&gt;семантическую модель&lt;/strong&gt; предметной области. Вы понимаете разницу между taxonomy (классификация) и ontology (модель концепций и их связей).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метаданные для AI:&lt;/strong&gt; вы настраиваете метаданные так, чтобы AI-ассистенты (ChatGPT, Perplexity, Copilot) могли находить и цитировать вашу документацию. Это включает GEO (Generative Engine Optimization).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность findability: search queries, click-through, time-to-find, support tickets, AI citations.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды работе с метаданными, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Findability становится частью продуктовой стратегии.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_docascode_search_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_docascode_search_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.tuni.fi/en/study-with-us/techs6-structured-documentation-and-dita\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TECHS6 Structured Documentation and DITA (Tampere University)&lt;/a&gt; - Importance of metadata in technical documentation, factors affecting information reuse, XML and DITA principles, modular writing, single sourcing;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.tekom.de/veranstaltungen/content-management-seminar\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Content-Management Seminar (tekom.de)&lt;/a&gt; - Content-Management-Methoden, Modularisierung, Metadaten und (PI-)Klassifikation, XML und Informationsmodelle;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.h-ka.de/en/technical-communication\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Management in Technical Communication (HKA)&lt;/a&gt; - Conception and application of metadata for intelligent content scenarios, classification concepts;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://foglift.io/blog/ai-search-optimization-technical-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;AI Search Optimization for Technical Documentation (Foglift)&lt;/a&gt; - GEO: optimizing docs for AI search engines (ChatGPT, Gemini, Perplexity). Real values, not placeholders;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_docascode_auto_junior_junior-ponimayu-princip-i-zapuskayu-gotovuyu-generaciyu\" data-original-article=\"Roadmap/docascode/auto/junior.html\"&gt;&lt;a href=\"#Roadmap_docascode_auto_junior_junior-ponimayu-princip-i-zapuskayu-gotovuyu-generaciyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Понимаю принцип и запускаю готовую генерацию»&lt;/span&gt;&lt;/a&gt;Junior: «Понимаю принцип и запускаю готовую генерацию»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_docascode_auto_junior\" id=\"Roadmap_docascode_auto_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне автоматизация генерации — это &lt;strong&gt;осознание того, что документацию можно создавать не только вручную&lt;/strong&gt;. Вы учитесь запускать готовые генераторы, понимать, откуда берётся контент, и проверять, что сгенерированная документация соответствует реальности. Ключевой сдвиг: вы перестаёте воспринимать документацию как «текст, который я пишу» и начинаете видеть в ней &lt;strong&gt;результат работы инструмента&lt;/strong&gt;, который можно настроить.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание источников генерации:&lt;/strong&gt; документация может генерироваться из разных источников: OpenAPI-спецификации (Swagger Codegen, Redocly), комментариев в коде (Javadoc, DocFX, Sphinx), AST-анализа кода (know-cli, code2docs). Вы знаете, что каждый источник даёт разный результат.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Запуск готового генератора:&lt;/strong&gt; вы умеете запустить генератор документации из OpenAPI-файла: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_auto_junior_inline-code-id-0ovi8bi6\"&gt;swagger-codegen generate&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_auto_junior_inline-code-id-0duhee5k\"&gt;redocly build-docs&lt;/code&gt;. Вы видите результат и понимаете, как спецификация превращается в HTML или Markdown.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Генерация reference из кода:&lt;/strong&gt; вы понимаете, как работает генерация API reference из комментариев в коде (docstrings, Javadoc). Вы можете запустить &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_auto_junior_inline-code-id-mwq479pd\"&gt;sphinx-apidoc&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_auto_junior_inline-code-id-ft5m50bz\"&gt;docfx&lt;/code&gt; и увидеть, как комментарии становятся документацией.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Проверка результата:&lt;/strong&gt; вы проверяете, что сгенерированная документация соответствует реальному API: правильные эндпоинты, параметры, примеры. Если что-то не совпадает — вы сообщаете об этом.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Понимание ограничений:&lt;/strong&gt; вы знаете, что автогенерация покрывает reference, но не даёт контекста, объяснений и примеров использования. Вы понимаете, что ручная работа всё ещё нужна — но в другом месте.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;запускаете и проверяете&lt;/strong&gt; готовую генерацию. Вы не настраиваете пайплайн, а учитесь работать с результатом.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_docascode_auto_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_docascode_auto_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://learn.microsoft.com/en-us/training/modules/automate-documentation/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Внедрение автоматизации документации истории Git (Microsoft Learn)&lt;/a&gt; - Официальный модуль: автоматизация документации API из кода через OpenAPI, Swagger Codegen, Redocly. Встраивание в CI/CD;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://dotnet.github.io/docfx/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;DocFX Documentation&lt;/a&gt; - Официальная документация DocFX: генерация reference из комментариев в коде для .NET, Java, JavaScript;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.sphinx-doc.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Sphinx Documentation&lt;/a&gt; - Официальная документация Sphinx: генерация reference из docstrings для Python;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://swagger.io/tools/swagger-codegen/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Swagger Codegen Documentation&lt;/a&gt; - Официальная документация Swagger Codegen: генерация документации из OpenAPI;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://redocly.com/docs/cli/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Redocly CLI Documentation&lt;/a&gt; - Официальная документация Redocly CLI: генерация документации из OpenAPI.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_docascode_auto_middle_middle-nastraivayu-generaciyu-i-integriruyu-v-ci/cd\" data-original-article=\"Roadmap/docascode/auto/middle.html\"&gt;&lt;a href=\"#Roadmap_docascode_auto_middle_middle-nastraivayu-generaciyu-i-integriruyu-v-ci/cd\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Настраиваю генерацию и интегрирую в CI/CD»&lt;/span&gt;&lt;/a&gt;Middle: «Настраиваю генерацию и интегрирую в CI/CD»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_docascode_auto_middle\" id=\"Roadmap_docascode_auto_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне автоматизация генерации перестаёт быть просто «запуском инструмента». Теперь это &lt;strong&gt;предмет настройки и интеграции&lt;/strong&gt;: вы создаёте пайплайн, который автоматически генерирует документацию при каждом изменении кода, проверяет её качество и публикует.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Настройка генерации из OpenAPI:&lt;/strong&gt; вы настраиваете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_auto_middle_inline-code-id-2w9t5utq\"&gt;redocly.yaml&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_auto_middle_inline-code-id-awttfucv\"&gt;swagger-config.yaml&lt;/code&gt; для тонкой настройки генерации: какие эндпоинты включать, как группировать, какие примеры показывать. Вы используете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_auto_middle_inline-code-id-jmw1j98b\"&gt;x-codeSamples&lt;/code&gt; для добавления примеров на разных языках.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Генерация из комментариев в коде:&lt;/strong&gt; вы настраиваете Sphinx (Python), DocFX (.NET/Java), JSDoc (JavaScript) или Doxygen (C++). Вы понимаете, как писать docstrings, которые хорошо генерируются: параметры, возвращаемые значения, примеры.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;AST-анализ и AI-генерация:&lt;/strong&gt; вы работаете с инструментами, которые используют AST-анализ для понимания структуры кода: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_auto_middle_inline-code-id-b4rnfbyd\"&gt;know-cli&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_auto_middle_inline-code-id-wtn736zk\"&gt;code2docs&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_auto_middle_inline-code-id-fok7upoj\"&gt;codeledger&lt;/code&gt;. Вы понимаете, как AI генерирует документацию из кода и как это проверять.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Интеграция в CI/CD:&lt;/strong&gt; вы настраиваете GitHub Actions (или GitLab CI) так, чтобы генерация документации запускалась при каждом изменении кода: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_auto_middle_inline-code-id-b9viwaq6\"&gt;on: push&lt;/code&gt; → генерация → валидация → деплой. Вы используете CI-гейты: если сгенерированная документация не проходит валидацию, PR не может быть смержен.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Синхронизация с кодом:&lt;/strong&gt; вы настраиваете пайплайн так, чтобы документация всегда соответствовала актуальной версии кода. Вы используете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_auto_middle_inline-code-id-0oaccjiz\"&gt;codeledger generate&lt;/code&gt; для создания снимков документации и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_auto_middle_inline-code-id-c5ywblcx\"&gt;codeledger merge&lt;/code&gt; для объединения их в финальный документ.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация сгенерированной документации:&lt;/strong&gt; вы проверяете, что сгенерированная документация корректна: все ссылки работают, примеры запускаются, схемы валидны. Вы настраиваете автоматическую проверку в CI.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;настраиваете и интегрируете&lt;/strong&gt;. Вы отвечаете за то, чтобы генерация работала надёжно и документация всегда была актуальной.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_docascode_auto_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_docascode_auto_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.gfu.de/schulung/docs-as-code/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Schulung Docs-as-Code: Technische Dokumentation mit Git, Markdown und CI/CD (GFU)&lt;/a&gt; - 2-дневный интенсив: автоматизированные publishing-пайплайны, Static Site Generators, CI/CD, генерация документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.cloudthat.com/resources/blog/automated-documentation-sites-with-backstage-techdocs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Automated Documentation Sites with Backstage TechDocs (CloudThat)&lt;/a&gt; - Реальный кейс: настройка автоматической генерации сайта документации из Markdown в CI/CD. Prepare → Generate → Publish;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://pypi.org/project/code2docs/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;code2docs Documentation&lt;/a&gt; - Инструмент для автоматической генерации и синхронизации документации из исходного кода. Поддерживает MkDocs, watch mode, sync markers;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://pypi.org/project/codeledger/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;codeledger Documentation&lt;/a&gt; - AI-ассистированная генерация документации: scan → parse → classify → generate → merge. Поддерживает Ollama (бесплатно);&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/docs-like-code/9781492049364/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs Like Code (Anne Gentle)&lt;/a&gt; - Классика docs-as-code: collaboration, automation, test automation, continuous integration. Как выстроить систему генерации.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_docascode_auto_senior_senior-opredelyayu-standart-i-upravlyayu-sistemoj-generacii\" data-original-article=\"Roadmap/docascode/auto/senior.html\"&gt;&lt;a href=\"#Roadmap_docascode_auto_senior_senior-opredelyayu-standart-i-upravlyayu-sistemoj-generacii\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и управляю системой генерации»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и управляю системой генерации»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_docascode_auto_senior\" id=\"Roadmap_docascode_auto_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне автоматизация генерации становится &lt;strong&gt;элементом архитектуры документации&lt;/strong&gt;. Вы не просто настраиваете генерацию для одного проекта, вы &lt;strong&gt;определяете стандарт для организации&lt;/strong&gt;: какие источники истины используются, как обрабатываются исключения, как измеряется качество сгенерированной документации.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия источников истины:&lt;/strong&gt; вы определяете, что является единым источником истины для каждого типа документации: OpenAPI для API reference, docstrings для SDK reference, код для архитектурных диаграмм. Вы понимаете, как связать разные источники.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за актуальность спецификаций, как обрабатываются breaking changes, как проверяется, что сгенерированная документация соответствует реальности.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых API, языков, версий без переписывания конфигураций для каждого.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Кросс-продуктовая генерация:&lt;/strong&gt; вы обеспечиваете, чтобы генерация работала across products: единый пайплайн для всех API, единый стиль сгенерированной документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики качества:&lt;/strong&gt; вы измеряете эффективность генерации: покрытие API документацией (какой процент эндпоинтов задокументирован), свежесть документации (насколько она отстаёт от кода), количество ошибок в сгенерированной документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды работе с генераторами, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Влияние на дизайн:&lt;/strong&gt; вы участвуете в design-ревью API и кода, предлагаете улучшения, которые делают генерацию более полной и точной.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Генерация документации становится частью инженерной культуры.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_docascode_auto_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_docascode_auto_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://dl.acm.org/doi/10.1145/3641237.3691677\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Implementing Structured Authoring Practices in a Docs-as-Code Framework (ACM)&lt;/a&gt; - Реальный кейс: структурированное авторство, генерация документации, автоматизация, масштабирование;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.docsastests.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs as Tests (Manny Silva)&lt;/a&gt; - Как применять концепцию тестирования к документации: автоматическая проверка актуальности, генерация из единого источника истины;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/technical-writing-for/9781098141349/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing for Software Developers (Chris Chinchilla)&lt;/a&gt; - Главы о docs-as-code, toolchains, автоматизации, генерации док
