        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"junior-zapuskayu-i-publikuyu-po-instrukcii\"&gt;&lt;a href=\"Roadmap/docascode/ssg/junior.html#junior-zapuskayu-i-publikuyu-po-instrukcii\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Запускаю и публикую по инструкции»&lt;/span&gt;&lt;/a&gt;Junior: «Запускаю и публикую по инструкции»&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне SSG — это &lt;strong&gt;инструмент для публикации&lt;/strong&gt;. Вы учитесь запускать готовый генератор локально, разбираться в его базовой структуре и публиковать документацию в интернет. Ключевой сдвиг: вы перестаёте думать о документации как о наборе файлов в папке и начинаете видеть в ней &lt;strong&gt;сайт&lt;/strong&gt;, который можно собирать и деплоить.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание принципа работы SSG:&lt;/strong&gt; вы знаете, что SSG берёт контент (Markdown, reStructuredText, AsciiDoc), применяет тему и создаёт статические HTML-страницы для публикации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Установка и запуск:&lt;/strong&gt; вы можете установить MkDocs или Docusaurus на локальную машину, запустить dev-сервер и увидеть свой сайт в браузере. Для MkDocs типичный запуск — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g95wvvkj\"&gt;mkdocs serve&lt;/code&gt;; для Docusaurus — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y6lzxott\"&gt;npm run start&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Базовая структура проекта:&lt;/strong&gt; вы понимаете, где лежат контентные файлы (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hwlu1fpp\"&gt;docs/&lt;/code&gt;), где конфигурация (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5jua6xku\"&gt;mkdocs.yml&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qgig1az9\"&gt;docusaurus.config.js&lt;/code&gt;), и как они связаны.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Навигация:&lt;/strong&gt; вы умеете добавлять новые страницы и настраивать их в боковом меню. В MkDocs навигация задаётся в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1fset5vs\"&gt;mkdocs.yml&lt;/code&gt; в разделе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zoy1kv7e\"&gt;nav&lt;/code&gt;; в Docusaurus — через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zj4wc7r1\"&gt;sidebars.js&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Публикация:&lt;/strong&gt; вы умеете собрать сайт (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rhr473wl\"&gt;mkdocs build&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ngejd3uc\"&gt;npm run build&lt;/code&gt;) и опубликовать его на GitHub Pages. Это первый шаг к тому, чтобы ваша документация стала доступна пользователям.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;запускаете и публикуете&lt;/strong&gt;, используя готовые инструкции и шаблоны. Если что-то не работает — вы ищете решение в документации инструмента.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-junior\"&gt;&lt;a href=\"Roadmap/docascode/ssg/junior.html#kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://www.mkdocs.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MkDocs Documentation&lt;/a&gt; - Официальная документация MkDocs: от установки до кастомизации. Разделы «Getting Started» и «User Guide» — обязательны для старта;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docusaurus.io/docs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docusaurus Documentation&lt;/a&gt; - Официальная документация Docusaurus: от установки до версионирования. Раздел «Getting Started» даёт быстрый старт;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://techwriterstribe.com/courses/publish-your-website-with-docusaurus/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Publish your website with Docusaurus (Tech Writer's Tribe)&lt;/a&gt; - Курс &lt;strong&gt;специально для технических писателей&lt;/strong&gt;, не требует опыта программирования. 4 сессии по 3 часа: Markdown, Git, Docusaurus, GitHub Actions, автоматическая публикация;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://squidfunk.github.io/mkdocs-material/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Material for MkDocs Documentation&lt;/a&gt; - Официальная документация темы Material for MkDocs: настройка, кастомизация, плагины. Один из самых популярных вариантов оформления для MkDocs;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.coursera.org/learn/website-development-for-software-projects\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Further Website Development for Software Projects (Imperial College London)&lt;/a&gt; - Курс о static site generation и GitHub Pages: настройка SSG, добавление навигации, деплой.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/docascode/ssg/junior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Junior: «Запускаю и публикую по инструкции»","href":"Roadmap/docascode/ssg/junior.html#junior-zapuskayu-i-publikuyu-po-instrukcii","level":2,"items":[{"title":"Курсы и книги (Junior)","href":"Roadmap/docascode/ssg/junior.html#kursy-i-knigi-junior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/docascode
