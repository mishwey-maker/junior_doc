6 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"636\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-636\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-636\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-636.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ol start=\"9\" style=\"--hier-list-start:8\"&gt;\n&lt;li&gt;\n&lt;p&gt;Сохранить изменения, отправить их на сервер;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Войти в GitHub, создать пул-реквест и слить рабочую ветку с веткой &lt;em&gt;main&lt;/em&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Перейти в раздел &lt;em&gt;Actions → All workflow&lt;/em&gt;. В списке &lt;em&gt;workflow&lt;/em&gt; появилась новая запись — это и есть наш новый автоматический процесс. Если он завершился успешно (все этапы отмечены зелёными галочками), значит, всё получилось. Для проверки можете внести какие-нибудь изменения в исходные файлы и добавить их в ветку &lt;em&gt;main&lt;/em&gt;. После сливания рабочей ветки с веткой main в &lt;em&gt;Actions&lt;/em&gt; опять должен запуститься новый &lt;em&gt;workflow&lt;/em&gt;. Дождитесь его завершения, перейдите на сайт и убедитесь, что там отобразились ваши изменения.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"useful/Begin.md","updatedAt":"2026-11-16T21:21:42.000Z"},"headings":[{"title":"Начальная настройка","href":"useful/Begin.html#nachalnaya-nastrojka","level":2},{"title":"Настройка окружения","href":"useful/Begin.html#nastrojka-okruzheniya","level":2},{"title":"Создать репозиторий Git","href":"useful/Begin.html#sozdat-repozitorij-git","level":2},{"title":"Настройка директории","href":"useful/Begin.html#nastrojka-direktorii","level":2},{"title":"Первый файл","href":"useful/Begin.html#pervyj-fajl","level":2},{"title":"Первый пул-реквест","href":"useful/Begin.html#pervyj-pul-rekvest","level":2},{"title":"Слияние","href":"useful/Begin.html#sliyanie","level":2},{"title":"Установка MkDocs","href":"useful/Begin.html#ustanovka-mkdocs","level":2},{"title":"Настройка структуры сайта","href":"useful/Begin.html#nastrojka-struktury-sajta","level":2},{"title":"GitHub Pages подготовка статичных страниц","href":"useful/Begin.html#github-pages-podgotovka-statichnyh-stranic","level":2},{"title":"Настройка CI","href":"useful/Begin.html#nastrojka-ci","level":2}],"title":"Инструкция по развертыванию MkDocs"},"router":{"pathname":"useful/Begin","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
