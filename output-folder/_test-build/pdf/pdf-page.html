            {"data":{"leading":false,"pdfTitlePages":{"content":"","pageCount":0},"pdfEndingPages":{"content":"","pageCount":0},"cssLink":["_bundle\\vendor-cc70cf5466d9b511.css","_bundle\\app-715d7aeb3092dba2.css","_bundle\\vendor-df116bb3ce3233d5.rtl.css","_bundle\\app-4b3297f74c2d7129.rtl.css","_bundle\\search-96be624454210403.rtl.css","_bundle\\572-d3beebf60c608a89.rtl.css"],"html":"&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;p&gt;👾 &lt;em&gt;Приветствую, путник! Присаживайся поудобнее и давай знакомиться.&lt;/em&gt; 👾&lt;/p&gt;\n&lt;p&gt;Меня зовут Михаил, и я технический писатель, который благодаря кризису среднего возраста решил выйти из зоны комфорта и удариться в изучение IT.&lt;/p&gt;\n&lt;p&gt;Я не буду строить из себя сеньора, а наоборот – хочу пройти вместе с тобой путь новичка, без багажа знаний.&lt;/p&gt;\n&lt;p&gt;Несмотря на навыки технического писателя, я такой же новичок, как и ты. Предлагаю учиться вместе с юмором и без пафоса.&lt;/p&gt;\n&lt;p&gt;Давай докажем вместе, то IT – это не только про \"миллион за полгода\", но и про личностный рост, прокачку мозга и расширение горизонтов.&lt;/p&gt;\n&lt;p&gt;👨🏻‍🎓Мой путь: от техписа к Python, SQL и API. План без спешки и нервов.&lt;/p&gt;\n&lt;p&gt;Дальнейшие возможности не имеют границ.&lt;/p&gt;\n&lt;p&gt;Также читать блог можно в telegram канале: &lt;a href=\"https://t.me/anonjunior\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;https://t.me/anonjunior&lt;/a&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;p&gt;👾 &lt;em&gt;Приветствую, путник! Присаживайся поудобнее и давай знакомиться.&lt;/em&gt; 👾&lt;/p&gt;\n&lt;p&gt;Меня зовут Михаил, и я технический писатель, который благодаря кризису среднего возраста решил выйти из зоны комфорта и удариться в изучение IT.&lt;/p&gt;\n&lt;p&gt;Я не буду строить из себя сеньора, а наоборот – хочу пройти вместе с тобой путь новичка, без багажа знаний.&lt;/p&gt;\n&lt;p&gt;Несмотря на навыки технического писателя, я такой же новичок, как и ты. Предлагаю учиться вместе с юмором и без пафоса.&lt;/p&gt;\n&lt;p&gt;Давай докажем вместе, то IT – это не только про \"миллион за полгода\", но и про личностный рост, прокачку мозга и расширение горизонтов.&lt;/p&gt;\n&lt;p&gt;👨🏻‍🎓Мой путь: от техписа к Python, SQL и API. План без спешки и нервов.&lt;/p&gt;\n&lt;p&gt;Дальнейшие возможности не имеют границ.&lt;/p&gt;\n&lt;p&gt;Также читать блог можно в telegram канале: &lt;a href=\"https://t.me/anonjunior\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;https://t.me/anonjunior&lt;/a&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Course_index_poleznye-kursy-i-knigi\" data-original-article=\"Course/index.html\"&gt;&lt;a href=\"#Course_index_poleznye-kursy-i-knigi\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Полезные курсы и книги&lt;/span&gt;&lt;/a&gt;Полезные курсы и книги&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Course_index\" id=\"Course_index\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;h5 id=\"Course_index_python\"&gt;&lt;a href=\"#Course_index_python\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Python&lt;/span&gt;&lt;/a&gt;Python&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;🔝 &lt;a href=\"https://stepik.org/course/58852\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;\"Поколение Python\": курс для начинающих&lt;/a&gt; (Бесплатно)&lt;/li&gt;\n&lt;li&gt;🔝 &lt;a href=\"https://stepik.org/course/68343\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;\"Поколение Python\": курс для продвинутых&lt;/a&gt; (Бесплатно)&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://coddy.tech/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Coddy tech&lt;/a&gt;  (Условно бесплатно)&lt;/li&gt;\n&lt;li&gt;Программирование на Python в примерах и задачах Алексей Васильев&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"Course_index_sql\"&gt;&lt;a href=\"#Course_index_sql\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SQL&lt;/span&gt;&lt;/a&gt;SQL&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;🔝 &lt;a href=\"https://stepik.org/course/63054/info\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Интерактивный тренажер по SQL&lt;/a&gt; (&lt;a href=\"https://stepik.org/course/63054/info\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;https://stepik.org/course/63054/info&lt;/a&gt;) (Бесплатно)&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://stepik.org/course/197970/info\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Sql Практикум&lt;/a&gt; (Платно)&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://sql-academy.org/ru\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Sql Academy&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"Course_index_markdown\"&gt;&lt;a href=\"#Course_index_markdown\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Markdown&lt;/span&gt;&lt;/a&gt;Markdown&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://stepik.org/course/187888/info\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;It Guru&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://stepik.org/course/253005/info\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Pragmatic Programmer&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"Course_index_git\"&gt;&lt;a href=\"#Course_index_git\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Git&lt;/span&gt;&lt;/a&gt;Git&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://githowto.com/ru\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitHowTo&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;🔝 &lt;a href=\"https://stepik.org/course/214865/promo\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Git + GitHub. Полный курс&lt;/a&gt; (Платный, есть возможность получить бесплатно + есть базовый курс бесплатный)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Course_python_pokolenie-python-kurs-dlya-nachinayushih-besplatno-projdeno\" data-original-article=\"Course/python.html\"&gt;&lt;a href=\"#Course_python_pokolenie-python-kurs-dlya-nachinayushih-besplatno-projdeno\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поколение Python\": курс для начинающих (Бесплатно) Пройдено&lt;/span&gt;&lt;/a&gt;&lt;a href=\"https://stepik.org/course/58852\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Поколение Python\": курс для начинающих&lt;/a&gt; (Бесплатно) Пройдено&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Course_python\" id=\"Course_python\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;Отличный курс для начала изучения синтаксиса. В теории минимум воды и при этом подсвечены все базовые аспекты. Считай у тебя в кармане уже готовая шпаргалка для дальнейшей практики. Единственный минус, но может для кого то и плюс, это математические задачи. Иногда могут привести в ступор. После прохождения курса у тебя появится понимание и будут появлять вьетнамские флешбеки при упоминании: \"задача с перчиком\", \"шахматы\", \"однострочники\".&lt;/p&gt;\n&lt;p&gt;Плюсы:&lt;br&gt;\n✅ Практика сразу. После короткого объяснения – задача.&lt;br&gt;\n✅ Нарастающая сложность.&lt;br&gt;\n✅ Много типовых упражнений.&lt;br&gt;\n✅ Интерпритатор прямо в браузере.&lt;/p&gt;\n&lt;p&gt;Минусы:&lt;br&gt;\n❌ Есть задачи, которые отпугивают. Много математических задач, которые сложно применить на практике.&lt;br&gt;\n❌ Некоторые темы раскрыты неполностью, для полного понимания стоит пользоваться дополнительными ресурсами.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 data-original-article=\"useful/Macword.html\"&gt;Макрос для сбора сокращений в документе&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#useful_Macword\" id=\"useful_Macword\"&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;Возможности макроса:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;сканирует весь документ и находит слова, состоящие полностью из заглавных букв (длиной от 2 символов);&lt;/li&gt;\n&lt;li&gt;игнорирует слова в стилях «Заголовок» (чтобы слова вроде «ВВЕДЕНИЕ» или «INTRODUCTION» не попали в список);&lt;/li&gt;\n&lt;li&gt;очищает найденные слова от знаков препинания;&lt;/li&gt;\n&lt;li&gt;сортирует их по алфавиту и создаёт аккуратную таблицу из двух столбцов;&lt;/li&gt;\n&lt;li&gt;выполняет расшифровку в рамках заданного словаря-источника.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"useful_Macword_predvaritelnye-nastrojki\"&gt;&lt;a href=\"#useful_Macword_predvaritelnye-nastrojki\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Предварительные настройки&lt;/span&gt;&lt;/a&gt;Предварительные настройки&lt;/h3&gt;\n&lt;p&gt;В MS Word должна быть включена функция разработчика. Для этого необходимо нажать на панели инструментов кнопку \"Файл\".&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"../useful/image.png\" alt=\"Кнопка &amp;quot;Файл&amp;quot;\"&gt;&lt;/p&gt;\n&lt;p&gt;Выбрать в меню \"Параметры\"&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"../useful/image-1.png\" alt=\"alt text\"&gt;&lt;/p&gt;\n&lt;p&gt;Выбрать раздел \"Настроить ленту\" и установить чек-бокс \"Разработчик\". Нажать кнопку \"Ок\" для сохранения изменений.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"../useful/image-2.png\" alt=\"alt text\"&gt;&lt;/p&gt;\n&lt;p&gt;Во избежание конфликтов, рекомендуется настроить доверенный доступ к объектной модели VBA.&lt;br&gt;\nДля этого во вкладке разработчик следует выбрать пункт \"Безопасность макросов\" и установить чек-бокс \"Доверять доступ к объектной модели проектов VBA\".&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"../useful/image-3.png\" alt=\"alt text\"&gt;&lt;/p&gt;\n&lt;h3 id=\"useful_Macword_ustanovka-i-zapusk-makrosa\"&gt;&lt;a href=\"#useful_Macword_ustanovka-i-zapusk-makrosa\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка и запуск макроса&lt;/span&gt;&lt;/a&gt;Установка и запуск макроса&lt;/h3&gt;\n&lt;p&gt;В открытом документе нажмите комбинацию клавиш &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Macword_inline-code-id-qhkqve9h\"&gt;Alt + F11&lt;/code&gt;. В результате отобразится редактор VBA. В верхнем меню выберите &lt;strong&gt;Insert &amp;gt; Module&lt;/strong&gt; (Вставка &amp;gt; Модуль).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"../useful/image-4.png\" alt=\"alt text\"&gt;&lt;/p&gt;\n&lt;p&gt;Для добавления макроса в следует скопировать приведённый код и вставить в модуль. Для сохранения изменений необходимо закрыть редактор VBA и вернуться в документ.&lt;/p&gt;\n&lt;p&gt;Чатобы запустить макрос следует нажать комбинацию клавиш &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Macword_inline-code-id-3c3hj0uh\"&gt;Alt + F8&lt;/code&gt;, выбрать &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Macword_inline-code-id-b7j20rxn\"&gt;GenerateAbbreviationsTable&lt;/code&gt; из списка и нажать кнопку &lt;strong&gt;Run&lt;/strong&gt; (Выполнить).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"../useful/image-5.png\" alt=\"alt text\"&gt;&lt;/p&gt;\n&lt;p&gt;В результате отобразится диалоговое окно с предложение создать резервную копию документа. Для создания копии следует нажать кнопку \"Да\", для продолжения без резервной копии – \"Нет\".&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"../useful/image-6.png\" alt=\"alt text\"&gt;&lt;/p&gt;\n&lt;p&gt;На следующем шаге отобразится окно для выбора словаря-источника с аббревиатурами и их расшифровками, на который будет полагаться макрос.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"../useful/image-7.png\" alt=\"alt text\"&gt;&lt;/p&gt;\n&lt;p&gt;Словарь необходимо подготовить в формате .xls. В словаре необходимо задать таблицу для абрревиатур. Макрос сравнивает слова из первой колонки с найденными сокращениями из документа. При наличии полной схожести добавляет расшифровку из второго столбца.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"../useful/image-8.png\" alt=\"alt text\"&gt;&lt;/p&gt;\n&lt;p&gt;В случае успешного выполнения отобразится диалоговое окно с указание количества найденных аббревиатур.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"../useful/image-9.png\" alt=\"alt text\"&gt;&lt;/p&gt;\n&lt;p&gt;В результате будет сформирована таблица аббревиатур, найденных в документе.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"../useful/image-10.png\" alt=\"alt text\"&gt;&lt;/p&gt;\n&lt;h3 id=\"useful_Macword_kod-makrosa\"&gt;&lt;a href=\"#useful_Macword_kod-makrosa\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Код макроса&lt;/span&gt;&lt;/a&gt;Код макроса&lt;/h3&gt;\n&lt;p&gt;Код макроса:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;\nOption Explicit\n\n' Флаг защиты от повторного запуска\nPrivate isRunning As Boolean\n\n' =====================================================================\n' ОСНОВНАЯ ПРОЦЕДУРА\n' =====================================================================\nPublic Sub GenerateAbbreviationsTable()\n    On Error GoTo ErrorHandler\n    \n    ' Защита от повторного запуска\n    If isRunning Then\n        MsgBox \"Макрос уже выполняется. Дождитесь завершения.\", vbInformation, \"Внимание\"\n        Exit Sub\n    End If\n    isRunning = True\n    \n    Application.ScreenUpdating = False\n    \n    Dim doc As Document\n    Set doc = ActiveDocument\n    \n    ' 1. Запрос на создание резервной копии\n    Dim backupAnswer As VbMsgBoxResult\n    backupAnswer = MsgBox(\"Рекомендуется создать резервную копию документа перед внесением изменений.\" &amp;amp; vbCrLf &amp;amp; _\n                          \"Создать копию сейчас?\", vbYesNo + vbQuestion, \"Резервное копирование\")\n    If backupAnswer = vbYes Then\n        Dim backupPath As String\n        backupPath = Replace(doc.FullName, \".docx\", \"_backup.docx\")\n        backupPath = Replace(backupPath, \".docm\", \"_backup.docm\")\n        If doc.Path = \"\" Then\n            MsgBox \"Сначала сохраните документ на диск.\", vbExclamation\n            GoTo CleanUp\n        End If\n        doc.SaveAs2 FileName:=backupPath\n    End If\n    \n    ' 2. Выбор справочника\n    Dim refPath As String\n    refPath = SelectReferenceFile()\n    If refPath = \"\" Then GoTo CleanUp ' Пользователь отменил выбор\n    \n    ' 3. Загрузка словаря\n    Dim dictRef As Object\n    Set dictRef = LoadDictionary(refPath)\n    If dictRef Is Nothing Then GoTo CleanUp\n    \n    ' 4. Поиск аббревиатур и сопоставление\n    Dim foundAbbrs As Object\n    Set foundAbbrs = ExtractAndMatchAbbreviations(doc, dictRef)\n    \n    If foundAbbrs.Count = 0 Then\n        MsgBox \"В тексте не найдено аббревиатур, подходящих под эвристику.\", vbInformation\n        GoTo CleanUp\n    End If\n    \n    ' 5. Создание таблицы\n    Dim targetDoc As Document\n    Dim tbl As Table\n    Dim rng As Range\n    \n    ' Если документ защищен, создаем новый\n    If doc.ProtectionType = wdNoProtection Then\n        Set targetDoc = doc\n        Set rng = targetDoc.Content\n        rng.Collapse wdCollapseEnd\n        rng.InsertParagraphAfter\n        rng.Collapse wdCollapseEnd\n    Else\n        Set targetDoc = Documents.Add\n        Set rng = targetDoc.Content\n    End If\n    \n    Set tbl = CreateReportTable(targetDoc, rng, foundAbbrs)\n    \n    ' 6. Форматирование таблицы\n    FormatTable tbl\n    \n    ' 7. Отчет\n    ShowReport foundAbbrs, dictRef, targetDoc\n\nCleanUp:\n    Application.ScreenUpdating = True\n    isRunning = False\n    Exit Sub\n\nErrorHandler:\n    Application.ScreenUpdating = True\n    isRunning = False\n    MsgBox \"Ошибка \" &amp;amp; Err.Number &amp;amp; \" в процедуре GenerateAbbreviationsTable:\" &amp;amp; vbCrLf &amp;amp; _\n           Err.Description, vbCritical, \"Сбой макроса\"\nEnd Sub\n\n' =====================================================================\n' ВЫБОР ФАЙЛА СПРАВОЧНИКА\n' =====================================================================\nPrivate Function SelectReferenceFile() As String\n    Dim fd As FileDialog\n    Set fd = Application.FileDialog(msoFileDialogFilePicker)\n    \n    With fd\n        .Title = \"Выберите справочник аббревиатур\"\n        .Filters.Clear\n        .Filters.Add \"Файлы Excel\", \"*.xlsx; *.xlsm; *.xls\"\n        .Filters.Add \"Текстовые файлы\", \"*.csv; *.txt\"\n        .AllowMultiSelect = False\n        If .Show = -1 Then\n            SelectReferenceFile = .SelectedItems(1)\n        Else\n            SelectReferenceFile = \"\"\n        End If\n    End With\nEnd Function\n\n' =====================================================================\n' ЗАГРУЗКА СПРАВОЧНИКА В СЛОВАРЬ\n' =====================================================================\nPrivate Function LoadDictionary(filePath As String) As Object\n    On Error GoTo ErrLoad\n    \n    Dim dict As Object\n    Set dict = CreateObject(\"Scripting.Dictionary\")\n    dict.CompareMode = vbTextCompare ' Регистронезависимое сравнение\n    \n    Dim ext As String\n    ' ИСПРАВЛЕНО: берем 5 символов для корректной проверки .xlsx и .xlsm\n    ext = LCase(Right(filePath, 5))\n    \n    If ext = \".xlsx\" Or ext = \".xlsm\" Or Right(ext, 4) = \".xls\" Then\n        ' Обработка Excel (позднее связывание)\n        Dim xlApp As Object, xlWb As Object, xlWs As Object\n        Set xlApp = CreateObject(\"Excel.Application\")\n        \n        If xlApp Is Nothing Then\n            MsgBox \"Не удалось создать объект Excel. Возможно, Excel не установлен или поврежден.\" &amp;amp; vbCrLf &amp;amp; _\n                   \"Пожалуйста, сохраните справочник в формате CSV или TXT и попробуйте снова.\", vbCritical\n            Set LoadDictionary = Nothing\n            Exit Function\n        End If\n        \n        xlApp.Visible = False\n        xlApp.DisplayAlerts = False\n        Set xlWb = xlApp.Workbooks.Open(filePath)\n        Set xlWs = xlWb.Sheets(1)\n        \n        Dim lastRow As Long\n        lastRow = xlWs.Cells(xlWs.Rows.Count, 1).End(-4162).Row ' -4162 = xlUp\n        \n        Dim i As Long\n        Dim abbr As String, decr As String\n        For i = 2 To lastRow\n            abbr = Trim(CStr(xlWs.Cells(i, 1).Value))\n            decr = Trim(CStr(xlWs.Cells(i, 2).Value))\n            \n            If abbr &amp;lt;&amp;gt; \"\" And decr &amp;lt;&amp;gt; \"\" Then\n                If dict.Exists(abbr) Then\n                    If dict(abbr) &amp;lt;&amp;gt; decr Then\n                        dict(abbr) = dict(abbr) &amp;amp; \" [Конфликт: \" &amp;amp; decr &amp;amp; \"]\"\n                    End If\n                Else\n                    dict.Add abbr, decr\n                End If\n            End If\n        Next i\n        \n        xlWb.Close False\n        xlApp.Quit\n        Set xlWs = Nothing: Set xlWb = Nothing: Set xlApp = Nothing\n        \n    Else\n        ' Обработка CSV/TXT\n        Dim fso As Object, ts As Object\n        Set fso = CreateObject(\"Scripting.FileSystemObject\")\n        Set ts = fso.OpenTextFile(filePath, 1, False, -2) ' -2 = TristateUseDefault\n        \n        ' Определение разделителя по первой строке\n        Dim firstLine As String\n        firstLine = ts.ReadLine\n        Dim delim As String\n        Dim cCount As Long, sCount As Long, tCount As Long\n        \n        cCount = UBound(Split(firstLine, \",\"))\n        sCount = UBound(Split(firstLine, \";\"))\n        tCount = UBound(Split(firstLine, vbTab))\n        \n        ' ИСПРАВЛЕНО: Однострочный If с ElseIf недопустим в VBA.\n        ' Переписано на многострочный блок с обязательным End If.\n        If tCount &amp;gt;= cCount And tCount &amp;gt;= sCount Then\n            delim = vbTab\n        ElseIf sCount &amp;gt;= cCount Then\n            delim = \";\"\n        Else\n            delim = \",\"\n        End If\n        \n        Dim parts() As String\n        Dim lineText As String\n        \n        ' Чтение данных\n        Do While Not ts.AtEndOfStream\n            lineText = ts.ReadLine\n            parts = Split(lineText, delim)\n            If UBound(parts) &amp;gt;= 1 Then\n                abbr = Trim(parts(0))\n                decr = Trim(parts(1))\n                If abbr &amp;lt;&amp;gt; \"\" And decr &amp;lt;&amp;gt; \"\" Then\n                    If dict.Exists(abbr) Then\n                        If dict(abbr) &amp;lt;&amp;gt; decr Then\n                            dict(abbr) = dict(abbr) &amp;amp; \" [Конфликт: \" &amp;amp; decr &amp;amp; \"]\"\n                        End If\n                    Else\n                        dict.Add abbr, decr\n                    End If\n                End If\n            End If\n        Loop\n        ts.Close\n    End If\n    \n    Set LoadDictionary = dict\n    Exit Function\n\nErrLoad:\n    MsgBox \"Ошибка чтения справочника: \" &amp;amp; Err.Description, vbCritical\n    Set LoadDictionary = Nothing\nEnd Function\n\n' =====================================================================\n' ПОИСК АББРЕВИАТУР И СОПОСТАВЛЕНИЕ\n' =====================================================================\nPrivate Function ExtractAndMatchAbbreviations(doc As Document, dictRef As Object) As Object\n    Dim re As Object\n    Set re = CreateObject(\"VBScript.RegExp\")\n    re.Global = True\n    re.IgnoreCase = False\n    ' Эвристика: 2+ заглавных букв, далее опционально пробел/дефис/слеш и еще заглавные/цифры\n    re.Pattern = \"(?:^|[^А-Яа-яЁё0-9])([А-ЯЁ]{2,}(?:[ \\-\\/][А-ЯЁ0-9]+)*)(?:[^А-Яа-яЁё0-9]|$)\"\n    \n    Dim text As String\n    text = doc.Content.text\n    \n    Dim matches As Object\n    Set matches = re.Execute(text)\n    \n    Dim resultDict As Object\n    Set resultDict = CreateObject(\"Scripting.Dictionary\")\n    resultDict.CompareMode = vbTextCompare ' Регистронезависимое сравнение\n    \n    ' Черный список для исключения ложных срабатываний\n    Dim blacklist As Variant\n    blacklist = Array(\"НА\", \"ПО\", \"ДО\", \"ОТ\", \"КО\", \"СО\", \"ОБ\", \"ИЗ\", \"УЖ\", \"ЭХ\", \"АХ\", \"ОХ\", \"УХ\", \"ЫХ\", \"ЕЕ\", \"ОО\", \"АА\", \"ИИ\", _\n                      \"ПРАЙМ\", \"АПИ\", \"АПИ ИЭМК\", \"БЕЗ\", \"ОК\", \"ООО\", \"ПРАЙМ ГРУП\", \"РЕГИОН БОТА\", _\n                      \"РЕД ОС\")\n    \n    Dim m As Object\n    Dim abbr As String\n    Dim isBlacklisted As Boolean\n    Dim blItem As Variant\n    \n    For Each m In matches\n        abbr = UCase(Trim(m.SubMatches(0)))\n        \n        ' 1. Проверка черного списка\n        isBlacklisted = False\n        For Each blItem In blacklist\n            If abbr = blItem Then\n                isBlacklisted = True\n                Exit For\n            End If\n        Next blItem\n        \n        If Not isBlacklisted Then\n            \n            ' 2. НОВОЕ: Проверка длины каждого \"слова\" (части аббревиатуры)\n            ' Если в одном слове больше 6 символов, не добавляем в таблицу\n            Dim tempAbbr As String\n            tempAbbr = Replace(Replace(abbr, \"/\", \"-\"), \" \", \"-\")\n            Dim abbrWords As Variant\n            abbrWords = Split(tempAbbr, \"-\")\n            \n            Dim isValidLength As Boolean\n            isValidLength = True\n            Dim wordPart As Variant\n            \n            For Each wordPart In abbrWords\n                If Len(wordPart) &amp;gt; 6 Then\n                    isValidLength = False\n                    Exit For\n                End If\n            Next wordPart\n            \n            ' Если все части прошли проверку длины\n            If isValidLength Then\n                \n                ' 3. НОВОЕ: Явная проверка на дубликат.\n                ' Dictionary уже не хранит дубликаты ключей, но проверка Exists\n                ' гарантирует, что мы не будем повторно обрабатывать и добавлять\n                ' уже найденную аббревиатуру в словарь результатов.\n                If Not resultDict.Exists(abbr) Then\n                    If dictRef.Exists(abbr) Then\n                        resultDict.Add abbr, dictRef(abbr)\n                    Else\n                        resultDict.Add abbr, \" \"\n                    End If\n                End If\n                \n            End If\n        End If\n    Next m\n    \n    Set ExtractAndMatchAbbreviations = resultDict\nEnd Function\n\n' =====================================================================\n' СОЗДАНИЕ ТАБЛИЦЫ\n' =====================================================================\nPrivate Function CreateReportTable(doc As Document, rng As Range, dataDict As Object) As Table\n    Dim tbl As Table\n    Set tbl = doc.Tables.Add(rng, dataDict.Count + 1, 2)\n    \n    ' Заголовки\n    tbl.Cell(1, 1).Range.text = \"Сокращение\"\n    tbl.Cell(1, 2).Range.text = \"Расшифровка\"\n    \n    ' Сортировка ключей\n    Dim keys As Variant\n    keys = dataDict.keys\n    SortArray keys\n    \n    ' Заполнение данных\n    Dim i As Long\n    For i = 0 To UBound(keys)\n        tbl.Cell(i + 2, 1).Range.text = keys(i)\n        tbl.Cell(i + 2, 2).Range.text = dataDict(keys(i))\n    Next i\n    \n    Set CreateReportTable = tbl\nEnd Function\n\n' =====================================================================\n' ФОРМАТИРОВАНИЕ ТАБЛИЦЫ\n' =====================================================================\nPrivate Sub FormatTable(tbl As Table)\n    tbl.Borders.Enable = True\n    tbl.AutoFitBehavior wdAutoFitContent\n    \n    ' Выделение заголовка\n    With tbl.Rows(1)\n        .Range.Font.Bold = True\n        .Range.Font.Color = wdColorBlack\n        .Shading.BackgroundPatternColor = wdColorGray15\n    End With\n    \n    ' Добавление подписи над таблицей\n    Dim rngTitle As Range\n    Set rngTitle = tbl.Range\n    rngTitle.Collapse wdCollapseStart\n    rngTitle.InsertParagraphBefore\n    rngTitle.InsertBefore \"Таблица аббревиатур\"\n    rngTitle.Paragraphs(1).Range.Font.Bold = True\n    rngTitle.Paragraphs(1).Alignment = wdAlignParagraphCenter\nEnd Sub\n\n' =====================================================================\n' ВЫВОД ОТЧЕТА\n' =====================================================================\nPrivate Sub ShowReport(foundDict As Object, refDict As Object, targetDoc As Document)\n    Dim totalFound As Long, decrypted As Long, notFound As Long\n    Dim key As Variant\n    \n    totalFound = foundDict.Count\n    For Each key In foundDict.keys\n        If foundDict(key) = \"Не найдено в справочнике\" Then\n            notFound = notFound + 1\n        Else\n            decrypted = decrypted + 1\n        End If\n    Next key\n    \n    Dim msg As String\n    msg = \"Обработка завершена успешно!\" &amp;amp; vbCrLf &amp;amp; vbCrLf\n    msg = msg &amp;amp; \"Всего найдено уникальных аббревиатур: \" &amp;amp; totalFound &amp;amp; vbCrLf\n    msg = msg &amp;amp; \"Успешно расшифровано: \" &amp;amp; decrypted &amp;amp; vbCrLf\n    msg = msg &amp;amp; \"Не найдено в справочнике: \" &amp;amp; notFound &amp;amp; vbCrLf &amp;amp; vbCrLf\n    msg = msg &amp;amp; \"Таблица создана в документе: \" &amp;amp; targetDoc.Name\n    \n    MsgBox msg, vbInformation, \"Отчет макроса\"\nEnd Sub\n\n' =====================================================================\n' ВСПОМОГАТЕЛЬНАЯ ФУНКЦИЯ: СОРТИРОВКА МАССИВА\n' =====================================================================\nPrivate Sub SortArray(arr As Variant)\n    Dim i As Long, j As Long\n    Dim temp As String\n    For i = LBound(arr) To UBound(arr) - 1\n        For j = i + 1 To UBound(arr)\n            If arr(i) &amp;gt; arr(j) Then\n                temp = arr(i)\n                arr(i) = arr(j)\n                arr(j) = temp\n            End If\n        Next j\n    Next i\nEnd Sub\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"111\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"useful_Macword_visibileAnimation-111\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"useful_Macword_hideAnimation-111\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-111.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 data-original-article=\"useful/Begin.html\"&gt;Инструкция по развертыванию MkDocs&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#useful_Begin\" id=\"useful_Begin\"&gt;&lt;/a&gt;&lt;/h2&gt;&lt;h3 id=\"useful_Begin_nachalnaya-nastrojka\"&gt;&lt;a href=\"#useful_Begin_nachalnaya-nastrojka\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Начальная настройка&lt;/span&gt;&lt;/a&gt;Начальная настройка&lt;/h3&gt;\n&lt;ol&gt;\n&lt;li&gt;Установить python и git&lt;/li&gt;\n&lt;/ol&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Скачайте дистрибутивы с официальных сайтов и установите их на компьютере: &lt;a href=\"https://www.python.org/downloads/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;python&lt;/a&gt;; &lt;a href=\"https://git-scm.com/download/win\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;git&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;ol start=\"2\" style=\"--hier-list-start:1\"&gt;\n&lt;li&gt;Зарегистрировать аккаунт в github&lt;/li&gt;\n&lt;/ol&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Сделать это можно на &lt;a href=\"https://github.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;github.com&lt;/a&gt; (регистрация по кнопке Sign up в правом верхнем углу).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;ol start=\"3\" style=\"--hier-list-start:2\"&gt;\n&lt;li&gt;Для работы нам понадобится какой-нибудь текстовый редактор. Я настоятельно рекомендую использовать &lt;a href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Visual Studio Code&lt;/a&gt; — это классический редактор кода с расширенными функциями, который удобно использовать для работы с облегченными языками разметки.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"useful_Begin_nastrojka-okruzheniya\"&gt;&lt;a href=\"#useful_Begin_nastrojka-okruzheniya\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройка окружения&lt;/span&gt;&lt;/a&gt;Настройка окружения&lt;/h3&gt;\n&lt;ol&gt;\n&lt;li&gt;Проверить версионность python и git:&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs shell\"&gt;python --version\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"44\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"useful_Begin_visibileAnimation-44\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"useful_Begin_hideAnimation-44\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-44.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs shell\"&gt;git --version\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"45\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"useful_Begin_visibileAnimation-45\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"useful_Begin_hideAnimation-45\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-45.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Если всё сделано верно, комадная строка вернёт вам версии установленного по:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;C:\\Users\\User1&amp;gt;python --version\nPython 3.10.2\n\nC:\\Users\\User1&amp;gt;git --version\ngit version 2.33.0.windows.2\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"50\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"useful_Begin_visibileAnimation-50\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"useful_Begin_hideAnimation-50\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-50.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"useful_Begin_sozdat-repozitorij-git\"&gt;&lt;a href=\"#useful_Begin_sozdat-repozitorij-git\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создать репозиторий Git&lt;/span&gt;&lt;/a&gt;Создать репозиторий Git&lt;/h3&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Войдите в свой аккаунт GitHub;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;В правом верхнем углу нажмите кнопку [+] и выберите пункт «New repository»;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Заполните поля в открывшейся форме:&lt;/p&gt;\n&lt;p&gt;✒️ &lt;strong&gt;Repository name&lt;/strong&gt; — обязательное поле, название и slug вашего репозитория. Вы можете использовать латиницу, цифры и некоторые символы (точку, дефис и нижнее подчёркивание). Постарайтесь придумать название, которое будет отражать суть вашего репозитория. Мой, например, называется parawriter_docs;&lt;/p&gt;\n&lt;p&gt;✒️ &lt;strong&gt;Description&lt;/strong&gt; — описание репозитория. Это поле необязательное, заполните его по своему усмотрению. Я ленивый, поэтому оставил описание пустым);&lt;/p&gt;\n&lt;p&gt;✒️ &lt;strong&gt;Public or Private&lt;/strong&gt; – Публичный репозиторий будет виден всем пользователям Интернета (в режиме просмотра), а в приватном вы сами настраиваете список допущенных лиц. В рамках курса я рекомендую создать публичный репозиторий. Для этого выберите опцию Public;&lt;/p&gt;\n&lt;p&gt;✒️ &lt;strong&gt;Add a README file. Readme&lt;/strong&gt; — это файл с описанием проекта. Я предлагаю добавить readme, потом мы зафиксируем в нём особенности работы с проектом. Активируйте этот чекбокс;&lt;/p&gt;\n&lt;p&gt;✒️ &lt;strong&gt;Add .gitignore. В файле .gitignore&lt;/strong&gt; содержится список неотслеживаемых гитом файлов и папок. Нам это пока не нужно, оставьте чекбокс неактивным;&lt;/p&gt;\n&lt;p&gt;✒️ &lt;strong&gt;Choose a license.&lt;/strong&gt; Лицензии защищают наше авторское право на создаваемый в репозитории продукт. В рамках этого курса я предлагаю установить стандартную универсальную общественную лицензию, которая разрешает всем желающим пользоваться вашими наработками. Раскройте список и выберите GNU General Public License;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Нажмите кнопку &lt;strong&gt;Create repository&lt;/strong&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"useful_Begin_nastrojka-direktorii\"&gt;&lt;a href=\"#useful_Begin_nastrojka-direktorii\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройка директории&lt;/span&gt;&lt;/a&gt;Настройка директории&lt;/h3&gt;\n&lt;ol&gt;\n&lt;li&gt;Определить в какой папке на компьютере будет размещаться проект.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Теперь нужно перейти на нее в приложении командной строки.&lt;br&gt;\nДля этого открыть CMD и выполнить команду:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs shell\"&gt;cd &amp;lt;Путь к папке&amp;gt; \n\nНапример:\n\ncd C:\\Users\\User1\\parawriter\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"108\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"useful_Begin_visibileAnimation-108\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"useful_Begin_hideAnimation-108\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-108.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ol start=\"2\" style=\"--hier-list-start:1\"&gt;\n&lt;li&gt;\n&lt;p&gt;Клонировать git-репозиторий в эту папку с помощью команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-nres2bpd\"&gt;git clone&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Войти в свой аккаунт на GitHub и открыть репозиторий.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Нажать кнопку &lt;em&gt;&amp;lt;&amp;gt; Code&lt;/em&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;В выпадающем окне на вкладке &lt;em&gt;Local&lt;/em&gt; в разделе &lt;em&gt;Clone&lt;/em&gt; выберите &lt;em&gt;HTTPS&lt;/em&gt; и скопировать &lt;em&gt;web url&lt;/em&gt; репозитория.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Перейти в CMD и выполнить команду:&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs shell\"&gt;  git clone repository-url\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"136\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"useful_Begin_visibileAnimation-136\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"useful_Begin_hideAnimation-136\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-136.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Система сообщит, когда репозиторий будет полностью клонирован:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs shell\"&gt;C:\\Users\\User1\\parawriter&amp;gt;git clone https://github.com/novillero/parawriter_docs.git\nCloning into 'parawriter_docs'...\nremote: Enumerating objects: 4, done.\nremote: Counting objects: 100% (4/4), done.\nremote: Compressing objects: 100% (3/3), done.\nremote: Total 4 (delta 0), reused 0 (delta 0), pack-reused 0 (from 0)\nReceiving objects: 100% (4/4), 7.56 KiB | 7.56 MiB/s, done.\nC:\\Users\\User1\\parawriter&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"140\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"useful_Begin_visibileAnimation-140\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"useful_Begin_hideAnimation-140\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-140.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ol start=\"7\" style=\"--hier-list-start:6\"&gt;\n&lt;li&gt;В папке появилась новая папка с репозиторием. Чтобы работать с проектом, нужно перейти в эту папку. Для этого необходимо выполнить команду cd:&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs shell\"&gt;C:\\Users\\User1\\parawriter&amp;gt;cd C:\\Users\\User1\\parawriter\\parawriter_docs\nC:\\Users\\User1\\parawriter\\parawriter_docs&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"148\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"useful_Begin_visibileAnimation-148\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"useful_Begin_hideAnimation-148\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-148.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ol start=\"8\" style=\"--hier-list-start:7\"&gt;\n&lt;li&gt;Проверить состояние проекта - выполнить команду &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-vjg7stm8\"&gt;git status&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs shell\"&gt;C:\\Users\\User1\\parawriter\\parawriter_docs&amp;gt;git status\nOn branch main\nYour branch is up to date with 'origin/main'.\n\nnothing to commit, working tree clean\n\nC:\\Users\\User1\\parawriter\\parawriter_docs&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"156\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"useful_Begin_visibileAnimation-156\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"useful_Begin_hideAnimation-156\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-156.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Система сообщает нам, что мы находимся в основной ветке проекта main, а также что наша локальная версия ветки main обновлена и совпадает с оригинальной main. Сообщение nothing to commit, working tree clean говорит о том, что мы еще не внесли никаких изменений, которые можно было бы зафиксировать.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"useful_Begin_pervyj-fajl\"&gt;&lt;a href=\"#useful_Begin_pervyj-fajl\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Первый файл&lt;/span&gt;&lt;/a&gt;Первый файл&lt;/h3&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Открыть CMD и перейти в папку проекта с помощью команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-arnl1285\"&gt;cd путь_к_папке&lt;/code&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Проверить состояние проекта, выполнив команду &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-hulf2ej7\"&gt;git status&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Что нужно смотреть в статусе репозитория? То, что вы находитесь в нужной ветке (main) и что у вас нет незафиксированных изменений;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;ol start=\"3\" style=\"--hier-list-start:2\"&gt;\n&lt;li&gt;Обновить репозиторий, выполнив команду &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-6am69b7b\"&gt;git pull&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Эта команда забирает актуальную версию ветки из оригинального репозитория на наш компьютер. Сейчас таких изменений нет, но мы будем следовать правилам;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;ol start=\"3\" style=\"--hier-list-start:2\"&gt;\n&lt;li&gt;\n&lt;p&gt;Каждая новая задача (а перед нами стоит задача добавить первый файл) должна выполняться в отдельной ветке. Создать новую ветку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-mpbj52j9\"&gt;task-1-add-file&lt;/code&gt;, отколов её от ветки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-dx6wf0bb\"&gt;main&lt;/code&gt;. Для этого выполнить команду &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-r8s9fvua\"&gt;git branch task-1-add-file&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Новая ветка создана, но &lt;em&gt;git status&lt;/em&gt; покажет, что вы до сих пор находится в ветке &lt;em&gt;main&lt;/em&gt;. Чтобы переключиться на рабочую ветку, выполнить команду &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-ru4lkjvp\"&gt;git switch task-1-add-file&lt;/code&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;В папке проекта создать файл &lt;a href=\"http://index.md\"&gt;index.md&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;После создания нового файла нам нужно отправить его на сервер:&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Вернуться в CMD и снова выполните команду &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-zn83j0ww\"&gt;git status&lt;/code&gt;. Система показывает, что в проекте есть изменения:&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs shell\"&gt;C:\\Users\\User1\\parawriter\\parawriter_docs&amp;gt;git status\nOn branch task-1-add-file\nUntracked files:\n  (use \"git add &amp;lt;file&amp;gt;...\" to include in what will be committed)\n        index.md\n\nnothing added to commit but untracked files present (use \"git add\" to track)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"221\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"useful_Begin_visibileAnimation-221\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"useful_Begin_hideAnimation-221\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-221.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ol start=\"8\" style=\"--hier-list-start:7\"&gt;\n&lt;li&gt;\n&lt;p&gt;Перед тем, как создать коммит, нужно сообщить гиту, какие изменения требуется зафиксировать в коммите. Для этого используется команда &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-qhmh8jxy\"&gt;git add&lt;/code&gt;. Так как мы собираемся зафиксировать все изменения, выполнить команду в таком виде: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-a1v51ja3\"&gt;git add .&lt;/code&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Теперь файл &lt;em&gt;&lt;a href=\"http://index.md\"&gt;index.md&lt;/a&gt;&lt;/em&gt; проиндексирован. Для создания коммита выполнить команду &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-xn7s9sus\"&gt;git commit -m \"краткое описание изменений\"&lt;/code&gt;:&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs shell\"&gt;C:\\Users\\User1\\parawriter\\parawriter_docs&amp;gt;git commit -m \"Добавил новый файл index.md\"\n[task-1-add-file df62424] Добавил новый файл index.md\n 1 file changed, 0 insertions(+), 0 deletions(-)\n create mode 100644 index.md\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"234\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"useful_Begin_visibileAnimation-234\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"useful_Begin_hideAnimation-234\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-234.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Система сообщает о том, что изменения зафиксированы.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;Отправить коммит на сервер, выполнив команду &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-38ogftrq\"&gt;git push&lt;/code&gt;. Так как вашей рабочей ветки ещё нет на сервере, используйте команду с флагом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-2828wsdq\"&gt;set-upstream: git push --set-upstream origin task-1-add-file&lt;/code&gt;. Это нужно только для первого обновления, все последующие обновления ветки можно будет проводить командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-ldshjv89\"&gt;git push&lt;/code&gt; без флага;&lt;/p&gt;\n&lt;p&gt;файл &lt;a href=\"http://index.md\"&gt;index.md&lt;/a&gt; отправился на сервер. Нам осталось создать пул-реквест и слить рабочую ветку и ветку main, чтобы обновить проект.&lt;/p&gt;\n&lt;h3 id=\"useful_Begin_pervyj-pul-rekvest\"&gt;&lt;a href=\"#useful_Begin_pervyj-pul-rekvest\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Первый пул-реквест&lt;/span&gt;&lt;/a&gt;Первый пул-реквест&lt;/h3&gt;\n&lt;ol&gt;\n&lt;li&gt;Открыть репозиторий в GitHub. Теперь, если вы раскроете список веток (кнопка слева над файлами репозитория, на кнопке отображается название текущей ветки main), увидите рабочую ветку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-q627knul\"&gt;task-1-add-file&lt;/code&gt;. Переключится на неё: в списке файлов появился новый файл &lt;a href=\"http://index.md\"&gt;index.md&lt;/a&gt;. Это значит, что изменения успешно добрались до сервера.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Чтобы провести ревью, а потом влить внесённые изменения в проект, нужно создать запрос на слияние веток: Pull request.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;В верхнем меню выбрать пункт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-otiexne2\"&gt;Pull requests&lt;/code&gt;. Страничка пока пустая, потому что не создано ни одного запроса;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Нажать зелёную кнопку &lt;em&gt;New pull request&lt;/em&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;В разделе &lt;em&gt;«Compare changes»&lt;/em&gt; выбрать ветки:&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;В поле &lt;em&gt;base&lt;/em&gt; добавить ветку &lt;em&gt;main&lt;/em&gt;, а в поле &lt;em&gt;compare&lt;/em&gt; — ветку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-4zt29qxa\"&gt;task-1-add-file&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Гитхаб проводит проверку возможности слияния и выносит вердикт: &lt;em&gt;Able to merge&lt;/em&gt;. Значит, всё хорошо, конфликтов не обнаружено, можно создавать пул-реквест.&lt;/p&gt;\n&lt;ol start=\"4\" style=\"--hier-list-start:3\"&gt;\n&lt;li&gt;\n&lt;p&gt;Нажать кнопку &lt;em&gt;Create pull request&lt;/em&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Придумайте название и описание пул-реквеста: заполните поля &lt;em&gt;Add a title и Add a description&lt;/em&gt;. Обычно в компаниях разработаны правила наименования пул-реквестов, но мы с вами не в обычной компании) Поэтому предлагаю придерживаться простой рекомендации: название должно кратко отражать суть задачи, а описание — подробности вносимых изменений.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Я назову пул-реквест «Добавление первого файла», а в описании расскажу, что именно я сделал: «Создал и добавил новый файл &lt;a href=\"http://index.md\"&gt;index.md&lt;/a&gt;».&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;ol start=\"6\" style=\"--hier-list-start:5\"&gt;\n&lt;li&gt;Ещё раз нажать кнопку &lt;em&gt;Create pull request&lt;/em&gt;. Поздравляю, запрос создан!&lt;/li&gt;\n&lt;/ol&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Этот запрос нужен не только для того, чтобы слить ветки. Именно здесь может проходить процесс проверки задачи и внесение правок. Обычно ссылка на пул-реквест прикрепляется к задаче, и назначенный ревьюер приходит и проверяет вашу работу. Он может перейти на вкладку Files changed и посмотреть файлы, которые вы изменили, а также оставить комментарии к любой строке этих файлов. Эти комментарии будут отображаться на  главной странице пул-реквеста, вы можете отвечать на них, ну, и конечно, вносить изменения по требованию ревьюера. После того, как все проверки будут пройдены, а правки согласованы, пул-реквест принимается и ваша рабочая ветка вливается в main, то есть добавляется в основной проект.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;ol start=\"7\" style=\"--hier-list-start:6\"&gt;\n&lt;li&gt;Внести изменения в файл &lt;a href=\"http://index.md\"&gt;index.md&lt;/a&gt; и отправьте эти изменения на сервер.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Подсказка&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Всю работу над задачей мы проводим в одной ветке. Если в процессе ревью вы получили правки, то вносить их нужно в той же рабочей ветке,  а потом по уже знакомому пути отправить изменения на сервер (проиндексировать изменения → создать коммит → отправить коммит). Если всё сделано правильно, ваш новый коммит попадёт в уже созданный пул-реквест.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;Ожидаемый результат&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Файл &lt;a href=\"http://index.md\"&gt;index.md&lt;/a&gt; изменён, в пул-реквесте на вкладке Commits отображаются два коммита.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"useful_Begin_sliyanie\"&gt;&lt;a href=\"#useful_Begin_sliyanie\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Слияние&lt;/span&gt;&lt;/a&gt;Слияние&lt;/h3&gt;\n&lt;p&gt;Задача провести слияние и влить рабочую ветку task-1-add-file в главную ветку main.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Открыть пул-реквест в GitHub и промотать вкладку &lt;em&gt;Conversation&lt;/em&gt; до блока с подтверждением запроса;&lt;/li&gt;\n&lt;li&gt;Нажать кнопку &lt;em&gt;Merge pull request&lt;/em&gt;.&lt;/li&gt;\n&lt;li&gt;Нажать кнопку &lt;em&gt;Confirm merge&lt;/em&gt;;&lt;/li&gt;\n&lt;li&gt;GitHub автоматически вольёт изменения в ветку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-02i35y8p\"&gt;main&lt;/code&gt; и сообщит о том, что всё прошло успешно: &lt;em&gt;«Pull request successfully merged and closed»&lt;/em&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"useful_Begin_ustanovka-mkdocs\"&gt;&lt;a href=\"#useful_Begin_ustanovka-mkdocs\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка MkDocs&lt;/span&gt;&lt;/a&gt;Установка MkDocs&lt;/h3&gt;\n&lt;ol&gt;\n&lt;li&gt;Установить генератор &lt;em&gt;MkDocs&lt;/em&gt;. Для этого откройте CMD и выполните команду:&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs shell\"&gt;pip install mkdocs\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"372\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"useful_Begin_visibileAnimation-372\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"useful_Begin_hideAnimation-372\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-372.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ol start=\"2\" style=\"--hier-list-start:1\"&gt;\n&
