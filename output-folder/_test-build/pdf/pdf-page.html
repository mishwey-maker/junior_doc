т». В процедурах каждый шаг начинается с глагола в повелительном наклонении. Конвертация пассивного залога в активный часто делает предложения короче и понятнее.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Единообразие терминов:&lt;/strong&gt; если вы назвали кнопку «Настройки» один раз, вы называете её так везде, а не «Параметры» через абзац. Термины в стайлгайде Microsoft явно прописаны: более 300 тем, разъясняющих правильное написание и использование отраслевых терминов.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Адаптация под аудиторию:&lt;/strong&gt; вы понимаете, что документация для конечных пользователей отличается от reference для разработчиков. Тон для API-справочника — плотный и точный, для туториала — более разговорный и поддерживающий.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Различие между русским и английским техническим стилем:&lt;/strong&gt; русский технический стиль тяготеет к безличным конструкциям («Аудит проведён», «План должен быть направлен»), которые создают ощущение объективности и дистанции между автором и действием. Английский стиль, наоборот, предпочитает активный залог и прямые конструкции. Вы понимаете эту разницу и не переносите русские безличные шаблоны в английский текст.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Ключевой принцип Junior:&lt;/strong&gt; вы следуете правилам, а не устанавливаете их. Если в проекте принято писать «войдите в систему», а не «залогиньтесь» — вы делаете именно так.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr&gt;\n&lt;h3 id=\"Roadmap_base_style_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_base_style_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - Фундаментальный курс: активный залог, сильные глаголы, конкретные существительные, фокус на одной идее, борьба с лишними словами. Сводка курса — краткая шпаргалка по стилю;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/style\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Developer Documentation Style Guide&lt;/a&gt; - Эталонный стайлгайд: tone and content, language and grammar, formatting, punctuation. Разделы «Highlights» и «Word list» — обязательны;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://learn.microsoft.com/en-us/style-guide/welcome/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Microsoft Writing Style Guide&lt;/a&gt; - Второй эталонный стайлгайд: более 300 тем по терминологии, бренд-голос, accessibility, локализация. Раздел «Top 10 tips» даёт быстрый старт;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.litres.ru/book/maksim-ilyahov/pishi-sokraschay-kak-sozdavat-silnyy-tekst-20276938/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«Пиши, сокращай» (Максим Ильяхов, Людмила Сарычева)&lt;/a&gt; - Русскоязычная библия информационного стиля: как убирать лишнее, как делать текст сильным. Принципы информационного стиля: общие фразы и сложные конструкции мешают восприятию;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.litres.ru/book/maksim-ilyahov/informacionnyy-stil-21985457/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«Информационный стиль» (Максим Ильяхов)&lt;/a&gt; - Практическое руководство по редактуре в информационном стиле: для писателей, редакторов, разработчиков;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.cntd.ru/document/1200007606\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ГОСТ 2.105-95 (ЕСКД)&lt;/a&gt; - Русскоязычный стандарт оформления технической документации: требования к изложению текста, краткости, чёткости, недопустимости различных толкований;&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_base_style_middle_middle-formuliruyu-pravila-i-adaptiruyu-ton\" data-original-article=\"Roadmap/base/style/middle.html\"&gt;&lt;a href=\"#Roadmap_base_style_middle_middle-formuliruyu-pravila-i-adaptiruyu-ton\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Формулирую правила и адаптирую тон»&lt;/span&gt;&lt;/a&gt;Middle: «Формулирую правила и адаптирую тон»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_base_style_middle\" id=\"Roadmap_base_style_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне стиль и тон перестают быть просто «набором правил, которым я следую». Теперь это предмет решений: вы выбираете стайлгайд под проект, формулируете правила для команды, адаптируете тон под разные типы контента и разрешаете спорные случаи. Ключевой сдвиг: вы перестаёте быть «тем, кто следует чужим правилам», и становитесь тем, кто создаёт правила для своей команды и обеспечивает их соблюдение.&lt;/p&gt;\n&lt;p&gt;Что входит в Middle-уровень:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Выбор и адаптация стайлгайда:&lt;/strong&gt; вы понимаете разницу между Google Developer Documentation Style Guide (фокус на developer-аудитории, «knowledgeable friend», консистентность) и Microsoft Writing Style Guide (более 300 тем по терминологии, бренд-голос, accessibility, локализация). Вы можете обосновать выбор для конкретного проекта и адаптировать его под продукт, а не просто «взять Google, потому что он хороший».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Формулирование правил для команды:&lt;/strong&gt; вы создаёте внутренний стайлгайд: какие термины использовать, какой тон, какие конструкции запрещены. Вы адаптируете Google/Microsoft под продукт, а не копируете их целиком. Ваши правила должны быть исполнимыми, а не декларативными.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Адаптация тона под тип контента:&lt;/strong&gt; вы понимаете, что тон должен соответствовать задаче читателя. API reference для опытных разработчиков выигрывает от плотности и точности. Туториал для новичков — от более разговорного и поддерживающего тона. Release notes — от нейтрального и фактологического.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Разрешение спорных случаев:&lt;/strong&gt; когда два автора пишут по-разному, вы решаете, какой вариант правильный, и объясняете почему. Вы не просто говорите «так принято», а аргументируете через аудиторию, задачу и стайлгайд.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Обучение и ревью:&lt;/strong&gt; вы проверяете тексты других авторов на соответствие стилю и даёте конструктивный фидбек. Вы не просто исправляете, а объясняете, почему это важно.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Автоматизация проверки стиля:&lt;/strong&gt; вы превращаете стайлгайд в исполняемые правила с помощью Vale. Вы подключаете готовые стили (Google, Microsoft), комбинируете их, разрешаете конфликты и создаёте кастомный словарь для терминов вашей команды.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы формулируете правила и объясняете их. Вы отвечаете за то, чтобы команда писала единообразно, даже если авторов несколько.&lt;/em&gt;&lt;/p&gt;\n&lt;h3 id=\"Roadmap_base_style_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_base_style_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://www.pce.uw.edu/courses/intermediate-professional-technical-writing\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Intermediate Professional Technical Writing (UW Professional &amp;amp; Continuing Education)&lt;/a&gt; - Курс для развития редакторского голоса и тона: как адаптировать контент под разные аудитории и цели, как интегрировать AI как редакторский инструмент, как выстраивать phased editing;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://books.google.com.sg/books?id=nMabEQAAQBAJ\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write Better with Vale (Brian P. Hogan)&lt;/a&gt; - Книга, которая превращает стайлгайд в исполняемые правила: как подключить стили Google и Microsoft, комбинировать их, разрешать конфликты и создавать кастомный словарь для терминов команды. Интеграция в VS Code, Git hooks и CI;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.tonex.com/writing-workshop-technical-professionals/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Writing Workshop for Technical Professionals (Tonex)&lt;/a&gt; - Модуль 3: Writing Style and Tone — профессиональный тон, избегание жаргона, баланс между технической детализацией и простотой, написание для разных аудиторий, активный и пассивный залог;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://learn.microsoft.com/en-us/style-guide/welcome/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Microsoft Writing Style Guide&lt;/a&gt; - Продвинутые разделы: более 300 тем по терминологии, руководство по локализации (избегание идиом и культурных отсылок), accessibility, написание для глобальной аудитории. Раздел «Top 10 tips» — быстрый старт для команды;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/style\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Developer Documentation Style Guide&lt;/a&gt; - Продвинутые разделы: Voice and tone (цель — «knowledgeable friend»), Word list (сотни терминов с рекомендациями), Write for a global audience, Write inclusive documentation. Эталон для developer-документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://users.dcc.uchile.cl/~nbaloian/ArquitecturaDeLaInformacion/materialDeLAWeb/TriDoc2005-DQTI.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Developing Quality Technical Information (IBM)&lt;/a&gt; - Руководство по качеству технической информации: 9 характеристик качества (accuracy, clarity, completeness, concreteness, organization, retrievability, style, task orientation, visual effectiveness), сгруппированных в 3 категории — Easy to use, Easy to understand, Easy to find. Помогает формулировать правила не «на глаз», а на основе модели качества;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://archive.org/details/isbn_9780132101301\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The IBM Style Guide: Conventions for Writers and Editors&lt;/a&gt; - Практическое руководство по языку и грамматике, пунктуации, форматированию и структуре, написанию для разных аудиторий. Полезно для формулирования внутренних правил команды: как писать чётко и консистентно, как структурировать информацию, чтобы её было легко найти.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_base_style_senior_senior-sozdayu-standart-i-obuchayu-drugih\" data-original-article=\"Roadmap/base/style/senior.html\"&gt;&lt;a href=\"#Roadmap_base_style_senior_senior-sozdayu-standart-i-obuchayu-drugih\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Создаю стандарт и обучаю других»&lt;/span&gt;&lt;/a&gt;Senior: «Создаю стандарт и обучаю других»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_base_style_senior\" id=\"Roadmap_base_style_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне стиль и тон — это &lt;strong&gt;элемент организационной культуры&lt;/strong&gt;. Вы не просто выбираете стайлгайд для команды, вы &lt;strong&gt;определяете, как язык документации вписывается в общую стратегию&lt;/strong&gt;: как связаны стиль документации, стиль интерфейса (UX writing) и стиль маркетинга, как обеспечивается консистентность между командами и продуктами, как обучать инженеров писать понятно. Ключевой сдвиг: вы перестаёте быть «тем, кто пишет по правилам», и становитесь &lt;strong&gt;тем, кто создаёт правила для организации&lt;/strong&gt; и отвечает за их соблюдение в масштабе.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Создание org-wide стайлгайда:&lt;/strong&gt; вы создаёте стандарт стиля для всей организации, который используется несколькими командами. Вы определяете, как обрабатывать исключения, как проводить ревью, как обучать новых авторов. Хороший стайлгайд не пишется в одиночку: в CrowdStrike, например, создают небольшие рабочие группы внутри писательской команды — одна решает, какие слова использовать, другая — каким должен быть стайлгайд, третья — что важно для accessibility. Это даёт чувство ownership и снижает «усталость от решений» у остальных авторов.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Governance и стандарты:&lt;/strong&gt; вы определяете политику языка: какие термины обязательны, какие запрещены, как адаптировать стиль для локализации, как обеспечивать accessibility. Ваш стайлгайд должен быть &lt;strong&gt;исполнимым&lt;/strong&gt;, а не декларативным: он либо встроен в Vale и CI, либо не работает. Senior-писатель «устанавливает и обеспечивает соблюдение стайлгайдов, шаблонов и стандартов документации, чтобы обеспечить консистентность и качество across documentation sets».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Кросс-функциональная работа:&lt;/strong&gt; вы согласовываете стиль документации со стилем интерфейса и маркетинга. IBM, например, строит контентные гайдлайны на основе &lt;strong&gt;IBM Style&lt;/strong&gt; — корпоративного справочника для всех писателей и редакторов, который применяется ко всему публикуемому контенту, и &lt;strong&gt;IBM Design Language&lt;/strong&gt;, который задаёт голос бренда. Голос (voice) остаётся узнаваемым, а тон (tone) адаптируется под ситуацию: тон сообщений об ошибках — экономный и прямой, тон onboarding-флоу — более дружелюбный и развёрнутый. Вы выстраиваете такую же связку для своей организации.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Обучение и менторство:&lt;/strong&gt; вы обучаете инженеров и писателей правилам стиля, проводите воркшопы, создаёте внутренние курсы. Senior-писатель «менторит и направляет других писателей, развивая навыки и обеспечивая adherence to best practices».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Стратегия локализации:&lt;/strong&gt; вы определяете, как стиль адаптируется для разных языков и культур. W3C Manual of Style, например, требует избегать идиом, специфичных для США или английского языка, выбирать примеры, отражающие глобальную аудиторию, и использовать locale-neutral представления данных — даты, числа, валюты. ISO House Style добавляет требование &lt;strong&gt;Plain English&lt;/strong&gt;: короткие предложения (не более 20 слов), одна идея на предложение, частые подзаголовки и списки, потому что документы читают не-носители языка и часто переводят.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Метрики стиля:&lt;/strong&gt; вы измеряете, как качество стиля влияет на метрики документации. Это не «нравится / не нравится», а &lt;strong&gt;data-driven обновления стайлгайда&lt;/strong&gt;: какие правила снижают время поиска, какие темы генерируют меньше тикетов, где readability scores улучшаются после правок. «Enhanced Style Guide» — это не статичный документ, а результат анализа performance-данных.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. PM-ы и инженеры приходят к вам за советом по стилю &lt;strong&gt;до&lt;/strong&gt; начала работы над фичей, потому что вы — тот, кто знает, как организация говорит с пользователем.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_base_style_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_base_style_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.w3.org/guide/manual-of-style/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;W3C Manual of Style&lt;/a&gt; - Пример редакционного стандарта для организации: grammar, spelling, punctuation, case, linking, accessibility, internationalization. Показывает, как выглядит живой стайлгайд, который обновляется и используется распределённой командой авторов и редакторов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.iso.org/ISO-house-style.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ISO House Style&lt;/a&gt; - Стандарт стиля для международной организации: Plain English, структура документов, терминология. Демонстрирует, как требования к ясности и переводимости встраиваются в формальный стандарт, обязательный для всех документов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.pearson.de/media/muster/ext/9780132118934.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The IBM Style Guide: Conventions for Writers and Editors&lt;/a&gt; - Пример корпоративного стайлгайда, который «помогает любой организации улучшить и стандартизировать контент across authors, delivery mechanisms, and geographic locations». Показывает, как связать язык, грамматику, форматирование и написание для глобальной аудитории в один исполнимый стандарт;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://carbondesignsystem.com/guidelines/content/overview/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;IBM Carbon Design System — Content guidelines&lt;/a&gt; - Пример связи voice и tone с продуктовым дизайном: IBM Style как корпоративный справочник, IBM Design Language как источник голоса бренда. Показывает, как документация и интерфейс используют один и тот же стандарт, но адаптируют тон под ситуацию;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://document360.com/blog/how-to-build-style-guides-that-enhances-the-customer-journey/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to build style guides with Marty Yu from CrowdStrike (Document360)&lt;/a&gt; - Подкаст о том, как Senior Technical Writer строит стайлгайд в реальной организации: рабочие группы, ownership, снижение decision fatigue, связь стайлгайда с customer journey и метриками;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Практическое руководство по созданию, измерению и поддержанию документации: шаблоны, процессы, принципы. Полезно для построения системы, в которой стайлгайд — часть жизненного цикла контента, а не отдельный документ;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://dl.acm.org/doi/book/10.5555/1190163\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Development: Managing Your Documentation Projects, Portfolio, and People (JoAnn T. Hackos)&lt;/a&gt; - Управление документацией в масштабе: портфель, зрелость процессов, качество, эффективность затрат. Помогает увидеть стайлгайд как элемент более широкой системы управления информацией, а не как «правила про запятые».&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_base_text_junior_junior-delyu-na-razdely-i-delayu-skaniruemym\" data-original-article=\"Roadmap/base/text/junior.html\"&gt;&lt;a href=\"#Roadmap_base_text_junior_junior-delyu-na-razdely-i-delayu-skaniruemym\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Делю на разделы и делаю сканируемым»&lt;/span&gt;&lt;/a&gt;Junior: «Делю на разделы и делаю сканируемым»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_base_text_junior\" id=\"Roadmap_base_text_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне структура текста — это &lt;strong&gt;дисциплина оформления&lt;/strong&gt;. Вы следуете шаблонам и не изобретаете велосипед. Ключевой сдвиг: вы перестаёте думать «как мне удобно писать» и начинаете думать «как читателю удобно искать». Пользователи не читают документацию линейно — они сканируют её в поисках ответа. Поэтому структура должна поддерживать &lt;strong&gt;сканирование&lt;/strong&gt; (scannability).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Логичная иерархия:&lt;/strong&gt; заголовки H1–H3, вложенные подразделы, группировка связанных тем. Каждый заголовок должен отвечать на вопрос читателя. Структура без заголовков — это «стена текста», которую пользователь покинет за 20–30 секунд. Иерархия должна быть интуитивной: пользователю не нужно учиться читать документацию, чтобы найти нужное.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Chunking:&lt;/strong&gt; разбиение контента на небольшие блоки с одной целью. Человеческая рабочая память удерживает 5±2 элемента — если раздел пытается объяснить пять разных вещей, читатель теряет нить. DQTI (Developing Quality Technical Information) подчёркивает: «Break up text into manageable chunks» и «Outline or chunk tasks and topics».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Инвертированная пирамида:&lt;/strong&gt; ключевая информация — в начале. Первый абзац должен содержать главный ответ, детали — ниже. В заголовках и первом предложении каждого абзаца — самое важное. Это принцип из журналистики, который работает и в технической документации: читатель должен понять суть, даже если прочитает только первый абзац.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Cross-references:&lt;/strong&gt; ссылки на связанные разделы («см. также», «для получения дополнительной информации»). На Junior вы используете их по шаблону, но понимаете, зачем они нужны: они помогают читателю перейти к нужной теме, не читая весь документ. Хорошая cross-reference — это не «см. раздел 5», а «см. раздел „Настройка аутентификации“».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Списки и таблицы:&lt;/strong&gt; когда использовать нумерованный список (последовательность шагов), когда маркированный (перечисление), когда таблицу (сравнение параметров). Нумерованный список говорит: «делай по порядку». Маркированный — «это равнозначные элементы». Таблица — «сравни эти параметры». Выбор неправильного формата сбивает читателя с толку.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Сканируемость:&lt;/strong&gt; вы используете пробелы, заголовки, списки и короткие абзацы, чтобы текст можно было быстро просмотреть. «Стена текста» — главный враг junior-писателя. Разбивайте длинные абзацы на короткие, используйте подзаголовки каждые 200–300 слов.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;следуете&lt;/strong&gt; структуре, заданной шаблоном. Если в проекте принята структура «Цель → Предпосылки → Шаги → Результат» — вы делаете именно так. Вы не изобретаете новую структуру, а применяете существующую.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_base_text_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_base_text_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - Фундаментальный курс: как организовывать информацию, как использовать заголовки, как строить абзацы. Раздел «Organizing information» даёт базовые принципы структурирования текста;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://learncoachassist.com/technical-writing-textbook/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing Textbook (LearnCoachAssist)&lt;/a&gt; - Учебник из 7 глав, включая «Document Structure and Information Design»: структура документа, информационный дизайн, организация контента. Даёт системное понимание того, как строится документация;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.litres.ru/book/maksim-ilyahov/pishi-sokraschay-kak-sozdavat-silnyy-tekst-20276938/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«Пиши, сокращай» (Максим Ильяхов, Людмила Сарычева)&lt;/a&gt; - Русскоязычная библия информационного стиля: как структурировать текст, чтобы он был читаемым. Главы о заголовках, списках и абзацах применимы к технической документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4302-6634-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;User Guides, Manuals, and Technical Writing (Adrian Wallwork)&lt;/a&gt; - Раздел «Structure and Content»: как писать различные секции мануала, какой контент включать, как организовать информацию для разных аудиторий. Написана специально для не-носителей английского;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.pearson.com/store/p/technical-communication-today/P100000855156\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Communication Today (Richard Johnson-Sheehan)&lt;/a&gt; - Учебник построен на принципе chunking: текст разбит на читаемые блоки с графикой. Показывает, как структура помогает читателю сканировать и находить информацию. Главы о заголовках, списках и визуальной организации;&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_base_text_middle_middle-proektiruyu-strukturu-i-adaptiruyu-pod-auditoriyu\" data-original-article=\"Roadmap/base/text/middle.html\"&gt;&lt;a href=\"#Roadmap_base_text_middle_middle-proektiruyu-strukturu-i-adaptiruyu-pod-auditoriyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Проектирую структуру и адаптирую под аудиторию»&lt;/span&gt;&lt;/a&gt;Middle: «Проектирую структуру и адаптирую под аудиторию»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_base_text_middle\" id=\"Roadmap_base_text_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне структура текста перестаёт быть просто «оформлением». Теперь это &lt;strong&gt;предмет проектирования&lt;/strong&gt;: вы выбираете тип иерархии, проектируете information architecture (IA) для продукта, применяете progressive disclosure и обеспечиваете findability. Ключевой сдвиг: вы перестаёте быть «тем, кто следует шаблону», и становитесь &lt;strong&gt;тем, кто создаёт структуру под конкретную аудиторию и задачу&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Information Architecture (IA):&lt;/strong&gt; вы понимаете, что IA — это организация, маркировка и связывание контента. Питер Морвиль сформулировал: «Findability precedes usability; you can’t use what you can’t find». IA упрощает сложную информацию, организуя её логически, последовательно и лаконично, что улучшает юзабилити и доступность цифровых продуктов.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Типы иерархий:&lt;/strong&gt; вы выбираете между &lt;strong&gt;task-based&lt;/strong&gt; (по задачам пользователя), &lt;strong&gt;role-based&lt;/strong&gt; (по ролям), &lt;strong&gt;system-based&lt;/strong&gt; (по архитектуре продукта) и &lt;strong&gt;tier-based&lt;/strong&gt; (по уровням доступа) в зависимости от продукта и аудитории. Вы понимаете, что иерархия должна быть интуитивной (пользователю не нужно учиться читать документацию), контекстуальной (каждый заголовок отвечает на вопрос пользователя) и гибкой (выдерживает добавление новой информации без полной перестройки).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Progressive disclosure:&lt;/strong&gt; вы слоями раскрываете информацию: сначала — базовую, потом — детали. Это особенно важно для мобильных интерфейсов и для документации, которую читают выборочно. В DQTI (Developing Quality Technical Information) это описывается как «apply a pattern for disclosing information».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Chunking и управление когнитивной нагрузкой:&lt;/strong&gt; вы разбиваете контент на управляемые блоки, чтобы снизить когнитивную нагрузку и улучшить удержание пользователей. DQTI подчёркивает: «Break up text into manageable chunks» и «Outline or chunk tasks and topics».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Аудиторный анализ и структура:&lt;/strong&gt; вы понимаете, что структура для новичка и для эксперта отличается. Новичку нужен пошаговый туториал, эксперту — плотный reference. Вы проектируете структуру под конкретную аудиторию, используя принципы IA: user (потребности, цели, ментальные модели), content (структура, организация, маркировка) и context (среда, в которой пользователь обращается к информации).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Масштабируемость:&lt;/strong&gt; вы проектируете структуру так, чтобы она выдерживала добавление новых разделов без полной реорганизации. «Docs for Developers» подчёркивает: «Organize larger sets of documentation to help users find the right information at the right time». Вы смотрите на документацию как на «traversal» — путь пользователя от «getting started» через архитектурные концепции к решению конкретных задач.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;проектируете&lt;/strong&gt; структуру и &lt;strong&gt;объясняете&lt;/strong&gt; её. Вы отвечаете за то, чтобы документация была находима, сканируема и читаема для разных аудиторий.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_base_text_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_base_text_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://document360.com/blog/information-architecture-for-technical-writing/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Architecture for Technical Writing (Document360)&lt;/a&gt; - Практический гайд по IA: определение важных тем для установления иерархии, установление границ на основе тем, аудиторий и продуктовых линеек, определение уровней контента (Primary, Secondary, Tertiary). Показывает, как организовать контент по типу, а не по аудитории;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/TECH-OPSS/Technical-Writing-Masterclass-C/blob/main/Module%205.md\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing Masterclass — Module 5: Document Organization Techniques (TECH-OPSS)&lt;/a&gt; - Продвинутый модуль по IA: task-based, role-based, system-based и tier-based иерархии, progressive disclosure, chunking, выравнивание контента под технические workflow. Включает практические задания и brain teasers для применения;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/Technical-writing-mentorship-program/Technicalwritingcourse/blob/main/docs/technical-writing-course/Information-Architecture.mdx\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Architecture for Technical Writing Guide (Technical Writing Mentorship Program)&lt;/a&gt; - Полный модуль по IA: что такое IA, почему она важна, таксономия, ключевые принципы. Объясняет три элемента IA: user, content, context, и как они влияют на структуру документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://users.dcc.uchile.cl/~nbaloian/ArquitecturaDeLaInformacion/materialDeLAWeb/TriDoc2005-DQTI.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Developing Quality Technical Information (IBM)&lt;/a&gt; - Руководство по качеству технической информации: 9 характеристик, включая &lt;strong&gt;Organization&lt;/strong&gt; и &lt;strong&gt;Retrievability&lt;/strong&gt;. Разделы о chunking, progressive disclosure и о том, как «put information where users expect it». Помогает проектировать структуру на основе модели качества, а не интуиции;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7217-6\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Глава «Structuring sets of documentation»: как организовать большие наборы документации, чтобы пользователи находили нужное в нужный момент. Показывает, как проектировать IA и создавать «clear, well-lit paths through content»;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/information-architecture-4th/9781491913529/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Architecture: For the Web and Beyond (Rosenfeld, Morville, Arango)&lt;/a&gt; - Классика IA: организация, маркировка, навигация, поиск, метаданные. Даёт фундаментальное понимание компонентов IA, которые применимы к документации в масштабе.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_base_text_senior_senior-proektiruyu-arhitekturu-kontenta-i-upravlyayu-strukturoj-v-masshtabe\" data-original-article=\"Roadmap/base/text/senior.html\"&gt;&lt;a href=\"#Roadmap_base_text_senior_senior-proektiruyu-arhitekturu-kontenta-i-upravlyayu-strukturoj-v-masshtabe\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Проектирую архитектуру контента и управляю структурой в масштабе»&lt;/span&gt;&lt;/a&gt;Senior: «Проектирую архитектуру контента и управляю структурой в масштабе»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_base_text_senior\" id=\"Roadmap_base_text_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне структура текста — это &lt;strong&gt;элемент информационной архитектуры (IA) всей организации&lt;/strong&gt;. Вы не просто проектируете структуру для одного продукта, вы &lt;strong&gt;владеете структурой всего набора документации (docset)&lt;/strong&gt;: иерархией, навигацией, шаблонами, перелинковкой и discoverability. Ключевой сдвиг: вы перестаёте быть «тем, кто проектирует страницы», и становитесь &lt;strong&gt;тем, кто проектирует систему&lt;/strong&gt;, в которой тысячи страниц остаются находимыми и консистентными при масштабировании.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Владение structural IA и docset hierarchy:&lt;/strong&gt; вы отвечаете за иерархию всего набора документации (10 000+ объектов знаний), а не отдельных страниц. Вы проектируете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_base_text_senior_inline-code-id-jqpumkma\"&gt;docset hierarchies&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_base_text_senior_inline-code-id-t51buakt\"&gt;linking strategies&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_base_text_senior_inline-code-id-rx210t63\"&gt;navigation flows&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_base_text_senior_inline-code-id-03evkz7f\"&gt;content discoverability patterns&lt;/code&gt; — то, как пользователь перемещается по документации и находит нужное. DQTI относит это к характеристике &lt;strong&gt;Organization&lt;/strong&gt;: «Put information where users expect it».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Шаблонные системы и контент-модели:&lt;/strong&gt; вы создаёте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_base_text_senior_inline-code-id-o3uagkkd\"&gt;template systems&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_base_text_senior_inline-code-id-zqiazohf\"&gt;content frameworks&lt;/code&gt;, которые используются всеми авторами. Вы определяете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_base_text_senior_inline-code-id-d990zzrc\"&gt;structural patterns&lt;/code&gt; для больших документационных экосистем, чтобы новая страница автоматически получала правильную структуру, а не изобреталась заново. Это то, что DQTI называет «present similar information in a similar way».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Structured authoring и таксономия:&lt;/strong&gt; вы работаете с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_base_text_senior_inline-code-id-siwfypg9\"&gt;structured authoring methodologies&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_base_text_senior_inline-code-id-ix94fulx\"&gt;reusable component patterns&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_base_text_senior_inline-code-id-vao2betw\"&gt;metadata tagging&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_base_text_senior_inline-code-id-qyy2s1w6\"&gt;taxonomy alignment&lt;/code&gt;. Структура перестаёт быть «текстом с заголовками» и становится управляемой моделью: компоненты переиспользуются, метаданные связывают контент, таксономия обеспечивает консистентную категоризацию.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Retrievability и discoverability:&lt;/strong&gt; вы проектируете структуру не только для чтения, но и для &lt;strong&gt;нахождения&lt;/strong&gt;. DQTI выделяет &lt;strong&gt;Retrievability&lt;/strong&gt; как отдельную характеристику качества: «Guide users through the information» и «simplify search and retrievability». Вы отвечаете за то, чтобы структура выдерживала поисковые сценарии, а не только линейное чтение.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Кросс-продуктовая и кросс-языковая структура:&lt;/strong&gt; вы проектируете IA, которая выдерживает рост: новые продукты, языки, версии и команды. W3C Manual of Style требует, чтобы структура документов работала для глобальной аудитории и выдерживала интернационализацию. ISO House Style добавляет требование &lt;strong&gt;Plain English&lt;/strong&gt;: короткие предложения и абзацы, частые подзаголовки и списки, чтобы структура была читаемой для не-носителей языка и переводимой.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Governance структуры:&lt;/strong&gt; вы определяете, кто владеет структурой, как она ревьюится, как обрабатываются исключения и как изменения в структуре коммуницируются командам. Вы обучаете авторов работать в рамках структуры, а не перестраивать её под каждую задачу.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Метрики структуры:&lt;/strong&gt; вы измеряете эффективность IA: time-to-find, search success rate, navigation paths, глубина кликов до целевой страницы. Вы используете данные для &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_base_text_senior_inline-code-id-miho2h0w\"&gt;data-driven&lt;/code&gt; изменений структуры, а не «мне кажется, так логичнее».&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила структуры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Если новый автор открывает репозиторий и автоматически получает правильную иерархию, шаблон и навигацию — это ваша работа. Если структура ломается при добавлении нового продукта — это тоже ваша ответственность.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_base_text_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_base_text_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/information-architecture-4th/9781491913529/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Architecture: For the Web and Beyond (Rosenfeld, Morville, Arango)&lt;/a&gt; - Классика IA: организация, маркировка, навигация, поиск, метаданные. Главы об &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_base_text_senior_inline-code-id-f5cp1qo1\"&gt;Organization Systems&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_base_text_senior_inline-code-id-hew4zfmh\"&gt;Navigation Systems&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_base_text_senior_inline-code-id-k73yjblz\"&gt;Design for Finding&lt;/code&gt; дают фундаментальные модели, которые вы применяете к документации в масштабе, а не к отдельному сайту;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://users.dcc.uchile.cl/~nbaloian/ArquitecturaDeLaInformacion/materialDeLAWeb/TriDoc2005-DQTI.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Developing Quality Technical Information (IBM)&lt;/a&gt; - DQTI определяет &lt;strong&gt;Organization&lt;/strong&gt; и &lt;strong&gt;Retrievability&lt;/strong&gt; как отдельные характеристики качества. Главы об &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_base_text_senior_inline-code-id-n4bf4s1u\"&gt;Organization&lt;/code&gt; («Put information where users expect it») и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_base_text_senior_inline-code-id-qmcpkk2o\"&gt;Retrievability&lt;/code&gt; («Guide users through the information») дают язык и критерии для проектирования структуры в масштабе, а не «на глаз»;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/979-8-8688-2509-5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Глава «Organizing Documentation»: как организовывать большие наборы документации, чтобы пользователи находили нужное в нужный момент. Книга написана практиками из Google, Linux Foundation, Stripe и Monzo и даёт шаблоны и принципы, которые можно адаптировать под организацию[reference:14][reference:15];&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.w3.org/guide/manual-of-style/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;W3C Manual of Style&lt;/a&gt; - Пример редакционного стандарта для глобальной организации: интернационализация, доступность, структура документов. Показывает, как требования к структуре (заголовки, ссылки, представление данных) встраиваются в формальный стандарт, обязательный для распределённой команды авторов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.iso.org/ISO-house-style.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ISO House Style&lt;/a&gt; - Стандарт стиля для международной организации: &lt;strong&gt;Plain English&lt;/strong&gt;, короткие предложения и абзацы, частые подзаголовки и списки. Демонстрирует, как структура документа подчиняется требованиям читаемости и переводимости, а не только эстетике[reference:17][reference:18];&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://carbondesignsystem.com/guidelines/content/overview/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;IBM Carbon Design System — Content guidelines&lt;/a&gt; - Пример связи структуры контента с продуктовым дизайном: как голос бренда и тон адаптируются под ситуацию, а структура интерфейса и документации остаются согласованными. Полезно для кросс-функциональной работы с дизайнерами и продактами.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_base_english_junior_junior-pishu-ponyatno-i-sleduyu-standartam\" data-original-article=\"Roadmap/base/english/junior.html\"&gt;&lt;a href=\"#Roadmap_base_english_junior_junior-pishu-ponyatno-i-sleduyu-standartam\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Пишу понятно и следую стандартам»&lt;/span&gt;&lt;/a&gt;Junior: «Пишу понятно и следую стандартам»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_base_english_junior\" id=\"Roadmap_base_english_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне английский — это &lt;strong&gt;дисциплина&lt;/strong&gt;. Вы не изобретаете язык, а следуете установленным правилам: Simplified Technical English (ASD-STE100), Google/Microsoft style guides, внутренние стандарты. Ключевой сдвиг: вы перестаёте переводить с русского на английский и начинаете &lt;strong&gt;думать на английском&lt;/strong&gt; в терминах технической документации.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Грамматическая база (B2–C1):&lt;/strong&gt; уверенное владение временами (Present Simple, Past Simple, Present Perfect, Future Simple), модальными глаголами (must, should, can, may), пассивным залогом (но с пониманием, когда его избегать), условными предложениями. Требования к вакансиям: technical writer с опытом 0–1 года — Upper-Intermediate (B2).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Simplified Technical English (ASD-STE100):&lt;/strong&gt; базовое понимание контролируемого языка. STE — это набор из 53 правил и словарь из 864 одобренных слов, который делает технические тексты понятными для всех читателей. Вы знаете, что такое «one word — one meaning», «one instruction per sentence», и почему нельзя писать «check» вместо «verify».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Активный залог и императив:&lt;/strong&gt; вместо «The document should be saved by the user» — «Save the document». В процедурах каждый шаг начинается с глагола в повелительном наклонении. Конвертация пассивного залога в активный часто делает предложения короче и понятнее.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Краткость и точность:&lt;/strong&gt; удаление пустых слов («actually», «various», «certain»), усилений («very», «critically»), оговорок. Предложения — не более 20 слов, особенно в технических инструкциях. ISO House Style рекомендует Plain English: короткие предложения, одна идея на предложение, частые подзаголовки и списки, потому что документы читают не-носители языка и часто переводят.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Единообразие терминов:&lt;/strong&gt; если вы назвали кнопку «Settings» один раз, вы называете её так везде. Терминологические глоссарии Google и Microsoft содержат сотни тем по правильному написанию и использованию отраслевых терминов.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Различие между русским и английским техническим стилем:&lt;/strong&gt; русский технический стиль тяготеет к безличным конструкциям («Аудит проведён», «План должен быть направлен»), английский — к активному залогу и прямым конструкциям. Вы понимаете эту разницу и не переносите русские шаблоны в английский текст.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;следуете&lt;/strong&gt; правилам, а не устанавливаете их. Если в проекте принят Google Developer Documentation Style Guide — вы пишете по нему.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_base_english_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_base_english_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - Фундаментальный курс: активный залог, сильные глаголы, конкретные существительные, борьба с лишними словами. Доступен на английском, что само по себе — практика;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4302-6634-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«User Guides, Manuals, and Technical Writing» (Adrian Wallwork)&lt;/a&gt; - Книга, написанная &lt;strong&gt;специально для не-носителей английского&lt;/strong&gt;: структура мануала, ясный английский, типичные грамматические и лексические ошибки в мануалах. Разделы о структуре и контенте, ясном английском, типичных ошибках;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.asd-ste100.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ASD-STE100 Simplified Technical English (официальный стандарт)&lt;/a&gt; - Набор из 53 правил и 864 одобренных слов. Официальная копия доступна бесплатно на &lt;a href=\"http://asd-ste100.org\"&gt;asd-ste100.org&lt;/a&gt;. Учит писать так, чтобы текст был понятен не-носителям языка и легко переводился;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://archive.org/details/technicalwriting0000huck\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«Technical Writing and Professional Communication for Nonnative Speakers of English» (Huckin, Olsen)&lt;/a&gt; - Разработан для не-носителей: процесс написания, кейсы, упражнения. Классика жанра, которая помогает понять, какие конструкции работают в английском техническом тексте, а какие — нет;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/style\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Developer Documentation Style Guide&lt;/a&gt; - Эталонный стайлгайд: tone and content, language and grammar, word list. Разделы «Highlights» и «Word list» — обязательны для Junior. Помогает понять, какие термины использовать и как писать для глобальной аудитории;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://learn.microsoft.com/en-us/style-guide/welcome/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Microsoft Writing Style Guide&lt;/a&gt; - Второй эталонный стайлгайд: более 300 тем по терминологии, бренд-голос, accessibility, локализация. Раздел «Top 10 tips» — быстрый старт для Junior.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_base_english_middle_middle-formuliruyu-pravila-i-adaptiruyu-yazyk\" data-original-article=\"Roadmap/base/english/middle.html\"&gt;&lt;a href=\"#Roadmap_base_english_middle_middle-formuliruyu-pravila-i-adaptiruyu-yazyk\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Формулирую правила и адаптирую язык»&lt;/span&gt;&lt;/a&gt;Middle: «Формулирую правила и адаптирую язык»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_base_english_middle\" id=\"Roadmap_base_english_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне английский перестаёт быть просто «языком, на котором я пишу». Теперь это &lt;strong&gt;предмет решений&lt;/strong&gt;: какой стайлгайд использовать, как адаптировать язык под аудиторию, как формулировать правила для команды, как разрешать спорные случаи. Ключевой сдвиг: вы перестаёте быть «тем, кто следует чужим правилам», и становитесь &lt;strong&gt;тем, кто создаёт правила для своей команды&lt;/strong&gt; и обеспечивает их соблюдение.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Уровень C1–C2:&lt;/strong&gt; требования к middle и senior technical writer — C1 или C2 (fluent/proficient) в письменном и устном английском.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Выбор и адаптация стайлгайда:&lt;/strong&gt; вы понимаете разницу между Google Developer Documentation Style Guide (фокус на developer-аудитории, «knowledgeable friend», консистентность) и Microsoft Writing Style Guide (более 300 тем по терминологии, бренд-голос, accessibility, локализация). Вы можете обосновать выбор для конкретного проекта и адаптировать его под продукт.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Global English:&lt;/strong&gt; вы адаптируете язык для глобальной аудитории: избегаете идиом, культурных отсылок, военных и спортивных метафор. Используете короткие предложения, простые конструкции, явные синтаксические связи. The Global English Style Guide (John R. Kohl) — ключевой ресурс: он объясняет, как писать документацию, оптимизированную для не-носителей, переводчиков и машинного перевода.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Управление терминологией:&lt;/strong&gt; вы ведёте глоссарий, определяете, какие термины переводить, какие оставлять на английском, как адаптировать терминологию для локализации. Microsoft Writing Style Guide содержит более 300 тем по терминологии, которые можно использовать как основу.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Формулирование правил:&lt;/strong&gt; вы создаёте внутренний стайлгайд для команды: какие термины использовать, какой тон, какие конструкции запрещены. Вы адаптируете Google/Microsoft под продукт, а не копируете их целиком.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Ревью и обучение:&lt;/strong&gt; вы проверяете тексты других авторов на соответствие стилю и даёте конструктивный фидбек. Вы не просто исправляете, а объясняете, почему это важно.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Интеграция стиля в процесс:&lt;/strong&gt; вы понимаете, как встроить проверку стиля в CI (Vale), чтобы правила соблюдались автоматически. Write Better with Vale (Brian P. Hogan) — практическое руководство по превращению стайлгайда в исполняемые правила.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;формулируете&lt;/strong&gt; правила и &lt;strong&gt;объясняете&lt;/strong&gt; их. Вы отвечаете за то, чтобы команда писала единообразно, даже если авторов несколько.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_base_english_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_base_english_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.amazon.com/Global-English-Style-Guide-Documentation/dp/0131477498\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The Global English Style Guide (John R. Kohl)&lt;/a&gt; - Классика жанра: как писать документацию, оптимизированную для не-носителей, переводчиков и машинного перевода. Главы об упрощении стиля, ясности модификаторов, пунктуации. Помогает адаптировать язык для глобальной аудитории;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.asd-ste100.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ASD-STE100 Simplified Technical English — Basic Course for Technical Writers (UNINETTUNO)&lt;/a&gt; - Официальный сертифицированный курс: 9 видеоуроков, от терминологии и грамматики до процедурного и описательного письма. Даёт структурированное понимание контролируемого языка и его применения в технической документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://be-english.com.ua/english-for-technical-writing/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;English for Technical Writing (be-english.com.ua)&lt;/a&gt; - Корпоративный курс для технических писателей с B1–B2: письмо для software products, user manuals, communication с инженерами. Практический курс, ориентированный на реальные задачи технического писателя;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4302-6634-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«User Guides, Manuals, and Technical Writing» (Adrian Wallwork, главы 2–4)&lt;/a&gt; - Разделы о ясном английском, типичных грамматических ошибках, layout и порядке информации. Написана специально для не-носителей английского, помогает избежать типичных ошибок в мануалах;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/two\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing Two&lt;/a&gt; - Продолжение Technical Writing One: продвинутые темы по стилю, редактированию и ревью. Помогает перейти от «пишу понятно» к «пишу так, чтобы команда писала единообразно»;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.pearson.com/store/p/technical-english/P100000855156\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«Technical English» (Pearson, 8-е издание)&lt;/a&gt; - Пошаговое руководство по технической коммуникации: research, employment, grammatical usage. Учебник для тех, кто хочет системно проработать грамматику и лексику технического английского.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_base_english_senior_senior-sozdayu-standart-i-obuchayu-drugih\" data-original-article=\"Roadmap/base/english/senior.html\"&gt;&lt;a href=\"#Roadmap_base_english_senior_senior-sozdayu-standart-i-obuchayu-drugih\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Создаю стандарт и обучаю других»&lt;/span&gt;&lt;/a&gt;Senior: «Создаю стандарт и обучаю других»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_base_english_senior\" id=\"Roadmap_base_english_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне английский — это &lt;strong&gt;элемент организационной культуры&lt;/strong&gt;. Вы не просто выбираете стайлгайд для команды, вы &lt;strong&gt;определяете, как язык вписывается в общую стратегию&lt;/strong&gt;: как связаны стиль документации, стиль интерфейса и стиль маркетинга, как обеспечивается консистентность между командами и продуктами, как обучать инженеров писать понятно на английском. Ключевой сдвиг: вы перестаёте быть «тем, кто пишет по правилам», и становитесь &lt;strong&gt;тем, кто создаёт правила для организации&lt;/strong&gt; и отвечает за их соблюдение в масштабе.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Уровень C2 (native or near-native):&lt;/strong&gt; требования к senior technical writer — C2 или native-level proficiency в письменном и устном английском.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Создание org-wide стайлгайда:&lt;/strong&gt; вы создаёте стандарт английского языка для всей организации, который используется несколькими командами. Вы определяете, как обрабатывать исключения, как проводить ревью, как обучать новых авторов. Ваш стайлгайд должен быть исполнимым: он либо встроен в Vale и CI, либо не работает.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Governance и стандарты:&lt;/strong&gt; вы определяете политику языка: какие термины обязательны, какие запрещены, как адаптировать язык для локализации, как обеспечивать accessibility. W3C Manual of Style и ISO House Style — примеры того, как формальные стандарты встраивают требования к ясности и переводимости в обязательные правила.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Кросс-функциональная работа:&lt;/strong&gt; вы согласовываете стиль документации со стилем интерфейса (UX writing), стилем маркетинга, стилем внутренних коммуникаций. IBM строит контентные гайдлайны на основе IBM Style (корпоративный справочник) и IBM Design Language (голос бренда): голос остаётся узнаваемым, а тон адаптируется под ситуацию.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Обучение и менторство:&lt;/strong&gt; вы обучаете инженеров и писателей правилам английского технического стиля, проводите воркшопы, создаёте внутренние курсы. Senior-писатель «менторит и направляет других писателей, развивая навыки и обеспечивая adherence to best practices».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Стратегия локализации:&lt;/strong&gt; вы определяете, как английский стиль адаптируется для разных языков и культур, какие термины переводятся, какие остаются. The Global English Style Guide (продвинутые главы) даёт инструменты для написания текстов, которые легко переводятся и понятны не-носителям.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Метрики стиля:&lt;/strong&gt; вы измеряете, как качество английского влияет на качество документации: time-to-find, support tickets, CSAT. Вы используете данные для обновления стайлгайда, а не для «отчёта ради отчёта».&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. PM-ы и инженеры приходят к вам за советом по английскому стилю &lt;strong&gt;до&lt;/strong&gt; начала работы над фичей, потому что вы — тот, кто знает, как организация говорит с пользователем.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_base_english_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_base_english_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.amazon.com/Global-English-Style-Guide-Documentation/dp/0131477498\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«The Global English Style Guide» (John R. Kohl, продвинутые главы)&lt;/a&gt; - Главы о controlled-authoring software, корпоративных стандартах, revision strategies. Помогает строить систему, в которой английский стиль оптимизирован для перевода и понятен глобальной аудитории;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.asd-ste100.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ASD-STE100 Simplified Technical English — Advanced Course (UNINETTUNO)&lt;/a&gt; - Продвинутый курс: процедурное и описательное письмо, safety instructions, punctuation, writing practices. Даёт глубокое понимание контролируемого языка и его применения в критических документах;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Главы о стратегии документации, стиле и обучении команды: как строить стандарты в масштабе, как измерять эффективность, как работать с инженерами;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://archive.org/details/technicalwriting0000huck\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«Technical Writing and Professional Communication» (Huckin, Olsen, продвинутые главы)&lt;/a&gt; - Главы о research, case studies, professional communication для не-носителей. Помогает понять, как адаптировать английский текст под разные аудитории и задачи;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.iso.org/standard/78176.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ISO/IEC 25010:2023&lt;/a&gt; - Стандарт качества ПО, включая usability и learnability: как язык влияет на эти характеристики. Полезно для обоснования требований к стилю на уровне организации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации в целом, включая язык, стиль и governance. Справочник, который можно использовать как основу для внутренних стандартов.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metod_tutorial_junior_junior-razlichayu-i-pishu-po-shablonu\" data-original-article=\"Roadmap/metod/tutorial/junior.html\"&gt;&lt;a href=\"#Roadmap_metod_tutorial_junior_junior-razlichayu-i-pishu-po-shablonu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Различаю и пишу по шаблону»&lt;/span&gt;&lt;/a&gt;Junior: «Различаю и пишу по шаблону»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metod_tutorial_junior\" id=\"Roadmap_metod_tutorial_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне вы учитесь &lt;strong&gt;различать&lt;/strong&gt; how-to и tutorial и писать оба типа по готовым шаблонам. Ключевой сдвиг: вы перестаёте писать «инструкцию вообще» и начинаете осознанно выбирать формат под задачу читателя.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание разницы:&lt;/strong&gt; tutorial учит (читатель не знает ничего), how-to решает (читатель знает контекст). Tutorial — это обучающий опыт для новичка, how-to — практическое руководство для опытного пользователя.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Структура tutorial:&lt;/strong&gt; заголовок начинается с глагола («Создайте первый REST API»), структура — Goal → Prerequisites → Numbered steps → Immediate verifiable result at each step → Final outcome.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Структура how-to:&lt;/strong&gt; заголовок формулируется как задача («Как настроить X»), структура — Goal statement → Assumptions/prerequisites → Numbered steps → Expected result.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Шаблоны:&lt;/strong&gt; вы используете готовые шаблоны для обоих типов: Overview → Prerequisites → Steps → Examples → Troubleshooting.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Проверка на работоспособность:&lt;/strong&gt; вы тестируете свой tutorial или how-to, проходя по шагам самостоятельно.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;следуете&lt;/strong&gt; шаблону и осознанно выбираете формат под задачу читателя.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metod_tutorial_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_metod_tutorial_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - База: аудитория, активный залог, списки, структура. В Technical Writing Two есть раздел о создании примеров для туториалов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://diataxis.fr/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diátaxis Framework&lt;/a&gt; - Официальный фреймворк: различие между tutorials и how-to guides, принципы каждого типа;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://about.gitlab.com/handbook/product/ux/technical-writing/fundamentals/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitLab Technical Writing Fundamentals Course&lt;/a&gt; - Четыре вводных видео о типах топиков, грамматике и стилевых требованиях;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://ubuntu.com/blog/the-idea-of-a-tutorial\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The idea of a tutorial (Ubuntu Blog)&lt;/a&gt; - Глубокое объяснение разницы между tutorial и how-to: tutorial — обучение, how-to — применение навыка;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/wongyah/awesome-technical-writing-learning\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Awesome Technical Writing Learning (GitHub)&lt;/a&gt; - Кураторский список бесплатных ресурсов по техническому писательству.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metod_tutorial_middle_middle-proektiruyu-pod-auditoriyu-i-svyazyvayu-tipy\" data-original-article=\"Roadmap/metod/tutorial/middle.html\"&gt;&lt;a href=\"#Roadmap_metod_tutorial_middle_middle-proektiruyu-pod-auditoriyu-i-svyazyvayu-tipy\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Проектирую под аудиторию и связываю типы»&lt;/span&gt;&lt;/a&gt;Middle: «Проектирую под аудиторию и связываю типы»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metod_tutorial_middle\" id=\"Roadmap_metod_tutorial_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне вы перестаёте писать «по шаблону» и начинаете &lt;strong&gt;проектировать&lt;/strong&gt; документацию под конкретную аудиторию. Вы понимаете, что tutorial и how-to — это не изолированные документы, а части единой системы обучения пользователя.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Проектирование tutorial как единого пути:&lt;/strong&gt; в Diátaxis tutorial — это «one true path»: один tutorial на продукт, который ведёт новичка от нуля до базовой компетенции.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Связывание типов:&lt;/strong&gt; tutorial может содержать несколько how-to, а how-to — ссылаться на reference. Вы проектируете навигацию: tutorial → how-to → reference.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Адаптация под аудиторию:&lt;/strong&gt; для разработчиков tutorial может быть плотнее, для конечных пользователей — проще. Тон и глубина объяснений варьируются.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация:&lt;/strong&gt; вы проверяете tutorial на реальных новичках, собираете обратную связь, итерируете. Tutorial считается успешным, если новичок может пройти его без внешней помощи.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность tutorial и how-to: completion rate, time-to-complete, support tickets.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;проектируете&lt;/strong&gt; под аудиторию и &lt;strong&gt;связываете&lt;/strong&gt; типы в единую систему.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metod_tutorial_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_metod_tutorial_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://diataxis.fr/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diátaxis Framework — Applying Diátaxis&lt;/a&gt; - Продвинутое применение: как выбирать тип, как связывать, как итерировать;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/two\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing Two&lt;/a&gt; - Продвинутые темы: создание примеров кода для tutorial, антипримеры, диапазон сложности;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://users.dcc.uchile.cl/~nbaloian/ArquitecturaDeLaInformacion/materialDeLAWeb/TriDoc2005-DQTI.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Developing Quality Technical Information (IBM)&lt;/a&gt; - Главы о проектировании tutorial и how-to, progressive disclosure, валидация;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://mintlify.com/blog/documentation-content-types\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mintlify: Documentation Content Types&lt;/a&gt; - Практические рекомендации: как писать tutorial и how-to, шаблоны, примеры;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, работа с аудиторией, измерение эффективности.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metod_tutorial_senior_senior-opredelyayu-standart-i-masshtabiruyu\" data-original-article=\"Roadmap/metod/tutorial/senior.html\"&gt;&lt;a href=\"#Roadmap_metod_tutorial_senior_senior-opredelyayu-standart-i-masshtabiruyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и масштабирую»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и масштабирую»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metod_tutorial_senior\" id=\"Roadmap_metod_tutorial_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне tutorial и how-to становятся &lt;strong&gt;элементами стратегии документации&lt;/strong&gt;. Вы определяете, как эти типы вписываются в общую систему обучения пользователя, как они масштабируются на несколько продуктов и команд.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия типов документации:&lt;/strong&gt; вы определяете, как tutorial, how-to, reference и explanation работают вместе для каждого продукта.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: какие типы обязательны для каждого продукта, как проверять качество, как поддерживать актуальность.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых продуктов, языков, версий без полной перестройки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Кросс-продуктовые tutorial:&lt;/strong&gt; вы обеспечиваете, чтобы tutorial для одного продукта связывался с tutorial для другого, не теряя контекст.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды принципам Diátaxis, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность tutorial и how-to на уровне организации: time-to-first-success, support tickets, retention.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metod_tutorial_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_metod_tutorial_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://diataxis.fr/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diátaxis Framework — Diátaxis as a guide to work&lt;/a&gt; - Продвинутое применение фреймворка: как использовать Diátaxis как руководство, а не план;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/information-architecture-4th/9781491913529/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Information Architecture: For the Web and Beyond (Rosenfeld, Morville, Arango)&lt;/a&gt; - Классика IA: организация, навигация, связывание типов контента;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации в целом, включая типы контента и governance;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.macmillanlearning.com/college/us/product/Technical-Communication/p/1319248727\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Communication (Mike Markel)&lt;/a&gt; - Главы о проектировании документов, аудиторном анализе, валидации.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metod_reference_junior_junior-znayu-strukturu-i-pishu-po-shablonu\" data-original-article=\"Roadmap/metod/reference/junior.html\"&gt;&lt;a href=\"#Roadmap_metod_reference_junior_junior-znayu-strukturu-i-pishu-po-shablonu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Знаю структуру и пишу по шаблону»&lt;/span&gt;&lt;/a&gt;Junior: «Знаю структуру и пишу по шаблону»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_metod_reference_junior\" id=\"Roadmap_metod_reference_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне вы учитесь &lt;strong&gt;распознавать&lt;/strong&gt; reference и писать его по готовому шаблону. Ключевой сдвиг: вы перестаёте «объяснять» в справочнике и начинаете &lt;strong&gt;каталогизировать факты&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание сути reference:&lt;/strong&gt; это полный каталог фактов о чём-либо: API endpoints, параметры, настройки, коды ошибок, глоссарий.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Структура reference:&lt;/strong&gt; каждый элемент (функция, параметр, команда) следует одному и тому же паттерну: Name → Type → Description → Parameters (таблица: Name, Type, Default, Description) → Returns → Examples → Notes.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Таблицы и списки:&lt;/strong&gt; reference должен быть сканируемым. Параметры описываются в таблицах, а не в прозе.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Точность:&lt;/strong&gt; информация должна быть проверена по реальной системе. Reference не может быть «примерно верным».&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Отсутствие редактуры:&lt;/strong&gt; никаких оценочных суждений («эта опция лучше»), никаких tutorial-объяснений. Только факты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Примеры:&lt;/strong&gt; минимально полезный пример для каждого элемента — как вызвать функцию, как выглядит ответ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;пишете reference по шаблону&lt;/strong&gt;, не добавляя редактуры и оценочных суждений.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_metod_reference_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_metod_reference_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://diataxis.fr/reference/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diátaxis Framework — Reference&lt;/a&gt; - Официальное описание reference: техническое описание фактов, нейтральность, структура, отражающая архитектуру системы;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ann-kilzer/doc-types-guide\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Doc Types Guide (GitHub)&lt;/a&gt; - Шаблон reference с примером: Name → Type → Description → Parameters → Returns → Examples → Notes;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - База: аудитория, структура, точность. Разделы о таблицах и списках применимы к reference;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://engineering.homeoffice.gov.uk/patterns/documentation/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write effective documentation (Home Office)&lt;/a&gt; - Разделение контента на conceptual, task-based и reference; рекомендации по структуре;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://about.gitlab.com/handbook/product/ux/technical-writing/fundamentals/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitLab Technical Writing Fundamentals&lt;/a&gt; - Типы топиков, включая reference; грамматика и стилевые требования.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_metod_reference_middle_middle-proektiruyu-strukturu-i-svyazyvayu-s-sistemoj\" data-original-article=\"Roadmap/metod/reference/middle.html\"&gt;&lt;a href=\"#Roadmap_metod_reference_middle_middle-proektiruyu-strukturu-i-svyazyvayu-s-sistemoj\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hi
