        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"middle-upravlyayu-processom-i-vystraivayu-dolgosrochnye-otnosheniya\"&gt;&lt;a href=\"Roadmap/comunication/sme/middle.html#middle-upravlyayu-processom-i-vystraivayu-dolgosrochnye-otnosheniya\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Управляю процессом и выстраиваю долгосрочные отношения»&lt;/span&gt;&lt;/a&gt;Middle: «Управляю процессом и выстраиваю долгосрочные отношения»&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне интервью с SME перестаёт быть разовым мероприятием. Теперь это &lt;strong&gt;часть выстроенного процесса&lt;/strong&gt;: вы управляете циклом коллаборации, знаете типы SME и адаптируете подход под каждого, а также выстраиваете доверие, чтобы инженеры сами приходили к вам с информацией.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Управление жизненным циклом коллаборации:&lt;/strong&gt; вы понимаете и управляете полным циклом: Pre-interview Research → Initial Meeting → Interview Sessions → Drafting → SME Review → Revision → Sign-off.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Адаптация под типы SME:&lt;/strong&gt; вы понимаете, что Product SME (PM, UX), Technical SME (разработчики, архитекторы), Operational SME (поддержка, SRE) и Regulatory SME (комплаенс, юристы) требуют разных подходов.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Работа с персонами:&lt;/strong&gt; вы адаптируете коммуникацию под конкретного эксперта. Backend-разработчик предпочитает техническую краткость и ожидает понимания JSON. PM фокусируется на user journey и предпочитает flowchart.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Эффективное использование времени SME:&lt;/strong&gt; вы проводите тщательное исследование до интервью и исключаете вопросы, на которые можно ответить самостоятельным изучением. Вы используете стратегический «позвоночник вопросов» на основе пяти W и H.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Проверка через процедуры:&lt;/strong&gt; вы проходите процедуры вживую, действуя как прокси для конечного пользователя, и задаёте уточняющие вопросы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Работа с трудными SME:&lt;/strong&gt; вы умеете перенаправлять разговор обратно к теме, повторять то, что сказал эксперт, чтобы получить более развёрнутый ответ.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Итеративная валидация:&lt;/strong&gt; вы развиваете контент через итеративную валидацию и циклы ревью, которые сохраняют целостность контента.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;управляете процессом и строите отношения&lt;/strong&gt;. Со временем ваша позиция меняется: инженеры начинают предвидеть ваши вопросы, вовлекают вас раньше, и вы учитесь извлекать нужную информацию.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-middle\"&gt;&lt;a href=\"Roadmap/comunication/sme/middle.html#kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/TECH-OPSS/Technical-Writing-Masterclass-C/blob/main/Module%2010.md\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TECH-OPSS Technical-Writing-Masterclass-C: Module 10 (GitHub, продвинутые разделы)&lt;/a&gt; - Продвинутые разделы: персоны SME, цикл коллаборации, работа с challenging scenarios;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://podscan.fm/podcasts/technical-writing-success/episodes/how-to-interview-an-sme-without-wasting-their-time-or-yours\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to Interview an SME Without Wasting Their Time (or Yours) (Technical Writing Success Podcast)&lt;/a&gt; - Фреймворк: rigorous pre-interview research, strategic question spine (5 Ws + H), walking through procedures live;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www2.gov.bc.ca/gov/content/governments/services-for-government/service-experience-digital-delivery/digital-delivery/digital-content/writing-content/interview-subject-matter-experts\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Interview subject matter experts (Government of British Columbia)&lt;/a&gt; - Практические рекомендации: не принимать мнения за факты, подтверждать данные, понимать аудиторию;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, работа с разработчиками, измерение эффективности;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://payhip.com/b/5QZ2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Extracting Technical Knowledge from BUSY SMEs (Payhip)&lt;/a&gt; - Специализированная книга: Asking Better Questions, Pre-SME Preparation, Interview Shortcuts, Validating Asynchronously.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/comunication/sme/middle.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Middle: «Управляю процессом и выстраиваю долгосрочные отношения»","href":"Roadmap/comunication/sme/middle.html#middle-upravlyayu-processom-i-vystraivayu-dolgosrochnye-otnosheniya","level":2,"items":[{"title":"Курсы и книги (Middle)","href":"Roadmap/comunication/sme/middle.html#kursy-i-knigi-middle","level":3}]}],"title":""},"router":{"pathname":"Roadmap/comunication/sme/middle","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
