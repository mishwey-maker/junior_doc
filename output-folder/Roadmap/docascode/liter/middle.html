        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"middle-nastraivayu-lintery-i-avtomatiziruyu-proverki\"&gt;&lt;a href=\"Roadmap/docascode/liter/middle.html#middle-nastraivayu-lintery-i-avtomatiziruyu-proverki\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Настраиваю линтеры и автоматизирую проверки»&lt;/span&gt;&lt;/a&gt;Middle: «Настраиваю линтеры и автоматизирую проверки»&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне линтеры перестают быть просто «инструментами, которые находят ошибки». Теперь это &lt;strong&gt;предмет настройки&lt;/strong&gt;: вы выбираете правила, создаёте кастомные конфигурации, интегрируете линтеры в CI/CD и обеспечиваете, чтобы команда работала по единым стандартам.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Настройка markdownlint:&lt;/strong&gt; вы создаёте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1b5r6czz\"&gt;.markdownlint.yaml&lt;/code&gt; с правилами, адаптированными под проект. Вы понимаете, какие правила можно отключить: MD013 (длина строки) часто отключается для таблиц и длинных URL, MD024 (дублирующиеся заголовки) — для changelog. Вы настраиваете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gz934t11\"&gt;markdownlint-cli2&lt;/code&gt; для проверки конкретных папок.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Настройка Vale:&lt;/strong&gt; вы создаёте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-18hhw8cg\"&gt;.vale.ini&lt;/code&gt; с указанием стилей. Вы подключаете готовые стили (Google, Microsoft, write-good, proselint) и создаёте кастомные правила. Пример кастомного правила: запрет на «simply», «just», «obviously», «easy» — слова, которые создают предположение о лёгкости задачи.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Настройка cspell:&lt;/strong&gt; вы создаёте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r8m98h00\"&gt;cspell.json&lt;/code&gt; с кастомным словарём для технических терминов, названий продуктов, аббревиатур. Вы понимаете, как игнорировать определённые пути и типы файлов.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Настройка проверки ссылок:&lt;/strong&gt; вы выбираете инструмент: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gcfypbia\"&gt;lychee&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ph39xx0p\"&gt;linkinator&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yrvh8ebi\"&gt;markdown-link-check&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ontifhwp\"&gt;mlc&lt;/code&gt;. Вы настраиваете конфигурацию: таймауты, повторные попытки, игнорирование определённых доменов.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Интеграция в CI/CD:&lt;/strong&gt; вы настраиваете GitHub Actions (или GitLab CI) так, чтобы все проверки запускались при каждом PR: markdownlint → Vale → cspell → link check → build. Если любая проверка падает — PR не может быть смержен.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Pre-commit hooks:&lt;/strong&gt; вы настраиваете pre-commit для всей команды, чтобы линтеры запускались локально перед коммитом. Это снижает количество «красных» CI-сборок.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Управление правилами:&lt;/strong&gt; вы определяете, какие правила обязательны (error), какие — рекомендательны (warning), какие — отключены. Вы документируете это в стайлгайде.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;настраиваете и автоматизируете&lt;/strong&gt;. Вы отвечаете за то, чтобы линтеры были настроены под проект и помогали команде, а не мешали.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-middle\"&gt;&lt;a href=\"Roadmap/docascode/liter/middle.html#kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://books.google.com/books/about/Write_Better_with_Vale.html?id=nMabEQAAQBAJ\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write Better with Vale (Brian P. Hogan)&lt;/a&gt; - Единственная книга, целиком посвящённая Vale: как превратить стайлгайд в исполняемые правила, как настраивать &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x2cclb80\"&gt;.vale.ini&lt;/code&gt;, как интегрировать в CI. Использует Vale 3.12.0+;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.spectrocloud.com/blog/scaling-writing-practices-with-vale-sh\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Scaling Writing Practices with Vale.sh (Spectro Cloud)&lt;/a&gt; - Реальный кейс: как команда внедрила Vale, какие правила создала, как масштабировала. Пример кастомного правила против «simply»;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/elastic/vale-rules\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Elastic vale-rules (GitHub)&lt;/a&gt; - Готовый набор правил Vale от Elastic: примеры кастомных правил, настройка per-repo overrides, интеграция с GitHub Actions;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/DavidAnson/markdownlint/blob/main/doc/Configuration.md\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;markdownlint Configuration (GitHub)&lt;/a&gt; - Примеры &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lgsyi3p9\"&gt;.markdownlint.yaml&lt;/code&gt; для документационных проектов: адаптация правил под реальные задачи;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ann-kilzer/documentation-lifecycle-guide\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Documentation Lifecycle Management Guide (GitHub)&lt;/a&gt; - Полный workflow: Write → Lint → Review → Publish → Audit. Включает pre-commit hooks и CI-интеграцию.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/docascode/liter/middle.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Middle: «Настраиваю линтеры и автоматизирую проверки»","href":"Roadmap/docascode/liter/middle.html#middle-nastraivayu-lintery-i-avtomatiziruyu-proverki","level":2,"items":[{"title":"Курсы и книги (Middle)","href":"Roadmap/docascode/liter/middle.html#kursy-i-knigi-middle","level":3}]}],"title":""},"router":{"pathname":"Roadmap/docascode/liter/middle","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
