    <body class="g-root g-root_theme_light">

        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Возможности макроса:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;сканирует весь документ и находит слова, состоящие полностью из заглавных букв (длиной от 2 символов);&lt;/li&gt;\n&lt;li&gt;игнорирует слова в стилях «Заголовок» (чтобы слова вроде «ВВЕДЕНИЕ» или «INTRODUCTION» не попали в список);&lt;/li&gt;\n&lt;li&gt;очищает найденные слова от знаков препинания;&lt;/li&gt;\n&lt;li&gt;сортирует их по алфавиту и создаёт аккуратную таблицу из двух столбцов;&lt;/li&gt;\n&lt;li&gt;выполняет расшифровку в рамках заданного словаря-источника.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"predvaritelnye-nastrojki\"&gt;&lt;a href=\"useful/Macword.html#predvaritelnye-nastrojki\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Предварительные настройки&lt;/span&gt;&lt;/a&gt;Предварительные настройки&lt;/h2&gt;\n&lt;p&gt;В MS Word должна быть включена функция разработчика. Для этого необходимо нажать на панели инструментов кнопку \"Файл\".&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"useful/image.png\" alt=\"Кнопка &amp;quot;Файл&amp;quot;\" /&gt;&lt;/p&gt;\n&lt;p&gt;Выбрать в меню \"Параметры\"&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"useful/image-1.png\" alt=\"alt text\" /&gt;&lt;/p&gt;\n&lt;p&gt;Выбрать раздел \"Настроить ленту\" и установить чек-бокс \"Разработчик\". Нажать кнопку \"Ок\" для сохранения изменений.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"useful/image-2.png\" alt=\"alt text\" /&gt;&lt;/p&gt;\n&lt;p&gt;Во избежание конфликтов, рекомендуется настроить доверенный доступ к объектной модели VBA.&lt;br /&gt;\nДля этого во вкладке разработчик следует выбрать пункт \"Безопасность макросов\" и установить чек-бокс \"Доверять доступ к объектной модели проектов VBA\".&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"useful/image-3.png\" alt=\"alt text\" /&gt;&lt;/p&gt;\n&lt;h2 id=\"ustanovka-i-zapusk-makrosa\"&gt;&lt;a href=\"useful/Macword.html#ustanovka-i-zapusk-makrosa\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка и запуск макроса&lt;/span&gt;&lt;/a&gt;Установка и запуск макроса&lt;/h2&gt;\n&lt;p&gt;В открытом документе нажмите комбинацию клавиш &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qhkqve9h\"&gt;Alt + F11&lt;/code&gt;. В результате отобразится редактор VBA. В верхнем меню выберите &lt;strong&gt;Insert &amp;gt; Module&lt;/strong&gt; (Вставка &amp;gt; Модуль).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"useful/image-4.png\" alt=\"alt text\" /&gt;&lt;/p&gt;\n&lt;p&gt;Для добавления макроса в следует скопировать приведённый код и вставить в модуль. Для сохранения изменений необходимо закрыть редактор VBA и вернуться в документ.&lt;/p&gt;\n&lt;p&gt;Чатобы запустить макрос следует нажать комбинацию клавиш &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3c3hj0uh\"&gt;Alt + F8&lt;/code&gt;, выбрать &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b7j20rxn\"&gt;GenerateAbbreviationsTable&lt;/code&gt; из списка и нажать кнопку &lt;strong&gt;Run&lt;/strong&gt; (Выполнить).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"useful/image-5.png\" alt=\"alt text\" /&gt;&lt;/p&gt;\n&lt;p&gt;В результате отобразится диалоговое окно с предложение создать резервную копию документа. Для создания копии следует нажать кнопку \"Да\", для продолжения без резервной копии – \"Нет\".&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"useful/image-6.png\" alt=\"alt text\" /&gt;&lt;/p&gt;\n&lt;p&gt;На следующем шаге отобразится окно для выбора словаря-источника с аббревиатурами и их расшифровками, на который будет полагаться макрос.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"useful/image-7.png\" alt=\"alt text\" /&gt;&lt;/p&gt;\n&lt;p&gt;Словарь необходимо подготовить в формате .xls. В словаре необходимо задать таблицу для абрревиатур. Макрос сравнивает слова из первой колонки с найденными сокращениями из документа. При наличии полной схожести добавляет расшифровку из второго столбца.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"useful/image-8.png\" alt=\"alt text\" /&gt;&lt;/p&gt;\n&lt;p&gt;В случае успешного выполнения отобразится диалоговое окно с указание количества найденных аббревиатур.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"useful/image-9.png\" alt=\"alt text\" /&gt;&lt;/p&gt;\n&lt;p&gt;В результате будет сформирована таблица аббревиатур, найденных в документе.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"useful/image-10.png\" alt=\"alt text\" /&gt;&lt;/p&gt;\n&lt;h2 id=\"kod-makrosa\"&gt;&lt;a href=\"useful/Macword.html#kod-makrosa\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Код макроса&lt;/span&gt;&lt;/a&gt;Код макроса&lt;/h2&gt;\n&lt;p&gt;Код макроса:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;\nOption Explicit\n\n' Флаг защиты от повторного запуска\nPrivate isRunning As Boolean\n\n' =====================================================================\n' ОСНОВНАЯ ПРОЦЕДУРА\n' =====================================================================\nPublic Sub GenerateAbbreviationsTable()\n    On Error GoTo ErrorHandler\n    \n    ' Защита от повторного запуска\n    If isRunning Then\n        MsgBox \"Макрос уже выполняется. Дождитесь завершения.\", vbInformation, \"Внимание\"\n        Exit Sub\n    End If\n    isRunning = True\n    \n    Application.ScreenUpdating = False\n    \n    Dim doc As Document\n    Set doc = ActiveDocument\n    \n    ' 1. Запрос на создание резервной копии\n    Dim backupAnswer As VbMsgBoxResult\n    backupAnswer = MsgBox(\"Рекомендуется создать резервную копию документа перед внесением изменений.\" &amp;amp; vbCrLf &amp;amp; _\n                          \"Создать копию сейчас?\", vbYesNo + vbQuestion, \"Резервное копирование\")\n    If backupAnswer = vbYes Then\n        Dim backupPath As String\n        backupPath = Replace(doc.FullName, \".docx\", \"_backup.docx\")\n        backupPath = Replace(backupPath, \".docm\", \"_backup.docm\")\n        If doc.Path = \"\" Then\n            MsgBox \"Сначала сохраните документ на диск.\", vbExclamation\n            GoTo CleanUp\n        End If\n        doc.SaveAs2 FileName:=backupPath\n    End If\n    \n    ' 2. Выбор справочника\n    Dim refPath As String\n    refPath = SelectReferenceFile()\n    If refPath = \"\" Then GoTo CleanUp ' Пользователь отменил выбор\n    \n    ' 3. Загрузка словаря\n    Dim dictRef As Object\n    Set dictRef = LoadDictionary(refPath)\n    If dictRef Is Nothing Then GoTo CleanUp\n    \n    ' 4. Поиск аббревиатур и сопоставление\n    Dim foundAbbrs As Object\n    Set foundAbbrs = ExtractAndMatchAbbreviations(doc, dictRef)\n    \n    If foundAbbrs.Count = 0 Then\n        MsgBox \"В тексте не найдено аббревиатур, подходящих под эвристику.\", vbInformation\n        GoTo CleanUp\n    End If\n    \n    ' 5. Создание таблицы\n    Dim targetDoc As Document\n    Dim tbl As Table\n    Dim rng As Range\n    \n    ' Если документ защищен, создаем новый\n    If doc.ProtectionType = wdNoProtection Then\n        Set targetDoc = doc\n        Set rng = targetDoc.Content\n        rng.Collapse wdCollapseEnd\n        rng.InsertParagraphAfter\n        rng.Collapse wdCollapseEnd\n    Else\n        Set targetDoc = Documents.Add\n        Set rng = targetDoc.Content\n    End If\n    \n    Set tbl = CreateReportTable(targetDoc, rng, foundAbbrs)\n    \n    ' 6. Форматирование таблицы\n    FormatTable tbl\n    \n    ' 7. Отчет\n    ShowReport foundAbbrs, dictRef, targetDoc\n\nCleanUp:\n    Application.ScreenUpdating = True\n    isRunning = False\n    Exit Sub\n\nErrorHandler:\n    Application.ScreenUpdating = True\n    isRunning = False\n    MsgBox \"Ошибка \" &amp;amp; Err.Number &amp;amp; \" в процедуре GenerateAbbreviationsTable:\" &amp;amp; vbCrLf &amp;amp; _\n           Err.Description, vbCritical, \"Сбой макроса\"\nEnd Sub\n\n' =====================================================================\n' ВЫБОР ФАЙЛА СПРАВОЧНИКА\n' =====================================================================\nPrivate Function SelectReferenceFile() As String\n    Dim fd As FileDialog\n    Set fd = Application.FileDialog(msoFileDialogFilePicker)\n    \n    With fd\n        .Title = \"Выберите справочник аббревиатур\"\n        .Filters.Clear\n        .Filters.Add \"Файлы Excel\", \"*.xlsx; *.xlsm; *.xls\"\n        .Filters.Add \"Текстовые файлы\", \"*.csv; *.txt\"\n        .AllowMultiSelect = False\n        If .Show = -1 Then\n            SelectReferenceFile = .SelectedItems(1)\n        Else\n            SelectReferenceFile = \"\"\n        End If\n    End With\nEnd Function\n\n' =====================================================================\n' ЗАГРУЗКА СПРАВОЧНИКА В СЛОВАРЬ\n' =====================================================================\nPrivate Function LoadDictionary(filePath As String) As Object\n    On Error GoTo ErrLoad\n    \n    Dim dict As Object\n    Set dict = CreateObject(\"Scripting.Dictionary\")\n    dict.CompareMode = vbTextCompare ' Регистронезависимое сравнение\n    \n    Dim ext As String\n    ' ИСПРАВЛЕНО: берем 5 символов для корректной проверки .xlsx и .xlsm\n    ext = LCase(Right(filePath, 5))\n    \n    If ext = \".xlsx\" Or ext = \".xlsm\" Or Right(ext, 4) = \".xls\" Then\n        ' Обработка Excel (позднее связывание)\n        Dim xlApp As Object, xlWb As Object, xlWs As Object\n        Set xlApp = CreateObject(\"Excel.Application\")\n        \n        If xlApp Is Nothing Then\n            MsgBox \"Не удалось создать объект Excel. Возможно, Excel не установлен или поврежден.\" &amp;amp; vbCrLf &amp;amp; _\n                   \"Пожалуйста, сохраните справочник в формате CSV или TXT и попробуйте снова.\", vbCritical\n            Set LoadDictionary = Nothing\n            Exit Function\n        End If\n        \n        xlApp.Visible = False\n        xlApp.DisplayAlerts = False\n        Set xlWb = xlApp.Workbooks.Open(filePath)\n        Set xlWs = xlWb.Sheets(1)\n        \n        Dim lastRow As Long\n        lastRow = xlWs.Cells(xlWs.Rows.Count, 1).End(-4162).Row ' -4162 = xlUp\n        \n        Dim i As Long\n        Dim abbr As String, decr As String\n        For i = 2 To lastRow\n            abbr = Trim(CStr(xlWs.Cells(i, 1).Value))\n            decr = Trim(CStr(xlWs.Cells(i, 2).Value))\n            \n            If abbr &amp;lt;&amp;gt; \"\" And decr &amp;lt;&amp;gt; \"\" Then\n                If dict.Exists(abbr) Then\n                    If dict(abbr) &amp;lt;&amp;gt; decr Then\n                        dict(abbr) = dict(abbr) &amp;amp; \" [Конфликт: \" &amp;amp; decr &amp;amp; \"]\"\n                    End If\n                Else\n                    dict.Add abbr, decr\n                End If\n            End If\n        Next i\n        \n        xlWb.Close False\n        xlApp.Quit\n        Set xlWs = Nothing: Set xlWb = Nothing: Set xlApp = Nothing\n        \n    Else\n        ' Обработка CSV/TXT\n        Dim fso As Object, ts As Object\n        Set fso = CreateObject(\"Scripting.FileSystemObject\")\n        Set ts = fso.OpenTextFile(filePath, 1, False, -2) ' -2 = TristateUseDefault\n        \n        ' Определение разделителя по первой строке\n        Dim firstLine As String\n        firstLine = ts.ReadLine\n        Dim delim As String\n        Dim cCount As Long, sCount As Long, tCount As Long\n        \n        cCount = UBound(Split(firstLine, \",\"))\n        sCount = UBound(Split(firstLine, \";\"))\n        tCount = UBound(Split(firstLine, vbTab))\n        \n        ' ИСПРАВЛЕНО: Однострочный If с ElseIf недопустим в VBA.\n        ' Переписано на многострочный блок с обязательным End If.\n        If tCount &amp;gt;= cCount And tCount &amp;gt;= sCount Then\n            delim = vbTab\n        ElseIf sCount &amp;gt;= cCount Then\n            delim = \";\"\n        Else\n            delim = \",\"\n        End If\n        \n        Dim parts() As String\n        Dim lineText As String\n        \n        ' Чтение данных\n        Do While Not ts.AtEndOfStream\n            lineText = ts.ReadLine\n            parts = Split(lineText, delim)\n            If UBound(parts) &amp;gt;= 1 Then\n                abbr = Trim(parts(0))\n                decr = Trim(parts(1))\n                If abbr &amp;lt;&amp;gt; \"\" And decr &amp;lt;&amp;gt; \"\" Then\n                    If dict.Exists(abbr) Then\n                        If dict(abbr) &amp;lt;&amp;gt; decr Then\n                            dict(abbr) = dict(abbr) &amp;amp; \" [Конфликт: \" &amp;amp; decr &amp;amp; \"]\"\n                        End If\n                    Else\n                        dict.Add abbr, decr\n                    End If\n                End If\n            End If\n        Loop\n        ts.Close\n    End If\n    \n    Set LoadDictionary = dict\n    Exit Function\n\nErrLoad:\n    MsgBox \"Ошибка чтения справочника: \" &amp;amp; Err.Description, vbCritical\n    Set LoadDictionary = Nothing\nEnd Function\n\n' =====================================================================\n' ПОИСК АББРЕВИАТУР И СОПОСТАВЛЕНИЕ\n' =====================================================================\nPrivate Function ExtractAndMatchAbbreviations(doc As Document, dictRef As Object) As Object\n    Dim re As Object\n    Set re = CreateObject(\"VBScript.RegExp\")\n    re.Global = True\n    re.IgnoreCase = False\n    ' Эвристика: 2+ заглавных букв, далее опционально пробел/дефис/слеш и еще заглавные/цифры\n    re.Pattern = \"(?:^|[^А-Яа-яЁё0-9])([А-ЯЁ]{2,}(?:[ \\-\\/][А-ЯЁ0-9]+)*)(?:[^А-Яа-яЁё0-9]|$)\"\n    \n    Dim text As String\n    text = doc.Content.text\n    \n    Dim matches As Object\n    Set matches = re.Execute(text)\n    \n    Dim resultDict As Object\n    Set resultDict = CreateObject(\"Scripting.Dictionary\")\n    resultDict.CompareMode = vbTextCompare ' Регистронезависимое сравнение\n    \n    ' Черный список для исключения ложных срабатываний\n    Dim blacklist As Variant\n    blacklist = Array(\"НА\", \"ПО\", \"ДО\", \"ОТ\", \"КО\", \"СО\", \"ОБ\", \"ИЗ\", \"УЖ\", \"ЭХ\", \"АХ\", \"ОХ\", \"УХ\", \"ЫХ\", \"ЕЕ\", \"ОО\", \"АА\", \"ИИ\", _\n                      \"ПРАЙМ\", \"АПИ\", \"АПИ ИЭМК\", \"БЕЗ\", \"ОК\", \"ООО\", \"ПРАЙМ ГРУП\", \"РЕГИОН БОТА\", _\n                      \"РЕД ОС\")\n    \n    Dim m As Object\n    Dim abbr As String\n    Dim isBlacklisted As Boolean\n    Dim blItem As Variant\n    \n    For Each m In matches\n        abbr = UCase(Trim(m.SubMatches(0)))\n        \n        ' 1. Проверка черного списка\n        isBlacklisted = False\n        For Each blItem In blacklist\n            If abbr = blItem Then\n                isBlacklisted = True\n                Exit For\n            End If\n        Next blItem\n        \n        If Not isBlacklisted Then\n            \n            ' 2. НОВОЕ: Проверка длины каждого \"слова\" (части аббревиатуры)\n            ' Если в одном слове больше 6 символов, не добавляем в таблицу\n            Dim tempAbbr As String\n            tempAbbr = Replace(Replace(abbr, \"/\", \"-\"), \" \", \"-\")\n            Dim abbrWords As Variant\n            abbrWords = Split(tempAbbr, \"-\")\n            \n            Dim isValidLength As Boolean\n            isValidLength = True\n            Dim wordPart As Variant\n            \n            For Each wordPart In abbrWords\n                If Len(wordPart) &amp;gt; 6 Then\n                    isValidLength = False\n                    Exit For\n                End If\n            Next wordPart\n            \n            ' Если все части прошли проверку длины\n            If isValidLength Then\n                \n                ' 3. НОВОЕ: Явная проверка на дубликат.\n                ' Dictionary уже не хранит дубликаты ключей, но проверка Exists\n                ' гарантирует, что мы не будем повторно обрабатывать и добавлять\n                ' уже найденную аббревиатуру в словарь результатов.\n                If Not resultDict.Exists(abbr) Then\n                    If dictRef.Exists(abbr) Then\n                        resultDict.Add abbr, dictRef(abbr)\n                    Else\n                        resultDict.Add abbr, \" \"\n                    End If\n                End If\n                \n            End If\n        End If\n    Next m\n    \n    Set ExtractAndMatchAbbreviations = resultDict\nEnd Function\n\n' =====================================================================\n' СОЗДАНИЕ ТАБЛИЦЫ\n' =====================================================================\nPrivate Function CreateReportTable(doc As Document, rng As Range, dataDict As Object) As Table\n    Dim tbl As Table\n    Set tbl = doc.Tables.Add(rng, dataDict.Count + 1, 2)\n    \n    ' Заголовки\n    tbl.Cell(1, 1).Range.text = \"Сокращение\"\n    tbl.Cell(1, 2).Range.text = \"Расшифровка\"\n    \n    ' Сортировка ключей\n    Dim keys As Variant\n    keys = dataDict.keys\n    SortArray keys\n    \n    ' Заполнение данных\n    Dim i As Long\n    For i = 0 To UBound(keys)\n        tbl.Cell(i + 2, 1).Range.text = keys(i)\n        tbl.Cell(i + 2, 2).Range.text = dataDict(keys(i))\n    Next i\n    \n    Set CreateReportTable = tbl\nEnd Function\n\n' =====================================================================\n' ФОРМАТИРОВАНИЕ ТАБЛИЦЫ\n' =====================================================================\nPrivate Sub FormatTable(tbl As Table)\n    tbl.Borders.Enable = True\n    tbl.AutoFitBehavior wdAutoFitContent\n    \n    ' Выделение заголовка\n    With tbl.Rows(1)\n        .Range.Font.Bold = True\n        .Range.Font.Color = wdColorBlack\n        .Shading.BackgroundPatternColor = wdColorGray15\n    End With\n    \n    ' Добавление подписи над таблицей\n    Dim rngTitle As Range\n    Set rngTitle = tbl.Range\n    rngTitle.Collapse wdCollapseStart\n    rngTitle.InsertParagraphBefore\n    rngTitle.InsertBefore \"Таблица аббревиатур\"\n    rngTitle.Paragraphs(1).Range.Font.Bold = True\n    rngTitle.Paragraphs(1).Alignment = wdAlignParagraphCenter\nEnd Sub\n\n' =====================================================================\n' ВЫВОД ОТЧЕТА\n' =====================================================================\nPrivate Sub ShowReport(foundDict As Object, refDict As Object, targetDoc As Document)\n    Dim totalFound As Long, decrypted As Long, notFound As Long\n    Dim key As Variant\n    \n    totalFound = foundDict.Count\n    For Each key In foundDict.keys\n        If foundDict(key) = \"Не найдено в справочнике\" Then\n            notFound = notFound + 1\n        Else\n            decrypted = decrypted + 1\n        End If\n    Next key\n    \n    Dim msg As String\n    msg = \"Обработка завершена успешно!\" &amp;amp; vbCrLf &amp;amp; vbCrLf\n    msg = msg &amp;amp; \"Всего найдено уникальных аббревиатур: \" &amp;amp; totalFound &amp;amp; vbCrLf\n    msg = msg &amp;amp; \"Успешно расшифровано: \" &amp;amp; decrypted &amp;amp; vbCrLf\n    msg = msg &amp;amp; \"Не найдено в справочнике: \" &amp;amp; notFound &amp;amp; vbCrLf &amp;amp; vbCrLf\n    msg = msg &amp;amp; \"Таблица создана в документе: \" &amp;amp; targetDoc.Name\n    \n    MsgBox msg, vbInformation, \"Отчет макроса\"\nEnd Sub\n\n' =====================================================================\n' ВСПОМОГАТЕЛЬНАЯ ФУНКЦИЯ: СОРТИРОВКА МАССИВА\n' =====================================================================\nPrivate Sub SortArray(arr As Variant)\n    Dim i As Long, j As Long\n    Dim temp As String\n    For i = LBound(arr) To UBound(arr) - 1\n        For j = i + 1 To UBound(arr)\n            If arr(i) &amp;gt; arr(j) Then\n                temp = arr(i)\n                arr(i) = arr(j)\n                arr(j) = temp\n            End If\n        Next j\n    Next i\nEnd Sub\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"111\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-111\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n
