gt;API Technical Writing: JSON and XML (Consult-Timmins)&lt;/a&gt; - Module 2: JSON syntax, structure, nested objects; Module 4: Hands-on writing API requests/responses in JSON; Module 7: Documenting API errors.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_api_json_senior_senior-opredelyayu-standart-i-upravlyayu-shemami\" data-original-article=\"Roadmap/api/json/senior.html\"&gt;&lt;a href=\"#Roadmap_api_json_senior_senior-opredelyayu-standart-i-upravlyayu-shemami\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и управляю схемами»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и управляю схемами»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_api_json_senior\" id=\"Roadmap_api_json_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне JSON/XML становится &lt;strong&gt;элементом архитектуры данных&lt;/strong&gt;. Вы не просто документируете структуры, вы &lt;strong&gt;влияете на их дизайн&lt;/strong&gt; с точки зрения документируемости. Вы определяете стандарты схем, управляете валидацией, обеспечиваете консистентность между продуктами.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия схем:&lt;/strong&gt; вы определяете, какие схемы (JSON Schema, XSD) используются в организации, как они версионируются, как поддерживаются в актуальном состоянии.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за актуальность схем, как проверяется соответствие документации и реального API, как обрабатываются breaking changes в структурах данных.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых endpoints, версий, форматов без ручной работы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Стандарты документирования:&lt;/strong&gt; вы определяете, как описывать JSON/XML в документации: обязательные поля, примеры, ограничения, обработка ошибок.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Автоматизация:&lt;/strong&gt; вы настраиваете CI/CD для валидации: проверка схем, валидация примеров, проверка соответствия документации и спецификации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды работе со схемами, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Влияние на дизайн API:&lt;/strong&gt; вы участвуете в API-ревью, предлагаете улучшения структур данных с точки зрения документируемости.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Инженеры приходят к вам за советом по структурам данных &lt;strong&gt;до&lt;/strong&gt; начала разработки.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_api_json_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_api_json_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-2764-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Pro RESTful APIs (Sanjay Patni, продвинутые главы)&lt;/a&gt; - Главы о дизайне, построении и интеграции с REST, JSON, XML;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-1464-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Java XML and JSON (Jeff Friesen)&lt;/a&gt; - Продвинутое руководство по обработке XML и JSON: parsing, creating, transforming, validation;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-00\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JSON Schema: A Media Type for Describing JSON Documents (IETF)&lt;/a&gt; - Официальная спецификация JSON Schema: understanding, composition, validation;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.w3.org/TR/xmlschema11-1/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;W3C XML Schema Definition Language (XSD) 1.1&lt;/a&gt; - Официальная спецификация XSD 1.1: structures, datatypes, validation;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_api_openapi_junior_junior-chitayu-specifikaciyu-i-dopolnyayu-po-shablonu\" data-original-article=\"Roadmap/api/openapi/junior.html\"&gt;&lt;a href=\"#Roadmap_api_openapi_junior_junior-chitayu-specifikaciyu-i-dopolnyayu-po-shablonu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Читаю спецификацию и дополняю по шаблону»&lt;/span&gt;&lt;/a&gt;Junior: «Читаю спецификацию и дополняю по шаблону»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_api_openapi_junior\" id=\"Roadmap_api_openapi_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне OpenAPI — это &lt;strong&gt;формат, который вы учитесь читать и дополнять&lt;/strong&gt;. Вы не создаёте спецификацию с нуля, а работаете с существующей: добавляете описания, примеры, уточняете параметры. Ключевой сдвиг: вы перестаёте «пересказывать» API в Markdown и начинаете работать с &lt;strong&gt;машиночитаемым контрактом&lt;/strong&gt;, который генерирует документацию автоматически.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Структура OpenAPI-документа:&lt;/strong&gt; вы понимаете базовые секции: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_api_openapi_junior_inline-code-id-pl2w2tor\"&gt;openapi&lt;/code&gt; (версия), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_api_openapi_junior_inline-code-id-355j7cus\"&gt;info&lt;/code&gt; (название, версия, описание), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_api_openapi_junior_inline-code-id-9qncftjg\"&gt;servers&lt;/code&gt; (базовые URL), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_api_openapi_junior_inline-code-id-yh4noo8f\"&gt;paths&lt;/code&gt; (эндпоинты и методы), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_api_openapi_junior_inline-code-id-350cw2oo\"&gt;components/schemas&lt;/code&gt; (модели данных).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Чтение спецификации:&lt;/strong&gt; вы можете открыть YAML или JSON файл OpenAPI и найти нужный эндпоинт, его параметры, схему запроса и ответа.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Дополнение описаний:&lt;/strong&gt; вы добавляете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_api_openapi_junior_inline-code-id-7falfdf9\"&gt;description&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_api_openapi_junior_inline-code-id-rv6e883i\"&gt;summary&lt;/code&gt; для эндпоинтов, параметров, схем. Вы понимаете, что автогенерация из кода не даёт контекста — его нужно писать вручную.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Примеры:&lt;/strong&gt; вы добавляете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_api_openapi_junior_inline-code-id-3zpcilkg\"&gt;example&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_api_openapi_junior_inline-code-id-frj9pmse\"&gt;examples&lt;/code&gt; для request body и responses. Вы проверяете, что примеры валидны и соответствуют реальному API.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Swagger UI:&lt;/strong&gt; вы умеете открыть Swagger UI, понять, как отображается спецификация, и использовать интерактивный режим «Try it out» для проверки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация:&lt;/strong&gt; вы проверяете, что спецификация синтаксически корректна (через Swagger Editor или валидатор).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;дополняете&lt;/strong&gt; существующую спецификацию, а не создаёте её с нуля. Если чего-то не хватает — вы уточняете у разработчика.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_api_openapi_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_api_openapi_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.udemy.com/course/learn-swagger-and-the-open-api-specification/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Learn Swagger and the OpenAPI Specification (Udemy)&lt;/a&gt; - Курс &lt;strong&gt;специально для технических писателей и PM-ов&lt;/strong&gt;: не требует опыта программирования. Учит читать и писать OpenAPI-файлы, понимать альтернативы Swagger;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.udemy.com/course/mastering-openapi-swagger/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mastering OpenAPI &amp;amp; Swagger: From Basics to AI Design (Udemy)&lt;/a&gt; - Для начинающих: предполагает базовое знание REST и JSON, но не требует программирования. Подходит техническим писателям;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://apidog.com/blog/openapi-3-0-tutorial/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;OpenAPI 3.0 Tutorial (Apidog)&lt;/a&gt; - Пошаговое руководство по определению OpenAPI 3.0: структура, paths, operations, schemas;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://spec.openapis.org/oas/v3.0.3\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;OpenAPI Specification — официальная документация&lt;/a&gt; - Официальная спецификация: структура документа, paths, components, schemas;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://swagger.io/tools/swagger-ui/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Swagger UI — официальная документация&lt;/a&gt; - Как работает Swagger UI, как отображается спецификация, интерактивный режим.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_api_openapi_middle_middle-pishu-specifikaciyu-i-nastraivayu-generaciyu\" data-original-article=\"Roadmap/api/openapi/middle.html\"&gt;&lt;a href=\"#Roadmap_api_openapi_middle_middle-pishu-specifikaciyu-i-nastraivayu-generaciyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Пишу спецификацию и настраиваю генерацию»&lt;/span&gt;&lt;/a&gt;Middle: «Пишу спецификацию и настраиваю генерацию»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_api_openapi_middle\" id=\"Roadmap_api_openapi_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне OpenAPI перестаёт быть просто «форматом, который я читаю». Теперь это &lt;strong&gt;инструмент проектирования и автоматизации&lt;/strong&gt;. Вы создаёте спецификации с нуля, настраиваете генерацию документации, интегрируете OpenAPI в docs-as-code.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Написание спецификации с нуля:&lt;/strong&gt; вы создаёте OpenAPI 3.0/3.1 документ для нового API: paths, operations, parameters, requestBody, responses, components/schemas.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Переиспользование компонентов:&lt;/strong&gt; вы понимаете, как работает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_api_openapi_middle_inline-code-id-d33efh63\"&gt;components&lt;/code&gt;: reusable schemas, parameters, responses, securitySchemes. Вы избегаете дублирования через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_api_openapi_middle_inline-code-id-g960v0g1\"&gt;$ref&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Безопасность:&lt;/strong&gt; вы документируете securitySchemes: OAuth 2.0, API keys, Bearer tokens, basic auth.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Генерация документации:&lt;/strong&gt; вы настраиваете Swagger UI или Redoc для отображения спецификации. Вы понимаете разницу: Swagger UI — интерактивный, с «Try it out»; Redoc — read-focused, более чистый и современный.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Интеграция в docs-as-code:&lt;/strong&gt; вы понимаете, как OpenAPI-файл живёт в Git-репозитории рядом с Markdown-документацией. Вы настраиваете CI для валидации спецификации и генерации документации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация и линтинг:&lt;/strong&gt; вы настраиваете проверку спецификации в CI: syntax validation, style linting, проверка на breaking changes.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Гибридный подход:&lt;/strong&gt; вы понимаете, что автогенерация из OpenAPI покрывает reference, но не даёт контекста. Вы добавляете ручные описания поверх.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;создаёте и автоматизируете&lt;/strong&gt;. Вы отвечаете за то, чтобы спецификация была точной, полной и генерировала качественную документацию.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_api_openapi_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_api_openapi_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.manning.com/books/designing-apis-with-swagger-and-openapi\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Designing APIs with Swagger and OpenAPI (Josh Ponelat, Lukas Rosenstock)&lt;/a&gt; - Комплексное руководство: от концепции до продакшена. Реальные проекты, OpenAPI syntax, codegen, versioning, breaking changes;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.manning.com/books/the-design-of-web-apis-second-edition\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The Design of Web APIs, Second Edition (Arnaud Lauret)&lt;/a&gt; - Обновлённое издание: покрывает последние изменения OpenAPI, документирование REST API с OpenAPI и JSON Schema;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://codered.eccouncil.org/course/openapi-3-1-api-design\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;OpenAPI 3.1 API Design Course (CodeRed)&lt;/a&gt; - Для разработчиков, архитекторов и &lt;strong&gt;технических писателей&lt;/strong&gt;: design-first подход, создание OpenAPI-документа, paths, operations, reusable components;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.pce.uw.edu/specializations/api-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Specialization in API Documentation (UW Professional &amp;amp; Continuing Education)&lt;/a&gt; - 11-недельная программа для технических писателей: API fundamentals, OpenAPI, docs-as-code, testing;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/OAI/OpenAPI-Specification/blob/main/versions/3.1.0.md\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitHub: Best Practices (Spec Authoring)&lt;/a&gt; - Правила написания спецификаций: operationId, reuse components, clear responses.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_api_openapi_senior_senior-opredelyayu-standart-i-upravlyayu-lifecycle\" data-original-article=\"Roadmap/api/openapi/senior.html\"&gt;&lt;a href=\"#Roadmap_api_openapi_senior_senior-opredelyayu-standart-i-upravlyayu-lifecycle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и управляю lifecycle»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и управляю lifecycle»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_api_openapi_senior\" id=\"Roadmap_api_openapi_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне OpenAPI становится &lt;strong&gt;элементом архитектуры документации&lt;/strong&gt;. Вы не просто создаёте спецификации, вы &lt;strong&gt;управляете их lifecycle&lt;/strong&gt;: версионирование, breaking changes, автоматизация, стандартизация, обучение команд.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия spec-driven документации:&lt;/strong&gt; вы определяете, как OpenAPI вписывается в общую стратегию: единый источник истины для документации, тестов, SDK, кода.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за актуальность спецификации, как проверяется соответствие коду, как обрабатываются breaking changes.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Версионирование:&lt;/strong&gt; вы управляете версиями спецификации: как поддерживать несколько версий API, как архивировать старые версии, как коммуницировать изменения.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;CI/CD для OpenAPI:&lt;/strong&gt; вы настраиваете пайплайн: валидация → генерация → публикация. Вы используете CI-гейты для проверки свежести спецификации и примеров.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Автоматизация:&lt;/strong&gt; вы настраиваете генерацию документации из спецификации, генерацию SDK, генерацию тестов.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых API, версий, языков без ручной работы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды работе с OpenAPI, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Инженеры приходят к вам за советом по API-дизайну &lt;strong&gt;до&lt;/strong&gt; начала разработки.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_api_openapi_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_api_openapi_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.manning.com/books/designing-apis-with-swagger-and-openapi\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Designing APIs with Swagger and OpenAPI (Josh Ponelat, Lukas Rosenstock, продвинутые главы)&lt;/a&gt; - Главы о versioning, breaking changes, codegen, работе с кросс-функциональными командами;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.manning.com/books/the-design-of-web-apis-second-edition\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The Design of Web APIs, Second Edition (Arnaud Lauret, продвинутые главы)&lt;/a&gt; - Продвинутые главы: стандартизация API-дизайна, automation, rationale;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.pce.uw.edu/specializations/api-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Specialization in API Documentation (UW Professional &amp;amp; Continuing Education)&lt;/a&gt; - Программа для технических писателей: API fundamentals, OpenAPI, docs-as-code, testing;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.gitbook.com/integrations/git-sync\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitBook: Integrating with CI/CD&lt;/a&gt; - Как автоматизировать обновление OpenAPI-спецификации через GitBook CLI.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_api_postman_junior_junior-otpravlyayu-zaprosy-i-proveryayu-dokumentaciyu\" data-original-article=\"Roadmap/api/postman/junior.html\"&gt;&lt;a href=\"#Roadmap_api_postman_junior_junior-otpravlyayu-zaprosy-i-proveryayu-dokumentaciyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Отправляю запросы и проверяю документацию»&lt;/span&gt;&lt;/a&gt;Junior: «Отправляю запросы и проверяю документацию»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_api_postman_junior\" id=\"Roadmap_api_postman_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне Postman — это &lt;strong&gt;инструмент проверки&lt;/strong&gt;. Вы учитесь отправлять запросы, читать ответы и убеждаться, что документация соответствует реальному поведению API. Ключевой сдвиг: вы перестаёте писать документацию «по памяти» и начинаете &lt;strong&gt;валидировать её через реальные вызовы&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Интерфейс Postman:&lt;/strong&gt; вы понимаете структуру: workspace, collections, folders, requests, environments. Вы знаете, как создать новый запрос, выбрать метод и отправить его.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Работа с запросами:&lt;/strong&gt; вы добавляете URL, query parameters, path parameters, headers (Content-Type, Accept, Authorization), body (raw JSON).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Анализ ответов:&lt;/strong&gt; вы читаете статус-код, заголовки ответа, тело ответа. Вы проверяете, соответствует ли ответ документации: тот ли статус-код, те ли поля, те ли типы данных.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Коллекции:&lt;/strong&gt; вы умеете импортировать API-коллекции, добавлять папки, сохранять запросы и ответы в коллекцию.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Переменные:&lt;/strong&gt; вы понимаете, зачем нужны переменные (base URL, токены), и умеете их создавать. Environment variables позволяют переключаться между средами.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация документации:&lt;/strong&gt; вы проходите по документации шаг за шагом, отправляя каждый запрос. Если что-то не совпадает — вы фиксируете это и уточняете у разработчика.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;проверяете&lt;/strong&gt; документацию, а не пишете её «вслепую». Если пример в документации не работает — вы это находите.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_api_postman_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_api_postman_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://academy.postman.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Postman Academy: API Fundamentals Student Expert Certification&lt;/a&gt; - Официальная сертификация Postman: GET, POST, PUT, PATCH, DELETE, работа с JSON, path variables, query parameters. Полностью бесплатно, с бейджем и сертификатом;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.udemy.com/course/technical-writing-how-to-write-api-software-documentation/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing: How to Write API Software Documentation (Udemy)&lt;/a&gt; - Курс &lt;strong&gt;специально для технических писателей&lt;/strong&gt;: использует Postman для проверки функциональности API. Не требует опыта программирования;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.coursera.org/learn/api-testing-postman\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apply API Testing Fundamentals Using Postman (Coursera)&lt;/a&gt; - Install and configure Postman to create, organize, and execute REST API requests. Validate API responses, debug issues, write test scripts;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://learning.postman.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Postman Learning Center&lt;/a&gt; - Официальная документация Postman: от первых шагов до продвинутых сценариев;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.udemy.com/course/postman-the-complete-guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Postman: The Complete Guide — REST API Testing (Udemy)&lt;/a&gt; - Курс для тестировщиков и разработчиков, но подходит писателям: GET, POST, PUT, DELETE, JSON, аутентификация, работа с коллекциями.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_api_postman_middle_middle-nastraivayu-testy-i-avtomatiziruyu-proverki\" data-original-article=\"Roadmap/api/postman/middle.html\"&gt;&lt;a href=\"#Roadmap_api_postman_middle_middle-nastraivayu-testy-i-avtomatiziruyu-proverki\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Настраиваю тесты и автоматизирую проверки»&lt;/span&gt;&lt;/a&gt;Middle: «Настраиваю тесты и автоматизирую проверки»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_api_postman_middle\" id=\"Roadmap_api_postman_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне Postman перестаёт быть просто «инструментом проверки». Теперь это &lt;strong&gt;среда для автоматизации&lt;/strong&gt;: вы пишете тесты, настраиваете переменные, интегрируете проверки в CI/CD. Вы отвечаете за то, чтобы документация была не только точной, но и &lt;strong&gt;постоянно проверяемой&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Написание тестов:&lt;/strong&gt; вы пишете assertions в Postman: проверка статус-кода, проверка полей в ответе, проверка времени ответа. Вы используете JavaScript-сниппеты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Переменные и environments:&lt;/strong&gt; вы настраиваете environment variables для разных сред (dev, staging, prod). Вы используете collection variables для общих значений.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Pre-request scripts:&lt;/strong&gt; вы пишете скрипты, которые выполняются до запроса: генерация токена, установка timestamp, подготовка данных.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Collection Runner:&lt;/strong&gt; вы запускаете всю коллекцию запросов, проверяете результаты, экспортируете отчёты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Автоматизация с Newman:&lt;/strong&gt; вы устанавливаете Newman (CLI для Postman) и запускаете коллекции из командной строки. Вы интегрируете Newman в CI/CD.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Тестирование ошибок:&lt;/strong&gt; вы проверяете не только успешные сценарии, но и обработку ошибок: 400, 401, 403, 404, 500.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Гибридный подход:&lt;/strong&gt; вы используете Postman для проверки документации, сгенерированной из OpenAPI.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;автоматизируете&lt;/strong&gt; проверки и &lt;strong&gt;интегрируете&lt;/strong&gt; их в процесс. Документация проверяется при каждом изменении API.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_api_postman_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_api_postman_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://iln.ieee.org/courses/api-testing-and-development-with-postman\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;API Testing and Development with Postman (IEEE)&lt;/a&gt; - Comprehensive introduction to API testing and development using Postman: terminology, types, best practices for designing and documenting APIs, security and performance testing;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.udemy.com/course/api-testing-with-postman/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;API Testing with Postman: From Beginner to Advanced (Udemy)&lt;/a&gt; - 7+ часов: от первого запроса до автоматизации с Newman, data-driven testing (CSV/JSON), CI/CD интеграция;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/mastering-postman/9781838987562/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mastering Postman (Dave Westerveld)&lt;/a&gt; - Комплексное руководство: API design, testing, documentation, mocking. Покрывает Postman CLI для продвинутого тестирования и автоматизации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://learning.postman.com/docs/collections/running-collections/intro-to-collection-runs/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Postman Docs: Collection Runner &amp;amp; Newman&lt;/a&gt; - Официальная документация: как запускать коллекции, настраивать iterations, экспортировать отчёты;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://learning.postman.com/docs/writing-scripts/test-scripts/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Postman Docs: Writing Tests&lt;/a&gt; - Официальное руководство по написанию тестов: assertions, snippets, работа с JSON.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_api_postman_senior_senior-opredelyayu-standart-i-upravlyayu-lifecycle-testirovaniya\" data-original-article=\"Roadmap/api/postman/senior.html\"&gt;&lt;a href=\"#Roadmap_api_postman_senior_senior-opredelyayu-standart-i-upravlyayu-lifecycle-testirovaniya\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и управляю lifecycle тестирования»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и управляю lifecycle тестирования»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_api_postman_senior\" id=\"Roadmap_api_postman_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне Postman становится &lt;strong&gt;элементом инфраструктуры качества документации&lt;/strong&gt;. Вы не просто пишете тесты, вы &lt;strong&gt;управляете lifecycle&lt;/strong&gt;: определяете стандарты, обучаете команды, интегрируете тестирование в процесс разработки и документации.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия тестирования API:&lt;/strong&gt; вы определяете, как тестирование API вписывается в общую стратегию документации: какие эндпоинты тестируются, как часто, кем, с какими проверками.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за актуальность тестов, как обрабатываются breaking changes, как тесты связаны с документацией.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Стандарты коллекций:&lt;/strong&gt; вы определяете, как организуются коллекции Postman: структура папок, именование запросов, обязательные тесты, использование переменных.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;CI/CD-интеграция:&lt;/strong&gt; вы проектируете пайплайн: при изменении API запускаются тесты Postman, при изменении документации — проверка соответствия.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых API, версий, команд без ручной работы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды работе с Postman, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Влияние на дизайн API:&lt;/strong&gt; вы используете данные тестирования для влияния на дизайн API: если эндпоинт сложно тестировать, он сложен и для документирования.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Тестирование API становится частью процесса разработки, а не разовым действием.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_api_postman_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_api_postman_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://iln.ieee.org/courses/api-testing-and-development-with-postman\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;API Testing and Development with Postman (IEEE, продвинутые модули)&lt;/a&gt; - Advanced topics: data-driven and contract testing, workflow automation, mock servers, security and performance testing;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oreilly.com/library/view/mastering-postman/9781838987562/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mastering Postman (Dave Westerveld, продвинутые главы)&lt;/a&gt; - Главы об API governance, интеграции, публикации, Postman CLI для продвинутой автоматизации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://learning.postman.com/docs/api-governance/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Postman Docs: API Governance&lt;/a&gt; - Как управлять стандартами API в организации: правила, линтинг, соответствие;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://learning.postman.com/docs/running-collections/using-newman-cli/continuous-integration/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Postman Docs: CI/CD Integration&lt;/a&gt; - Как интегрировать Postman/Newman в CI/CD: GitHub Actions, Jenkins, GitLab CI;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_api_code_junior_junior-pishu-rabotayushie-primery-po-shablonu\" data-original-article=\"Roadmap/api/code/junior.html\"&gt;&lt;a href=\"#Roadmap_api_code_junior_junior-pishu-rabotayushie-primery-po-shablonu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Пишу работающие примеры по шаблону»&lt;/span&gt;&lt;/a&gt;Junior: «Пишу работающие примеры по шаблону»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_api_code_junior\" id=\"Roadmap_api_code_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне примеры кода — это &lt;strong&gt;практический инструмент&lt;/strong&gt;, который вы добавляете в документацию по готовому шаблону. Вы учитесь писать примеры, которые &lt;strong&gt;работают&lt;/strong&gt;: их можно скопировать, запустить и получить ожидаемый результат. Ключевой сдвиг: вы перестаёте «пересказывать» API словами и начинаете &lt;strong&gt;показывать&lt;/strong&gt; его в действии.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Базовые примеры для эндпоинта:&lt;/strong&gt; вы пишете пример запроса (curl) и пример ответа (JSON) для каждого документируемого эндпоинта.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Самодостаточность:&lt;/strong&gt; каждый пример должен быть &lt;strong&gt;self-contained&lt;/strong&gt; — его можно скопировать и запустить без дополнительных пояснений. Это означает: явные заголовки авторизации, полные URL, корректный JSON.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Форматирование:&lt;/strong&gt; вы следуете правилам оформления кода: отступы, переносы строк (80 символов), указание языка для подсветки синтаксиса, использование комментариев для пропущенного кода.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Интро-предложение:&lt;/strong&gt; вы предваряете каждый пример кода вводным предложением, которое объясняет, что этот пример делает.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Проверка работоспособности:&lt;/strong&gt; вы тестируете каждый пример через Postman или curl, чтобы убедиться, что он действительно работает и возвращает ожидаемый результат.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;пишете и проверяете&lt;/strong&gt; примеры, а не копируете их из кода. Если пример не работает — вы это находите и исправляете.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_api_code_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_api_code_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One — Code Samples&lt;/a&gt; - Официальный модуль по оформлению примеров кода: интро-предложения, отступы, переносы строк, комментарии к пропущенному коду;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/style/code-samples\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Developer Documentation Style Guide — Code Samples&lt;/a&gt; - Эталонные правила оформления: отступы, переносы строк, использование комментариев, запрет на ellipsis;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://api7.ai/blog/code-samples-in-api-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;API7.ai: Incorporating Code Samples in API Documentation&lt;/a&gt; - Практические рекомендации: самодостаточность примеров, явные предпосылки, тестирование примеров;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://mintlify.com/blog/api-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mintlify: API Documentation Recommendations&lt;/a&gt; - Раздел о code samples: как примеры ускоряют time-to-first-call, примеры из Stripe и Twilio;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://document360.com/blog/technical-writing-guides/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Document360: Writing Technical Guides for Developers&lt;/a&gt; - Раздел о code examples: используйте реальный работающий код, показывайте вывод, добавляйте copy buttons.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_api_code_middle_middle-proektiruyu-portfel-primerov-i-avtomatiziruyu-proverki\" data-original-article=\"Roadmap/api/code/middle.html\"&gt;&lt;a href=\"#Roadmap_api_code_middle_middle-proektiruyu-portfel-primerov-i-avtomatiziruyu-proverki\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Проектирую портфель примеров и автоматизирую проверки»&lt;/span&gt;&lt;/a&gt;Middle: «Проектирую портфель примеров и автоматизирую проверки»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_api_code_middle\" id=\"Roadmap_api_code_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне примеры кода перестают быть просто «дополнением к документации». Теперь это &lt;strong&gt;предмет проектирования&lt;/strong&gt;: вы определяете, какие примеры нужны для разных аудиторий, как они связаны с задачами разработчиков, как автоматизировать их проверку.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Портфель примеров (Code Sample Portfolio):&lt;/strong&gt; вы проектируете три уровня примеров: &lt;strong&gt;request snippets&lt;/strong&gt; (один вызов), &lt;strong&gt;task-focused examples&lt;/strong&gt; (несколько вызовов для решения задачи), &lt;strong&gt;sample applications&lt;/strong&gt; (end-to-end приложение).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Мультиязычность:&lt;/strong&gt; вы добавляете примеры на нескольких языках (curl, Python, JavaScript, Java) в зависимости от аудитории.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Безопасность и обработка ошибок:&lt;/strong&gt; вы включаете в примеры безопасную обработку credentials (никогда не хардкодить токены), таймауты, проверку статус-кодов, обработку ошибок.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Автоматизация проверок:&lt;/strong&gt; вы настраиваете CI для тестирования примеров: синтаксическая проверка — минимум, высокоценные примеры запускаются против контролируемой среды.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Интеграция с OpenAPI:&lt;/strong&gt; вы используете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_api_code_middle_inline-code-id-bdo3xf5s\"&gt;x-codeSamples&lt;/code&gt; для добавления примеров в спецификацию OpenAPI. Swagger UI и Redoc автоматически отображают примеры для каждого эндпоинта.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Проверка актуальности:&lt;/strong&gt; вы убеждаетесь, что примеры не используют устаревшие SDK, не игнорируют ошибки и не нормализуют небезопасные практики.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;проектируете и автоматизируете&lt;/strong&gt;. Вы отвечаете за то, чтобы примеры были актуальными, безопасными и проверяемыми.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_api_code_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_api_code_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/two\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing Two — Code Samples&lt;/a&gt; - Продвинутые темы: создание примеров для туториалов, антипримеры, диапазон сложности;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://mintlify.com/docs/api-playground/sdk-examples\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mintlify: Add SDK examples&lt;/a&gt; - Как добавлять SDK-примеры через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_api_code_middle_inline-code-id-z3fofadn\"&gt;x-codeSamples&lt;/code&gt;, автоматическая генерация через Speakeasy;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://redocly.com/docs/openapi-visual-reference/x-code-samples/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Redocly: x-codeSamples&lt;/a&gt; - Использование &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_api_code_middle_inline-code-id-svdnobo7\"&gt;x-codeSamples&lt;/code&gt; для добавления кастомных примеров на нескольких языках;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://api7.ai/blog/code-samples-in-api-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;API7.ai: Incorporating Code Samples&lt;/a&gt; - Продвинутые разделы: портфель примеров, мультиязычность, автоматизация проверок;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://learning.postman.com/docs/sending-requests/examples/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Postman: Create examples of request responses&lt;/a&gt; - Как использовать Postman для создания и сохранения примеров запросов и ответов.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_api_code_senior_senior-opredelyayu-standart-i-upravlyayu-lifecycle-primerov\" data-original-article=\"Roadmap/api/code/senior.html\"&gt;&lt;a href=\"#Roadmap_api_code_senior_senior-opredelyayu-standart-i-upravlyayu-lifecycle-primerov\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и управляю lifecycle примеров»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и управляю lifecycle примеров»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_api_code_senior\" id=\"Roadmap_api_code_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне примеры кода становятся &lt;strong&gt;элементом архитектуры документации&lt;/strong&gt;. Вы не просто создаёте примеры, вы &lt;strong&gt;управляете их lifecycle&lt;/strong&gt;: стандартизация, автоматизация, масштабирование, обучение команд.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия примеров:&lt;/strong&gt; вы определяете, какие типы примеров обязательны для каждого продукта, как они связаны с другими типами документации (tutorial, how-to, reference), как обеспечивается консистентность между командами.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за актуальность примеров, как проверяется их работоспособность, как обрабатываются breaking changes.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых API, языков, версий без ручной работы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;CI/CD для примеров:&lt;/strong&gt; вы настраиваете пайплайн: синтаксическая проверка → тестирование против контролируемой среды → публикация. Вы используете CI-гейты для проверки свежести примеров.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Стандарты примеров:&lt;/strong&gt; вы определяете, как оформлять примеры: форматирование, комментарии, обработка ошибок, безопасность.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды написанию примеров, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность примеров: time-to-first-call, support tickets, adoption.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Примеры кода становятся частью процесса разработки, а не разовым действием.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_api_code_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_api_code_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды, включая code samples;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://api7.ai/blog/code-samples-in-api-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;API7.ai: Incorporating Code Samples (продвинутые разделы)&lt;/a&gt; - Управление портфелем примеров, метрики, масштабирование;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/style/api-reference-comments\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Developer Documentation Style Guide — API reference code comments&lt;/a&gt; - Стандарты для API reference: code samples на каждой странице (5–20 строк), ссылки на reference;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.gitbook.com/content-editor/blocks/code-block\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitBook: Adding custom code samples&lt;/a&gt; - Как добавлять кастомные примеры через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_api_code_senior_inline-code-id-7romjoau\"&gt;x-codeSamples&lt;/code&gt;, интеграция с Fern-generated SDK;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://mintlify.com/docs/api-playground/sdk-examples\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mintlify: Add SDK examples&lt;/a&gt; - Автоматическая генерация примеров через Speakeasy, добавление в OpenAPI.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;p&gt;На Junior-уровне SDK-документация — это &lt;strong&gt;пошаговое руководство для разработчика&lt;/strong&gt;, который впервые сталкивается с вашей библиотекой. Вы учитесь писать quickstart, документировать установку и описывать базовые операции по готовому шаблону. Ключевой сдвиг: вы перестаёте «пересказывать» сигнатуры методов и начинаете &lt;strong&gt;вести разработчика от нуля до первого работающего вызова&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание SDK vs API:&lt;/strong&gt; API — это контракт на уровне HTTP. SDK — это &lt;strong&gt;клиентская библиотека&lt;/strong&gt;, которая оборачивает API в удобный для конкретного языка интерфейс. Документация SDK отвечает на вопрос «Как использовать библиотеку в моём проекте?».&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Структура quickstart:&lt;/strong&gt; Prerequisites (что нужно до начала) → Installation (команда пакетного менеджера) → Authentication (как передать credentials) → First call (минимальный работающий пример) → Next steps (куда идти дальше).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Установка:&lt;/strong&gt; вы документируете команды для разных пакетных менеджеров (npm, pip, Maven, Gradle), указываете минимальную версию языка и зависимости.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Аутентификация:&lt;/strong&gt; вы показываете, как создать клиент и передать credentials. Пример должен быть самодостаточным: разработчик копирует его, подставляет свой токен и запускает.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Базовые операции:&lt;/strong&gt; вы документируете CRUD-операции (create, read, update, delete) с минимальными примерами. Каждый пример показывает happy path.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Inline-комментарии:&lt;/strong&gt; вы добавляете комментарии в код, объясняющие неочевидные параметры и возвращаемые значения.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Проверка работоспособности:&lt;/strong&gt; вы тестируете каждый пример в реальном проекте, убеждаясь, что он компилируется и выполняется.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;ведёте разработчика&lt;/strong&gt; от установки до первого успешного вызова. Если пример не работает — это ваша ошибка, а не проблема читателя.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h2 id=\"Roadmap_api_sdk_junior_kursy-i-knigi-junior\" data-original-article=\"Roadmap/api/sdk/junior.html\"&gt;&lt;a href=\"#Roadmap_api_sdk_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_api_sdk_junior\" id=\"Roadmap_api_sdk_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"https://training.linuxfoundation.org/training/creating-effective-documentation-for-developers-lfc112/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Creating Effective Documentation for Developers (LFC112) (Linux Foundation)&lt;/a&gt; - Курс для технических писателей с базовыми знаниями программирования: типы документации, API-элементы, code-based reference, планирование документации в разработке;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.archbee.com/blog/sdk-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SDK documentation — Archbee Blog&lt;/a&gt; - Введение в разницу между SDK и API, что должна включать SDK-документация, примеры из реальных SDK;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - База: аудитория, структура, ясность. Применимо к quickstart и примерам кода;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации, включая quickstart и code samples;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://diataxis.fr/tutorials/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diátaxis Framework — Tutorials&lt;/a&gt; - Понимание разницы между tutorial (обучение) и how-to (решение задачи). SDK quickstart — это tutorial.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_api_sdk_middle_middle-proektiruyu-flow-based-spravochnik-i-pokryvayu-scenarii\" data-original-article=\"Roadmap/api/sdk/middle.html\"&gt;&lt;a href=\"#Roadmap_api_sdk_middle_middle-proektiruyu-flow-based-spravochnik-i-pokryvayu-scenarii\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Проектирую flow-based справочник и покрываю сценарии»&lt;/span&gt;&lt;/a&gt;Middle: «Проектирую flow-based справочник и покрываю сценарии»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_api_sdk_middle\" id=\"Roadmap_api_sdk_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне SDK-документация перестаёт быть просто «набором примеров». Теперь это &lt;strong&gt;спроектированная система&lt;/strong&gt;, которая ведёт разработчика через реальные сценарии использования. Вы переходите от «документирую методы» к «документирую flows» — последовательности вызовов, которые решают конкретную задачу разработчика.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Flow-based подход:&lt;/strong&gt; вы идентифицируете ключевые use cases продукта и группируете сущности SDK (классы, функции) в эти flows. Для каждого flow вы выстраиваете сущности в порядке использования, добавляете «предыдущий» и «следующий» шаг, а также ссылки «See Also».&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Пользовательский фокус:&lt;/strong&gt; вы отвечаете на вопрос «Что я могу построить с этим?», а не «На чём это построено?». Каждый раздел начинается с ответа: для чего это нужно и какую задачу решает.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Покрытие сценариев:&lt;/strong&gt; вы документируете не только happy path, но и обработку ошибок, edge cases, продвинутые сценарии (batch operations, streaming, pagination).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Состояния SDK:&lt;/strong&gt; вы документируете SDK across states: Not installed → Installed but not configured → Configured but first use → Active use → Upgrade path.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Гибридный подход:&lt;/strong&gt; вы понимаете, что автогенерация из docstrings покрывает reference, но не даёт контекста. Вы добавляете ручные описания поверх.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Интеграция с CI:&lt;/strong&gt; вы настраиваете проверку примеров в CI: синтаксическая проверка, запуск против тестовой среды.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Troubleshooting:&lt;/strong&gt; вы документируете типичные ошибки SDK и способы их решения.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;проектируете систему&lt;/strong&gt;, а не набор разрозненных страниц. Разработчик, читающий SDK-документацию, должен видеть не список методов, а &lt;strong&gt;путь решения задачи&lt;/strong&gt;.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_api_sdk_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_api_sdk_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.slideshare.net/miguelcaetano/sdk-reference-manuals-a-flowbased-approach\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SDK Reference Manuals: A flow-based approach (Miguel Caetano)&lt;/a&gt; - Детальный разбор flow-based подхода: идентификация flows, группировка сущностей, «See Also» ссылки, gotchas. Единственный в своём роде ресурс по SDK-документации для писателей;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/agent-sh/agent-skills/tree/main/writing-sdk-docs-and-samples\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;writing-sdk-docs-and-samples Agent Skill (GitHub)&lt;/a&gt; - Готовый workflow: scope → map operations → write installation → authentication → operation samples → error handling → troubleshooting;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://mintlify.com/docs/api-playground/sdk-reference\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mintlify: SDK Reference Setup&lt;/a&gt; - Как генерировать SDK reference из TypeDoc, DocFX, Javadoc, Sphinx, phpDocumentor;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/liblab/liblab\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;liblab CLI&lt;/a&gt; - Генерация SDK и SDK-документации из OpenAPI-спецификации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Главы о code samples, reference documentation, работе с разработчиками.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_api_sdk_senior_senior-opredelyayu-standart-i-upravlyayu-lifecycle\" data-original-article=\"Roadmap/api/sdk/senior.html\"&gt;&lt;a href=\"#Roadmap_api_sdk_senior_senior-opredelyayu-standart-i-upravlyayu-lifecycle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и управляю lifecycle»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и управляю lifecycle»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_api_sdk_senior\" id=\"Roadmap_api_sdk_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне SDK-документация становится &lt;strong&gt;элементом developer experience (DX) стратегии&lt;/strong&gt;. Вы не просто проектируете документацию для одного SDK, вы определяете, как компания подходит к SDK-документации в масштабе: стандарты, автоматизация, метрики, обучение.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия SDK-документации:&lt;/strong&gt; вы определяете, какие SDK нуждаются в документации, какие языки поддерживаются, как документация связана с API reference и migration guides.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за актуальность, как проверяется работоспособность примеров, как обрабатываются breaking changes в SDK.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Стандарты:&lt;/strong&gt; вы определяете, как организуется SDK-документация: структура навигации, обязательные разделы, шаблоны, стиль примеров кода.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Автоматизация:&lt;/strong&gt; вы настраиваете пайплайн: генерация reference из docstrings → валидация примеров → публикация. Вы выбираете инструменты: TypeDoc, DocFX, Javadoc, Sphinx, phpDocumentor.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность SDK-документации: time-to-first-call, adoption, support tickets, DX-метрики.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды написанию SDK-документации, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Влияние на дизайн SDK:&lt;/strong&gt; вы участвуете в design-ревью SDK, предлагаете улучшения API с точки зрения документируемости и пользовательского опыта.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. SDK-документация становится частью DX-стратегии, а не побочным продуктом разработки.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_api_sdk_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_api_sdk_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ann-kilzer/developer-docs-framework\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;developer-docs-framework: SDK docs (GitHub)&lt;/a&gt; - Enterprise-фреймворк для документации: 14 content types, включая SDK docs. Content architecture, docs-as-code workflows, DX strategy;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://mintlify.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mintlify: Create developer documentation&lt;/a&gt; - Построение developer documentation: quickstarts, references, guides для SDK;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации, включая SDK и governance;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/style\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Developer Documentation Style Guide&lt;/a&gt; - Эталонные правила для developer documentation, включая code samples и reference.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_docascode_ssg_junior_junior-zapuskayu-i-publikuyu-po-instrukcii\" data-original-article=\"Roadmap/docascode/ssg/junior.html\"&gt;&lt;a href=\"#Roadmap_docascode_ssg_junior_junior-zapuskayu-i-publikuyu-po-instrukcii\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Запускаю и публикую по инструкции»&lt;/span&gt;&lt;/a&gt;Junior: «Запускаю и публикую по инструкции»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_docascode_ssg_junior\" id=\"Roadmap_docascode_ssg_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне SSG — это &lt;strong&gt;инструмент для публикации&lt;/strong&gt;. Вы учитесь запускать готовый генератор локально, разбираться в его базовой структуре и публиковать документацию в интернет. Ключевой сдвиг: вы перестаёте думать о документации как о наборе файлов в папке и начинаете видеть в ней &lt;strong&gt;сайт&lt;/strong&gt;, который можно собирать и деплоить.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание принципа работы SSG:&lt;/strong&gt; вы знаете, что SSG берёт контент (Markdown, reStructuredText, AsciiDoc), применяет тему и создаёт статические HTML-страницы для публикации.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Установка и запуск:&lt;/strong&gt; вы можете установить MkDocs или Docusaurus на локальную машину, запустить dev-сервер и увидеть свой сайт в браузере. Для MkDocs типичный запуск — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_ssg_junior_inline-code-id-g95wvvkj\"&gt;mkdocs serve&lt;/code&gt;; для Docusaurus — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_ssg_junior_inline-code-id-y6lzxott\"&gt;npm run start&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Базовая структура проекта:&lt;/strong&gt; вы понимаете, где лежат контентные файлы (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_ssg_junior_inline-code-id-hwlu1fpp\"&gt;docs/&lt;/code&gt;), где конфигурация (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_ssg_junior_inline-code-id-5jua6xku\"&gt;mkdocs.yml&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_ssg_junior_inline-code-id-qgig1az9\"&gt;docusaurus.config.js&lt;/code&gt;), и как они связаны.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Навигация:&lt;/strong&gt; вы умеете добавлять новые страницы и настраивать их в боковом меню. В MkDocs навигация задаётся в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_ssg_junior_inline-code-id-1fset5vs\"&gt;mkdocs.yml&lt;/code&gt; в разделе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_ssg_junior_inline-code-id-zoy1kv7e\"&gt;nav&lt;/code&gt;; в Docusaurus — через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_ssg_junior_inline-code-id-zj4wc7r1\"&gt;sidebars.js&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Публикация:&lt;/strong&gt; вы умеете собрать сайт (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_ssg_junior_inline-code-id-rhr473wl\"&gt;mkdocs build&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_ssg_junior_inline-code-id-ngejd3uc\"&gt;npm run build&lt;/code&gt;) и опубликовать его на GitHub Pages. Это первый шаг к тому, чтобы ваша документация стала доступна пользователям.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;запускаете и публикуете&lt;/strong&gt;, используя готовые инструкции и шаблоны. Если что-то не работает — вы ищете решение в документации инструмента.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_docascode_ssg_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_docascode_ssg_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.mkdocs.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MkDocs Documentation&lt;/a&gt; - Официальная документация MkDocs: от установки до кастомизации. Разделы «Getting Started» и «User Guide» — обязательны для старта;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docusaurus.io/docs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docusaurus Documentation&lt;/a&gt; - Официальная документация Docusaurus: от установки до версионирования. Раздел «Getting Started» даёт быстрый старт;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://techwriterstribe.com/courses/publish-your-website-with-docusaurus/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Publish your website with Docusaurus (Tech Writer's Tribe)&lt;/a&gt; - Курс &lt;strong&gt;специально для технических писателей&lt;/strong&gt;, не требует опыта программирования. 4 сессии по 3 часа: Markdown, Git, Docusaurus, GitHub Actions, автоматическая публикация;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://squidfunk.github.io/mkdocs-material/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Material for MkDocs Documentation&lt;/a&gt; - Официальная документация темы Material for MkDocs: настройка, кастомизация, плагины. Один из самых популярных вариантов оформления для MkDocs;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.coursera.org/learn/website-development-for-software-projects\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Further Website Development for Software Projects (Imperial College London)&lt;/a&gt; - Курс о static site generation и GitHub Pages: настройка SSG, добавление навигации, деплой.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_docascode_ssg_middle_middle-proektiruyu-strukturu-i-nastraivayu-pod-zadachi\" data-original-article=\"Roadmap/docascode/ssg/middle.html\"&gt;&lt;a href=\"#Roadmap_docascode_ssg_middle_middle-proektiruyu-strukturu-i-nastraivayu-pod-zadachi\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Проектирую структуру и настраиваю под задачи»&lt;/span&gt;&lt;/a&gt;Middle: «Проектирую структуру и настраиваю под задачи»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_docascode_ssg_middle\" id=\"Roadmap_docascode_ssg_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне SSG перестаёт быть просто «инструментом для публикации». Теперь это &lt;strong&gt;предмет проектирования&lt;/strong&gt;: вы выбираете генератор под задачи команды, настраиваете кастомизацию, интегрируете с CI/CD и обеспечиваете масштабируемость.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Выбор инструмента:&lt;/strong&gt; вы понимаете компромиссы между MkDocs (Python, простой Markdown), Docusaurus (React, версионирование, i18n), Sphinx (Python, reStructuredText, мощные cross-references) и Hugo (Go, скорость, Docsy). Вы можете обосновать выбор для конкретного проекта.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Продвинутая навигация:&lt;/strong&gt; вы проектируете структуру сайта: sidebar, navbar, breadcrumbs, footer. Вы понимаете, как работает автоматическая генерация навигации в MkDocs и ручная — в Docusaurus.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Кастомизация:&lt;/strong&gt; вы умеете переопределять тему: добавлять кастомные CSS, изменять шаблоны, настраивать цвета и шрифты. В Docusaurus вы работаете с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_ssg_middle_inline-code-id-joa48w5d\"&gt;src/css/custom.css&lt;/code&gt;; в MkDocs — с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_ssg_middle_inline-code-id-64tn8wxp\"&gt;extra_css&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Front matter:&lt;/strong&gt; вы используете метаданные (title, description, tags, sidebar_position) для управления отображением страниц.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Версионирование:&lt;/strong&gt; вы настраиваете versioning документации для нескольких версий продукта. Docusaurus поддерживает это «из коробки»; в MkDocs требуется плагин (mike).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Интеграция с CI/CD:&lt;/strong&gt; вы настраиваете автоматическую сборку и деплой при каждом push в main. Типичный workflow: build → lint → deploy.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Поиск:&lt;/strong&gt; вы настраиваете полнотекстовый поиск: встроенный (Docusaurus + Algolia) или локальный (MkDocs + search plugin).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;проектируете и настраиваете&lt;/strong&gt;. Вы отвечаете за то, чтобы SSG был выбран осознанно, настроен под задачи и интегрирован в процесс.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_docascode_ssg_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_docascode_ssg_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ann-kilzer/docs-as-code-setup-guide\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs-as-Code Setup Guide (GitHub)&lt;/a&gt; - Comprehensive guide: выбор инструмента, версионирование, автоматизация, best practices;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.gfu.de/schulung/docs-as-code/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Schulung Docs-as-Code: Technische Dokumentation mit Git, Markdown und CI/CD (GFU)&lt;/a&gt; - 2-дневный интенсив: Static Site Generators im Vergleich, CI/CD im Einsatz, automatisierte Publishing-Pipelines;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/jimporter/mike\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;mike Documentation (GitHub)&lt;/a&gt; - Официальная документация mike: управление версиями MkDocs, деплой на GitHub Pages, интеграция с Material for MkDocs;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docusaurus.io/docs/versioning\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docusaurus Versioning Documentation&lt;/a&gt; - Официальная документация по версионированию Docusaurus: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_ssg_middle_inline-code-id-pbvhhp4c\"&gt;npm run docusaurus docs:version&lt;/code&gt;, работа с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_docascode_ssg_middle_inline-code-id-t2rixycy\"&gt;versions.json&lt;/code&gt;;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://squidfunk.github.io/mkdocs-material/setup/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MkDocs Material Documentation — Advanced&lt;/a&gt; - Продвинутые разделы: plugins, customization, versioning, search.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_docascode_ssg_senior_senior-opredelyayu-standart-i-proektiruyu-arhitekturu\" data-original-article=\"Roadmap/docascode/ssg/senior.html\"&gt;&lt;a href=\"#Roadmap_docascode_ssg_senior_senior-opredelyayu-standart-i-proektiruyu-arhitekturu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и проектирую архитектуру»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и проектирую архитектуру»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_docascode_ssg_senior\" id=\"Roadmap_docascode_ssg_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне SSG становится &lt;strong&gt;элементом архитектуры документации&lt;/strong&gt;. Вы не просто настраиваете генератор для одного проекта, вы &lt;strong&gt;определяете стандарт для организации&lt;/strong&gt;, проектируете масштабируемую архитектуру и управляете lifecycle документационных сайтов.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Senior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Стратегия SSG для организации:&lt;/strong&gt; вы определяете, какой SSG используется в компании (или какие для разных продуктов), как он связан с другими инструментами: OpenAPI, CI/CD, системами аналитики.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Архитектура документации:&lt;/strong&gt; вы проектируете модульную архитектуру: как связаны разные документационные сайты, как работает кросс-продуктовая навигация, как обеспечивается единый поиск.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику: кто отвечает за обновление SSG, как обрабатываются breaking changes, как проверяется качество сборки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Масштабирование:&lt;/strong&gt; вы проектируете систему, которая выдерживает рост: добавление новых продуктов, языков, версий без полной перестройки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Автоматизация:&lt;/strong&gt; вы настраиваете пайплайн: контент → lint → build → test → deploy. Вы используете CI-гейты для проверки качества.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Метрики:&lt;/strong&gt; вы измеряете эффективность документационного сайта: page views, time-to-find, search queries, adoption.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; вы обучаете команды работе с SSG, проводите воркшопы, создаёте внутренние стандарты.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Выбор и оценка инструментов:&lt;/strong&gt; вы проводите сравнительную оценку SSG (MkDocs, Docusaurus, Sphinx, Hugo, Antora) и обосновываете выбор для организации.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы &lt;strong&gt;определяете правила игры&lt;/strong&gt; и &lt;strong&gt;отвечаете за их соблюдение в масштабе&lt;/strong&gt;. Документационный сайт становится частью продуктовой стратегии.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h4 id=\"Roadmap_docascode_ssg_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_docascode_ssg_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://www.amazon.com/Antora-Essentials-Complete-Developers-Engineers/dp/1484286547\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Antora Essentials: The Complete Guide for Developers and Engineers&lt;/a&gt; - Для documentation architects и senior technical writers: модульная архитектура документации, стратегическое сравнение SSG, масштабирование;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ann-kilzer/docs-as-code-setup-guide\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs-as-Code Setup Guide (GitHub, разделы о governance)&lt;/a&gt; - Разделы о документационной governance: placement matrix, правила размещения контента, lifecycle;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/TECH-OPSS/Technical-Writing-Masterclass-A\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical-Writing-Masterclass-A: Module 7 (TECH-OPSS)&lt;/a&gt; - Module 7 полностью о docs-as-code инструментах: Git, SSG, CI/CD, AI-ассистенты;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации, включая архитектуру сайта и governance;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4842-7295-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - Стратегия документации, архитектура, масштабирование, обучение команды.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_docascode_cicd_junior_junior-ponimayu-pajplajn-i-zapuskayu-gotovyj-workflow\" data-original-article=\"Roadmap/docascode/cicd/junior.html\"&gt;&lt;a href=\"#Roadmap_docascode_cicd_junior_junior-ponimayu-pajplajn-i-zapuskayu-gotovyj-workflow\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Понимаю пайплайн и запускаю готовый workflow»&lt;/span&gt;&lt;/a&gt;Junior: «Понимаю пайплайн и запускаю готовый workflow»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_docascode_cicd_junior\" id=\"Roadmap_docascode_cicd_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне CI/CD — это &lt;strong&gt;процесс, за которым вы наблюдаете и в котором участвуете&lt;/strong&gt;. Вы учитесь работать с pull requests, понимать статусы проверок и исправлять ошибки, которые находит автоматика. Ключевой сдвиг: вы перестаёте воспринимать документацию как отдельный артефакт и начинаете видеть в ней &lt;strong&gt;часть инженерного workflow&lt;/strong&gt; — от коммита до публикации.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание принципа docs-as-code:&lt;/strong&gt; документация живёт в том же репозитории, что и код, использует те же инструменты (Git, Markdown, pull requests) и проходит те же этапы проверки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Работа с pull requests:&lt;/strong&gt; вы создаёте PR, видите, какие проверки запустились, и понимаете, что означает красный или зелёный статус. В современных workflow CI-система запускает тесты документации при каждом PR.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Базовые проверки:&lt;/strong&gt; вы знаете, что CI проверяет: сборка сайта (build), проверка ссылок (broken links), линтинг (стиль, форматирование), орфография. Вы умеете читать логи ошибок и исправлять их.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Простые workflow GitHub Actions:&lt;/strong&gt; вы понимаете структуру YAML-файла: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"Roadmap_
