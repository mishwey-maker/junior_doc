        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"junior-pishu-ponyatno-i-sleduyu-standartam\"&gt;&lt;a href=\"Roadmap/base/english/junior.html#junior-pishu-ponyatno-i-sleduyu-standartam\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Пишу понятно и следую стандартам»&lt;/span&gt;&lt;/a&gt;Junior: «Пишу понятно и следую стандартам»&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне английский — это &lt;strong&gt;дисциплина&lt;/strong&gt;. Вы не изобретаете язык, а следуете установленным правилам: Simplified Technical English (ASD-STE100), Google/Microsoft style guides, внутренние стандарты. Ключевой сдвиг: вы перестаёте переводить с русского на английский и начинаете &lt;strong&gt;думать на английском&lt;/strong&gt; в терминах технической документации.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Грамматическая база (B2–C1):&lt;/strong&gt; уверенное владение временами (Present Simple, Past Simple, Present Perfect, Future Simple), модальными глаголами (must, should, can, may), пассивным залогом (но с пониманием, когда его избегать), условными предложениями. Требования к вакансиям: technical writer с опытом 0–1 года — Upper-Intermediate (B2).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Simplified Technical English (ASD-STE100):&lt;/strong&gt; базовое понимание контролируемого языка. STE — это набор из 53 правил и словарь из 864 одобренных слов, который делает технические тексты понятными для всех читателей. Вы знаете, что такое «one word — one meaning», «one instruction per sentence», и почему нельзя писать «check» вместо «verify».&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Активный залог и императив:&lt;/strong&gt; вместо «The document should be saved by the user» — «Save the document». В процедурах каждый шаг начинается с глагола в повелительном наклонении. Конвертация пассивного залога в активный часто делает предложения короче и понятнее.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Краткость и точность:&lt;/strong&gt; удаление пустых слов («actually», «various», «certain»), усилений («very», «critically»), оговорок. Предложения — не более 20 слов, особенно в технических инструкциях. ISO House Style рекомендует Plain English: короткие предложения, одна идея на предложение, частые подзаголовки и списки, потому что документы читают не-носители языка и часто переводят.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Единообразие терминов:&lt;/strong&gt; если вы назвали кнопку «Settings» один раз, вы называете её так везде. Терминологические глоссарии Google и Microsoft содержат сотни тем по правильному написанию и использованию отраслевых терминов.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Различие между русским и английским техническим стилем:&lt;/strong&gt; русский технический стиль тяготеет к безличным конструкциям («Аудит проведён», «План должен быть направлен»), английский — к активному залогу и прямым конструкциям. Вы понимаете эту разницу и не переносите русские шаблоны в английский текст.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;следуете&lt;/strong&gt; правилам, а не устанавливаете их. Если в проекте принят Google Developer Documentation Style Guide — вы пишете по нему.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-junior\"&gt;&lt;a href=\"Roadmap/base/english/junior.html#kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - Фундаментальный курс: активный залог, сильные глаголы, конкретные существительные, борьба с лишними словами. Доступен на английском, что само по себе — практика;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/978-1-4302-6634-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«User Guides, Manuals, and Technical Writing» (Adrian Wallwork)&lt;/a&gt; - Книга, написанная &lt;strong&gt;специально для не-носителей английского&lt;/strong&gt;: структура мануала, ясный английский, типичные грамматические и лексические ошибки в мануалах. Разделы о структуре и контенте, ясном английском, типичных ошибках;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.asd-ste100.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ASD-STE100 Simplified Technical English (официальный стандарт)&lt;/a&gt; - Набор из 53 правил и 864 одобренных слов. Официальная копия доступна бесплатно на &lt;a href=\"http://asd-ste100.org\"&gt;asd-ste100.org&lt;/a&gt;. Учит писать так, чтобы текст был понятен не-носителям языка и легко переводился;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://archive.org/details/technicalwriting0000huck\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«Technical Writing and Professional Communication for Nonnative Speakers of English» (Huckin, Olsen)&lt;/a&gt; - Разработан для не-носителей: процесс написания, кейсы, упражнения. Классика жанра, которая помогает понять, какие конструкции работают в английском техническом тексте, а какие — нет;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/style\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Developer Documentation Style Guide&lt;/a&gt; - Эталонный стайлгайд: tone and content, language and grammar, word list. Разделы «Highlights» и «Word list» — обязательны для Junior. Помогает понять, какие термины использовать и как писать для глобальной аудитории;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://learn.microsoft.com/en-us/style-guide/welcome/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Microsoft Writing Style Guide&lt;/a&gt; - Второй эталонный стайлгайд: более 300 тем по терминологии, бренд-голос, accessibility, локализация. Раздел «Top 10 tips» — быстрый старт для Junior.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/base/english/junior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Junior: «Пишу понятно и следую стандартам»","href":"Roadmap/base/english/junior.html#junior-pishu-ponyatno-i-sleduyu-standartam","level":2,"items":[{"title":"Курсы и книги (Junior)","href":"Roadmap/base/english/junior.html#kursy-i-knigi-junior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/base/english/junior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
