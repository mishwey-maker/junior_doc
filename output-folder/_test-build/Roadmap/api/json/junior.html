        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"junior-chitayu-struktury-i-dokumentiruyu-po-shablonu\"&gt;&lt;a href=\"Roadmap/api/json/junior.html#junior-chitayu-struktury-i-dokumentiruyu-po-shablonu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Читаю структуры и документирую по шаблону»&lt;/span&gt;&lt;/a&gt;Junior: «Читаю структуры и документирую по шаблону»&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне JSON/XML — это &lt;strong&gt;язык, на котором передаются данные&lt;/strong&gt;. Вы учитесь читать JSON-ответы, разбирать XML-документы, различать типы данных и документировать структуры по готовому шаблону. Ключевой сдвиг: вы перестаёте «пересказывать» данные и начинаете &lt;strong&gt;документировать их контракт&lt;/strong&gt; — какие поля есть, какие типы, обязательные или опциональные.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;JSON-синтаксис:&lt;/strong&gt; вы понимаете структуру JSON: объекты &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2uep38fo\"&gt;{}&lt;/code&gt;, массивы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f43axe6f\"&gt;[]&lt;/code&gt;, пары «ключ-значение», строки, числа, булевы значения, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n8gvnbwu\"&gt;null&lt;/code&gt;. Вы различаете вложенные объекты и массивы объектов.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;XML-синтаксис:&lt;/strong&gt; вы понимаете структуру XML: корневой элемент, вложенные элементы, атрибуты, текстовое содержимое.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Типы данных:&lt;/strong&gt; вы различаете в JSON: string, number, boolean, array, object, null. В XML: элементы, атрибуты, текст, CDATA. Вы документируете типы для каждого поля.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обязательные и опциональные поля:&lt;/strong&gt; вы понимаете, какие поля обязательны, а какие — нет. Вы документируете это явно.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Документирование структур:&lt;/strong&gt; вы описываете JSON/XML по шаблону: поле → тип → описание → пример.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация примеров:&lt;/strong&gt; вы проверяете, что ваши примеры JSON/XML валидны — синтаксически корректны и соответствуют реальному API.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;читаете и документируете&lt;/strong&gt; структуры данных, а не проектируете их. Если поле неверное — вы документируете то, что есть, и уточняете у разработчика.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-junior\"&gt;&lt;a href=\"Roadmap/api/json/junior.html#kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://www.udemy.com/course/learn-api-technical-writing-json-and-xml-for-writers/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Learn API Technical Writing: JSON and XML for Writers (Udemy, Peter Gruenbaum)&lt;/a&gt; - Курс &lt;strong&gt;специально для технических писателей&lt;/strong&gt;: 8 видео, 4 практических упражнения, 5 квизов. Учит читать и документировать структурированные данные в JSON и XML. Не требует опыта программирования;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.koenig-solutions.com/api-technical-writing-json-xml-training\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;API Technical Writing: JSON and XML for Writers (Koenig Solutions)&lt;/a&gt; - 8-часовой интенсив: API types (REST, SOAP, GraphQL), JSON syntax, XML tags and attributes, hands-on practice, documenting errors;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.amazon.com/API-Technical-Writing-Made-Easy-ebook/dp/B0BQZ8Z8Z8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;API Technical Writing Made Easy: A Guide to JSON &amp;amp; XML for Non-Programmers (R. Parvin)&lt;/a&gt; - Практическое руководство &lt;strong&gt;без опыта программирования&lt;/strong&gt;: что такое API, как читать JSON/XML, как документировать структуры;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.classcentral.com/course/udemy-learn-api-technical-writing-json-and-19418\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JSON and XML for Technical Writers (Class Central)&lt;/a&gt; - Обзорный курс: read and understand structured data, write documentation for JSON/XML files, edit JSON/XML for tools that generate documentation;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://stackoverflow.com/questions/13217291/json-schema-vs-xml-schema\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JSON Schema vs XML Schema (Stack Overflow)&lt;/a&gt; - Понимание разницы между схемами: JSON Schema draft 04 vs XSD, когда что использовать.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/api/json/junior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Junior: «Читаю структуры и документирую по шаблону»","href":"Roadmap/api/json/junior.html#junior-chitayu-struktury-i-dokumentiruyu-po-shablonu","level":2,"items":[{"title":"Курсы и книги (Junior)","href":"Roadmap/api/json/junior.html#kursy-i-knigi-junior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/api/json/junior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
