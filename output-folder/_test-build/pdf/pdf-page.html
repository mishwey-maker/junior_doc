lt;li&gt;Установить тему &lt;em&gt;MkDocs material theme&lt;/em&gt; с помощью команды:&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs shell\"&gt;pip install mkdocs-material\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"380\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"useful_Begin_visibileAnimation-380\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"useful_Begin_hideAnimation-380\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-380.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ol start=\"3\" style=\"--hier-list-start:2\"&gt;\n&lt;li&gt;\n&lt;p&gt;Перейти в папку с репозиторием проекта с помощью команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-kkvp81wo\"&gt;cd путь_к_папке&lt;/code&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Проверить состояние проекта с помощью команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-3qwqgxxs\"&gt;git status&lt;/code&gt;. Убедится, что находитесь в главной ветке. Если нет, переключитесь на неё (команда &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-8tgdqtwg\"&gt;git switch main&lt;/code&gt;);&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Обновить репозиторий с помощью команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-s4owu0k4\"&gt;git pull&lt;/code&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Отколоть новую ветку, в которой будет совершаться настройка проекта. Например &lt;em&gt;task-2-setup-mkdocs&lt;/em&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Открыть папку проекта через проводник;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;В папке создать &lt;em&gt;mkdocs.yml&lt;/em&gt;. Это конфиг, с помощью которого будет происходить настройка документации;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Привести структуру проекта к шаблону:&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;├─ docs/\n│  └─ index.md\n└─ mkdocs.yml\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"418\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"useful_Begin_visibileAnimation-418\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"useful_Begin_hideAnimation-418\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-418.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;По шаблону все исходники должны лежать в подпапке docs. Создать папку &lt;em&gt;docs&lt;/em&gt; и перенести туда файл &lt;em&gt;&lt;a href=\"http://index.md\"&gt;index.md&lt;/a&gt;&lt;/em&gt;;&lt;br&gt;\n10. Открыть файл mkdocs.yml (с помощью VS Code или любого другого редактора кода) и добавить  название проекта:&lt;br&gt;\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-ci4mqvq8\"&gt;site_name: [Название сайта]&lt;/code&gt;&lt;br&gt;\n11. Сохранить изменения в &lt;em&gt;mkdocs.yml&lt;/em&gt; и закрыть файл.&lt;/p&gt;\n&lt;ol start=\"12\" style=\"--hier-list-start:11\"&gt;\n&lt;li&gt;Выполнить команду &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-ndip565f\"&gt;mkdocs serve&lt;/code&gt;&lt;br&gt;\nЕсли всё сделано правильно, в ответ придёт адрес локального порта, на котором собралась дока:&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs shell\"&gt;C:\\Users\\User1\\parawriter\\parawriter_docs&amp;gt;mkdocs serve\nINFO    -  Building documentation...\nINFO    -  Cleaning site directory\nINFO    -  Documentation built in 0.11 seconds\nINFO    -  [11:59:50] Watching paths for changes: 'docs', 'mkdocs.yml'\nINFO    -  [11:59:50] Serving on http://127.0.0.1:8000/\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"429\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"useful_Begin_visibileAnimation-429\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"useful_Begin_hideAnimation-429\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-429.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если перейти по адресу в последней строке, то можно увидеть как будет выглядеть сайт.&lt;/p&gt;\n&lt;p&gt;Теперь дело за малым: закоммитьте изменения, отправьте их на сервер, создайте пул-реквест и влейте рабочую ветку в ветку main.&lt;/p&gt;\n&lt;ol start=\"13\" style=\"--hier-list-start:12\"&gt;\n&lt;li&gt;\n&lt;p&gt;Выполнить команду &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-fh2r49ui\"&gt;-git add .&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Выполнить команду &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-8g69pclh\"&gt;git commit -m \"краткое описание изменений\"&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;В GitHub выберите пункт &lt;em&gt;Pull requests&lt;/em&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Нажать кнопку &lt;em&gt;New pull request&lt;/em&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;В разделе &lt;em&gt;«Compare changes»&lt;/em&gt; выбрать ветки:&lt;br&gt;\nВ поле base нужно добавить ветку main, а в поле compare — ветку с которой ведётся работа.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Нажать кнопку &lt;em&gt;Create pull request&lt;/em&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Заполнить описание пул-реквеста.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Нажать кнопку &lt;em&gt;Create pull request&lt;/em&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"useful_Begin_nastrojka-struktury-sajta\"&gt;&lt;a href=\"#useful_Begin_nastrojka-struktury-sajta\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройка структуры сайта&lt;/span&gt;&lt;/a&gt;Настройка структуры сайта&lt;/h3&gt;\n&lt;p&gt;Пример структуры сайта:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Главная страница  // файл index.md\n├─ Онбординг тех.писателя // файл onboarding.md\n│  ├── Первый урок // файл onboarding/lesson_1.md\n│  ├── Второй урок // файл onboarding/lesson_2.md\n│  ├── &amp;lt;...&amp;gt;\n│  └── Последний урок // файл onboarding/lesson_last.md\n└─ Docs-as-code для самых маленьких // файл docs_as_code.md\n   ├── Первый урок // файл docs_as_code/lesson_1.md\n   ├── Второй урок // файл docs_as_code/lesson_2.md\n   ├── &amp;lt;...&amp;gt;\n   └── Последний урок // файл docs_as_code/lesson_last.md\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"484\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"useful_Begin_visibileAnimation-484\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"useful_Begin_hideAnimation-484\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-484.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;blockquote&gt;\n&lt;p&gt;!Все изменения делать в новой ветке.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;Пример заполнения mkdocs.yml&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs shell\"&gt;site_name: Rivers and lakes # Название сайта\nsite_description: Rivers and lakes of Russia # Описание сайта, добавляется в meta-теги\ntheme: # Тема сайта, информация о ее параметрах\n  name: material # Название темы\n  logo: logo.svg # Ссылка на логотип сайта\n  font:\n    text: Roboto # Шрифт текста\n    code: Roboto Mono # Шрифт для текста кода\n  features:\n    #- navigation.sections\n    - navigation.path # Хлебные крошки\n    - navigation.indexes # Позволяет создавать корневые страницы разделов меню. Корневая страница должна лежать в папке раздела и называться index.md. Пример использования корневых страниц приведен ниже в настройках nav\n    #- navigation.tabs # Верхнее меню\n    #- navigation.tabs.sticky # Фиксация верхнего меню\n    #- Navigation sections # Настройка спойлеров в левом меню\n    #- navigation.expand # Разворачивает спойлеры в левом меню по умолчанию\n    #- toc.integrate # Фиксирует оглавление страницы в левом меню\n    - navigation.instant # Функция быстрой загрузки страниц\n    - navigation.top # Добавляет кнопку «к началу» для быстрой обратной прокрутки страницы\n    - search.suggest # Подсказки при вводе поискового запроса\n    - search.highlight # Подсветка результатов поиска в тексте страницы\n    - content.code.copy # Кнопка копирования в блоке кода\n\n  language: ru # Язык\n  palette: # Настройки светлой и тёмной тем\n    # Настройки светлой темы\n    - scheme: default \n      toggle:\n        icon: material/weather-sunny # Иконка для активации светлой темы\n        name: Выключить солнышко # Всплывающий текст-подсказка\n      primary: blue # Основной цвет\n      accent: purple # Акцентный цвет\n    # Настройки тёмной темы\n    - scheme: slate\n      toggle:\n        icon: material/weather-night\n        name: Позвать солнышко\n      primary: deep purple\n      accent: blue\n\nnav: # Структура сайта\n    - Главная страница: index.md\n    - Озёра России: \n      - lakes/index.md\n      - Онежское озеро: lakes/onega.md\n      - Ладожское озеро: lakes/ladoga.md\n      - Байкал: lakes/baikal.md\n    - Реки России:\n      - rivers/index.md\n      - Свирь: rivers/svir.md\n      - Нева: rivers/neva.md\n      - Ангара: rivers/angara.md\n\nextra:\n  social: # Ссылки на соц.сети\n    - icon: fontawesome/brands/github-alt # Иконка гитхаба\n      link: https://github.com/{your_account} # Ссылка на гитхаб\n\nmarkdown_extensions: # Расширения markdown\n  - admonition # Поддержка информационных панелей (сообщений типа «Внимание», «Совет», «Примечание», etc.)\n  - footnotes # Поддержка встроенных сносок на страницах\n  - attr_list # Использование html-атрибутов и CSS в элементах markdown\n  - md_in_html # Поддержка markdown внутри html\n  - def_list # Поддержка списков определений\n  - pymdownx.tabbed # Использование вкладок (табов)\n  - pymdownx.details # Использование спойлеров (катов)\n  - pymdownx.highlight: # Подсветка синтаксиса в блоках кода\n      anchor_linenums: true\n  - pymdownx.superfences # Поддержка вложенных блоков кода\n  - pymdownx.snippets # Использование заимствованного контента\n  - pymdownx.emoji: # Иконки и эмодзи\n      emoji_index: !!python/name:material.extensions.emoji.twemoji\n      emoji_generator: !!python/name:material.extensions.emoji.to_svg\n\ncopyright: |\n  &amp;amp;copy; 2024 NOVILLERO\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"493\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"useful_Begin_visibileAnimation-493\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"useful_Begin_hideAnimation-493\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-493.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Подробное описание настроек конфига можно посмотреть &lt;a href=\"https://squidfunk.github.io/mkdocs-material/setup/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;тут&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Собрать доку локально с помощью команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-z477otpi\"&gt;mkdocs serve&lt;/code&gt; убедится, что всё работает.&lt;/p&gt;\n&lt;p&gt;Отправьте изменения на сервер. Не забыть, что все изменения проводятся в новой ветке.&lt;/p&gt;\n&lt;h3 id=\"useful_Begin_github-pages-podgotovka-statichnyh-stranic\"&gt;&lt;a href=\"#useful_Begin_github-pages-podgotovka-statichnyh-stranic\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GitHub Pages подготовка статичных страниц&lt;/span&gt;&lt;/a&gt;GitHub Pages подготовка статичных страниц&lt;/h3&gt;\n&lt;p&gt;Выполнить публикацию вручную:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Открыть CMD;&lt;/li&gt;\n&lt;li&gt;Зайти в папку с проектом, используя команду &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-5xnqnhca\"&gt;cd&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Убедится, что находитесь в ветке main и что все изменения собраны в коммиты и залиты в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-ged4ific\"&gt;main&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Выполните команду для сборки и публикации сайта:&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs shell\"&gt;mkdocs gh-deploy\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"531\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"useful_Begin_visibileAnimation-531\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"useful_Begin_hideAnimation-531\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-531.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если процесс прошёл без ошибок, в ответе на команду &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-4l2s9gra\"&gt;mkdocs gh-deploy&lt;/code&gt; отобразится URL сайта:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;…&amp;gt;\nTo https://github.com/novillero/parawriter_docs.git\n * [new branch]      gh-pages -&amp;gt; gh-pages\nINFO    -  Your documentation should shortly be available at: https://novillero.github.io/parawriter_docs/\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"535\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"useful_Begin_visibileAnimation-535\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"useful_Begin_hideAnimation-535\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-535.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ol&gt;\n&lt;li&gt;Открыть репозиторий в &lt;em&gt;Github&lt;/em&gt; и перейти на вкладку &lt;em&gt;Settings&lt;/em&gt;;&lt;/li&gt;\n&lt;li&gt;В левом меню выберите пункт &lt;em&gt;Pages&lt;/em&gt;;&lt;/li&gt;\n&lt;li&gt;На этой странице указаны настройки публикации сайта на &lt;em&gt;GitHub Pages&lt;/em&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Проверить на установленные значения:&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Sourse — Deploy from a branch;&lt;br&gt;\nBranch — gh-pages; folder — /(root).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;Это значит, что сайт публикуется из ветки, ветка для публикации — gh-pages.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Открыть вкладку Action. Здесь отображаются все запущенные &lt;em&gt;workflow&lt;/em&gt; публикации сайта.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Каждый раз, когда вы запускаете сборку командой mkdocs gh-deploy, в разделе Actions → All workflow появляется новая запись.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;ol&gt;\n&lt;li&gt;Нажать на запись, чтобы увидеть подробности сборки и ссылку на опубликованный сайт. Зелёная галочка сообщает о том, что процесс прошёл удачно и сайт опубликован. &lt;strong&gt;Красный крестик показывает, что сборка и публикация завершились ошибкой. В этом случае стоит проверить валидность конфига и файлов проекта.&lt;/strong&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Ошибки и предупреждения можно посмотреть с помощью команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-xphzr5g9\"&gt;mkdocs serve&lt;/code&gt; — все они отобразятся в командной строке.&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Главная цель достигнута — сайт с документацией опубликован. Теперь вы можете каждый раз после обновления проекта (вливания рабочей ветки в main) запускать пересборку и публикацию изменений.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"useful_Begin_nastrojka-ci\"&gt;&lt;a href=\"#useful_Begin_nastrojka-ci\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройка CI&lt;/span&gt;&lt;/a&gt;Настройка CI&lt;/h3&gt;\n&lt;ol&gt;\n&lt;li&gt;Открыть CMD и перейти в папку проекта с помощью команды cd;&lt;/li&gt;\n&lt;li&gt;Создать новую рабочую ветку;&lt;/li&gt;\n&lt;li&gt;Открыть папку с проектом через проводник;&lt;/li&gt;\n&lt;li&gt;Создать новую папку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"useful_Begin_inline-code-id-gqmqcokf\"&gt;.github&lt;/code&gt;в корне проекта;&lt;/li&gt;\n&lt;li&gt;Внутри папки .github создать папку &lt;em&gt;workflows&lt;/em&gt;;&lt;/li&gt;\n&lt;li&gt;Внутри папки workflows создайте новый файл ci.yml;&lt;/li&gt;\n&lt;li&gt;Открыть файл &lt;em&gt;ci.yml&lt;/em&gt; с помощью VS Code или другого редактора;&lt;/li&gt;\n&lt;li&gt;Скопировать текст ниже и вставить его в файл &lt;em&gt;ci.yml&lt;/em&gt;:&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;name: ci\non:\n  push:\n    branches:\n      - main\npermissions:\n  contents: write\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v3\n      - uses: actions/setup-python@v4\n        with:\n          python-version: 3.x\n      - uses: actions/cache@v2\n        with:\n          key: ${{ github.ref }}\n          path: .cache\n      - run: pip install mkdocs-material\n      - run: mkdocs gh-deploy --force\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"636\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"useful_Begin_visibileAnimation-636\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"useful_Begin_hideAnimation-636\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-636.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ol start=\"9\" style=\"--hier-list-start:8\"&gt;\n&lt;li&gt;\n&lt;p&gt;Сохранить изменения, отправить их на сервер;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Войти в GitHub, создать пул-реквест и слить рабочую ветку с веткой &lt;em&gt;main&lt;/em&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Перейти в раздел &lt;em&gt;Actions → All workflow&lt;/em&gt;. В списке &lt;em&gt;workflow&lt;/em&gt; появилась новая запись — это и есть наш новый автоматический процесс. Если он завершился успешно (все этапы отмечены зелёными галочками), значит, всё получилось. Для проверки можете внести какие-нибудь изменения в исходные файлы и добавить их в ветку &lt;em&gt;main&lt;/em&gt;. После сливания рабочей ветки с веткой main в &lt;em&gt;Actions&lt;/em&gt; опять должен запуститься новый &lt;em&gt;workflow&lt;/em&gt;. Дождитесь его завершения, перейдите на сайт и убедитесь, что там отобразились ваши изменения.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;p&gt;[TOC]&lt;/p&gt;\n&lt;h2 id=\"Roadmap_base_md_junior_junior-pishu-i-ne-zadumyvayus\" data-original-article=\"Roadmap/base/md/junior.html\"&gt;&lt;a href=\"#Roadmap_base_md_junior_junior-pishu-i-ne-zadumyvayus\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Пишу и не задумываюсь»&lt;/span&gt;&lt;/a&gt;Junior: «Пишу и не задумываюсь»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_base_md_junior\" id=\"Roadmap_base_md_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне Markdown — это ваш рабочий инструмент, которым вы пользуетесь ежедневно. Вы не «изучаете Markdown», вы пишете документацию, а Markdown — это просто способ её оформить. Вы должны уверенно воспроизводить базовый синтаксис без шпаргалки и понимать, зачем нужен каждый элемент.&lt;/p&gt;\n&lt;p&gt;Что входит в Junior-уровень:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Базовый синтаксис:&lt;/strong&gt; заголовки (#–######), параграфы, переносы строк, выделение (&lt;strong&gt;bold&lt;/strong&gt;, &lt;em&gt;italic&lt;/em&gt;), списки (маркированные, нумерованные, вложенные), ссылки (инлайн и reference-style), изображения, цитаты (&amp;gt;), код (инлайн и блоки с указанием языка), горизонтальные линии (---).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Таблицы:&lt;/strong&gt; создание простых таблиц, выравнивание столбцов, понимание, когда таблица лучше списка, а когда — хуже.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Экранирование:&lt;/strong&gt; умение вывести символ, который Markdown интерпретирует как разметку (*, _, `).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Понимание «вкусов» Markdown: вы знаете, что &lt;em&gt;CommonMark&lt;/em&gt;&lt;/strong&gt; — базовый стандарт, &lt;em&gt;GitHub Flavored Markdown (GFM)&lt;/em&gt; добавляет таблицы, task lists, strikethrough, а разные платформы (GitLab, Bitbucket, Confluence) могут иметь свои нюансы.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Инструментальная база:&lt;/strong&gt; вы пишете в VS Code или другом редакторе с превью, понимаете, как проверить, что разметка отрендерится корректно.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы следуете правилам, а не устанавливаете их. Если в проекте принято использовать ATX-заголовки (#) и ограничивать длину строки 100 символами — вы делаете именно так, не задавая вопросов.&lt;/em&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr&gt;\n&lt;h3 id=\"Roadmap_base_md_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_base_md_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://markdownguide.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Markdown Guide&lt;/a&gt; - лучший стартовый ресурс: от базового синтаксиса до GFM и расширений.&lt;/p&gt;\n&lt;p&gt;🔝 &lt;a href=\"https://stepik.org/a/187888\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Курс «Markdown» на Stepik&lt;/a&gt; - cамый популярный русскоязычный курс по Markdown: более 5700 студентов, структура от нуля до уверенного владения.&lt;/p&gt;\n&lt;p&gt;🔝 &lt;a href=\"https://github.com/als-creator/it_notes/blob/main/%D0%A3%D1%87%D0%B5%D0%B1%D0%BD%D0%B8%D0%BA%20Markdown.md\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Книга по Markdown (на основе курса Stepik)&lt;/a&gt; - полноценное пособие, повторяющее структуру курса. Можно использовать как справочник и офлайн-версию.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"Roadmap/base/md/markdowntutorial.com\"&gt;Markdown Tutorial&lt;/a&gt; - интерактивный тренажёр, каждая тема короткое упражнение с мгновенной проверкой.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - не про Markdown напрямую, но про то, как писать, а Markdown это лишь инструмент оформления.&lt;/p&gt;\n&lt;hr&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;p&gt;[TOC]&lt;/p&gt;\n&lt;h2 id=\"Roadmap_base_md_middle_middle-vybirayu-i-nastraivayu\" data-original-article=\"Roadmap/base/md/middle.html\"&gt;&lt;a href=\"#Roadmap_base_md_middle_middle-vybirayu-i-nastraivayu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Выбираю и настраиваю»&lt;/span&gt;&lt;/a&gt;Middle: «Выбираю и настраиваю»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_base_md_middle\" id=\"Roadmap_base_md_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне Markdown перестаёт быть просто «языком, на котором я пишу». Теперь это предмет решений: какой диалект использовать, какие расширения подключать, какие правила линтинга настроить, как обеспечить единообразие в команде.&lt;/p&gt;\n&lt;p&gt;Что входит в Middle-уровень:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Выбор диалекта:&lt;/strong&gt; вы понимаете разницу между CommonMark, GFM, MyST, и можете обосновать, почему для проекта выбран именно этот вариант. Markdown (CommonMark/GFM) — тривиален для изучения, все его знают, он даёт чистые диффы, но имеет ограничения: нет встроенных includes, сносок, сложных таблиц, admonitions.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Расширения:&lt;/strong&gt; вы знаете, как подключить и использовать admonitions (callouts), footnotes, definition lists, task lists, tabbed code blocks, collapsible sections. Вы понимаете, какие расширения даёт Python-Markdown, какие — MyST, а какие — SSG (MkDocs, Docusaurus).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Линтинг и валидация:&lt;/strong&gt; вы настраиваете markdownlint для проверки синтаксиса и Vale для проверки стиля. Vale позволяет превратить стайлгайд в исполняемые правила: он ловит жаргон, пассивный залог, несоответствия терминов — прямо в редакторе или в CI.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Интеграция с SSG:&lt;/strong&gt; вы понимаете, как Markdown-файлы превращаются в сайт через MkDocs, Docusaurus, Sphinx или Hugo. Вы знаете, как работают front matter (YAML-метаданные), навигация, sidebar, версионирование.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Стандарты и стайлгайд:&lt;/strong&gt; вы можете написать стайлгайд для Markdown: какие заголовки использовать (ATX, не Setext), какую длину строки считать максимальной, когда использовать таблицу, а когда список, как оформлять код и ссылки.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы делаете выбор и объясняете его. Вы не просто «пишете в Markdown», вы отвечаете за то, чтобы команда писала единообразно.&lt;/em&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"Roadmap_base_md_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_base_md_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"Roadmap/base/md/senior-stack.uz\"&gt;Docs as Code &amp;amp; Tooling — Middle Level&lt;/a&gt; - подробный разбор выбора языка разметки, SSG, CI-гейтов. Описывает, как принимать решения, а не просто следовать туториалу.&lt;/p&gt;\n&lt;p&gt;Write Better with Vale (Brian P. Hogan) - единственная книга, целиком посвящённая Vale: как превратить стайлгайд в исполняемые правила, как линтить Markdown, как настроить CI.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"Roadmap/base/md/learn.microsoft.com\"&gt;Microsoft Markdown Best Practices&lt;/a&gt; - реальный корпоративный стайлгайд: ATX-заголовки, лимит строки 100 символов, работа с пробелами и табами.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://google.github.io/styleguide/docguide/style.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Markdown Style Guide&lt;/a&gt; - пример строгого, продуманного стайлгайда от Google: простота, консистентность, читаемость исходного текста.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.gitlab.com/development/documentation/styleguide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitLab Documentation Style Guide&lt;/a&gt; - отличный пример стайлгайда для open-source проекта, написанного на Markdown&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://python-markdown.github.io/extensions/index.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Python-Markdown Extensions&lt;/a&gt; - справочник по расширениям: admonitions, footnotes, definition lists, attribute lists&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;p&gt;[TOC]&lt;/p&gt;\n&lt;h2 id=\"Roadmap_base_md_senior_senior-opredelyayu-standart-i-masshtabiruyu\" data-original-article=\"Roadmap/base/md/senior.html\"&gt;&lt;a href=\"#Roadmap_base_md_senior_senior-opredelyayu-standart-i-masshtabiruyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и масштабирую»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и масштабирую»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_base_md_senior\" id=\"Roadmap_base_md_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне Markdown — это элемент архитектуры документации. Вы не просто выбираете диалект для команды, вы определяете, как Markdown вписывается в общую стратегию: как связаны рукописные гайды и генерируемый reference, как масштабируется документация на десятки тысяч файлов, как обеспечивается консистентность между командами и продуктами.&lt;/p&gt;\n&lt;p&gt;Что входит в Senior-уровень:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Архитектура разметки:&lt;/strong&gt; вы определяете, где использовать Markdown, а где — DITA, AsciiDoc или reStructuredText. Вы понимаете компромиссы: Markdown тривиален для контрибьюторов, но ограничен; AsciiDoc мощнее, но требует изучения; DITA — стандарт для структурированного авторства, но тяжёл.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Lightweight DITA (LwDITA):&lt;/strong&gt; вы знаете, как связать Markdown с структурированным авторством через LwDITA — открытый стандарт, который мостит разрыв между Markdown и DITA XML.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Governance и стандарты:&lt;/strong&gt; вы создаёте org-wide стайлгайд по Markdown, который используется несколькими командами. Вы определяете, как обрабатывать исключения, как проводить ревью, как обучать новых авторов.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Инструментальная стратегия:&lt;/strong&gt; вы выбираете SSG для организации, определяете пайплайн: Markdown → lint → build → deploy. Вы решаете, какие проверки обязательны, а какие — рекомендательны.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Автоматизация и масштабирование:&lt;/strong&gt; вы настраиваете автоматическую генерацию Markdown из источников истины (OpenAPI, docstrings), интеграцию с CI/CD, обработку тысяч файлов, поиск и метаданные.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Миграции:&lt;/strong&gt; вы руководите миграцией с одного диалекта/SSG/платформы на другой, сохраняя контент, ссылки и историю.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы определяете правила игры и отвечаете за их соблюдение в масштабе. PM-ы и инженеры приходят к вам за советом по документации до начала работы над фичей.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h3 id=\"Roadmap_base_md_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_base_md_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://dl.acm.org/doi/10.1145/3641237.3691677\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Implementing Structured Authoring Practices in a Docs-as-Code Framework (ACM)&lt;/a&gt; - реальный кейс миграции с DITA на Markdown в IBM Cloud: компромиссы, уроки, практики выбора инструментов&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://cdn.jsdelivr.net/npm/cc4pm@2.0.6/_bmad/_memory/tech-writer-sidecar/documentation-standards.md\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Documentation Standards for BMAD&lt;/a&gt; - пример строгого внутреннего стандарта: CommonMark, стайлгайд, правила compliance, Mermaid&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.oasis-open.org/committees/download.php/61809/LwDITA-v1.0-cn01-1.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;DITA and Lightweight DITA (LwDITA)&lt;/a&gt; - Официальное введение в LwDITA: как связать Markdown со структурированным авторством, маппинг XML/HTML5/Markdown&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://link.springer.com/book/10.1007/979-8-8688-2509-5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs for Developers (Jared Bhatti et al.)&lt;/a&gt; - не про Markdown напрямую, но про то, как строить документацию в масштабе: архитектура, процессы, метрики, работа с инженерами&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - лучшие практики для документации в целом, включая выбор разметки и инструментов&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/wongyah/awesome-technical-writing-learning\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Awesome Technical Writing Learning (GitHub)&lt;/a&gt; - кураторский список бесплатных ресурсов по техническому писательству, включая стайлгайды и инструменты&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_base_git_junior_junior-kommichu-i-ne-boyus\" data-original-article=\"Roadmap/base/git/junior.html\"&gt;&lt;a href=\"#Roadmap_base_git_junior_junior-kommichu-i-ne-boyus\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Коммичу и не боюсь»&lt;/span&gt;&lt;/a&gt;Junior: «Коммичу и не боюсь»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_base_git_junior\" id=\"Roadmap_base_git_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне Git — это ваш ежедневный инструмент. Вы должны уверенно выполнять базовые операции, не заглядывая в шпаргалку, и понимать зачем каждая из них нужна. Ключевой сдвиг в мышлении: вы перестаёте думать файлами и начинаете думать изменениями. Традиционный редактор перезаписывает файл — нет истории, нет точки восстановления. Git создаёт структурированную временную линию: каждый коммит — это снимок всей документации в конкретный момент, с записанным решением и возможностью отката.&lt;/p&gt;\n&lt;p&gt;Что входит в Junior-уровень:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Базовые команды&lt;/strong&gt;: git clone, git add, git commit, git push, git pull, git status, git log, git diff.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Ветвление&lt;/strong&gt;: создание ветки (git branch, git checkout -b), переключение, слияние (git merge). Понимание, что ветка — это «параллельная вселенная» для одной группы изменений.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Коммиты&lt;/strong&gt;: осмысленные сообщения (что и зачем изменено), разделение работы на небольшие логические шаги.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Pull Request&lt;/strong&gt;: создание PR на GitHub, описание изменений, запрос ревью, ответ на комментарии.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Работа с GitHub&lt;/strong&gt;: создание репозитория, README, issues, fork.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Понимание docs-as-code&lt;/strong&gt;: зачем писателю Git, как документация живёт в том же репозитории, что и код.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы следуете установленному воркфлоу. Если в команде принято создавать ветку для каждой задачи — вы делаете именно так.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h3 id=\"Roadmap_base_git_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_base_git_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://www.udemy.com/course/git-and-github-for-writers/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Git and GitHub for Writers (Udemy)&lt;/a&gt; - первый курс, созданный специально для писателей: все примеры — документы, а не код. 14 практических упражнений, объяснение концепций на языке, понятном писателю;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://learngitbranching.js.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Learn Git Branching&lt;/a&gt; - визуализация ветвления — лучший способ увидеть, как работает Git. Визуальный sandbox и серия учебных задач;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://skills.github.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitHub Skills&lt;/a&gt; - курсы прямо внутри GitHub: «Introduction to GitHub», «Review Pull Requests», «Resolve Merge Conflicts». Учитесь в реальном репозитории с ботом Mona;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/Douglasebhoman/git-github-for-technical-writers-series\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Git and GitHub for Technical Writers&lt;/a&gt; - шесть серия именно для технических писателей: от основ Git до CI/CD и архитектуры репозитория;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://git-scm.com/book/ru/v2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«Pro Git» (Скотт Чакон, Бен Штрауб)&lt;/a&gt; - официальная книга по Git, переведена на русский. Первые 3 главы — обязательно для Junior.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.chitai-gorod.ru/product/git-dlya-professionalnogo-programmista-2618344\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«Git для профессионального программиста»&lt;/a&gt; - русскоязычное издание про git.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;p&gt;Middle: «Настраиваю и выбираю»&lt;/p&gt;\n&lt;p&gt;На Middle-уровне Git перестаёт быть просто «инструментом, которым я пользуюсь». Теперь это предмет решений: какую стратегию ветвления выбрать для проекта документации, как настроить ревью, как автоматизировать проверки, как обеспечить консистентность между несколькими авторами.&lt;/p&gt;\n&lt;p&gt;Что входит в Middle-уровень:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Стратегии ветвления:&lt;/strong&gt; вы понимаете разницу между trunk-based workflow, GitHub flow и versioned branches. Trunk-based — все изменения в main, подходит для маленьких команд без сложного ревью. GitHub flow — каждая задача в ветке + PR, стандарт для docs-as-code. Versioned branches — для документации с версионированием.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Разрешение конфликтов:&lt;/strong&gt; вы уверенно решаете merge conflicts, понимаете, когда использовать rebase, а когда — merge.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Работа с PR на продвинутом уровне:&lt;/strong&gt; вы настраиваете шаблоны PR, ревьюеров, labels, автоматические проверки.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Git hooks и автоматизация:&lt;/strong&gt; pre-commit hooks для проверки Markdown, интеграция с линтерами (Vale, markdownlint), настройка CI для документации.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Ревью документации:&lt;/strong&gt; вы понимаете, как проводить ревью PR с документацией: что проверять, как давать фидбек, как разрешать спорные правки.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Метки и теги:&lt;/strong&gt; вы используете git tag для версий документации, понимаете, как связать версию docs с версией продукта.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Ключевой принцип&lt;/strong&gt; Middle: вы выбираете стратегию и объясняете её. Вы отвечаете за то, чтобы команда работала с Git единообразно.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Курсы и книги (Middle)&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://redocly.com/blog/git-branching-for-docs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Git branching strategies for documentation projects (Redocly)&lt;/a&gt; - Разбор трёх стратегий ветвления специально для документации: trunk-based, GitHub flow, versioned branches. С диаграммами и рекомендациями;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://learn.mintlify.com/courses/git-github/overview\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Git and GitHub for Mintlify&lt;/a&gt; - Курс по Git для документационных команд: как работать с ветками, preview deployments, ревью, коллаборация с инженерами и PM-ами;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://engineering.homeoffice.gov.uk/patterns/docs-as-code/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs as Code (Home Office)&lt;/a&gt; - Государственный стандарт Великобритании: как выстроить docs-as-code в команде, какие инструменты использовать, как интегрировать писателей в dev-команды;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://git-scm.com/docs/gitworkflows\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Git Workflows (gitworkflows(7), man page)&lt;/a&gt; - Официальное описание рабочих процессов Git: как разбивать изменения на логические шаги, как работать с поддерживаемыми ветками;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://git-scm.com/book/en/v2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«Pro Git» (главы 4–7)&lt;/a&gt; - Главы о ветвлении, rebase, worktree, настройке Git-сервера — для Middle-уровня.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_base_git_senior_senior-opredelyayu-standart-i-masshtabiruyu\" data-original-article=\"Roadmap/base/git/senior.html\"&gt;&lt;a href=\"#Roadmap_base_git_senior_senior-opredelyayu-standart-i-masshtabiruyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и масштабирую»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и масштабирую»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_base_git_senior\" id=\"Roadmap_base_git_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне Git — это элемент архитектуры документации. Вы не просто выбираете стратегию для команды, вы определяете, как Git вписывается в общую стратегию: как связаны рукописные гайды и генерируемый reference, как масштабируется документация на десятки тысяч файлов, как обеспечивается traceability и compliance.&lt;/p&gt;\n&lt;p&gt;Что входит в Senior-уровень:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Архитектура репозитория:&lt;/strong&gt; вы проектируете структуру репозитория для масштабируемой документации: модульная организация, мультиязычность, разделение на гайды и reference.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Git-воркфлоу для организации:&lt;/strong&gt; вы определяете, как работают несколько команд в одном репозитории или в связанных репозиториях, как координируются изменения, как разрешаются конфликты между командами.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Compliance и traceability:&lt;/strong&gt; в регулируемых отраслях (медицина, финансы) вы настраиваете Git для соответствия стандартам: подписанные коммиты (GPG), связывание с issues, аудит изменений.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Автоматизация на уровне организации:&lt;/strong&gt; вы проектируете CI/CD-пайплайны для документации: от PR до публикации, включая валидацию, линтинг, сборку, деплой.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Governance:&lt;/strong&gt; вы определяете политику работы с Git для всей организации: какие ветки обязательны, какие проверки обязательны, кто и как может мержить.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Обучение и менторство:&lt;/strong&gt; вы обучаете инженеров и писателей работе с Git в контексте документации.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Ключевой принцип Senior:&lt;/strong&gt; вы определяете правила игры и отвечаете за их соблюдение в масштабе.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Курсы и книги (Senior)&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/TECH-OPSS/Technical-Writing-Masterclass\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Module 11: Version Control for Documentation (TECH-OPSS)&lt;/a&gt; - Продвинутый модуль для senior-писателей и content architects: multi-branch workflows, CI/CD-гейты, compliance. Прямая ссылка на модуль недоступна, но материалы входят в репозиторий TECH-OPSS на GitHub;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/TECH-OPSS/Technical-Writing-Masterclass\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs as Code Infrastructure (TECH-OPSS)&lt;/a&gt; - Инфраструктурные паттерны для docs-as-code: модульная структура, мультиязычность, автоматизация. Прямая ссылка на модуль недоступна, материалы находятся в том же репозитории TECH-OPSS;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docsfordevelopers.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«Docs for Developers» (Jared Bhatti et al.)&lt;/a&gt; - Не про Git напрямую, но про то, как строить документацию в масштабе: архитектура, процессы, метрики, команда;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://git-scm.com/book/en/v2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«Pro Git» (главы 8–10)&lt;/a&gt; - Главы о настройке Git, Git в организации, Git internals — для Senior-уровня (полный текст книги, включая главы 8–10, доступен на этой странице);&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://git-scm.com/docs/gitworkflows\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Git Workflows (gitworkflows(7))&lt;/a&gt; - Официальное описание рабочих процессов Git для больших проектов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://redocly.com/blog/git-branching-for-docs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Git Branching Strategies for Documentation Projects (Redocly)&lt;/a&gt; - Разбор стратегий ветвления с рекомендациями для разных сценариев.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_base_ide_junior_junior-pishu-i-vizhu-rezultat\" data-original-article=\"Roadmap/base/ide/junior.html\"&gt;&lt;a href=\"#Roadmap_base_ide_junior_junior-pishu-i-vizhu-rezultat\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Пишу и вижу результат»&lt;/span&gt;&lt;/a&gt;Junior: «Пишу и вижу результат»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_base_ide_junior\" id=\"Roadmap_base_ide_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне редактор — это ваш основной инструмент. Вы должны уверенно работать в VS Code (или выбранном редакторе) с Markdown: писать текст, видеть превью, использовать базовые расширения. Ключевой сдвиг: вы перестаёте писать «в блокноте» и начинаете использовать среду, которая помогает вам не ошибаться.&lt;/p&gt;\n&lt;p&gt;Что входит в Junior-уровень:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Базовая настройка VS Code:&lt;/strong&gt; установка, настройка шрифта и размера, понимание интерфейса (Explorer, Search, Source Control, Extensions).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Markdown-расширения:&lt;/strong&gt; Markdown All in One (автогенерация TOC, горячие клавиши, автоматическая нумерация заголовков), Markdown Preview Enhanced (поддержка LaTeX, Mermaid, экспорт в PDF/HTML), Code Spell Checker (проверка орфографии с кастомным словарём для технических терминов).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Превью:&lt;/strong&gt; умение открыть превью Markdown (Ctrl+Shift+V), понимание разницы между превью и финальным рендерингом на платформе.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Горячие клавиши:&lt;/strong&gt; базовые сочетания (Ctrl+P — быстрый переход к файлу, Ctrl+Shift+P — палитра команд, Ctrl+D — мульти-курсор для одновременного редактирования одинаковых слов).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Работа с файлами:&lt;/strong&gt; создание, переименование, перемещение файлов внутри проекта, понимание структуры папок документации.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы используете редактор так, как он настроен. Если в команде принят VS Code с определённым набором расширений — вы работаете именно в нём, не переключаясь на «свой любимый блокнот».&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h3 id=\"Roadmap_base_ide_junior_kursy-i-knigi-junior\"&gt;&lt;a href=\"#Roadmap_base_ide_junior_kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://code.visualstudio.com/docs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;VS Code официальная документация&lt;/a&gt; - Официальный гайд по настройке: от установки до горячих клавиш. Разделы «Get Started» и «Tips and Tricks» — обязательны для старта;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://m.php.cn/faq/1948549.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«VSCode for Technical Writing:&lt;/a&gt; - Подробный разбор настройки VS Code именно для технического писателя: расширения Markdown All in One, Markdown Preview Enhanced, Code Spell Checker, Prettier и Vale, а также рабочие процессы с Git и Live Server;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://josephstreeter.github.io/docs/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Setup and Configuration для docs-as-code&lt;/a&gt; - Пример документационного сайта на DocFX с полным списком расширений и конфигураций для docs-as-code проектов. Исходный репозиторий с настройками VS Code доступен на GitHub;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://skills.github.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitHub Skills: Introduction to GitHub&lt;/a&gt; - Интерактивный курс прямо внутри GitHub, который поможет понять, как редактор связан с Git-воркфлоу. Начните с урока «Introduction to GitHub», затем переходите к «Review pull requests».&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_base_ide_middle_middle-nastraivayu-i-avtomatiziruyu\" data-original-article=\"Roadmap/base/ide/middle.html\"&gt;&lt;a href=\"#Roadmap_base_ide_middle_middle-nastraivayu-i-avtomatiziruyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Настраиваю и автоматизирую»&lt;/span&gt;&lt;/a&gt;Middle: «Настраиваю и автоматизирую»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_base_ide_middle\" id=\"Roadmap_base_ide_middle\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне редактор перестаёт быть «просто местом, где я пишу». Теперь это конфигурируемая среда, которую вы настраиваете под проект и команду. Вы отвечаете за то, чтобы редактор помогал соблюдать стандарты: линтинг, форматирование, проверка ссылок — всё это работает автоматически.&lt;/p&gt;\n&lt;p&gt;Что входит в Middle-уровень:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Workspace-конфигурация:&lt;/strong&gt; создание .vscode/settings.json с настройками для проекта: editor.wordWrap, editor.rulers (направляющие на 80 и 120 символов), editor.formatOnSave, автоисправление markdownlint при сохранении.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Интеграция линтеров:&lt;/strong&gt; markdownlint (проверка синтаксиса), Vale (проверка стиля и терминологии). Настройка .vale.ini с правилами: запрет «utilize» вместо «use», единообразие терминов, проверка пассивного залога.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Prettier для Markdown:&lt;/strong&gt; настройка Prettier как форматтера по умолчанию, включение «format on save» для автоматического выравнивания списков, отступов и заголовков.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Сниппеты (User Snippets):&lt;/strong&gt; создание шаблонов для часто используемых блоков: командный блок с комментарием, admonition, таблица параметров.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Tasks:&lt;/strong&gt; настройка задач для запуска скриптов: проверка ссылок, сборка документации, валидация OpenAPI.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Git-интеграция:&lt;/strong&gt; использование встроенного Git-панели для ревью изменений, просмотр diff, создание коммитов из редактора.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы настраиваете редактор под проект и делитесь конфигурацией с командой. Workspace-настройки лежат в репозитории, чтобы каждый новый автор получал готовую среду.&lt;/em&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h3 id=\"Roadmap_base_ide_middle_kursy-i-knigi-middle\"&gt;&lt;a href=\"#Roadmap_base_ide_middle_kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/itikineva/doc-as-a-code-workshop\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs-as-Code Workshop: Полезные плагины для VS Code (GitHub)&lt;/a&gt; - Список плагинов для docs-as-code: Markdown All in One, &lt;a href=\"http://Draw.io\"&gt;Draw.io&lt;/a&gt; Integration, OpenAPI (Swagger) Editor, PlantUML, Markdown Table. Репозиторий также содержит пример настройки Docusaurus и CI/CD для публикации документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.vale.sh/topics/.vale.ini\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Vale Documentation (.vale.ini)&lt;/a&gt; - Официальная документация Vale: как настроить .vale.ini, как писать кастомные правила и как интегрировать проверку в VS Code. Страница объясняет структуру конфигурационного файла и управление правилами;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://prettier.io/docs/en/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Prettier Documentation&lt;/a&gt; - Официальная документация Prettier: настройка для Markdown, интеграция с VS Code (через расширение esbenp.prettier-vscode) и конфигурация для обеспечения единообразного форматирования документов;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://m.php.cn/faq/1948549.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;«VSCode for Technical Writing» (m.php.cn)&lt;/a&gt; - Статья на китайском, но с подробным разбором цепочки «написал → сохранил → проверилось»: Prettier как форматтер по умолчанию с включённым «format on save» + Vale (CLI + Vale Server) для проверки тона, терминологии и пассивного залога;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://code.visualstudio.com/docs/editor/tasks\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;VS Code Tasks Documentation&lt;/a&gt; - Официальный гайд по Tasks: как запускать скрипты (проверка ссылок, сборка документации) из редактора через tasks.json, не переключаясь в терминал.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_base_ide_senior_senior-opredelyayu-standart-i-masshtabiruyu\" data-original-article=\"Roadmap/base/ide/senior.html\"&gt;&lt;a href=\"#Roadmap_base_ide_senior_senior-opredelyayu-standart-i-masshtabiruyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Senior: «Определяю стандарт и масштабирую»&lt;/span&gt;&lt;/a&gt;Senior: «Определяю стандарт и масштабирую»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_base_ide_senior\" id=\"Roadmap_base_ide_senior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Senior-уровне редактор — это элемент инфраструктуры документации. Вы не просто настраиваете VS Code для себя или команды, вы определяете, какой редактор использовать в организации, как он интегрируется с CI/CD и как обеспечить консистентность между командами. Вы также понимаете альтернативы VS Code и можете обосновать выбор: JetBrains Writerside с гибридным Markdown + XML, специализированные HAT вроде MadCap Flare или лёгкие редакторы для контрибьюторов.&lt;/p&gt;\n&lt;p&gt;Что входит в Senior-уровень:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Стратегия выбора редактора:&lt;/strong&gt; обоснование выбора VS Code vs. JetBrains Writerside vs. специализированные HAT (MadCap Flare, Adobe RoboHelp) в зависимости от задач. Writerside предлагает гибридный Markdown + semantic XML, topic-based authoring и интеграцию с Git, но после закрытия standalone-IDE в марте 2025 остаётся только как бесплатный плагин для JetBrains IDE с более консервативным roadmap.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Интеграция с CI/CD:&lt;/strong&gt; настройка редактора так, чтобы локальные проверки совпадали с проверками в CI (одинаковые версии линтеров, одинаковые правила). Если Vale чисто проходит на вашем ноутбуке, он должен так же проходить в GitHub Actions — иначе PR будет «красным» без причины.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;ИИ-ассистенты:&lt;/strong&gt; подключение GitHub Copilot, настройка контекста через .github/copilot-instructions.md для определения стандартов документации, понимание ограничений и безопасности при работе с конфиденциальной документацией.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Стандартизация:&lt;/strong&gt; создание org-wide шаблона .vscode/ для всех документационных репозиториев: settings.json (поведение редактора, форматирование при сохранении), extensions.json (рекомендуемые расширения), tasks.json (скрипты сборки и проверок), snippets (шаблоны блоков).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Обучение:&lt;/strong&gt; проведение воркшопов для инженеров и писателей по настройке редактора, создание внутренних гайдов, чтобы новый автор мог за 15 минут получить рабочую среду, а не полдня искать расширения.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Senior: вы определяете, как выглядит «стандартная среда технического писателя» в организации, и отвечаете за её поддержку. Если инженер или писатель открывает репозиторий и получает готовую среду без ручной настройки — это ваша работа.&lt;/em&gt;&lt;/p&gt;\n&lt;h3 id=\"Roadmap_base_ide_senior_kursy-i-knigi-senior\"&gt;&lt;a href=\"#Roadmap_base_ide_senior_kursy-i-knigi-senior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Senior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Senior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://docsio.co/blog/writerside\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JetBrains Writerside Review: Is It Worth Using in 2026? (Docsio)&lt;/a&gt; - Детальный разбор Writerside: гибридный Markdown + XML, topic-based authoring, что изменилось после закрытия standalone-IDE в 2025 году, ограничения и сравнение с Docusaurus, Mintlify и Starlight. Помогает обосновать выбор редактора для организации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://pub.towardsai.net/5-vscode-files-that-standardize-your-whole-team-f6e1e80fbf5f\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;5 .vscode Files That Standardize Your Whole Team (Towards AI)&lt;/a&gt; - Практический гайд по стандартизации VS Code для команды: settings.json, extensions.json, launch.json, tasks.json и snippets. Показывает, как закоммитить .vscode в Git, чтобы каждый новый автор получал готовую среду;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://books.google.com.sg/books?id=nMabEQAAQBAJ\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write Better with Vale (Brian P. Hogan)&lt;/a&gt; - Книга, которая связывает редактор и CI: как превратить стайлгайд в исполняемые правила Vale, интегрировать их в VS Code, Git hooks и CI pipeline. Ключевой ресурс для обеспечения идентичных проверок локально и в CI;&lt;/p&gt;\n&lt;p&gt;&lt;a&gt;VS Code Documentation: Tasks&lt;/a&gt; - Официальный гайд по tasks.json: как запускать сборку документации, проверку ссылок и линтеры из редактора одной командой, чтобы локальный workflow совпадал с CI;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://code.visualstudio.com/docs/editor/tasks\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitHub Copilot: Custom Instructions (VS Code Docs)&lt;/a&gt; - Официальная документация по настройке .github/copilot-instructions.md: как задать стандарты документации, стиль и требования к формату, чтобы Copilot генерировал контент, соответствующий вашим правилам.&lt;/p&gt;\n&lt;/div&gt;&lt;div class=\"pdf-page-wrapper\" data-page-break=\"true\"&gt;&lt;h2 id=\"Roadmap_base_style_junior_junior-sleduyu-pravilam-i-ne-meshayu-chitatelyu\" data-original-article=\"Roadmap/base/style/junior.html\"&gt;&lt;a href=\"#Roadmap_base_style_junior_junior-sleduyu-pravilam-i-ne-meshayu-chitatelyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Следую правилам и не мешаю читателю»&lt;/span&gt;&lt;/a&gt;Junior: «Следую правилам и не мешаю читателю»&lt;a class=\"yfm-anchor\" aria-hidden=\"true\" href=\"#Roadmap_base_style_junior\" id=\"Roadmap_base_style_junior\"&gt;&lt;/a&gt;&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне стиль и тон — это дисциплина. Вы не изобретаете правила, а следуете тем, что уже приняты в команде или в индустрии. Ключевой сдвиг: вы перестаёте писать «как мне нравится» и начинаете писать так, как нужно читателю. Документацию читают, чтобы понять, а не восхититься.&lt;/p&gt;\n&lt;p&gt;Что входит в Junior-уровень:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Следование стайлгайду:&lt;/strong&gt; вы используете выбранный в проекте стайлгайд (Google, Microsoft, внутренний) и не отклоняетесь от него без причины. Google Technical Writing One формулирует базовые правила: используйте термины последовательно, избегайте двусмысленных местоимений, предпочитайте активный залог пассивному, выбирайте сильные глаголы и конкретные существительные, фокусируйте каждое предложение на одной идее, убирайте лишние слова.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Краткость и точность:&lt;/strong&gt; вы удаляете пустые слова («на самом деле», «различные», «определённый»), дублирование, усиления («очень», «критически», «абсолютно») и оговорки. В технических документах должно быть мало усилений и мало оговорок.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Активный залог и императив:&lt;/strong&gt; вместо «Документ должен быть сохранён пользователем» — «Сохраните докумен
