        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"middle-nastraivayu-pajplajn-i-avtomatiziruyu-proverki\"&gt;&lt;a href=\"Roadmap/docascode/cicd/middle.html#middle-nastraivayu-pajplajn-i-avtomatiziruyu-proverki\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Настраиваю пайплайн и автоматизирую проверки»&lt;/span&gt;&lt;/a&gt;Middle: «Настраиваю пайплайн и автоматизирую проверки»&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне CI/CD перестаёт быть просто «процессом, в котором я участвую». Теперь это &lt;strong&gt;предмет проектирования&lt;/strong&gt;: вы настраиваете workflow с нуля, выбираете инструменты, автоматизируете проверки и обеспечиваете, чтобы документация была качественной до попадания к пользователю.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Настройка workflow с нуля:&lt;/strong&gt; вы пишете YAML-файлы GitHub Actions (или GitLab CI) для документации: build → lint → test → deploy. Вы понимаете триггеры (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-esf2onex\"&gt;on: push&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gk6n6un4\"&gt;on: pull_request&lt;/code&gt;), jobs и steps.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Выбор инструментов проверки:&lt;/strong&gt; вы настраиваете линтеры (Vale для стиля, markdownlint для форматирования), проверку ссылок (lychee, linkchecker), проверку орфографии (cspell, yaspeller). Вы понимаете, какие проверки обязательны, а какие — рекомендательны.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Проверка сборки:&lt;/strong&gt; вы настраиваете CI так, чтобы сборка сайта запускалась при каждом PR. Если сборка падает — PR не может быть смержен. Это гарантирует, что в main всегда попадает рабочая документация.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Автоматический деплой:&lt;/strong&gt; вы настраиваете пайплайн, который после merge в main собирает и публикует документацию автоматически. Вы понимаете разницу между staging и production деплоем.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Оптимизация пайплайна:&lt;/strong&gt; вы используете кэширование зависимостей, matrix builds (для нескольких версий), условные проверки (только для изменённых файлов). Это ускоряет CI и экономит ресурсы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Мониторинг:&lt;/strong&gt; вы настраиваете уведомления о падениях CI (Slack, email), отслеживаете статус сборок, анализируете причины частых падений.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;настраиваете и автоматизируете&lt;/strong&gt;. Вы отвечаете за то, чтобы CI/CD-пайплайн был надёжным, быстрым и покрывал все критические проверки.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-middle\"&gt;&lt;a href=\"Roadmap/docascode/cicd/middle.html#kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://www.udemy.com/course/github-actions-the-complete-guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitHub Actions: The Complete Guide from Beginner to Expert (Udemy)&lt;/a&gt; - Комплексный курс по GitHub Actions: от базовых workflow до продвинутых сценариев. Подходит для настройки CI/CD для документации;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.udemy.com/course/gitlab-ci-cd-the-complete-guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitLab CI/CD: The Complete Guide (Udemy)&lt;/a&gt; - Альтернатива GitHub Actions: настройка пайплайнов в GitLab CI. Полезно, если компания использует GitLab;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ann-kilzer/docs-as-code-setup-guide\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs-as-Code Setup Guide (GitHub)&lt;/a&gt; - Comprehensive guide: CI/CD pipelines для документации, автоматизация проверок, best practices;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://vale.sh/docs/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Vale Documentation&lt;/a&gt; - Официальная документация Vale: настройка правил, интеграция с CI;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://ubuntu.com/blog/continuous-deployment-for-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Continuous deployment for documentation (Ubuntu)&lt;/a&gt; - Реальный кейс: как организован CI/CD для документации в Ubuntu: review, test suite, deploy.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/docascode/cicd/middle.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Middle: «Настраиваю пайплайн и автоматизирую проверки»","href":"Roadmap/docascode/cicd/middle.html#middle-nastraivayu-pajplajn-i-avtomatiziruyu-proverki","level":2,"items":[{"title":"Курсы и книги (Middle)","href":"Roadmap/docascode/cicd/middle.html#kursy-i-knigi-middle","level":3}]}],"title":"CI/CD для документации — Middle"},"router":{"pathname":"Roadmap/docascode/cicd/middle","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
