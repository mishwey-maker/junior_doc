            {"data":{"leading":false,"html":"&lt;h2 id=\"middle-proektiruyu-strukturu-i-nastraivayu-pod-zadachi\"&gt;&lt;a href=\"Roadmap/docascode/ssg/middle.html#middle-proektiruyu-strukturu-i-nastraivayu-pod-zadachi\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Middle: «Проектирую структуру и настраиваю под задачи»&lt;/span&gt;&lt;/a&gt;Middle: «Проектирую структуру и настраиваю под задачи»&lt;/h2&gt;\n&lt;p&gt;На Middle-уровне SSG перестаёт быть просто «инструментом для публикации». Теперь это &lt;strong&gt;предмет проектирования&lt;/strong&gt;: вы выбираете генератор под задачи команды, настраиваете кастомизацию, интегрируете с CI/CD и обеспечиваете масштабируемость.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Middle-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Выбор инструмента:&lt;/strong&gt; вы понимаете компромиссы между MkDocs (Python, простой Markdown), Docusaurus (React, версионирование, i18n), Sphinx (Python, reStructuredText, мощные cross-references) и Hugo (Go, скорость, Docsy). Вы можете обосновать выбор для конкретного проекта.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Продвинутая навигация:&lt;/strong&gt; вы проектируете структуру сайта: sidebar, navbar, breadcrumbs, footer. Вы понимаете, как работает автоматическая генерация навигации в MkDocs и ручная — в Docusaurus.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Кастомизация:&lt;/strong&gt; вы умеете переопределять тему: добавлять кастомные CSS, изменять шаблоны, настраивать цвета и шрифты. В Docusaurus вы работаете с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vw5bejv1\"&gt;src/css/custom.css&lt;/code&gt;; в MkDocs — с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s0gp6svw\"&gt;extra_css&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Front matter:&lt;/strong&gt; вы используете метаданные (title, description, tags, sidebar_position) для управления отображением страниц.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Версионирование:&lt;/strong&gt; вы настраиваете versioning документации для нескольких версий продукта. Docusaurus поддерживает это «из коробки»; в MkDocs требуется плагин (mike).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Интеграция с CI/CD:&lt;/strong&gt; вы настраиваете автоматическую сборку и деплой при каждом push в main. Типичный workflow: build → lint → deploy.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Поиск:&lt;/strong&gt; вы настраиваете полнотекстовый поиск: встроенный (Docusaurus + Algolia) или локальный (MkDocs + search plugin).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Middle: вы &lt;strong&gt;проектируете и настраиваете&lt;/strong&gt;. Вы отвечаете за то, чтобы SSG был выбран осознанно, настроен под задачи и интегрирован в процесс.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-middle\"&gt;&lt;a href=\"Roadmap/docascode/ssg/middle.html#kursy-i-knigi-middle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Middle)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Middle)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ann-kilzer/docs-as-code-setup-guide\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docs-as-Code Setup Guide (GitHub)&lt;/a&gt; - Comprehensive guide: выбор инструмента, версионирование, автоматизация, best practices;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.gfu.de/schulung/docs-as-code/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Schulung Docs-as-Code: Technische Dokumentation mit Git, Markdown und CI/CD (GFU)&lt;/a&gt; - 2-дневный интенсив: Static Site Generators im Vergleich, CI/CD im Einsatz, automatisierte Publishing-Pipelines;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/jimporter/mike\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;mike Documentation (GitHub)&lt;/a&gt; - Официальная документация mike: управление версиями MkDocs, деплой на GitHub Pages, интеграция с Material for MkDocs;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docusaurus.io/docs/versioning\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docusaurus Versioning Documentation&lt;/a&gt; - Официальная документация по версионированию Docusaurus: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1tprp6lm\"&gt;npm run docusaurus docs:version&lt;/code&gt;, работа с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ukwik0kj\"&gt;versions.json&lt;/code&gt;;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://squidfunk.github.io/mkdocs-material/setup/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MkDocs Material Documentation — Advanced&lt;/a&gt; - Продвинутые разделы: plugins, customization, versioning, search.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/docascode/ssg/middle.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Middle: «Проектирую структуру и настраиваю под задачи»","href":"Roadmap/docascode/ssg/middle.html#middle-proektiruyu-strukturu-i-nastraivayu-pod-zadachi","level":2,"items":[{"title":"Курсы и книги (Middle)","href":"Roadmap/docascode/ssg/middle.html#kursy-i-knigi-middle","level":3}]}],"title":""},"router":{"pathname":"Roadmap/docascode/ssg/middle","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
