        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"junior-ponimayu,-chto-dokumentaciya-dolzhna-byt-nahodimoj\"&gt;&lt;a href=\"Roadmap/docascode/search/junior.html#junior-ponimayu,-chto-dokumentaciya-dolzhna-byt-nahodimoj\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Понимаю, что документация должна быть находимой»&lt;/span&gt;&lt;/a&gt;Junior: «Понимаю, что документация должна быть находимой»&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне поиск и метаданные — это &lt;strong&gt;осознание того, что документация существует не в вакууме&lt;/strong&gt;. Вы учитесь писать заголовки, которые отражают суть страницы, заполнять front matter (title, description) и понимать, как пользователи ищут информацию. Ключевой сдвиг: вы перестаёте думать «я написал текст» и начинаете думать «пользователь найдёт этот текст».&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание важности findability:&lt;/strong&gt; «Findability precedes usability; you can’t use what you can’t find». Документация, которую не находят, бесполезна.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Заголовки и структура:&lt;/strong&gt; вы пишете заголовки, которые чётко отражают содержимое страницы. Используйте формулировки, которые вводит пользователь, а не внутренние названия фич. Заголовок H1 должен быть конкретным и описательным.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Front matter:&lt;/strong&gt; вы понимаете, что такое front matter (YAML-блок в начале Markdown-файла) и умеете заполнять базовые поля: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-glft2m3f\"&gt;title&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u72dr1ln\"&gt;description&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mbeot9c2\"&gt;tags&lt;/code&gt;. Mintlify автоматически генерирует мета-теги из frontmatter title и description.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Мета-теги для SEO:&lt;/strong&gt; вы понимаете, что meta title (50–60 символов) и meta description (150–160 символов) влияют на то, как страница отображается в поисковой выдаче. Они должны быть конкретными, а не шаблонными.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Внутренние ссылки:&lt;/strong&gt; вы добавляете internal links между связанными страницами. Это помогает и пользователям, и поисковым краулерам.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Понимание, как работает поиск в SSG:&lt;/strong&gt; вы знаете, что в MkDocs есть встроенный search plugin (работает на lunr), а в Docusaurus — интеграция с Algolia DocSearch.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;следуете&lt;/strong&gt; правилам оформления заголовков и метаданных. Если в проекте принято заполнять &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8g30iu7f\"&gt;description&lt;/code&gt; для каждой страницы — вы делаете именно так.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-junior\"&gt;&lt;a href=\"Roadmap/docascode/search/junior.html#kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://www.gitbook.com/blog/seo-techniques-for-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;How to use SEO techniques to improve your documentation (GitBook)&lt;/a&gt; - Практическое руководство: keywords, headings, metadata, internal links. Quick takeaways для старта;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.telerik.com/devtools/wpf/styling-and-appearance/style-guide/seo-metadata\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SEO metadata (Progress Telerik Style Guide)&lt;/a&gt; - Пример реализации meta block: title, description, tags. Правила заполнения;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docs.ansible.com/ansible/latest/community/documentation_contribs.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Writing documentation so search can find it (Ansible)&lt;/a&gt; - Практические советы: clear headings, numbered lists, первые предложения описывают тему страницы;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.mkdocs.org/user-guide/configuration/#search\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MkDocs Search Plugin&lt;/a&gt; - Официальная документация: как работает встроенный поиск, как настроить язык;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://docusaurus.io/docs/search\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docusaurus Search&lt;/a&gt; - Официальная документация: как подключить Algolia DocSearch, какие поля заполнять.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/docascode/search/junior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Junior: «Понимаю, что документация должна быть находимой»","href":"Roadmap/docascode/search/junior.html#junior-ponimayu,-chto-dokumentaciya-dolzhna-byt-nahodimoj","level":2,"items":[{"title":"Курсы и книги (Junior)","href":"Roadmap/docascode/search/junior.html#kursy-i-knigi-junior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/docascode/search/junior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
