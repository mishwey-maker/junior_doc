        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;На Junior-уровне SDK-документация — это &lt;strong&gt;пошаговое руководство для разработчика&lt;/strong&gt;, который впервые сталкивается с вашей библиотекой. Вы учитесь писать quickstart, документировать установку и описывать базовые операции по готовому шаблону. Ключевой сдвиг: вы перестаёте «пересказывать» сигнатуры методов и начинаете &lt;strong&gt;вести разработчика от нуля до первого работающего вызова&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Понимание SDK vs API:&lt;/strong&gt; API — это контракт на уровне HTTP. SDK — это &lt;strong&gt;клиентская библиотека&lt;/strong&gt;, которая оборачивает API в удобный для конкретного языка интерфейс. Документация SDK отвечает на вопрос «Как использовать библиотеку в моём проекте?».&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Структура quickstart:&lt;/strong&gt; Prerequisites (что нужно до начала) → Installation (команда пакетного менеджера) → Authentication (как передать credentials) → First call (минимальный работающий пример) → Next steps (куда идти дальше).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Установка:&lt;/strong&gt; вы документируете команды для разных пакетных менеджеров (npm, pip, Maven, Gradle), указываете минимальную версию языка и зависимости.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Аутентификация:&lt;/strong&gt; вы показываете, как создать клиент и передать credentials. Пример должен быть самодостаточным: разработчик копирует его, подставляет свой токен и запускает.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Базовые операции:&lt;/strong&gt; вы документируете CRUD-операции (create, read, update, delete) с минимальными примерами. Каждый пример показывает happy path.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Inline-комментарии:&lt;/strong&gt; вы добавляете комментарии в код, объясняющие неочевидные параметры и возвращаемые значения.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Проверка работоспособности:&lt;/strong&gt; вы тестируете каждый пример в реальном проекте, убеждаясь, что он компилируется и выполняется.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;ведёте разработчика&lt;/strong&gt; от установки до первого успешного вызова. Если пример не работает — это ваша ошибка, а не проблема читателя.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-junior\"&gt;&lt;a href=\"Roadmap/api/sdk/junior.html#kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://training.linuxfoundation.org/training/creating-effective-documentation-for-developers-lfc112/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Creating Effective Documentation for Developers (LFC112) (Linux Foundation)&lt;/a&gt; - Курс для технических писателей с базовыми знаниями программирования: типы документации, API-элементы, code-based reference, планирование документации в разработке;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.archbee.com/blog/sdk-documentation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SDK documentation — Archbee Blog&lt;/a&gt; - Введение в разницу между SDK и API, что должна включать SDK-документация, примеры из реальных SDK;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://developers.google.com/tech-writing/one\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Technical Writing One&lt;/a&gt; - База: аудитория, структура, ясность. Применимо к quickstart и примерам кода;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.writethedocs.org/guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Write the Docs: Software Documentation Guide&lt;/a&gt; - Best practices для документации, включая quickstart и code samples;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://diataxis.fr/tutorials/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diátaxis Framework — Tutorials&lt;/a&gt; - Понимание разницы между tutorial (обучение) и how-to (решение задачи). SDK quickstart — это tutorial.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/api/sdk/junior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[],"title":""},"router":{"pathname":"Roadmap/api/sdk/junior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
