        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"junior-otpravlyayu-zaprosy-i-proveryayu-dokumentaciyu\"&gt;&lt;a href=\"Roadmap/api/postman/junior.html#junior-otpravlyayu-zaprosy-i-proveryayu-dokumentaciyu\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Junior: «Отправляю запросы и проверяю документацию»&lt;/span&gt;&lt;/a&gt;Junior: «Отправляю запросы и проверяю документацию»&lt;/h2&gt;\n&lt;p&gt;На Junior-уровне Postman — это &lt;strong&gt;инструмент проверки&lt;/strong&gt;. Вы учитесь отправлять запросы, читать ответы и убеждаться, что документация соответствует реальному поведению API. Ключевой сдвиг: вы перестаёте писать документацию «по памяти» и начинаете &lt;strong&gt;валидировать её через реальные вызовы&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Что входит в Junior-уровень:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Интерфейс Postman:&lt;/strong&gt; вы понимаете структуру: workspace, collections, folders, requests, environments. Вы знаете, как создать новый запрос, выбрать метод и отправить его.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Работа с запросами:&lt;/strong&gt; вы добавляете URL, query parameters, path parameters, headers (Content-Type, Accept, Authorization), body (raw JSON).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Анализ ответов:&lt;/strong&gt; вы читаете статус-код, заголовки ответа, тело ответа. Вы проверяете, соответствует ли ответ документации: тот ли статус-код, те ли поля, те ли типы данных.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Коллекции:&lt;/strong&gt; вы умеете импортировать API-коллекции, добавлять папки, сохранять запросы и ответы в коллекцию.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Переменные:&lt;/strong&gt; вы понимаете, зачем нужны переменные (base URL, токены), и умеете их создавать. Environment variables позволяют переключаться между средами.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Валидация документации:&lt;/strong&gt; вы проходите по документации шаг за шагом, отправляя каждый запрос. Если что-то не совпадает — вы фиксируете это и уточняете у разработчика.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Ключевой принцип Junior: вы &lt;strong&gt;проверяете&lt;/strong&gt; документацию, а не пишете её «вслепую». Если пример в документации не работает — вы это находите.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"kursy-i-knigi-junior\"&gt;&lt;a href=\"Roadmap/api/postman/junior.html#kursy-i-knigi-junior\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курсы и книги (Junior)&lt;/span&gt;&lt;/a&gt;Курсы и книги (Junior)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://academy.postman.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Postman Academy: API Fundamentals Student Expert Certification&lt;/a&gt; - Официальная сертификация Postman: GET, POST, PUT, PATCH, DELETE, работа с JSON, path variables, query parameters. Полностью бесплатно, с бейджем и сертификатом;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.udemy.com/course/technical-writing-how-to-write-api-software-documentation/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Technical Writing: How to Write API Software Documentation (Udemy)&lt;/a&gt; - Курс &lt;strong&gt;специально для технических писателей&lt;/strong&gt;: использует Postman для проверки функциональности API. Не требует опыта программирования;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.coursera.org/learn/api-testing-postman\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apply API Testing Fundamentals Using Postman (Coursera)&lt;/a&gt; - Install and configure Postman to create, organize, and execute REST API requests. Validate API responses, debug issues, write test scripts;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://learning.postman.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Postman Learning Center&lt;/a&gt; - Официальная документация Postman: от первых шагов до продвинутых сценариев;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://www.udemy.com/course/postman-the-complete-guide/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Postman: The Complete Guide — REST API Testing (Udemy)&lt;/a&gt; - Курс для тестировщиков и разработчиков, но подходит писателям: GET, POST, PUT, DELETE, JSON, аутентификация, работа с коллекциями.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.64.1"}],"vcsPath":"Roadmap/api/postman/junior.md","updatedAt":"2026-11-16T19:43:33.000Z"},"headings":[{"title":"Junior: «Отправляю запросы и проверяю документацию»","href":"Roadmap/api/postman/junior.html#junior-otpravlyayu-zaprosy-i-proveryayu-dokumentaciyu","level":2,"items":[{"title":"Курсы и книги (Junior)","href":"Roadmap/api/postman/junior.html#kursy-i-knigi-junior","level":3}]}],"title":""},"router":{"pathname":"Roadmap/api/postman/junior","depth":4,"base":"../../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true,"markdownActions":"none"},"search":{"provider":"local","tolerance":2,"confidense":"phrased","enabled":true,"hiddenPolicy":false,"api":"_search\\api.js","link":"_search\\ru\\index.html","tags":[]}}
